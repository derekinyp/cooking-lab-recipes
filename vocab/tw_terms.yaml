  - {cn: 千克, tw: 公斤, kind: 單位}
  # 一詞多義：生抽、老抽不等於醬油、醬油膏，台灣對應是「醬油」與「蔭油（深色醬油）」，鹹度與上色不同，要依菜理解後改寫。
  - {cn: 生抽, tw: 醬油, kind: 調味, rewrite: true}
  - {cn: 老抽, tw: 蔭油, kind: 調味, rewrite: true}
# 站上可見文字不得出現的過程用語（建置後掃描；來源區的連結標題不在掃描範圍）
forbidden_phrases:
  - 原文
  - 推論
  - 家庭改法
  - Notion
  - 換算值
  - 數字依據
  - 這頁的數字
  - 不亂補
  - 待試做
  - 還沒做第二輪
  - 編者

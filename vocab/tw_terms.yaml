# 台灣用語表 v1.0（2026-11-28，振達指示：全站一律使用台灣用語，大陸說法只留作搜尋別名）
# 用途：
#   1. tools/apply_tw_terms.py：把食譜檔、詞表、白話說明檔裡「會顯示給使用者」的欄位改成台灣用語（原文引用、來源標題不改）。
#   2. 搜尋：cn 欄的說法保留成搜尋別名，打大陸說法也找得到，但不顯示。
#   3. 測試：tests/test_public_text.py 建置後掃描所有頁面可見文字，cn 說法必須是 0 筆。
# 欄位：cn＝大陸說法；tw＝台灣說法；rx＝比對用正規表示式（沒寫就用 cn 本身）；kind＝類別；
#       rewrite＝true 代表一詞多義、不能機械取代，要理解後改寫（由補寫批次處理，build 掃到就擋）。
terms:
  - {cn: '白花菜（花椰菜／椰花菜）', tw: 花椰菜, kind: 食材}   # 先整句處理，避免變成「白花椰菜（花椰菜／椰花椰菜）」
  - {cn: 匀, tw: 勻, kind: 用字}   # 「拌勻」；匀是簡體寫法，思源黑體也沒有這個字
  - {cn: 肉末, tw: 絞肉, kind: 食材}

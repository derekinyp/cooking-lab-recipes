# 刀工成形詞彙 v1.0。size_mm 取自勞動部丙級檢定刀工規格（WDA_CUT，原文公分→毫米），
# 那是「檢定題目的規格」，不同材料略有差異；食譜裡實際尺寸以該食譜來源為準，寫在 action.params.cut.size_mm。
# size_mm 為 null＝尚無官方數字，不自行填。
scheme: cut
version: "1.0"
concepts:
  - {id: cut/si, zh: 絲, alt: [粗絲], en: {term: julienne, match: close}, size_mm: {width: [2, 4], thick: [2, 4], length: [40, 60]}, example: "青椒絲、里肌肉絲", source: WDA_CUT}

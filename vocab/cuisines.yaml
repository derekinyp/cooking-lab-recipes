# 菜系雙軸 v1.0
# 軸一 tradition（cuisine/…）：傳統菜系與流派。八大菜系是通行說法（教學與出版公約，非法定）；台菜、京、滬等另列。
# 軸二 region（region/…）：地理行政區。中國部分對齊中國烹飪協會 2018《中國菜》名錄的 34 個省級地域（CCAS18）；
#       其他國家用 國家.地區 的階層 id。
# 一道菜可同時掛兩軸、多個值；每個掛法都要寫 basis（依據）。

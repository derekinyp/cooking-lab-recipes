intro: 蒜末用橄欖油炒出香氣，再加入有彈性的義大利直麵與煮麵水拌勻，最後拌入巴西里。辣椒另外放，方便自行添加。
card: 蒜末用橄欖油炒香，加入麵和煮麵水拌至吸收，最後拌入巴西里；辣椒另放，方便調整辣度。
variant: 義大利家常版
burners: 湯鍋煮麵、平底鍋炒蒜油，可同時使用兩口爐；麵煮好後直接放入平底鍋拌勻。
spice:
  mode: addon
  text: 主鍋不加辣椒；想吃辣時，將切碎辣椒另外放在旁邊，盛盤後自行添加。
  mild:
  - 主鍋不加辣椒。
  hot:
  - 辣椒另放，依口味添加。
notes:
- 煮麵時留一些煮麵水，拌麵時分次加入。
- 蒜末用小火炒出香氣即可，避免炒焦。
- 巴西里梗可先和蒜末一起炒，葉片切碎後拌入麵中。
compare:
- 這個版本將辣椒另外盛放；若整鍋都要辣，可在炒蒜時加入辣椒。
steps:
  a4:
    title: 煮麵
    heat: 大火
    done:
    - 麵條煮至有彈性，保留一些煮麵水。
  a5:
    title: 炒香蒜末
    heat: 小火
    done:
    - 蒜末散出香氣但沒有焦黑。
  a6:
    title: 拌麵與橄欖油
    heat: 中火
    done:
    - 煮麵水被麵條吸收，麵條裹上油汁。
ing:
  parsley:
    suggest: 約 30 公克
  salt:
    suggest: 煮麵水加鹽，最後依口味調整
  water:
    suggest: 用湯杓舀取煮麵水

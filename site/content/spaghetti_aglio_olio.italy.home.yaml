tag: weekday
tag_note: 主要食譜標準備 5 分鐘、烹調 10 分鐘，在平日 20 分鐘內；麵要煮多久原文沒寫，看包裝。
card: 蒜末用橄欖油炒香，加一杓煮麵水，彈牙的麵直接下鍋拌到吸收，最後拌入其餘橄欖油和巴西里；辣椒另外放。
variant: 義大利家常版
intro: 份量和做法照義大利食譜網站的版本（來源①），4 人份。另一份義大利食譜（來源②）放在下面對照。這道菜原本會把辣椒放進油裡泡出辣味，這頁改成主鍋不放、辣椒最後各自加。
spice:
  mode: addon
  text: 原食譜把新鮮辣椒放進蒜油裡泡出辣味；這頁主鍋不放辣椒，整鍋就是不辣那份（改法，原文沒有）。
  mild: [照這頁做，不加辣椒。]
  yours: [切碎的辣椒另放一小碟，盛盤後加在你那份；份量原文是整鍋 1 根，自己抓。]
burners: 湯鍋煮麵、平底鍋做蒜油，兩件同時做用 2 口爐（推論，原文沒寫爐口數）。
ing:
  oil:
    note: 總量 60 克，分兩次用：先用 20 克（1.5 大匙）炒蒜，其餘約 40 克（3 大匙）最後拌麵
  salt:
    note: 煮麵水要加鹽，原文沒寫多少；最後再視需要用細鹽調整
  water:
    note: 原文只寫「一杓煮麵水」，用湯杓舀；煮麵水先留一些不要全倒掉
  parsley:
    note: 原文寫 1 把，沒寫重量；梗先拿來和蒜一起炒，葉子切碎最後拌
missing:
  - 鹽要放多少
  - 一杓煮麵水是多少
  - 麵要煮幾分鐘（看包裝的彈牙時間）
  - 炒蒜用什麼火、炒多久、炒到什麼顏色
  - 巴西里多重
notes:
  - 另一份義大利食譜（來源②）建議蒜稍微變金黃時就加一到兩杓煮麵水，免得蒜燒焦；麵煮到很彈牙就下鍋續煮，關火後再加生橄欖油。
  - 炒蒜的火力原文沒寫；來源②寫小火慢慢炒，第一次做可以參考。
  - 沒有烤箱、氣炸鍋的步驟，湯鍋和平底鍋就能做。
steps:
  a4:
    heat: 水煮滾再下麵（原文沒寫火力大小）
    time: 煮到彈牙，分鐘數原文沒寫，看包裝
  a5:
    heat: 炒香（原文沒寫火力；來源②是小火）
    time: 原文沒寫
  a6:
    heat: 原文沒寫火力；讓麵在鍋裡把水吸收、把麵煮完
    time: 拌一下就好，原文沒寫幾秒

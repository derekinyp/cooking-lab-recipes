intro: 綠竹筍帶殼以冷水煮熟，關火後留在原湯裡悶涼再冷藏。食用前去殼切塊，擠上自製沙拉醬，冰涼清甜。
card: 帶殼竹筍冷水下鍋，煮熟後留在原湯裡悶涼、冷藏；食用前去殼切塊，擠上自製沙拉醬。
variant: 台式家常版
burners: 煮筍用 1 口爐和 1 只湯鍋；等待筍子冷卻時可在碗裡調製沙拉醬。
spice:
  mode: none
notes:
- 煮之前先把竹筍外殼洗淨，水量加到蓋過竹筍。
- 筍子留在原湯裡悶到放涼，再放進冰箱冷藏。
steps:
  a1:
    title: 煮竹筍
    heat: 大火煮滾後轉中火
    time: 中火續煮 25 分鐘
    done:
    - 水滾後轉中火續煮 25 分鐘；筷子可刺入筍身較厚處。
    flow: 煮熟竹筍
  a2:
    title: 原湯悶涼冷藏
    done:
    - 竹筍留在原湯中至水涼，再放入冰箱冷藏。
    flow: 悶涼冷藏
  a3:
    title: 去殼切塊
    done:
    - 竹筍去殼後切成方便入口的塊狀。
    flow: 去殼切塊
  a4:
    title: 擠上沙拉醬
    done:
    - 筍塊上擠適量沙拉醬即可。
    flow: 擠醬上桌
ing:
  i_bamboo:
    suggest: 3 隻
  i_water:
    suggest: 加水蓋過竹筍

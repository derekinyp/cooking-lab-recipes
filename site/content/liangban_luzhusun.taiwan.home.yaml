card: 綠竹筍帶殼放入冷水中煮熟，關火後留在原湯裡悶到水涼，再冷藏。吃之前去殼切塊，擠上沙拉醬，筍塊清爽冰涼，配上香甜的醬。
variant: 台式家常版
intro: 綠竹筍和沙拉醬的份量照楊桃美食網的食譜。原食譜沒有寫份數；沙拉醬做好後可先放著，等筍子冷藏時再使用（推論）。
burners: 煮筍用湯鍋；沙拉醬在碗裡調製，可接著準備，不用另外開火（推論）。
missing:
  - 原文沒寫煮筍前是否要刷洗外殼
  - 原文沒寫大火煮到水滾要多久
  - 原文沒寫關火後悶到水涼要多久
  - 原文沒寫筍子要冷藏多久
  - 原文沒寫筍子切塊的大小
  - 原文沒寫沙拉醬做好後的份量和保存方式
  - 原文沒寫這道菜的份數
steps:
  a1:
    heat: 大火煮到水滾，再轉中火
    time: 中火續煮 25 分鐘
  a2:
    time: 關火後悶到水涼；悶多久原文沒寫
tag: weekend
tag_note: 食譜寫明中火續煮 25 分鐘，已超過 20 分鐘；悶涼和冷藏的時間原文沒寫。

intro: 白蘿蔔、紅蘿蔔、玉米和排骨先分別汆燙，再與薑片加水小火煮成清甜湯品。適合搭配家常飯菜，趁熱享用。
card: 排骨、白蘿蔔、紅蘿蔔和玉米分別汆燙後，與薑片一同小火煮約 45 分鐘，最後加鹽調味。
variant: 台式家常版
burners: 全程用 1 口爐和 1 只湯鍋，先汆燙食材、洗淨鍋子後換水煮湯。
spice:
  mode: none
notes:
- 白蘿蔔和紅蘿蔔去皮切滾刀塊，玉米洗淨切小段。
- 汆燙後沖洗食材與湯鍋，再加乾淨的水煮湯。
steps:
  a1:
    title: 切配食材
    done:
    - 白蘿蔔、紅蘿蔔切滾刀塊，玉米切小段，排骨剁小塊。
    flow: 切配食材
  a2:
    title: 分別汆燙
    heat: 大火
    time: 水滾後分批汆燙
    done:
    - 食材表面略轉色後撈起，以清水沖洗。
    flow: 汆燙洗淨
  a3:
    title: 小火煮湯
    heat: 小火
    time: 約 45 分鐘
    done:
    - 排骨熟透，蘿蔔可用筷子輕鬆刺入。
    flow: 慢煮入味
  a4:
    title: 加鹽調味
    heat: 小火
    done:
    - 加鹽拌勻，試喝後調整鹹淡。
    flow: 調味起鍋

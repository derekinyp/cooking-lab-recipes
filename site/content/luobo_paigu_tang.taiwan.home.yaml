missing:
  - 汆燙要用的火力和時間
  - 玉米段的大小和蘿蔔塊的大小
  - 煮好時排骨、蔬菜和湯的樣子
  - 上桌溫度和食用時限
  - 原文沒寫人份
notes:
  - 原文只列鹽作為調味；白胡椒、料酒、蔥和香菜都沒列。
  - 原文沒寫是否加蓋；用湯鍋加蓋慢煮是家庭做法（推論）。

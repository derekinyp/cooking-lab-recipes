tag: pending
tag_note: 原文只寫小火煮約 45 分鐘，沒有寫整道菜的總時間；備料和汆燙要多久，原文沒寫。
card: 排骨、白蘿蔔、紅蘿蔔和玉米分別汆燙洗淨，再和薑片一起放進湯鍋，以小火慢煮約 45 分鐘，最後加鹽調味。湯裡有排骨和蔬菜，成品的湯色、口感原文沒寫。
variant: 台式家常版
intro: 照原文做，排骨和蔬菜都先分別汆燙，再加水一起煮。原文沒寫汆燙要用哪種鍋；家裡可用湯鍋汆燙後洗淨，再換水煮湯（推論）。
burners: 汆燙和煮湯都用同一只湯鍋，先汆燙、洗淨後換水煮湯（推論）。
ing:
  i_rib:

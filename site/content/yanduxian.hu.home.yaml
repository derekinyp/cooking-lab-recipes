tag: weekend
tag_note: 光燉就要半小時、再 20 分鐘、最後 5 分鐘，加上切肉和汆燙會更久；原文沒寫總共要多久。
card: 鹹肉、鮮五花肉先燉到半熟，再依序下春筍和百葉結，湯清、味鮮。
variant: 湯鍋燉煮版
tool_alts:
  tool/stock_pot: 沒有湯鍋時，可以用炒鍋或平底鍋（水位、時間都不變）
spice:
  mode: none
  text: 原文沒有辣椒和花椒，整鍋就是不辣那份。
  mild: [照食譜做。]
  yours: [想吃辣，盛碗後另外加（原文沒有，份量自己抓）。]
burners: 汆燙和燉煮都用同一只湯鍋依序做，只用 1 口爐。
missing:
  - 幾人份
  - 汆燙肉要煮幾分鐘、汆燙和沖洗要用多少水
  - 大火煮沸要多久
  - 怎麼看肉塊「半熟」
  - 燉的時候鍋蓋要蓋緊還是留縫
  - 去殼後春筍的淨重
notes:
  - 肉、春筍、百葉結一定要分三次下鍋：春筍太熟會變軟，百葉結煮太久會糊爛（原文）。
  - 春筍不用先燙過，以免失去鮮脆（原文）。
  - 鹹肉本身就鹹，原則上不放鹽；吃口重才稍微加一點（原文）。
  - 不要用火腿代替鹹肉，不要用雞肉、排骨、蹄髈代替五花肉，不要用冬筍或筍乾代替春筍，也不要加萵苣筍、青菜、黃豆芽（原文）。
  - 也不要燉太久，否則五花肉會軟爛、湯面浮一層白油（原文）。
  - 原文用陶瓷煮，這版改用湯鍋（家庭改法）。燉煮的三段也可以改放電鍋內鍋，但外鍋要放多少水、時間要不要改，原文沒寫，要試做。
steps:
  a4:
    time: 沸水煮 2 分鐘（原文）
  a6:
    heat: 煮開後轉小火（原文）
    time: 慢燉半小時（原文）
  a7:
    heat: 慢燉（接上一步的小火）
    time: 慢燉 20 分鐘（原文）
  a8:
    heat: 大火煮沸，再轉小火（原文）
    time: 轉小火燉 5 分鐘（原文）

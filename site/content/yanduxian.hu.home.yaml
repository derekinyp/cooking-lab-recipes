intro: 鹹腿肉、五花肉和春筍慢燉成清香鮮美的湯，再加入百葉結收尾。適合春天配飯，也適合多人共享。
card: 先把鹹肉與五花肉燉到半熟，再依序加入春筍和百葉結，保留筍的爽脆與湯頭的清香。
variant: 湯鍋燉煮版
burners: 切洗材料時可先備好百葉結；汆燙、燉肉、煮筍和收尾都依序使用同一口爐。
spice:
  mode: addon
  text: 湯底不辣；想吃辣，盛碗後再加辣椒或辣油。
  mild:
  - 照食譜烹調即可。
  hot:
  - 辣椒或辣油盛碗後另加。
notes:
- 肉、春筍、百葉結分次下鍋，筍比較爽脆，百葉結也不容易煮糊。
- 鹹腿肉已有鹹味，先試湯再決定是否加鹽。
- 不要燉得太久，避免五花肉軟爛、湯面浮出過多油脂。
steps:
  a4:
    title: 汆燙百葉結
    heat: 大火
    done:
    - 沸水煮 2 分鐘後撈起，以清水沖洗。
  a5:
    title: 汆燙肉塊
    heat: 大火
    time: 水滾後約 1–2 分鐘
    done:
    - 肉塊汆燙後撈起洗淨。
  a6:
    title: 燉肉
    heat: 煮開後轉小火
    time: 小火慢燉 30 分鐘
    done:
    - 肉塊表面變色，中心仍略帶粉色。
  a7:
    title: 燉春筍
    heat: 小火
    time: 慢燉 20 分鐘
    done:
    - 春筍煮到入味，仍保有爽脆口感。
  a8:
    title: 加入百葉結
    heat: 煮沸後轉小火
    time: 小火燉 5 分鐘
    done:
    - 百葉結熱透即可；試味後視需要少量加鹽。
tool_alts:
  tool/stock_pot: 可用厚底鍋替代湯鍋，水量以剛好蓋過肉塊為準。

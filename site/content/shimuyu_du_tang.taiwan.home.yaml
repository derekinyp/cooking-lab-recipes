tag: pending
tag_note: 主要食譜沒有寫總製作時間，原文沒寫，需試做計時。
card: 先用薑絲煮出湯香，再放入魚肚煮熟，最後加米酒、鹽和薑絲，撒上蔥花或芹菜珠。湯色清爽，魚肉熟透、能沿著紋理分開。
variant: 台式家常版
intro: 主要食譜寫虱目魚肚 2 片，約 500～600 公克，約 3～4 人份。魚肚先沖洗、吸乾，再和薑絲煮成清湯。
burners: 全程用 1 口爐和 1 只湯鍋依序煮。
missing:
  - 總製作時間
  - 清洗魚肚要多久
  - 魚肚放入鍋中到湯重新滾起要多久
steps:
  a3:
    heat: 水煮滾後轉中火
    time: 繼續煮 2～3 分鐘，讓薑香進入湯裡
  a4:
    heat: 原文沒另外寫火力
    time: 煮到湯重新滾起；要多久原文沒寫
  a5:
    heat: 轉中小火
    time: 約煮 6～10 分鐘；看到魚肉最厚處完全不透明、能沿著紋理分開即可

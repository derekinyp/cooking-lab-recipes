intro: 蝨目魚肚搭配薑絲煮成清湯，魚肉細嫩，湯頭帶著薑香，適合日常熱湯上桌。
card: 先煮薑絲湯底，再讓魚肚魚皮朝下入鍋，最後才加米酒與鹽，湯頭清爽、魚肉細嫩。
variant: 台式家常版
burners: 全程使用一口爐和一只湯鍋，依序煮湯底、魚肚與收尾調味。
spice:
  mode: none
notes:
- 魚肚若為冷凍品，先放冷藏解凍；下鍋前檢查是否有細刺。
- 鹽先少量加入，試過湯味再調整。
steps:
  a1:
    title: 清洗魚肚
    done:
    - 沖去表面雜質，再用紙巾吸乾。
  a2:
    title: 切配薑蔥
    done:
    - 薑切絲，蔥切花；芹菜切珠可代替蔥花。
  a3:
    title: 煮薑絲湯底
    heat: 中火
    time: 煮滾後續煮 2～3 分鐘
    done:
    - 聞到薑香。
  a4:
    title: 放入魚肚
    heat: 中火
    done:
    - 魚皮朝下滑入，湯重新滾起後撈去浮沫。
    tips:
    - 避免用力攪動魚肚。
  a5:
    title: 煮熟魚肚
    heat: 中小火
    time: 約 6～10 分鐘
    done:
    - 魚肉最厚處完全不透明，能沿肌理分開。
  a6:
    title: 調味起鍋
    done:
    - 加入米酒、鹽和剩餘薑絲，撒上蔥花或芹菜珠後關火。
ing:
  i_fish:
    suggest: 2 片
  i_ginger:
    suggest: 約 25 公克
  i_scallion:
    suggest: 2 支
  i_water:
    suggest: 約 1,000 毫升
  i_wine:
    suggest: 1 大匙
  i_salt:
    suggest: 適量
  i_wp:
    suggest: 少許，可省略
  i_celery:
    suggest: 約 10 公克，可代替蔥花

intro: 菲力牛排裹上壓碎的黑、白胡椒，煎出香氣後用同一鍋做紅酒鮮奶油胡椒醬，適合週末在家享用。
card: 菲力牛排裹上黑白胡椒煎香，再用同一鍋煮成紅酒鮮奶油醬，胡椒香濃，配馬鈴薯或沙拉都合適。
variant: 菲力、三色胡椒與紅酒鮮奶油醬
burners: 全程使用一口爐和同一只平底鍋；牛排煎好先取出，再用鍋中香氣煮醬汁。
spice:
  mode: addon
  text: 胡椒帶有辛香；想降低刺激感，可少裹一些胡椒，喜歡濃烈胡椒味則照量使用。
  mild:
  - 牛排少裹一些壓碎胡椒。
  hot:
  - 黑、白胡椒照量使用。
notes:
- 煎牛排前先將黑、白胡椒壓碎，均勻沾在牛排表面。
- 牛排離鍋靜置 3 分鐘，再搭配熱醬汁盛盤。
- 可搭配沙拉或馬鈴薯。
steps:
  p3:
    title: 煎牛排
    heat: 大火
    done:
    - 表面煎上色，中心保持偏紅；中心至少達 63°C。
  p4:
    title: 靜置牛排
    time: 3 分鐘
    done:
    - 離鍋靜置 3 分鐘。
tools:
  tool/mortar_pestle: 研缽；也可用平底鍋鍋底壓碎胡椒。
states:
  s_rare: 煎好的菲力牛排

tag: weekend
tag_note: 原文網頁標總時間 40 分鐘，超過平日 20 分鐘。
card: 菲力牛排裹壓碎的黑白胡椒煎到很生，用同一只鍋做紅酒鮮奶油胡椒醬。
intro: 菲力牛排裹上壓碎的黑、白胡椒，煎到很生的熟度，再用同一只鍋以白蘭地、紅酒、鮮奶油做胡椒醬。
variant: 英國主廚保羅・希斯寇特的版本（出版食譜）
tools:
  tool/mortar_pestle: 研缽（沒有就用平底鍋鍋底壓碎，原文的替代做法）
spice:
  mode: addon
  text: 這道菜的「辣」來自黑、白、綠胡椒，沒有辣椒，也沒有花椒。
  mild: [不辣那塊牛排少裹一點壓碎的胡椒（家庭改法，原文沒寫）。]
  yours: [照原文。]
burners: 全程只用 1 口爐、1 只平底鍋：牛排煎好拿出來，用同一只鍋做醬。
missing:
  - 每面煎幾分鐘、怎麼判斷熟度（原文沒寫中心溫度）
  - 牛排要靜置多久
  - 白蘭地要放多少（原文只寫「一點」）
  - 加鮮奶油後要煮多久、煮到多稠
notes:
  - 原文建議搭配粗薯條、沙拉、烤馬鈴薯或烤蔬菜；這版不用烤箱，烤的配菜就先不做。
steps:
  p3:
    title: 熱平底鍋加一點油，把牛排煎到很生的熟度
    temp: 中心溫度原文沒寫
    done: ["牛排：煎到很生的熟度。台灣叫一分熟或三分熟的說法不一，原文沒寫怎麼判斷。"]
  q1:
    time: 約 15–20 秒（原文）
states:
  s_rare: 煎好的牛排

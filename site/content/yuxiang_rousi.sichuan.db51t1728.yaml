intro: 肉絲與青筍、木耳快炒，再加入泡辣椒、薑、蒜和蔥，最後以糖醋醬油芡汁收裹。酸甜鹹香、辣味鮮明，適合配飯。
card: 肉絲炒散後加入青筍與木耳快炒，泡辣椒和薑蒜蔥炒出香氣，再用糖醋醬油芡汁收至緊裹食材。
variant: 四川省地方標準版
burners: 使用一口爐和一只炒鍋；開火前先切好材料並調好芡汁，下鍋後依序快炒。
spice:
  mode: separate
  text: 泡辣椒一開始就和薑蒜蔥下鍋炒香，辣味會進入整鍋；要做不辣版本，另起一鍋省略泡辣椒末。
  mild:
  - 另鍋不放泡辣椒末，其餘材料依序炒製。
  hot:
  - 依食譜加入泡辣椒末。
notes:
- 先備妥肉絲、青筍、木耳和芡汁，下鍋後連續完成快炒。
- 芡汁先調勻，倒入鍋中後迅速翻炒至均勻裹住食材。
compare:
- 家常版本常用辣豆瓣醬，且會先炒肉絲盛起；這個版本以泡辣椒末提味，肉絲不先盛出。
steps:
  a1:
    title: 切肉絲
    done:
    - 豬肉切成粗細一致的肉絲。
  a2:
    title: 醃肉
    time: 約 10–20 分鐘
    done:
    - 加入鹽、米酒和太白粉水拌勻。
  a3:
    title: 切配蔬菜
    done:
    - 青筍切絲，木耳切粗絲。
  a4:
    title: 燒熱食用油
    heat: 中大火
    done:
    - 油溫達 160°C 後下肉絲。
  a5:
    title: 炒肉絲
    heat: 大火
    time: 約 1–2 分鐘
    done:
    - 肉絲炒散並轉白。
  a6:
    title: 炒香辛料
    heat: 中火
    time: 約 30–60 秒
    done:
    - 泡辣椒、薑、蒜和蔥香氣散出。
  a7:
    title: 炒青筍與木耳
    heat: 大火
    time: 約 1–2 分鐘
    done:
    - 青筍轉亮，木耳熱透，仍保有脆度。
  a8:
    title: 芡汁收裹
    heat: 中大火
    time: 約 1–2 分鐘
    done:
    - 芡汁收濃，均勻裹住肉絲和蔬菜。
  a9:
    title: 盛盤
    done:
    - 趁熱盛盤上桌。
ing:
  i_pork:
    suggest: 約 1 碗肉絲
  i_celtuce:
    suggest: 約 1 碗青筍絲
  i_woodear:
    suggest: 約 1 小碗木耳絲
  i_paolajiao:
    suggest: 約 3 湯匙泡辣椒末
  i_ginger:
    suggest: 約 1 湯匙薑末
  i_garlic:
    suggest: 約 1 湯匙蒜末
  i_scallion:
    suggest: 約 2 湯匙蔥花
  i_oil:
    suggest: 約 5 湯匙食用油

tag: pending
tag_note: 四川省官方標準沒寫總共要多久，要試做計時；另外兩份台灣家常食譜（來源②③）各自標 20 分鐘，但做法不同，只能參考。
card: 肉絲炒散、青筍和木耳炒斷生，再下泡辣椒末、薑米、蒜米和蔥花炒香，倒入先調好的糖醋醬油芡汁，收到緊緊裹住食材。
variant: 四川省地方標準版
intro: 這道的份量和做法照四川省地方標準（來源①，附錄裡的魚香肉絲）。標準是用公克寫的，這頁照標準的數字。另外兩份台灣家常版（來源②③）放在下面對照，數字不混在一起用。
spice:
  mode: separate
  text: 泡辣椒末在肉絲炒散以後就下鍋炒香，辣味和紅色都進了油裡，沒辦法最後再分開加，所以不辣那份要另外做。這道沒有花椒，不麻本來就成立。
  mild: [另起一鍋，不放泡辣椒末，其餘步驟照標準做。不辣版少了泡辣椒的鹹香和紅色，要不要用別的調料補，原文沒寫，要試做後再定。標準沒有不辣版本，這是改法（推論）。]
  yours: [照這頁的食譜做。]
burners: 全程只用 1 口爐、1 只炒鍋依序做（推論，標準只寫在鍋中烹製）；芡汁可以先在碗裡調好。
ing:
  i_pork:
    note: 標準寫豬肉切成「二粗絲」，沒寫幾毫米
  i_woodear:
    note: 水發木耳就是泡發好的木耳
  i_oil:
    note: 標準給的是食用油 70 克；燒油要燒到什麼溫度、怎麼目測，原文沒寫
missing:
  - 幾人份（標準沒標，豬肉 200 克不能直接當成幾人份）
  - 用什麼火
  - 總時間和每一步要多久
  - 「二粗絲」切幾毫米
  - 碼味要醃多久
  - 燒油到什麼樣子可以下肉（標準寫了溫度，但沒寫沒有溫度計怎麼看）
  - 青筍要不要先焯水
compare:
  - 來源③用辣豆瓣醬代替泡辣椒，先把肉絲炒到變白盛出，另鍋先炒辣豆瓣醬再下蔥薑蒜，投料順序和標準不同。
  - 來源②也是肉絲先盛出，另起一鍋爆香；標準只寫在鍋中烹製，沒說用幾只鍋。兩份台灣版都是家常變化，這頁沒用它們的數字。
  - 糖、醋、醬油的比例在標準裡是 17 比 10 比 4（糖最多）。
notes:
  - 開火前把肉絲、青筍、木耳、泡辣椒末、薑米、蒜米、蔥花和芡汁都先備好，下鍋後要連續做完。
  - 芡汁可以先調好：糖、醋、醬油、鹽、料酒、水澱粉和鮮湯（味精可放可不放）。
steps:
  a4:
    heat: 標準沒寫火力
  a8:
    tips: 收到芡汁緊緊裹住食材（包芡）就好。

intro: 五花肉煸香後加入蝦米、紅蘿蔔與紅蔥頭，再和高麗菜、生米及醬汁一起煮成一鍋飯。米飯吸收肉香與蔬菜甜味，適合忙碌時簡單準備一餐。
card: 五花肉煸香，和蝦米、紅蘿蔔、高麗菜與生米同鍋煮，米飯吸飽配料香氣。
variant: 一鍋到底・湯鍋爐上版
burners: 全程使用一口爐與一只湯鍋；洗切配料、泡米和調醬汁可在開火前完成。
spice:
  mode: none
notes:
- 米和水都用同一只量米杯量取。
- 泡米的水要瀝掉，不算在煮飯用水裡。
- 怕黏鍋可偶爾查看鍋底，輕輕翻動。
- 想加香菇，可和紅蘿蔔一起炒香。
ing:
  i_pork:
    suggest: 100 公克
  i_shrimp:
    suggest: 10 公克
  i_shallot:
    suggest: 2 瓣
  i_oil:
    note: 五花肉會煸出油脂，若鍋子容易黏再加油。
  i_salt:
    note: 蝦米有鹹味，鹽先少放，煮好再調整。

tag: weekend
tag_note: 主要食譜標 30 分鐘（光小火煮 15 分鐘、再悶 10 分鐘），超過你定的平日 20 分鐘；影片還要先泡米，泡多久原文沒寫。
card: 五花肉丁煸到焦香，加蝦米、紅蘿蔔、紅蔥頭炒香，再下高麗菜和泡好的生米，倒醬汁蓋鍋小火煮，一只湯鍋做到底。
variant: 一鍋到底・湯鍋爐上版
intro: 這道菜的做法來自一支一鍋到底高麗菜飯的短影片；影片沒有任何份量，所以份量照一份同樣是爐上一鍋、小火煮 15 分鐘的家常食譜（來源②）。影片有、那份食譜沒有的五花肉、蝦米、紅蔥頭，附上其他食譜的建議值。
spice:
  mode: none
  text: 影片和主要食譜都沒有辣椒和花椒，整鍋就是不辣那份。
  mild: [照食譜做。白胡椒可以少放。]
  yours: [想吃辣，盛碗後另外加（原文沒有，份量自己抓）。]
burners: 全程只用 1 口爐、1 只湯鍋；另一口爐可以同時做別的菜（推論）。
ing:
  i_pork:
    suggest: 100 公克（來源③，同樣用 2 杯米）
  i_shrimp:
    suggest: 10 公克（來源③）；沒有秤就抓「1 小把」（來源④）
  i_shallot:
    suggest: 2 瓣（來源④）
  i_oil:
    note: 五花肉會煸出油，影片沒拍有沒有先放油；鍋子容易黏再放
  i_salt:
    note: 蝦米本身帶鹹，鹽先放一半，醬汁嚐過再補
missing:
  - 米要泡多久
  - 五花肉、蝦米、紅蔥頭、蔥花的量（上面附了建議值，蔥花沒有）
  - 影片的醬汁是什麼調的（這頁用主要食譜的水、醬油、鹽、白胡椒）
  - 煸肉、炒料用什麼火、要多久
  - 煮好是什麼樣子、湯鍋要多大
notes:
  - 米和水一樣多（照主要食譜 2 杯米、2 杯水換算）；用電鍋附的量米杯量就好（推論）。泡過米的水要瀝掉，不算在煮飯的水裡（推論，影片沒拍）。
  - 影片把醬汁先調好再倒；主要食譜是倒入水以後再加醬油、鹽、白胡椒。兩種都可以，這頁照影片先調好。
  - 怕黏鍋：小火煮的那 15 分鐘，影片和主要食譜都沒說要翻；另一份用鑄鐵鍋的食譜每 1～2 分鐘開蓋翻一次（來源⑤），第一次做可以掀蓋看一下底部。
  - 主要食譜還有蒜末和香菇絲，影片沒有，這頁不放；想加香菇，跟紅蘿蔔一起炒。
  - 影片說原作是用電鍋做的，她改用湯鍋；這頁照湯鍋做，不用烤箱或氣炸鍋。
steps:
  a10:
    heat: 先煮滾，再蓋鍋轉小火（主要食譜；影片只說蓋鍋小火滾煮）
    time: 小火煮 15 分鐘（影片和主要食譜一樣）
  a11:
    time: 關火悶 10 分鐘（主要食譜；影片沒拍這步）

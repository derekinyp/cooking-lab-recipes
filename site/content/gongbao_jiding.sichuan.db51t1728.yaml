tag: pending
tag_note: 官方標準沒寫總共要多久，要試做計時。
card: 雞丁滑嫩、花生香脆，鹹鮮帶麻辣和一點甜酸。
spice:
  mode: separate
  text: 乾辣椒和花椒是一開始就下熱油炒香，整鍋的味道都從這裡來，沒辦法從同一鍋分出不辣不麻的一份。
  wife: [要另外做一份不放乾辣椒和花椒的。官方標準沒有這種做法，份量和步驟要試做後再定。]
  yours: [照這頁的食譜做。]
burners: 全程只用 1 口爐、1 只炒鍋；開火前把雞丁、辣椒、芡汁都先備好，開火後要一氣呵成。
missing:
  - 幾人份（只寫雞肉 200 克）
  - 「中丁」切多大
  - 燒油要多熱：原文寫 150°C，家裡沒有溫度計，原文也沒寫怎麼目測
  - 碼味要放多久、每一步用什麼火
compare:
  - 糖醋比例：官方是白糖 8 克、醋 6 克（糖比醋多）；網路流傳醋要比糖多。兩種說法相反，這頁照官方，做完覺得太甜或太酸，在 Notion 紀錄裡寫下來。
  - 北京版會先把雞丁過油撈出再回鍋，偏甜；這些說法只來自網路，這頁沒用。
steps:
  a4:
    tips: [這一步之後要連續做完，材料先排在爐子旁。]

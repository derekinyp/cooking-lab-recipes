intro: 宮保雞丁以乾辣椒和花椒炒出香麻氣息，雞丁裹上鹹鮮帶甜酸的醬汁，再拌入酥花生。適合搭配白飯作為家常主菜。
card: 雞丁裹上棕紅亮澤的甜酸醬汁，搭配乾辣椒、花椒與酥花生，入口鹹鮮帶麻辣。
variant: 四川傳統版
burners: 全程使用一口爐與一只炒鍋；開火前先備好雞丁、辛香料和調味醬汁，開火後依序快炒。
spice:
  mode: separate
  text: 乾辣椒和花椒會在前段下鍋，想做不辣不麻版本請另起一鍋，省略這兩種辛香料。
notes:
- 雞丁與調味料先拌勻，炒製前備妥所有材料。
- 醬汁下鍋後快速拌至濃稠亮澤，完成後立即起鍋。
- 花生最後加入，保留酥脆口感。
steps:
  a1:
    title: 切雞丁
    done:
    - 切成大小一致的中丁。
  a2:
    title: 醃雞丁
    time: 醃 10–20 分鐘
    done:
    - 與鹽、米酒和太白粉水拌勻。
  a3:
    title: 處理乾辣椒
    done:
    - 剪切成長約 2 公分的辣椒節。
  a4:
    title: 加熱食用油
    heat: 中大火
    done:
    - 油熱後準備下乾辣椒與花椒。
  a5:
    title: 炒香辛料
    heat: 中火
    done:
    - 辣椒轉棕紅並聞到香氣，避免炒焦。
  a6:
    title: 快炒雞丁
    heat: 中大火
    done:
    - 雞丁炒至剛熟。
  a7:
    title: 加入薑蒜蔥
    heat: 中大火
    done:
    - 炒至辛香料散出香氣。
  a8:
    title: 倒入芡汁
    heat: 中大火
    done:
    - 芡汁濃稠亮澤並均勻裹住雞丁，隨即起鍋。
  a9:
    title: 拌入花生
    done:
    - 起鍋前拌入酥花生。

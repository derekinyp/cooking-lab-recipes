tag: pending
tag_note: 食譜沒有寫總共要多久，只有部分步驟有時間，需試做計時。
card: 五花肉煮過、豬皮扎孔塗醬油後煎到表面起泡，再切片和炒過的梅乾菜一起排入碗中，淋上略煮勻的醬汁蒸好後倒扣。成品肉片與梅乾菜層層相疊，肉軟爛是推論。
variant: 客家家常版（推論）
intro: 做法照楊桃美食網的梅乾菜扣肉食譜。原文以電鍋蒸製；家裡用大同式電鍋外鍋加水蒸是家庭改法（推論），外鍋加水量原文沒寫。
spice:
  mode: separate
  text: 這份主食譜沒有辣椒或花椒，照原文做就是不辣那份。若參照另一份做法加辣椒，辣椒一開始就和蒜、八角爆香，不能最後才分開加；不辣那份需另外做（推論）。
  mild:
    - 不辣那份照主食譜做，不加辣椒或花椒。
  yours:
    - 主食譜沒有辣椒或花椒。若想參照另一份做法加辣椒，需另外處理；主食譜沒有這種做法，怎麼加原文沒寫（推論）。
steps:
  a1:
    heat: 滾水煮；爐火檔位原文沒寫
    time: 約煮40分鐘
  a2:
    time: 晾乾多久原文沒寫
  a3:
    heat: 原文沒寫火力
    time: 煎多久原文沒寫；煎至表面起泡
  a5:
    heat: 小火
    time: 炒多久原文沒寫；炒至水分收乾
  a6:
    heat: 原文沒寫火力
    time: 略煮多久原文沒寫；略煮勻
  a7:
    time: 電鍋蒸2小時；外鍋加水量原文沒寫

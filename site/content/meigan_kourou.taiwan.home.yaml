intro: 五花肉先煮過、扎孔煎香，再和炒過的梅乾菜一層層排入碗中蒸軟。倒扣盛盤後肉香與梅乾菜香交融，適合家人一起配飯。
card: 五花肉皮朝下煎到起泡，與炒乾的梅乾菜疊放，淋入醬汁蒸到軟嫩後倒扣盛盤。
variant: 客家家常版
burners: 煮肉時可同時用另一口爐炒梅乾菜；之後煎肉、略煮醬汁，最後用電鍋蒸。
spice:
  mode: addon
  text: 這份做法不辣；想吃辣，可另備辣椒片，盛盤後各自添加。
  mild:
  - 照食譜做，不加辣椒。
  hot:
  - 辣椒片另外盛小碟，依個人口味添加。
notes:
- 梅乾菜洗淨後切碎；若吃起來仍偏鹹，可再沖洗一次並瀝乾。
- 豬皮煎到起泡後取出稍微放涼，再切片較好操作。
- 蒸好的扣肉小心倒扣，避免熱湯汁濺出。
compare:
- 這個版本先煎整塊豬皮，再切片排碗蒸；另一種做法會先將肉片和梅乾菜同鍋燉煮。
steps:
  a1:
    title: 煮熟五花肉
    heat: 中大火
    time: 約煮 40 分鐘
    done:
    - 煮好後撈出瀝乾。
  a2:
    title: 豬皮扎孔塗醬油
    time: 晾約 5–10 分鐘
    done:
    - 豬皮扎孔，表面薄塗醬油並晾至不再濕亮。
  a3:
    title: 煎香豬皮
    heat: 中火
    time: 約 2–5 分鐘
    done:
    - 豬皮表面起泡。
  a5:
    title: 炒梅乾菜
    heat: 小火
    time: 約 5–10 分鐘
    done:
    - 梅乾菜水分收乾。
  a6:
    title: 略煮肉片與醬汁
    heat: 中火
    time: 約 3–5 分鐘
    done:
    - 肉片與醬汁混合均勻。
  a7:
    title: 電鍋蒸軟
    time: 蒸 2 小時
    done:
    - 筷子可輕易戳入肉片。
  a8:
    title: 倒扣盛盤
    done:
    - 整碗倒扣，肉片與梅乾菜完整成形。
ing:
  i_pork:
    suggest: 約 800 公克
  i_meigan:
    suggest: 約 150 公克
  i_soy_c:
    suggest: 少許，薄塗豬皮
states:
  s_steamed: 蒸軟的梅乾扣肉

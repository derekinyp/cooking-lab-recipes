tag: weekday
tag_note: 原文標 20 分鐘（4 人份），平日勉強可以；備料時間有沒有算在裡面，原文沒寫，請試做計時確認。
card: 薑片乾煸、雞腿煎到金黃，加三杯醬汁燜煮收乾，最後下九層塔。
spice:
  mode: addon
  text: 原文的辣椒片是整鍋一起下（燜煮前和收汁後各一次）。這頁改成主鍋不放辣椒，做好先盛太太那份。
  wife: [照這頁做，主鍋不放辣椒。]
  yours: [最後在你那份另加辣椒片。原文整鍋用 2 根，你那份放多少原文沒寫。這道菜沒有花椒。]
burners: 全程只用 1 口爐、1 只炒鍋依序做。
missing:
  - 一包雞腿有多重
  - 炒薑、煎雞用什麼火、煎多久
  - 收汁要多久
  - 鍋邊淋的米酒要多少、麻油兩處各放多少
notes:
  - 原文提醒：節奏很快，材料和醬汁要先準備好。
  - 原文提醒：麻油不耐高溫，太早放容易有苦味。

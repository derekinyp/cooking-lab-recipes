intro: 薑片乾鍋煸香，蒜頭炒到金黃，再煎香雞腿塊，加入醬汁燜煮收汁。最後放九層塔與鍋邊米酒，香氣濃郁、適合配飯。
card: 乾鍋煸薑、蒜頭炒金黃，雞腿煎香後以醬汁燜煮收乾，最後放九層塔和鍋邊米酒提香。
variant: 台式家常版
burners: 全程用 1 口爐和 1 只炒鍋，薑蒜先炒香盛起，再煎雞、燜煮並收汁。
spice:
  mode: addon
  text: 主鍋不加辣椒，完成後先盛出不辣的份量；想吃辣，再把辣椒片拌入剩下的雞肉。
  mild:
  - 主鍋不放辣椒。
  hot:
  - 盛出不辣份量後，再將辣椒片拌入其餘雞肉。
notes:
- 先備好材料與醬汁，炒煮過程接續進行。
- 麻油不耐高溫，避免長時間大火加熱。
- 鍋邊淋入米酒時小心蒸氣。
steps:
  a1:
    title: 乾鍋煸香薑片
    heat: 中小火
    done:
    - 薑片微乾並散出香氣。
  a2:
    title: 加入香油拌炒
    heat: 中小火
    done:
    - 薑片均勻沾上香油。
  a3:
    title: 炒金黃蒜頭
    heat: 中小火
    done:
    - 蒜頭呈金黃色，薑蒜取出備用。
  a4:
    title: 煎香雞腿塊
    heat: 中火
    time: 每面約 2–4 分鐘
    done:
    - 雞塊兩面金黃。
  a5:
    title: 加入薑蒜與醬料
    heat: 中小火
    done:
    - 雞塊均勻裹上醬料。
  a6:
    title: 加蓋燜煮
    heat: 中小火
    time: 燜煮 5 分鐘
    done:
    - 醬汁滾沸後轉中小火燜煮。
  a6b:
    title: 大火收汁
    heat: 大火
    done:
    - 醬汁收乾並裹住雞塊。
  a7:
    title: 放九層塔與鍋邊米酒
    heat: 中大火
    done:
    - 九層塔稍微軟化、香氣散出即可起鍋。
ing:
  i_chicken:
    suggest: 帶骨雞腿塊 2 包
  i_wine_finish:
    suggest: 約 1 大匙
states:
  s_braised: 收汁完成的三杯雞

tag: weekend
tag_note: 原文標準備 30 分鐘、料理 10 分鐘，超過平日 20 分鐘。
card: 魚用蔥薑水醃過，電鍋蒸熟，淋醬汁、鋪蔥段、澆熱油。
spice:
  mode: addon
  text: 主要食譜沒有辣椒，整條魚不辣，可以直接當不辣那份。
  mild: [照食譜做，不另外加。]
  yours: [辣椒不要和魚一起蒸；最後和蔥段一起鋪在你那半邊、澆熱油，或另外裝小碟沾著吃（家庭改法，沒有份量）。]
burners: 電鍋蒸魚不佔爐口；熱油用平底鍋佔 1 口爐，可以和電鍋同時。
missing:
  - 用什麼魚、魚多重
  - 魚身劃刀要多深
  - 魚片或魚排怎麼看熟（「魚眼凸出」只適用整條帶頭的魚）
  - 熱油要多熱
notes:
  - 電鍋比較小，原文說適合蒸魚片、魚排；整尾魚要先確認放得進電鍋，放不下就改用魚片或魚排。
  - 計時 10 分鐘一到就把魚拿出來，不要等電鍋開關跳起來（原文）。
  - 醃魚要放冰箱 10～30 分鐘，不要醃太久，不然蔥味太重（原文）。

intro: 鮮魚先用蔥薑水抓醃，再以電鍋蒸熟，淋上蒸魚醬汁、鋪蔥段並澆熱油。魚肉鮮嫩，醬香清爽，適合家常晚餐。
card: 蔥薑水抓醃後用電鍋蒸魚，倒掉部分湯汁再淋醬、鋪蔥段，最後澆熱油提香。
variant: 電鍋家庭版
burners: 魚用電鍋蒸，平底鍋加熱油；兩件事可以同時進行。
spice:
  mode: addon
  text: 魚本身不辣；想吃辣，可把辣椒片和蔥段一起鋪上，再澆熱油。
  mild:
  - 照食譜做，不另外加辣椒。
  hot:
  - 辣椒片另放小碟，或鋪在魚的一側再澆熱油。
notes:
- 整尾魚要先確認放得進電鍋；空間不夠時可改用魚片或魚排。
- 電鍋計時 10 分鐘一到就取出魚，不要等開關跳起。
- 魚放冰箱醃 10–30 分鐘即可，避免蔥味太重。
steps:
  a6:
    title: 電鍋蒸魚
    time: 計時 10 分鐘
    done:
    - 帶頭整魚可觀察魚眼凸起；時間到立刻取出。
  a7:
    title: 加熱食用油
    heat: 中火
    done:
    - 油面流動後即可使用，避免加熱到冒煙。
  a8:
    title: 淋醬鋪蔥
    done:
    - 倒掉一半湯汁，淋醬並鋪上蔥段。
  a9:
    title: 澆熱油提香
    done:
    - 熱油澆上蔥段，香氣散出。
ing:
  i_fish:
    suggest: 整尾 1 尾，或適量大小的魚片、魚排
states:
  s_fish_steamed: 蒸熟的魚

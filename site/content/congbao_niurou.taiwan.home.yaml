tag: pending
tag_note: 主要食譜沒寫要炒多久，只有頁面標籤寫「30 分鐘內」，要試做計時；另一份食譜（來源②）標 5 分鐘，但做法不同，只能參考。
card: 牛肉絲用米酒、醬油、糖、水抓拌入味，最後拌太白粉；少許油爆香蒜片，下牛肉絲炒到變白，加醬油、糖、蔥段和紅辣椒絲拌勻。
variant: 台式家常版
intro: 份量和做法照一份有完整份量的家常食譜（來源①，牛肉絲 150 公克）。另外兩份蔥爆牛肉（來源②③）放在下面對照，數字不混在一起用。全程只用一只炒鍋。
spice:
  mode: addon
  text: 主要食譜的紅辣椒絲到最後一步才和蔥段一起下，不是一開始爆香，所以可以一鍋兩吃。這是改法（推論），原文沒有分開做。
  mild: [最後一步調味拌勻後，先盛出不辣那份，不放辣椒。]
  yours: [鍋裡剩下的加紅辣椒絲拌炒一下（原文整道菜用 1 支，你那份放多少要自己抓）。這道菜沒有花椒。]
burners: 全程只用 1 口爐、1 只炒鍋依序做（推論，原文沒寫爐口）。
ing:
  i_beef:
    note: 原文只寫「牛肉絲」，沒寫哪個部位、肥瘦；買的時候請攤商切絲
  i_oil:
    note: 原文只寫「倒入少許沙拉油」，沒寫多少；另一份食譜（來源②）用 3 大匙，可以參考，但那是不同做法
  i_m_starch:
    note: 太白粉最後才拌入，包住牛肉絲保護肉質
missing:
  - 幾人份
  - 沙拉油要放多少
  - 每一步用什麼火、要炒多久
  - 牛肉絲要醃多久（另外兩份食譜都寫約 10 分鐘）
  - 蔥段要切多長
compare:
  - 另外兩份食譜（來源②③）有蠔油，來源③還有洋蔥；主要食譜都沒有，這頁不加，不混在一起。
  - 來源②是先把蔥白、薑絲、蒜末爆香盛起，再和牛肉一起炒，最後才放蔥青和辣椒，並在起鍋前淋烏醋；這頁照主要食譜，沒有烏醋。
notes:
  - 牛肉最怕炒太老（來源①的小撇步標題），看到肉色變白就可以進下一步，不要久炒。
  - 太白粉要最後才拌進牛肉，不要一開始就和醃料混在一起。
steps:
  a3:
    heat: 原文沒寫火力
  a4:
    tips: 牛肉炒到肉色變白就好，原文沒寫要炒幾分鐘。

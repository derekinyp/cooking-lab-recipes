intro: 牛肉絲先抓入米酒、醬油和糖，再拌太白粉，炒起來較滑嫩。搭配蒜香、青蔥與紅椒絲，適合配飯的家常快炒。
card: 牛肉絲先抓醃再拌太白粉，少油爆香蒜片後快速拌炒，醬油與砂糖帶出鹹香微甜。
variant: 台式家常版
burners: 用一口爐和一只炒鍋依序完成；備料與牛肉抓醃可先在砧板、碗中進行。
spice:
  mode: addon
  text: 先不放紅辣椒，盛出不辣的部分後，再把紅辣椒絲放入鍋中拌炒。
  mild:
  - 紅辣椒先留在一旁，最後分開加入。
  hot:
  - 想增加辣味，可在最後加入紅辣椒絲一起拌炒。
notes:
- 太白粉最後才拌入牛肉，炒前再抓勻。
- 牛肉炒到變色就接著加入配料，避免久炒變硬。
steps:
  a1:
    title: 切配料
    done:
    - 青蔥切段、蒜頭切片，紅辣椒去籽切絲。
    flow: 切好備用
  a2:
    title: 抓醃牛肉
    done:
    - 牛肉抓入米酒、醬油、砂糖和水，靜置後再拌入太白粉。
    flow: 抓醃上粉
  a3:
    title: 爆香蒜片
    heat: 中小火
    done:
    - 炒出蒜香，蒜片邊緣微金黃。
    flow: 蒜片爆香
  a4:
    title: 快炒牛肉
    heat: 中大火
    done:
    - 炒至牛肉絲變色。
    tips:
    - 牛肉變色就接著下一步，避免久炒。
    flow: 炒至變色
  a5:
    title: 加入蔥與調味
    heat: 中大火
    done:
    - 加入醬油、砂糖、青蔥與紅椒絲拌勻，蔥段略軟即可起鍋。
    flow: 拌勻起鍋
ing:
  i_beef:
    suggest: 約 1 碗
  i_oil:
    suggest: 約 1 小匙

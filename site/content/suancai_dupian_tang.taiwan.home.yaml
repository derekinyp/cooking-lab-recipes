tag_note: 原文沒寫總時間，要試做計時。
card: 豬肚先和米酒、蔥、薑片煮軟，切片後與酸菜、薑絲和水煮成湯，最後加鹽調味。湯裡有酸菜和薑絲，豬肚切成斜片。
variant: 台式家常版
intro: 做法照原食譜，豬肚先煮軟，再切片回鍋煮湯。
burners: 兩段煮製依步驟先後進行（推論）；湯鍋數量原文沒寫。
missing:
  - 豬肚清洗方式
  - 煮豬肚的火力、是否加蓋及用水量
  - 酸菜是否先泡水去鹹
  - 酸菜、豬肚和薑絲切多大
  - 酸菜和薑絲煮到水滾要多久
  - 成品色澤、湯味和上桌方式
steps:

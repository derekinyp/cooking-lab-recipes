intro: 苦瓜切片汆燙後瀝乾，再與蒜末、鹹蛋和調味料快炒，鹹香中帶著苦瓜清苦，配飯或作便當菜都合適。
card: 苦瓜先汆燙瀝乾，再用中火炒香蒜末和鹹蛋，放入苦瓜與米酒等調味料拌炒，清苦中帶鹹香。
variant: 台式家常版
burners: 先用一口爐汆燙苦瓜，再用炒鍋依序炒香蒜末、鹹蛋與苦瓜。
spice:
  mode: addon
  text: 先完成不辣的苦瓜與鹹蛋，再盛出不辣的部分；鍋中剩下的拌入紅辣椒片。
notes:
- 苦瓜汆燙後瀝乾再下鍋，較不會把炒鍋裡的味道沖淡。
- 鹹蛋本身有鹹度，鹽先少量加入，試味後再調整。
steps:
  a2:
    title: 汆燙苦瓜
    heat: 大火
    time: 汆燙約 5 分鐘
    done:
    - 苦瓜片撈出瀝乾。
    flow: 汆燙
  a4:
    title: 爆香蒜末
    heat: 中火
    done:
    - 蒜末散出香氣。
    flow: 爆香
  a5:
    title: 炒香鹹蛋
    heat: 中火
    done:
    - 鹹蛋炒出香氣。
    flow: 炒鹹蛋
  a6:
    title: 拌炒苦瓜
    heat: 中火
    done:
    - 苦瓜與調味料均勻混合並熱透。
    flow: 拌炒
  a7:
    title: 替部分加入辣椒
    heat: 中小火
    done:
    - 辣椒片均勻拌入鍋中。
    flow: 加辣椒

tag: pending
tag_note: 主要食譜只標「30 分鐘內」（不是 20 分鐘），寫出來的時間只有汆燙約 5 分鐘，爆香和拌炒多久原文沒寫，要試做計時。
card: 苦瓜去籽切片、汆燙約 5 分鐘瀝乾；鹹蛋去殼切小塊；中火爆香蒜末，下鹹蛋炒香，再放苦瓜和調味料拌炒均勻；辣椒最後才分開加。
variant: 台式家常版
intro: 份量和做法照楊桃美食網的食譜（來源①，苦瓜 300 公克、鹹蛋 2 顆）。另外兩份鹹蛋苦瓜（來源②③）放在下面對照，數字不混在一起用。
spice:
  mode: addon
  text: 主要食譜的紅辣椒片是和蒜末一起爆香，這頁改成最後才分開加，所以可以一鍋兩吃。這是改法（推論），辣味會比原文淡。
  mild: [苦瓜和調味料拌勻後，先盛出不辣那份。]
  yours: [鍋裡剩下的再拌入紅辣椒片（原文 10 公克是整鍋的量；分開加多少要試做）。這道菜沒有花椒。]
burners: 先用湯鍋汆燙苦瓜，再用炒鍋炒，兩步先後做，同一時間只用 1 口爐（推論）；另一口爐可以做別的菜。
ing:
  i_egg:
    note: 原文只寫「鹹蛋」，沒寫是生的還是熟的；市售多半是熟鹹蛋
  i_salt:
    note: 原文只寫「少許」，邊炒邊試味道（推論）
  i_sugar:
    note: 原文只寫「少許」
missing:
  - 幾人份
  - 汆燙要多少水
  - 爆香、炒鹹蛋、拌炒各要多久
  - 苦瓜切多厚
  - 成品的樣子和口感
compare:
  - 來源②用蔥、薑、香油，苦瓜只燙約 10 秒鐘就撈起沖涼，小火炒香後改中火再炒約 30 秒。
  - 來源③（山苦瓜）把鹹蛋黃壓泥、蛋白切末分開炒，苦瓜川燙 1 分鐘，加高湯 2 大匙煨到收汁。
notes:
  - 苦瓜燙好要撈出瀝乾水份再下鍋（原文提醒）。
steps:
  a2:
    heat: 原文沒寫火力
    time: 汆燙約 5 分鐘
  a4:
    heat: 中火
    time: 爆香，原文沒寫多久

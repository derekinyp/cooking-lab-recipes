intro: 空心菜用大火快炒，蒜香和薑香襯出蔬菜清甜，顏色翠綠、口感爽脆。辣椒另外拌入，方便同桌分別享用。
card: 蒜頭和薑絲先爆香，再下空心菜大火快炒到轉綠；辣椒最後分開加入，清爽脆口又方便調整辣度。
variant: 台式家常版
burners: 用一口爐和一只炒鍋依序快炒，空心菜洗切瀝乾後再開火。
spice:
  mode: addon
  text: 先炒好不辣份並盛出，再把辣椒絲拌入其餘空心菜。
  mild:
  - 蒜頭和薑絲爆香後直接下空心菜，不加辣椒。
  hot:
  - 盛出不辣份後，把辣椒絲拌入剩下的空心菜。
notes:
- 空心菜洗淨後充分瀝乾，入鍋較不會出太多水。
- 炒到葉片轉綠就加調味料拌勻，避免菜梗失去脆度。
compare:
- 這道是大火快炒，蔬菜保持翠綠與脆口；慢火加湯煨煮的做法會更軟。
steps:
  a1:
    title: 洗切空心菜
    done:
    - 洗淨瀝乾後切段。
    flow: 洗切瀝乾
  a2:
    title: 爆香蒜薑
    heat: 中小火
    time: 約 30 秒至 2 分鐘
    done:
    - 炒出蒜香與薑香。
    flow: 蒜薑爆香
  a3:
    title: 大火快炒
    heat: 大火
    time: 約 1 至 3 分鐘
    done:
    - 空心菜轉綠後加鹽與雞粉拌勻，立即盛出。
    flow: 快炒空心菜
  a4:
    title: 分開加辣
    done:
    - 先盛出不辣份，再把辣椒絲拌入其餘份量。
    flow: 辣椒另加
ing:
  i_kongxincai:
    suggest: 約 1 把

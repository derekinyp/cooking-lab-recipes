tag: pending
tag_note: 主要食譜沒寫要炒多久，頁面只標「30 分鐘內」（不是 20 分鐘），要試做計時；另一份食譜（來源②）標備料 10 分鐘、步驟 10 分鐘，但那是不同的做法，只能參考。
card: 空心菜洗淨切段，熱油鍋爆香蒜頭和薑絲，下空心菜大火快炒到變色，加鹽和雞粉拌勻就盛出；辣椒絲最後才分開加。
variant: 台式家常版
intro: 份量和做法照楊桃美食網的食譜（來源①，空心菜 6 兩）。另一份蒜炒空心菜（來源②）放在下面對照，數字不混在一起用。這是台式大火快炒的做法，和廣式先煨再炒的做法不同。
spice:
  mode: addon
  text: 主要食譜的辣椒絲是和蒜頭、薑絲一起爆香，這頁改成最後才分開加，所以可以一鍋兩吃。這是改法（推論），原文沒有分開做。
  mild: [炒好、調味拌勻後先盛出不辣那份，不放辣椒。]
  yours: [另一份盛盤後放上辣椒絲拌一下（原文辣椒絲只寫「少許」；實際辣度和口感要試做）。這道菜沒有花椒。]
burners: 全程只用 1 口爐、1 只炒鍋依序做；另一口爐可以同時做別的菜（推論）。
ing:
  i_kongxincai:
    note: 「兩」是台灣市場常用的重量單位，原文沒換算；買的時候看攤販的台兩標示就好
  i_oil:
    note: 原文只寫「熱油鍋」，沒寫油的種類和份量；另一份食譜（來源②）用橄欖油 1 大匙，可以參考
  i_salt:
    note: 原文只寫「少許」，邊炒邊試味道（推論）
  i_chicken_powder:
    note: 原文只寫「少許」，邊炒邊試味道（推論）
missing:
  - 油要放多少、用哪種油
  - 爆香用什麼火、要多久
  - 大火快炒要炒幾分鐘
  - 空心菜要切多長
  - 鹽和雞粉的量（只寫少許）
  - 幾人份
compare:
  - 來源②用蒜末 1 大匙、橄欖油 1 大匙，雞粉 0.5 匙，標 2 人份；食材表沒有列鹽，也沒寫鹽的量。
  - 廣式的做法是先加少許湯汁和調味料，用極小的火煨到入味再炒，口感很不一樣；這頁是主要食譜的台式快炒。
notes:
  - 大火快炒的好處是顏色會很綠、很漂亮（原文提醒）。
  - 炒到空心菜變色就加調味料，拌勻就盛出，不要炒太久。
steps:
  a3:
    heat: 大火
    time: 炒到變色，原文沒寫幾分鐘

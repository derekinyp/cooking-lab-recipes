intro: 乾香菇泡發切絲，與肉羹、高湯和調味料煮滾，再加入蒜酥與柴魚片，以太白粉水勾成薄亮芡汁。盛碗前加香菜、香油、胡椒粉和烏醋。
card: 香菇絲與肉羹在高湯中煮出鮮味，加入蒜酥、柴魚片後以太白粉水勾薄芡，盛碗再加香菜、香油、胡椒粉和烏醋。
variant: 台式家常版
burners: 乾香菇泡發時可先調好太白粉水；接著用一口爐和一只湯鍋依序完成。
spice:
  mode: none
notes:
- 乾香菇需先泡軟，泡發的水可留作料理用水，但先確認沒有砂粒。
- 太白粉水倒入前再攪勻，避免粉沉底。
- 勾芡時一邊倒入太白粉水、一邊持續攪拌。
steps:
  a1:
    title: 泡發乾香菇
    time: 熱水泡約 20–30 分鐘
    done:
    - 香菇軟化後撈起。
    flow: 泡香菇
  a4:
    title: 煮滾湯底
    heat: 中火
    done:
    - 湯汁冒出連續大泡。
    flow: 煮湯底
  a5:
    title: 加入蒜酥與柴魚片
    done:
    - 材料拌入湯中，湯汁再次微滾。
    flow: 添入香氣
  a6:
    title: 勾薄芡
    heat: 小火
    done:
    - 湯汁薄亮滑順，能薄薄附著湯勺。
    flow: 勾薄芡
  a7:
    title: 盛碗調味
    done:
    - 依喜好加入香菜、香油、胡椒粉與烏醋。
    flow: 盛碗調味

tag: pending
tag_note: 原文沒有標示總時間，無法判斷平日或假日適合；乾香菇泡水和各步驟所需時間也原文沒寫。
card: 乾香菇泡水後切絲，和肉羹、高湯及調味料煮到滾，再放入蒜酥、柴魚片。湯汁再度微滾時轉小火，一邊倒入太白粉水一邊攪拌，煮成薄亮的芡汁；最後加香菜、香油、胡椒粉和烏醋。
variant: 台式家常版
intro: 依照原文做香菇肉羹。乾香菇泡水切絲，調好太白粉水；高湯、調味料、香菇絲和肉羹煮滾後，加入蒜酥與柴魚片，再以小火勾芡，食用前加香菜、香油、胡椒粉和烏醋。
burners: 依照步驟先後使用一口爐和一只湯鍋（推論）。
missing:
  - 乾香菇泡水要多久
  - 煮湯要用什麼火、煮多久
  - 放入蒜酥和柴魚片後要用什麼火、煮多久
  - 勾芡要多久
  - 肉羹的肉種、部位和自製做法
  - 高湯種類
  - 成品的顏色、味道和口感

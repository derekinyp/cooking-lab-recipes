intro: 白菜汆燙後與香菇、紅蘿蔔、紅蔥肉燥和高湯同煮，口感軟爛、滋味鹹香。適合配飯，也適合家常餐桌。
card: 先把白菜汆燙，再用蔥薑與香菇爆香，加入紅蔥肉燥和高湯煮到軟爛，湯汁鹹香又下飯。
variant: 台式家常版
burners: 用兩口爐較順手：一鍋汆燙白菜，另一鍋爆香後續煮；也可依序使用同一口爐。
spice:
  mode: none
notes:
- 泡發香菇可用乾香菇或新鮮香菇；乾香菇需先泡軟再切絲。
- 白菜瀝乾再下鍋，湯汁較不會被多餘水分沖淡。
steps:
  a1:
    title: 切白菜
    done:
    - 切成大小接近、方便入口的大塊。
    flow: 切白菜
  a2:
    title: 汆燙白菜
    heat: 大火
    time: 約 30 秒
    done:
    - 葉片稍軟後撈起瀝乾。
    flow: 汆燙瀝乾
  a3:
    title: 切香菇
    done:
    - 泡發香菇切成細絲。
    flow: 香菇切絲
  a4:
    title: 爆香配料
    heat: 小火
    time: 約 30 秒至 2 分鐘
    done:
    - 炒出蔥、薑與香菇香氣。
    flow: 爆香配料
  a5:
    title: 燉煮白菜
    heat: 小火
    time: 約 5 分鐘
    done:
    - 煮到白菜軟爛入味。
    flow: 小火煮軟

tag: pending
tag_note: 主要食譜沒有寫整道菜的總時間；只寫了汆燙約30秒和小火煮約5分鐘，其他時間原文沒寫。
card: 大白菜切大塊汆燙，香菇切絲；蔥段、薑片、香菇絲和紅蘿蔔絲先用少許油炒出香氣，再放入白菜、高湯和紅蔥肉燥煮到軟爛。成品是白菜軟爛的家常滷白菜。
variant: 台式家常版
intro: 照主要食譜做。原文沒有寫份數；香菇只寫泡發香菇，乾貨或鮮貨原文沒寫。
burners: 汆燙用湯鍋，爆香和續煮用炒鍋（家庭改法，推論）；是否能同時進行原文沒寫。
missing:
  - 份數
  - 白菜切塊大小
  - 爆香時間
  - 煮時是否加蓋、是否收汁
  - 香菇是乾貨或鮮貨
  - 成品色澤、味道和上桌時間
steps:
  a2:
    heat: 沸水；汆燙火力原文沒寫
    time: 約30秒，撈起瀝乾
  a4:
    heat: 小火
    time: 爆香時間原文沒寫；炒到聞得到香氣（推論）
  a5:
    heat: 小火
    time: 約5分鐘，煮到白菜軟爛

tag: pending
tag_note: 主要食譜沒寫要蒸多久（蒸到電鍋開關跳起來），要試做計時；另一份食譜（來源②）標 20 分鐘，但份量和做法不同，只能參考。
card: 蛤蜊用滾水煮到一開口就夾起，湯過濾放涼，和打勻過篩的蛋液照 1 比 2 混合，倒進排好蛤蜊的盤子，電鍋蒸到開關跳起再燜一下。
variant: 電鍋版
intro: 份量和做法照一份有完整份量的電鍋食譜（來源①，2 人份）。另外兩份蛤蜊蒸蛋（來源②③）放在下面對照，數字不混在一起用。全程只用電鍋和一只湯鍋，不用蒸籠、烤箱。
spice:
  mode: none
  text: 三份食譜都沒有辣椒和花椒，整盤就是不辣那份。
  mild: [照食譜做就好。]
  yours: [想吃辣，蒸好後另外加辣椒（原文沒有，份量自己抓）。]
burners: 只有煮蛤蜊那一步要開 1 口爐（湯鍋）；電鍋蒸蛋不佔爐口，另一口爐可以同時做別的菜（推論）。
ing:
  i_egg:
    note: 蛋打勻後要過篩，再量出蛋液的量（原文是 120 毫升）
  i_clam:
    note: 15 顆大顆蛤蜊的重量原文寫 300 克，是同一份蛤蜊，不要加兩次。原文沒寫吐沙；第一次做可以先泡鹽水吐沙（另一份食譜有這一步）
  i_broth:
    note: 就是煮蛤蜊留下來的湯，過濾放涼後量出 240 毫升，不另外加水或高湯
  i_soy:
    note: 原文寫「隨喜好增減」，推薦用鰹魚醬油
  i_goji:
    note: 枸杞沖洗後泡米酒，原文沒寫米酒要多少
  i_outer_water:
    note: 「米杯」就是電鍋附的量米杯，原文括號寫約 180 毫升
missing:
  - 蒸要多久（只寫蒸到開關跳起來）
  - 煮蛤蜊煮多久（只寫一開口就夾出來）
  - 泡枸杞的米酒要多少
  - 要不要吐沙
  - 上桌溫度
compare:
  - 蛋和水的比例：主要食譜是蛋液 1 比蛤蜊湯 2；來源②是蛋 1 比高湯約 1.1；來源③是蛋 1 比溫開水 5。三種都有人做，這頁照主要食譜。
  - 燜的時間：主要食譜 5～10 分鐘，來源②約 2～3 分鐘，來源③約 3 分鐘，差得不少，第一次做可以先試短一點再調。
  - 來源③不先煮蛤蜊，是蒸到一半才把蛤蜊放上去，這頁沒用。
notes:
  - 煮蛤蜊要用滾水、中大火，縮短蛤蜊受熱的時間，肉才會嫩（原文提醒）。
  - 蛋液打勻就好，不要打太久，免得打進太多空氣；倒進盤子後把表面的小泡泡撈掉，蒸出來才光滑。
  - 電鍋蓋子要留縫：鍋緣橫放 1 根筷子，蓋上鍋蓋，不要蓋死。
  - 燜的時候不要關電源、不要掀鍋蓋。
  - 盤子選平底、有一點高度的（原文提醒）。
steps:
  a1:
    heat: 水滾後維持中大火
    time: 一開口就夾出，原文沒寫要多久
  a6:
    time: 蒸到電鍋開關跳起來，原文沒寫要多久
  a7:
    time: 開關跳起後燜 5～10 分鐘

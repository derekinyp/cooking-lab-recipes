intro: 蛤蜊先煮開取湯，再與蛋液依比例混合後用電鍋蒸熟。成品滑嫩帶有蛤蜊鮮味，適合當作家常配菜。
card: 蛤蜊湯與過篩蛋液依 2 比 1 混合，電鍋蒸出滑嫩蛋體，蛤蜊鮮味自然融入。
variant: 電鍋版
burners: 煮蛤蜊時使用一口爐；蛤蜊放涼時可打蛋、過篩並準備蒸盤，之後改用電鍋蒸。
spice:
  mode: none
notes:
- 蛋液輕輕打散即可，過篩後量取，再與放涼的蛤蜊湯混合。
- 蛤蜊煮至一開口就夾起，避免久煮變硬。
- 蒸盤選平底且有高度的容器，表面小泡泡先撈掉。
- 鍋緣橫放一根筷子，讓鍋蓋留縫；燜的時候不開蓋、不切斷電源。
steps:
  a1:
    title: 煮開蛤蜊
    heat: 中大火
    time: 開口就夾起
    done:
    - 殼一打開就立刻夾出。
  a2:
    title: 過濾蛤蜊湯
    done:
    - 濾過一次，放涼備用。
  a3:
    title: 打散蛋液
    done:
    - 同方向輕輕打散，避免打入太多空氣。
  a4:
    title: 混合蛋液與蛤蜊湯
    done:
    - 蛋液與蛤蜊湯依 1 比 2 混合均勻。
  a5:
    title: 倒入蒸盤
    done:
    - 倒入排好蛤蜊的盤中，撈除表面小泡泡。
  a6:
    title: 電鍋蒸熟
    done:
    - 開關跳起，蛋液凝固且中心不再晃動。
  a7:
    title: 燜熟
    time: 燜 5–10 分鐘
    done:
    - 燜的時候維持通電並蓋好鍋蓋。
  a8:
    title: 撒上配料
    done:
    - 取出後撒上蔥花與枸杞。
ing:
  i_egg:
    note: 蛋打散過篩後量出蛋液，再依比例取蛤蜊湯。
  i_clam:
    note: 大顆蛤蜊先煮至開口；可先泡鹽水吐沙。
  i_broth:
    note: 煮蛤蜊留下的湯過濾放涼後，量取 240 毫升。
  i_soy:
    note: 鰹魚醬油可依口味增減。
  i_goji:
    note: 枸杞沖洗後以米酒浸泡 15 分鐘，瀝乾再用。
  i_outer_water:
    note: 外鍋水用電鍋附的量米杯量取。

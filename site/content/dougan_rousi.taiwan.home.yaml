intro: 豆乾先汆燙再切絲，煸到微金黃後與肉絲、蔥蒜和醬汁拌炒。成品鹹香帶胡椒香，適合搭配白飯。
card: 豆乾汆燙切絲後先炒出微金黃，再與醃過的肉絲、蔥蒜和醬汁拌炒，最後撒上青蔥與白胡椒。
variant: 台式家常版
burners: 先用湯鍋汆燙豆乾，再以一口爐和一只炒鍋依序炒豆乾、爆香配料並合炒；醃肉可在一旁備妥。
spice:
  mode: separate
  text: 辣椒先切好留用；不吃辣的部分先盛出，再把辣椒加入鍋中拌炒剩下的菜。
  mild:
  - 爆香時先不放辣椒，盛出不辣部分。
  hot:
  - 辣椒加入鍋中與剩餘食材拌炒。
notes:
- 豆乾汆燙後瀝乾再切絲，炒至微金黃先盛出。
- 肉絲醃好後才加入太白粉，抓勻後下鍋。
steps:
  a1:
    title: 醃肉絲
    done:
    - 肉絲與醃料抓勻，靜置 10 分鐘。
    flow: 醃肉
  a1b:
    title: 拌入太白粉
    done:
    - 醃好的肉絲再拌入太白粉。
    flow: 肉絲上粉
  a2:
    title: 汆燙豆乾
    heat: 大火
    time: 汆燙 2 分鐘
    done:
    - 豆乾汆燙後撈起瀝乾。
    flow: 汆燙豆乾
  a3:
    title: 切豆乾
    done:
    - 豆乾剖半後切絲。
    flow: 切成細絲
  a4:
    title: 切配料
    done:
    - 蔥白、青蔥斜切，蒜頭切末，辣椒切片。
    flow: 切好備用
  a5:
    title: 炒香豆乾
    heat: 中大火
    done:
    - 豆乾絲炒到微金黃後先盛出。
    flow: 炒至金黃
  a6:
    title: 爆香蔥蒜
    heat: 中小火
    done:
    - 爆出蔥白與蒜香，蒜末不要炒焦。
    flow: 蔥蒜爆香
  a7:
    title: 炒肉絲
    heat: 中大火
    done:
    - 肉絲表面大多轉白。
    flow: 炒肉絲
  a8:
    title: 回鍋拌炒
    heat: 中火
    done:
    - 豆乾回鍋，加入醬油、蠔油、砂糖與米酒炒勻。
    flow: 醬香拌炒
  a9:
    title: 加入青蔥
    heat: 中火
    done:
    - 加入青蔥與白胡椒拌勻後起鍋。
    flow: 拌勻起鍋
ing:
  i_pork:
    suggest: 約 1 包
  i_dougan:
    suggest: 約 5 片

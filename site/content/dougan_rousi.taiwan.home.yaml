tag: weekend
tag_note: 主要食譜標料理時間 30 分鐘（其中醃肉 10 分鐘、燙豆乾 2 分鐘），超過平日 20 分鐘，所以放在假日做。
card: 肉絲先醃 10 分鐘再加太白粉抓勻；豆乾燙 2 分鐘切絲，炒到微金黃先取出；爆香蔥白和蒜末，肉絲炒到 6 分熟，倒回豆乾加醬油、蠔油、糖、米酒拌炒，最後放青蔥和白胡椒粉；辣椒最後才分開加。
variant: 台式家常版
intro: 份量和做法照一家豬肉品牌官網的食譜（來源①，1 人份，肉絲 200 公克、豆乾 5 片）。另外兩份豆干肉絲（來源②③）放在下面對照，數字不混在一起用。
spice:
  mode: addon
  text: 主要食譜的辣椒是和蔥白、蒜末一起爆香，這頁改成先不下辣椒、最後才分開加，所以可以一鍋兩吃。這是改法（推論）。
  mild: [起鍋前先盛出不辣那份。]
  yours: [鍋裡剩下的再加辣椒拌炒一下（原文辣椒寫「適量」，份量自己抓）。這道菜沒有花椒。]
burners: 先用湯鍋燙豆乾，之後只用 1 口爐、1 只炒鍋依序炒；醃肉在碗裡做，不佔爐口（推論）。
ing:
  i_soy:
    note: 原文寫「1 中匙」，中匙的容量原文沒寫
  i_starch:
    note: 肉絲醃好 10 分鐘後才加，原文寫「1 中匙」
  i_oil:
    note: 原文只寫「適量」
missing:
  - 各步驟用什麼火
  - 豆乾炒到微金黃、肉絲炒到 6 分熟各要多久
  - 中匙是多大的匙
  - 豆乾絲、肉絲切多粗
compare:
  - 來源②是 2 人份、45 分鐘：豆乾 300 公克、肉絲 150 公克；肉絲先炒到變白撈起，再把豆乾煸到金黃，最後一起拌炒。
  - 來源③用梅花肉 100 公克、五香豆乾 200 公克，肉絲先過油撈起，米酒嗆鍋。
notes:
  - 豆乾先燙過再切絲，炒到微金黃先盛出，最後才回鍋（原文作法）。
steps:
  a1:
    time: 醃 10 分鐘
  a2:
    time: 燙 2 分鐘

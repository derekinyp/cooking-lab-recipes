intro: 花椰菜擦乾後以大火乾煸，搭配煸香的五花肉、豆瓣醬與花椒，吃來鹹香帶辣麻，邊緣微焦而中心仍脆嫩。適合配白飯上桌。
card: 花椰菜徹底擦乾後大火乾煸，裹上紅亮醬汁，邊緣微焦、口感脆嫩。
variant: 湘式家常版
burners: 全程使用一口爐與一只炒鍋；花椰菜若需分批，依序在同一鍋炒。
spice:
  mode: separate
  text: 豆瓣醬、乾辣椒與花椒會在前段下鍋，想做不辣版本請另起一鍋，只用蒜片和薑片爆香，並省略豆瓣醬、乾辣椒與花椒。
notes:
- 花椰菜泡鹽水後要瀝乾並擦乾，再下鍋乾煸，避免出水變軟。
- 蔭油主要用來上色，少量加入即可。
compare:
- 這版不汆燙花椰菜，泡水後擦乾直接乾煸；另一種做法會先汆燙，再以蠔油和火鍋湯底調味。
steps:
  a1:
    title: 處理花椰菜
    done:
    - 掰成大小相近的小朵，泡鹽水後瀝乾並擦乾。
  a3:
    title: 煸香五花肉
    heat: 中火
    time: 煸 3–4 分鐘
    done:
    - 五花肉出油，邊緣呈金黃微脆。
  a4:
    title: 炒出豆瓣紅油
    heat: 中小火
    time: 約 30 秒
    done:
    - 鍋中油脂轉紅亮，聞到豆瓣醬香。
  a5:
    title: 爆香辛料
    heat: 中小火
    time: 10–15 秒
    done:
    - 聞到花椒與乾辣椒香氣，蒜片不要炒焦。
  a6:
    title: 乾煸花椰菜
    heat: 大火
    time: 翻炒 5–7 分鐘
    done:
    - 花椰菜熟透仍有咬勁，邊緣略帶焦色。
  a7:
    title: 調味裹汁
    heat: 大火
    time: 再炒 1–2 分鐘
    done:
    - 每朵花椰菜均勻裹上光亮醬汁。
    tips:
    - 蔭油主要用來上色，少量加入。
  a8:
    title: 加入蔥段
    done:
    - 翻拌均勻後立即起鍋。
ing:
  i_cauliflower:
    note: 掰成約 3–4 公分的小朵，大小盡量一致。
  i_oil:
    note: 材料表列 2 大匙；煸肉時先下 1 大匙，鍋中油脂過多可舀出一些。
  i_salt_soak:
    note: 只用來泡洗花椰菜，不加入最後調味。

tag: weekend
tag_note: 主要食譜標準備 10 分鐘、烹煮 15 分鐘，合起來 25 分鐘，超過平日能做的時間，所以放在假日做。
card: 花椰菜用手掰成小朵，泡鹽水 10 分鐘後一定要擦乾；五花肉中火煸出油，轉中小火炒豆瓣醬到油變紅，再爆香乾辣椒、花椒、蒜、薑，轉最大火把花椰菜煸到邊緣微焦，最後加生抽、老抽、糖和蔥段拌勻。
variant: 湘式家常版
intro: 份量和做法照一個專寫湖南菜的英文食譜網站（來源①，網站編輯團隊署名，3 到 4 人份，花椰菜 1 顆約 500 公克、五花肉 100 公克）。原文用小砂鍋上桌、桌上再用小火保溫，家裡沒有這種鍋，這頁改成直接盛盤（推論）。
spice:
  mode: separate
  text: 豆瓣醬、乾辣椒和花椒都是一開始就下鍋爆香，沒辦法最後才分開，所以不辣那份要另外做一鍋（推論）。
  mild: [另一鍋照樣泡花椰菜、煸五花肉，只用蒜片和薑片爆香，不放花椒、乾辣椒和豆瓣醬，用生抽、老抽、糖調味；份量原文沒寫，要試做後再定。]
  yours: [照食譜做。想少麻一點，原文建議花椒減到 1 茶匙。]
burners: 從頭到尾只用 1 口爐、1 只炒鍋；花椰菜太多時分兩批，在同一只鍋先後炒（推論）。
ing:
  i_cauliflower:
    note: 用手掰成小朵，每朵約 3 到 4 公分，大小盡量一致
  i_oil:
    note: 材料表寫 2 大匙，步驟卻寫先下 1 大匙、煸完肉鍋裡至少留 2 大匙，原文前後不一致
  i_salt_soak:
    note: 只用來泡花椰菜，不算調味
missing:
  - 五花肉要不要去皮
  - 泡花椰菜的鹽水要放多少水
  - 片和段切多大
  - 不辣那份的份量
compare:
  - 來源②（四川家常部落格）是 2 人份：花椰菜約 250 公克，不放花椒、薑和糖；五花肉煸 4 到 5 分鐘先撈出，最後才回鍋，花椰菜大火只炒 2 到 3 分鐘。
  - 來源③（醬料品牌官網）花椰菜先用滾水燙 1 分鐘，用蠔油和麻辣火鍋湯底調味，沒有豆瓣醬。
notes:
  - 花椰菜一定要完全擦乾再下鍋，濕的花椰菜會變成蒸、炒出來軟爛（原文）。
  - 炒花椰菜要開最大火、一直翻炒 5 到 7 分鐘，熟了但還要有咬勁，邊緣有點焦（原文）。
steps:
  a1:
    time: 泡 10 分鐘
  a3:
    heat: 中火
    time: 煸 3 到 4 分鐘，偶爾翻動
  a4:
    heat: 中小火
    time: 約 30 秒
  a5:
    heat: 原文沒另外調火，接著上一步的中小火
    time: 10 到 15 秒，炒香就好
  a6:
    heat: 最大火
    time: 一直翻炒 5 到 7 分鐘
  a7:
    time: 再炒 1 到 2 分鐘

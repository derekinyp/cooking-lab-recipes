card: 豬小腸先汆燙洗淨、切成小段，和泡好的薏仁、芡實、蓮子及其他材料一起入鍋。煮開後撈去浮沫，蓋鍋小火煮到小腸和薏仁軟爛，再加鹽調味；成品是帶有軟爛小腸與薏仁的湯。
variant: 台式家常版
intro: 先處理豬小腸，讓薏仁、芡實和蓮子泡水，再與其他材料一起煮成湯。泡料的水要不要一起入鍋，原文沒寫。
steps:
  a1:
    heat: 小火
    time: 燙煮 5 分鐘
  a2:
    time: 泡水 2 小時
  a5:
    heat: 水煮開、撈去浮沫後，轉小火並蓋上鍋蓋
    time: 約 40 分鐘，煮至小腸和薏仁軟爛
tag: pending
tag_note: 食譜沒給總時間；雖有汆燙、泡水和煮湯的時間，仍需實際做一次計時。
burners: 先汆燙小腸，再用湯鍋煮湯；前後使用同一只湯鍋是家庭改法（推論）。
missing:
  - 人份數
  - 小腸翻洗與去黏液的處理方式
  - 茯苓和淮山是否需要泡發
  - 水煮開前要用什麼火
  - 泡料的水是否一起入鍋
  - 成品色澤與其他口感
  - 上桌溫度與時限
spice:
  mode: none
  text: 原文沒有辣椒或花椒，整鍋就是不辣那份；若想吃辣，可在碗裡自行加辣（推論），不必等到最後才分開加。
  mild: [整鍋照食譜煮，不加辣；這就是不辣那份。]
  yours: [想吃辣，可在自己的碗裡加辣（推論）；加多少原文沒寫。]

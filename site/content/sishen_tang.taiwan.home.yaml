intro: 豬小腸搭配薏仁、芡實、蓮子與四神藥材煮成湯，口感軟綿，適合慢慢燉煮後趁熱享用。
card: 小腸先汆燙洗淨，再和泡軟的薏仁、芡實、蓮子及藥材燉煮，直到小腸與薏仁軟爛。
variant: 台式家常版
burners: 先用湯鍋汆燙小腸，再以同一口爐燉湯；泡料可同時在旁邊進行。
spice:
  mode: addon
  text: 湯底不辣；想吃辣可在碗裡另外加辣椒。
  mild:
  - 依食譜煮好，不另外加辣。
  hot:
  - 盛碗後再加辣椒，依喜好調整。
notes:
- 薏仁、芡實和蓮子先泡水 2 小時；泡料水不必倒入湯鍋。
- 小腸汆燙後洗淨再切段。
steps:
  a1:
    title: 汆燙小腸
    heat: 小火
    time: 5 分鐘
    done:
    - 取出後洗淨。
  a2:
    title: 泡發材料
    time: 2 小時
    done:
    - 薏仁、芡實和蓮子洗淨後泡水。
  a3:
    title: 切小腸
    done:
    - 切成約 3 公分小段。
  a4:
    title: 材料入鍋
    done:
    - 小腸、藥材、薑片、米酒和水放入湯鍋。
  a5:
    title: 燉煮
    heat: 水煮開後轉小火並蓋鍋
    time: 約 40 分鐘
    done:
    - 撈去浮沫；小腸和薏仁煮至軟爛。
  a6:
    title: 加鹽調味
    done:
    - 試味後加鹽調整。
ing:

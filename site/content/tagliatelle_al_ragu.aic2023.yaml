tag: weekend
tag_note: 光燉肉醬就要約 2 小時，也可以燉到 3 小時；肉醬可以前一天做。
card: 波隆那傳統肉醬慢燉成深橘色，拌寬麵吃。肉醬可以前一天做。
variant: 義大利美食學院登錄的傳統配方
tool_alts:
  tool/stock_pot: 沒有湯鍋時，肉醬可以用炒鍋燉
spice:
  mode: none
  text: 原文沒有辣椒和花椒，大家吃同一鍋。
  mild: [照食譜做。]
  yours: [想吃辣，可以在你那盤另外加（原文沒有，份量自己抓）。]
burners: 湯鍋燉肉醬，快好時用平底鍋煮麵；肉醬前一天做好的話，當天就用湯鍋煮麵。
missing:
  - 寬麵要用多少、麵和醬的比例（原文只寫肉醬 6 人份）
  - 「杯」「匙」是多大（義大利原文沒定義容量，所以不換算）
  - 煮麵時間（依包裝）
notes:
  - 原文用厚底鍋燉肉醬，這版改用湯鍋；替代做法：用炒鍋燉（家庭改法）。
  - 煮麵：肉醬還在湯鍋裡燉的話，麵用平底鍋煮、水放深一點；肉醬前一天做好就用湯鍋煮麵（家庭改法）。
  - 蔬菜要用刀剁細，原文明說不要用食物調理機。
steps:
  t1:
    tool: 平底鍋（湯鍋正在燉肉醬；肉醬前一天做好的話就用湯鍋）
  t2:
    tool: 平底鍋（湯鍋正在燉肉醬；肉醬前一天做好的話就用湯鍋）
  f4:
    heat: 中小火（原文）
  r1:
    heat: 轉大火（原文）
    time: 約 10 分鐘（原文）
  r4:
    heat: 小火，加蓋慢燉（原文）
    time: 約 2 小時，也可以燉到 3 小時（原文）
    done: ["湯汁：不要燉乾，乾了就補熱高湯"]
  r5:
    tips: [牛奶（可省）是在燉到一半時加、煮到收乾；這一步只加鹽和胡椒。]

tag: weekend
tag_note: 光燉肉醬就要約 2 小時，也可以燉到 3 小時；肉醬可以前一天做。
card: 波隆那傳統肉醬慢燉成深橘色，拌寬麵吃。肉醬可以前一天做。
variant: 義大利美食學院登錄的傳統配方
tools:
  tool/heavy_pot: 炒鍋（代替厚底鍋）
  tool/stock_pot: 平底鍋（代替湯鍋，水要放深一點）
spice:
  mode: none
  text: 原文沒有辣椒和花椒，全家吃同一鍋。
  wife: [照食譜做。]
  yours: [想吃辣，可以在你那盤另外加（原文沒有，份量自己抓）。]
burners: 炒鍋燉肉醬，快好時用平底鍋煮麵。
missing:
  - 寬麵要用多少、麵和醬的比例（原文只寫肉醬 6 人份）
  - 「杯」「匙」是多大（義大利原文沒定義容量，所以不換算）
  - 煮麵時間（依包裝）
notes:
  - 家裡沒有厚底鍋和湯鍋：肉醬用炒鍋燉、麵用平底鍋煮（家庭改法）。
  - 蔬菜要用刀剁細，原文明說不要用食物調理機。
steps:
  f4:
    heat: 中小火（原文）
  r1:
    heat: 轉大火（原文）
    time: 約 10 分鐘（原文）
  r4:
    heat: 小火，加蓋慢燉（原文）
    time: 約 2 小時，也可以燉到 3 小時（原文）
    done: ["湯汁：不要燉乾，乾了就補熱高湯"]
  r5:
    tips: [牛奶（可省）是在燉到一半時加、煮到收乾；這一步只加鹽和胡椒。]

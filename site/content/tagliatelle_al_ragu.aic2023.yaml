intro: 波隆那肉醬以蔬菜、絞肉與番茄慢燉，煮成深橘色、濃稠柔滑的醬汁，拌上寬麵就是一餐。肉醬也適合提前做好。
card: 絞肉與蔬菜慢燉成深橘色濃醬，拌上寬麵享用；肉醬可先做好，吃之前再煮麵。
variant: 義大利傳統配方
burners: 肉醬燉煮時可用另一口爐煮麵；若肉醬已提前做好，煮麵時只需使用一口爐。
spice:
  mode: addon
notes:
- 肉醬可提前做好，冷藏保存並在食用前充分加熱。
- 麵條依包裝時間煮熟，瀝乾後趁熱拌入肉醬。
- 蔬菜以刀切細，肉醬口感較細緻。
steps:
  t1:
    title: 煮麵水
    heat: 大火
    tool: 湯鍋
    done:
    - 水滾後下寬麵。
  t2:
    title: 煮寬麵
    heat: 大火
    tool: 湯鍋
    done:
    - 麵條依包裝時間煮熟，仍有彈性。
  t3:
    title: 拌入肉醬
    done:
    - 肉醬均勻裹住每條麵。
  r4:
    heat: 小火，加蓋慢燉
    time: 約 2 小時，也可燉到 3 小時
    done:
    - 醬汁保持濕潤，若過乾可補熱高湯。
tool_alts:
  tool/stock_pot: 肉醬可用厚底鍋或炒鍋慢燉。

tag: pending
tag_note: 主要食譜沒寫總時間；寫出來的只有燜 3 分鐘、2 分鐘、1 分鐘，切菜、爆香、炒料、收汁要多久原文沒寫，要試做計時。
card: 米粉不泡水，汆燙後蓋鍋燜軟；紅蔥頭爆香，炒肉絲、香菇、蝦米，下高麗菜和紅蘿蔔煮軟，加水和調味煮滾，放米粉燜到收汁，最後淋烏醋、撒芹菜。
variant: 台式家常版
intro: 份量和做法照楊桃美食網的食譜（來源①，米粉 200 公克，用葷食版）。另外兩份炒米粉（來源②③）放在下面對照，數字不混在一起用。
spice:
  mode: none
  text: 主要食譜沒有辣椒和花椒，整鍋就是不辣那份。白胡椒粉想分開放的話，可以不下鍋、改成各自在碗裡加（推論）。
  mild: [照食譜做就好。]
  yours: [想吃辣，盛盤後另外加辣椒（原文沒有，份量自己抓）。]
burners: 先用湯鍋燙米粉、燜軟，再用炒鍋炒料，兩步先後做（推論，原文沒寫用哪種鍋）。
ing:
  i_noodle:
    note: 原文沒寫是哪一種米粉（新竹、埔里等）
  i_shiitake:
    note: 原文用的是泡發好的香菇絲 80 公克；乾香菇要多少原文沒寫
  i_shrimp:
    note: 蝦米要不要先泡水，原文沒寫
missing:
  - 幾人份
  - 米粉燙多久（原文只寫燙到水滾）
  - 爆香、炒肉、炒菜、收汁各要多久
  - 大部分步驟用什麼火（只寫了下米粉後轉中火）
  - 豬肉用哪個部位
  - 總時間
compare:
  - 來源②（廈門炒米粉）用火腿、蝦仁、銀芽、青椒、洋蔥，加蠔油、番茄醬和一種美國辣椒醬（原文寫英文品牌名）；米粉滾水燙一下撈起，蓋盤子燜約 5 分鐘，最後炒 2 分鐘。
  - 來源③（新竹米粉）是 4 人份，米粉用溫水泡約 8 分鐘，不是汆燙再燜。
notes:
  - 米粉不用泡水，燙過再蓋鍋燜 3 分鐘到軟透，開蓋翻鬆（原文重點）。
  - 烏醋和芹菜珠是關火後才放，再蓋鍋燜 1 分鐘拌勻。
steps:
  a3:
    time: 蓋鍋燜 3 分鐘到軟透
  a8:
    heat: 中火
    time: 蓋鍋燜 2 分鐘
  a11:
    time: 蓋鍋燜 1 分鐘

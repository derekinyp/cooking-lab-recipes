intro: 米粉先汆燙再蓋鍋燜軟，吸入醬油、香菇與蝦米的香氣，最後淋上烏醋提味。適合當家常午餐或晚餐主食。
card: 米粉不先泡水，汆燙後蓋鍋燜軟，再和肉絲、香菇、蝦米及高麗菜一起煮到入味，最後以烏醋提香。
variant: 台式家常版
burners: 先用湯鍋汆燙並燜軟米粉，再用炒鍋炒料、煮米粉，依序進行即可。
spice:
  mode: addon
  text: 整鍋不辣；想吃辣可在盛盤後加辣椒醬或辣椒油。
  mild:
  - 照食譜調味即可。
  hot:
  - 盛盤後另加辣椒醬或辣椒油。
notes:
- 米粉汆燙後瀝乾，再蓋鍋燜到軟透，拌炒時較不易碎。
- 香菇先泡發，泡發後切絲；蝦米可直接下鍋炒香。
- 烏醋和芹菜珠在關火後加入，再蓋鍋燜香。
steps:
  a2:
    title: 汆燙米粉
    heat: 大火
    time: 約 1–3 分鐘
    done:
    - 米粉散開變軟後撈起瀝乾。
  a3:
    title: 燜軟米粉
    heat: 小火
    time: 燜 3 分鐘
    done:
    - 米粉軟透後開蓋翻鬆。
  a4:
    title: 爆香紅蔥頭
    heat: 中小火
    time: 約 30 秒至 2 分鐘
    done:
    - 炒出香氣，邊緣微金黃。
  a5:
    title: 炒香肉絲與配料
    heat: 中火
    time: 約 5–15 分鐘
    done:
    - 肉絲表面微焦，香菇與蝦米炒出香氣。
  a6:
    title: 煮軟蔬菜
    heat: 中大火
    time: 約 3–5 分鐘
    done:
    - 高麗菜變軟，紅蘿蔔略軟。
  a7:
    title: 煮滾調味湯汁
    heat: 中大火
    time: 約 3–5 分鐘
    done:
    - 湯汁持續冒泡後下米粉。
  a8:
    title: 燜煮入味
    heat: 中火
    time: 燜 2 分鐘
    done:
    - 米粉吸入湯汁，變得柔軟入味。
  a9:
    title: 收乾湯汁
    heat: 中火
    time: 約 1–4 分鐘
    done:
    - 鍋底湯汁收乾，米粉仍濕潤。
  a10:
    title: 加入烏醋與芹菜
    done:
    - 關火後淋入烏醋，加入芹菜珠。
  a11:
    title: 蓋鍋燜香
    time: 燜 1 分鐘
    done:
    - 烏醋香氣融入米粉。
  a12:
    title: 拌勻盛盤
    done:
    - 米粉和配料拌勻即可盛盤。

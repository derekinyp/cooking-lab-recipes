tag: weekday
tag_note: 主要食譜標準備 2 分鐘、烹煮 8 分鐘，在平日 20 分鐘內；各步驟細項多久原文沒寫。
card: 清水加一罐玉米醬，大火煮滾，加雞粉和鹽調味；生粉加少許水調成糊勾芡，湯再滾時倒入蛋液攪一攪，最後加白胡椒粉和芝麻油。
variant: 台式家常版
intro: 份量和做法照一家醬料品牌台灣官網的食譜（來源①，4 人份，玉米醬 1 罐、雞蛋 2 顆、清水 7 杯）。另外兩份玉米蛋花湯（來源②③）放在下面對照，數字不混在一起用。
spice:
  mode: none
  text: 三份食譜都沒有辣椒和花椒，整鍋就是不辣那份。白胡椒粉是最後才加，不想要可以少放。
  mild: [照食譜做就好。]
  yours: [想吃辣，盛碗後另外加辣椒或辣油（原文沒有，份量自己抓）。]
burners: 全程只用 1 口爐、1 只湯鍋（推論）；另一口爐可以做別的菜。
ing:
  i_corn:
    note: 原文寫「玉米茸 1 罐」，就是罐頭玉米醬；罐子多大原文沒寫
  i_water:
    note: 原文的「杯」沒寫容量
  i_starch:
    note: 原文寫「生粉」，沒寫是太白粉還是玉米粉
  i_slurry_water:
    note: 原文只寫「少許水」
missing:
  - 杯和湯匙的容量
  - 勾芡、下蛋用什麼火
  - 蛋花要打成絲還是片
  - 每一步要多久
compare:
  - 來源②（玉米濃湯）用高湯 600㏄、玉米醬 1 罐、雞蛋 1 顆，小火調味、勾薄芡後關火才加蛋液。
  - 來源③（英文食譜）用高湯 5 杯、甜玉米 1 罐、蛋 4 顆，另加薑和青蔥；關火淋入蛋液，等 30 秒讓蛋凝固再攪。
notes:
  - 湯要再次燒開才倒蛋液，倒完再攪拌（原文作法）。
steps:
  a3:
    heat: 大火
    time: 煮滾

intro: 玉米茸煮成濃香湯底，以太白粉略微勾稠，再淋入蛋液做成柔嫩蛋花。簡單暖胃，適合平日家常餐桌。
card: 清水煮開玉米茸後調味，以太白粉略勾芡，再淋入蛋液攪成柔嫩蛋花，最後添上芝麻油香。
variant: 台式家常版
burners: 全程使用一口爐和一只湯鍋；煮湯時可在旁邊先調好太白粉糊並打散蛋液。
spice:
  mode: addon
  text: 湯本身不辣，白胡椒粉可依口味少放；想吃辣可在碗裡另加辣油。
  mild:
  - 白胡椒粉少放或不加。
  hot:
  - 辣油盛碗後另加。
notes:
- 勾芡用的水先少量加入太白粉，調勻後再倒入湯裡。
- 太白粉糊下鍋時持續攪拌，湯汁變稠就可停手。
steps:
  a1:
    title: 打散蛋液
    done:
    - 蛋白和蛋黃充分打散。
  a2:
    title: 煮玉米湯底
    heat: 大火
    done:
    - 清水和玉米茸煮至沸騰，再加入雞粉和鹽調味。
  a3:
    title: 調太白粉糊
    done:
    - 太白粉加少許水攪勻，調成均勻糊狀。
  a4:
    title: 勾芡
    heat: 中火
    time: 約 30–60 秒
    done:
    - 攪拌至湯汁略稠，能薄薄附在湯匙表面。
  a5:
    title: 加入蛋液
    heat: 中火
    time: 約 30–60 秒
    done:
    - 湯再次燒開後淋入蛋液，攪拌至蛋花凝固，最後加白胡椒粉和芝麻油。
ing:
  i_corn:
    suggest: 1 罐
  i_water:
    suggest: 7 杯
  i_starch:
    suggest: 3 湯匙
  i_chicken_powder:
    suggest: 2 湯匙
  i_sesame:
    suggest: 2 茶匙
  i_slurry_water:
    suggest: 少許

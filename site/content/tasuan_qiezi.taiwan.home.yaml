intro: 茄子先蒸軟，再與蒜末、辣椒和辣豆醬炒煮，醬汁勾薄芡後裹住茄子，最後拌入九層塔。鹹香微辣，適合配白飯。
card: 先蒸軟茄子，再用蒜末、辣椒和辣豆醬炒出香氣，勾薄芡裹勻茄子，最後拌入九層塔，鹹香微辣很下飯。
variant: 台式家常版
burners: 茄子用電鍋蒸的同時可切配其他材料；接著用一口爐和炒鍋依序完成醬汁與燜煮。
spice:
  mode: separate
  text: 辣椒和辣豆醬一開始就下鍋；不吃辣可省略兩者，並另用一鍋炒煮。
notes:
- 茄子蒸軟後再下鍋，較容易裹上醬汁。
- 九層塔最後趁熱拌入，香氣較明顯。
steps:
  a5:
    title: 蒸軟茄子
    heat: 大火
    done:
    - 茄肉軟化，筷子可輕易戳入。
    flow: 蒸軟
  a7:
    title: 炒香蒜末與辣豆醬
    heat: 中火
    done:
    - 蒜末開始變色，辣豆醬炒出香氣。
    flow: 炒香
  a8:
    title: 煮滾醬汁
    heat: 中火
    done:
    - 醬汁煮滾。
    flow: 煮醬
  a9:
    title: 勾薄芡
    heat: 中小火
    done:
    - 醬汁略稠並能附著鍋鏟。
    flow: 勾芡
  a10:
    title: 燜茄子
    heat: 小火
    time: 加蓋燜約 2 分鐘
    done:
    - 茄子均勻裹上醬汁。
    flow: 燜入味
  a11:
    title: 拌入九層塔
    done:
    - 九層塔葉稍軟並散出香氣。
    flow: 拌九層塔
  a12:
    title: 盛盤
    done:
    - 趁熱盛盤，可依喜好撒上點綴。
    flow: 盛盤
ing:
  i_eggplant:
    note: 切成 5 公分段，再切小條。
  i_fried_shallot:
    note: 可不加。
  i_garnish:
    note: 蔥花、香菜或九層塔擇一，可不加。

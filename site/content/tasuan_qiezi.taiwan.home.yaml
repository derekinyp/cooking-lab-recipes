tag: weekend
tag_note: 主要食譜標備料 15 分鐘、烹調 15 分鐘，合起來 30 分鐘，超過平日 20 分鐘，所以放在假日做。
card: 茄子切小條先蒸熟；熱油炒香蒜末和辣椒，再下辣豆醬，倒入調好的醬汁煮滾勾芡，放茄子蓋鍋燜約 2 分鐘，趁熱拌入九層塔。
variant: 台式家常版
intro: 份量和做法照一份英文家常食譜（來源①，個人食譜部落格，作者說這道菜很有台灣味，茄子 200 公克、2 到 3 人份）。這頁把原本的砂鍋換成炒鍋，原文說用炒鍋也可以。
spice:
  mode: separate
  text: 主要食譜的辣椒和辣豆醬是一開始就和蒜末一起炒，沒辦法最後才分開，所以不辣那份要另外做一鍋（推論）。
  mild: [另一鍋不放辣椒和辣豆醬，其他照做；不放辣豆醬會少一點豆醬香，用什麼替代、放多少原文沒寫。]
  yours: [照食譜做。這道菜沒有花椒。]
burners: 茄子用電鍋蒸，不佔爐口，可以和切菜同時做；之後用 1 口爐、1 只炒鍋做完（推論）。
ing:
  i_eggplant:
    note: 原文切成 5 公分長段，再切成小條；粗細原文沒寫
  i_taucheo:
    note: 原文寫「辣豆漿」，指一種辣的發酵豆醬（我們的判讀），不是喝的豆漿
  i_fried_shallot:
    note: 可以不放；份量原文沒寫
  i_garnish:
    note: 可以不放，擇一就好；份量原文沒寫
missing:
  - 茄子要蒸多久、蒸到多軟（原文只寫先弄熟，示範用微波爐）
  - 各步驟用什麼火
  - 芡水要倒多少
  - 不辣那份用什麼替代辣豆醬
compare:
  - 另外查的幾份中文食譜，網頁存不下來，沒辦法逐字核對，所以不列在這裡。
  - 一份泰式茄子炒九層塔用魚露和蠔油調味，和台式做法差很多，沒有採用。
notes:
  - 茄子先弄熟再下鍋，可以保留茄子的紫色（原文提醒）。
  - 九層塔要趁鍋裡還熱的時候才拌進去。
steps:
  a10:
    time: 蓋鍋燜約 2 分鐘

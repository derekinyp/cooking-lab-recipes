tag: weekend
tag_note: 主要食譜寫中火燉煮 30 分鐘，已經超過平日 20 分鐘；再加上汆燙雞肉和備料，整道的總時間原文沒寫，所以放在假日做。
card: 雞切塊汆燙去血水，和對切的新鮮香菇、薑片、米酒等調味料一起放進湯鍋，加 8 杯水，中火燉煮 30 分鐘，撈掉浮沫就能吃。
variant: 家常版（湯鍋版）
intro: 份量和做法照一份寫得完整的家常食譜（來源①，雞半隻）。另外兩份香菇雞湯（來源②③）放在下面對照，數字不混在一起用。這頁用湯鍋，不用電鍋也不用烤箱。
spice:
  mode: none
  text: 三份食譜都沒有辣椒和花椒，整鍋就是不辣那份。
  mild: [照食譜做就好。]
  yours: [想吃辣，盛碗後另外加辣椒（原文沒有，份量自己抓）。]
burners: 先用湯鍋汆燙雞肉、撈起洗淨，再用同一只湯鍋燉煮，全程 1 口爐（推論）；另一口爐可以做別的菜。
ing:
  i_chicken:
    note: 原文只寫「雞 1/2隻」，沒寫是哪個部位；請攤商切塊
  i_shiitake:
    note: 原文用新鮮香菇，不用泡發；另一份食譜（來源③）寫香菇稍微泡水，沒寫是鮮是乾
  i_water:
    note: 原文的「杯」沒寫容量；用同一個杯子量米酒和水就好（推論）
  i_dashi_msg:
    note: 原文寫「柴魚味精」，用量是 1/3 大匙
missing:
  - 雞半隻有多重
  - 汆燙要燙多久、用什麼火
  - 雞肉煮熟的樣子（原文只寫燉 30 分鐘）
  - 杯、大匙的容量
  - 幾人份
  - 湯鍋要多大
compare:
  - 來源②用鮮香菇，先用少許油炒香薑片和香菇，水滾了才下雞腿肉，小火煮約 15 分鐘到熟；小撇步是水滾後才下雞腿肉，才不會過老乾柴。
  - 來源③是電鍋版：雞肉先汆燙，加鹽和米酒後放進電鍋燉；水和香菇都只寫「適量」。
notes:
  - 要確定雞肉熟了，可以用筷子戳戳看，戳得穿就好（這是我們的判斷建議，原文只寫燉 30 分鐘）。
  - 汆燙是為了去血水和腥味，撈起後要洗乾淨，湯才清。
  - 煮好後把浮沫撈乾淨再上桌。
steps:
  a3:
    heat: 中火
    time: 燉煮 30 分鐘

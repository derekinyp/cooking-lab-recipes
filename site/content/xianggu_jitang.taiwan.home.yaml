intro: 雞肉先汆燙去除浮沫，再與新鮮香菇、薑片、米酒和調味料一起煮成清香雞湯，適合日常晚餐暖胃上桌。
card: 雞肉汆燙去浮沫後，與對切新鮮香菇、薑片、米酒和調味料放入湯鍋，加水中火燉煮 30 分鐘，湯頭清香暖胃。
variant: 家常版（湯鍋版）
burners: 先用一口爐汆燙雞肉，再用同一只湯鍋煮湯；切香菇和薑片可同步準備。
spice:
  mode: addon
  text: 湯底不辣；想吃辣可在盛碗後另加辣椒。
notes:
- 新鮮香菇洗淨去蒂後對切，不必泡發。
- 湯煮好後撈去浮沫再盛碗。
steps:
  a1:
    title: 汆燙雞肉
    heat: 大火
    done:
    - 雞塊表面變色，水面浮沫冒出後撈起洗淨。
    flow: 汆燙雞肉
  a3:
    title: 燉煮雞湯
    heat: 中火
    time: 中火燉煮 30 分鐘
    done:
    - 雞肉中心熟透，筷子可戳穿。
    flow: 燉雞湯
  a4:
    title: 撈去浮沫
    done:
    - 湯面浮沫撈乾淨。
    flow: 撈浮沫

tag: weekend
tag_note: 光燉煮就要 40 分鐘，再續煮 20 分鐘。滷好可以先放著，平日只要盛飯澆滷；不過保存幾天、怎麼回溫，原文沒寫。
card: 手切五花肉和豬皮丁，加自炸油蔥酥小火燉煮，澆在白飯上。
spice:
  mode: addon
  text: 三份參考食譜都沒有另外放辣椒、花椒，整鍋不辣，可以直接當不辣那份。
  mild: [照食譜做，不另外加。]
  yours: [盛碗後在你那碗另加辣椒油、花椒粉。原文沒有這一步，份量你自己抓。]
burners: 建議只用 1 口爐、1 只炒鍋依序做：汆燙、炸油蔥酥、炒料、加蓋小火燉。另一口爐可以同時煮飯或燙青菜（推論）。
missing:
  - 幾人份（原文份量很大：五花肉 1200 克、豬皮 300 克）
  - 汆燙要多久、怎麼看熟
  - 燉好的樣子（原文只寫時間）
notes:
  - 份量很大，可以用上面的「半份」按鈕縮量；縮量後燉煮時間要不要跟著改，原文沒寫，試做再看。
  - 五香粉的成分原文沒寫，所以沒辦法保證完全不含花椒。
  - 炸完油蔥酥的油留在鍋裡，直接用來炒五花肉（原文）。
steps:
  y1:
    hide_risk: true
    tips: [來源③提醒：一定要用小火慢慢炸，才炸得出香味。]
  lr9:
    heat: 原文這一步沒再寫火力（照上一步的小火，推論）

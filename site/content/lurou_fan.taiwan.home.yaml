intro: 手切五花肉細條和豬皮丁，搭配自製油蔥酥、醬油與冰糖燉煮，鹹甜醬香，適合淋在熱白飯上。
card: 五花肉細條與豬皮丁先炒香，再和油蔥酥、醬油及冰糖慢燉，滷汁濃香，澆飯吃很下飯。
variant: 台式家常版
burners: 用一口爐依序完成油蔥酥、炒料與燉煮；另一口爐可同時煮飯。
spice:
  mode: addon
  text: 滷肉本身不辣；想吃辣可在盛碗後另外加辣椒油。
  mild:
  - 照食譜燉煮即可。
  hot:
  - 盛碗後另加辣椒油。
notes:
- 這份滷肉量較多，可分裝冷藏或冷凍，搭配白飯食用。
- 五香粉風味因配方而異，可依喜好調整。
- 炸油蔥酥後留鍋中的油可接著炒五花肉。
steps:
  y1:
    tips:
    - 油蔥酥以小火慢炸，顏色轉金黃、香氣出來即可。
  lr9:
    heat: 小火
    done:
    - 肉條與豬皮吸收滷汁，醬色均勻，滷汁略濃。

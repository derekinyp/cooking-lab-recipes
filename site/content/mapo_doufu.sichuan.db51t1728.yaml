intro: 豆腐嫩而完整，牛絞肉炒出香氣，裹著紅亮濃稠的麻辣醬汁。適合配熱飯一起吃。
card: 豆瓣、辣椒粉與蒜末炒出紅油，再讓豆腐和牛絞肉裹上濃稠芡汁，麻香辣味十足。
variant: 四川風味家常版
burners: 最多用 2 口爐：一鍋泡豆腐，另一口先炒牛肉臊子，再接著炒香料、燒煮豆腐。
spice:
  mode: separate
  text: 豆瓣和辣椒粉一起炒出辣味，整鍋會辣；想吃不辣的，需另外做一鍋並省略辣椒粉與辣豆瓣。
  mild:
  - 另做一鍋不辣版本，改用不辣豆瓣調味。
  hot:
  - 依配方加入辣椒粉與豆瓣。
notes:
- 郫縣豆瓣先剁細再下鍋，炒到油色轉紅；豆瓣鹹度不同，試味後再調整鹽量。
- 豆腐丁浸鹽水後瀝乾，再放入炒鍋，翻動時動作放輕。
steps:
  m2:
    title: 鹽水浸豆腐
    heat: 小火
    done:
    - 豆腐丁浸過鹽水後撈起瀝乾。
  m6:
    title: 加熱食用油
    heat: 小火
    done:
    - 油面微微流動、尚未冒煙。
  m7:
    title: 炒香紅油底
    heat: 中小火
    done:
    - 香氣出來，油色轉紅。
  m8:
    title: 加入高湯燒煮
    heat: 中小火
    done:
    - 牛絞肉全熟，豆腐熱透且完整。
  m9:
    title: 勾芡收汁
    heat: 中火
    done:
    - 芡汁濃稠包住食材，表面亮油，蒜苗仍翠綠。
  m10:
    title: 盛碗
    done:
    - 趁熱盛碗。
tool_alts:
  tool/stock_pot: 沒有湯鍋時，可用平底鍋裝鹽水浸豆腐。
states:
  s_thickened: 收好汁的麻婆豆腐

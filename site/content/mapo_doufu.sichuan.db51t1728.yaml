tag: pending
tag_note: 官方標準沒寫總共要多久，要試做計時。
card: 豆腐嫩、牛肉末酥香，湯汁紅亮濃稠，又麻又辣。
tools:
  tool/stock_pot: 平底鍋（代替湯鍋）
spice:
  mode: separate
  text: 辣味來自郫縣豆瓣和辣椒粉炒出的紅油底，是整道菜的主體，沒辦法從同一鍋分出不辣的一份。
  wife: [要另外做一份不辣的。官方標準沒有這種做法，份量和步驟要試做後再定。]
  yours: [花椒粉可以先不下鍋，起鍋後只撒在你那份（推論）。]
burners: 平底鍋裝鹽水泡豆腐保溫，炒鍋先炒牛肉末盛起，再用同一只炒鍋燒油做主菜。
missing:
  - 幾人份（只寫豆腐 400 克）
  - 豆腐要泡多久、水放多少
  - 燒油要多熱：原文寫 100°C，家裡沒有溫度計，原文也沒寫怎麼目測
  - 炒牛肉末要不要放油、70 克油怎麼分給兩步
  - 每一步用什麼火、要多久
notes:
  - 郫縣豆瓣要先剁細再下鍋，炒到油變紅；豆瓣本身很鹹，鹽要看豆瓣調整（原文）。
  - 家裡沒有湯鍋：泡豆腐的鹽水先用平底鍋代替（家庭改法）。
steps:
  m9:
    title: 下蒜苗、花椒粉、水澱粉，收汁到濃稠
    done: ["湯汁：收到濃稠，芡汁包住豆腐表面、像糊漿（原文的說法是「干二流芡」）", "表面：亮油", "蒜苗：保持翠綠"]
states:
  s_thickened: 收好汁的麻婆豆腐

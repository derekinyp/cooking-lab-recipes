tag: weekday
tag_note: 原文標 20 分鐘；燒開煮麵水要多久原文沒寫，第一次做可能會久一點。
card: 奶油麵粉加牛奶煮成白醬，和炒香的雞肉、香菇、玉米筍、義大利麵一起拌炒收汁。
variant: 雞肉香菇・爐上版、不焗烤
intro: 先用小火把奶油、麵粉和牛奶煮成白醬放旁邊；另外煮麵，再炒洋蔥、蒜、雞胸肉、香菇和玉米筍，最後把麵和白醬倒進去一起拌炒收汁。
tool_alts:
  tool/stock_pot: 沒有湯鍋時，可以用炒鍋煮麵
  tool/frying_pan: 沒有平底鍋時，可以用炒鍋做白醬（原文作者用一般的鐵鍋）
  tool/wok: 沒有炒鍋時，可以用平底鍋
spice:
  mode: none
  text: 原文沒有辣椒和花椒，整盤就是不辣那份。
  mild: [照食譜做。]
  yours: [想吃辣，盛盤後另外加（原文沒有，份量自己抓）。]
burners: 先用平底鍋做白醬、同時用湯鍋燒煮麵水；白醬做好離火放旁邊。煮麵的時候，另一口爐用炒鍋炒料。
ing:
  p_pasta:
    suggest: 每人 100 公克，兩人 200 公克（來源②）
  p_water:
    suggest: 每 100 公克麵配 1 公升水，兩人份 2 公升（來源②③）
  p_salt:
    suggest: 每 1 公升水 10 公克鹽，兩人份 20 公克（來源②③）
  p_chicken:
    confirmed: 兩人份 150 公克（依據來源④一人份 75 公克）
  p_garlic:
    suggest: 2 瓣（來源④⑥）
  p_oil:
    suggest: 每人 1 大匙，兩人 2 大匙（來源④）
  p_shiitake:
    note: 原文只寫「香菇」，直接切片下鍋，所以用新鮮香菇
two_serving:
  title: 兩人份怎麼抓
  intro: 原文是 3 人份。「照原文比例」是把原文數字乘三分之二；「建議值」是原文沒寫克數時，從其他公開來源找到的參考量；「已確認」是試做前已經定下來的量；「原文沒寫」的就邊做邊試。上面的材料表還是原文的 3 人份。
  rows:
    - {item: 奶油, orig: 50 公克, two: 約 33 公克, kind: calc, basis: 原文 50 公克的三分之二}
    - {item: 中筋麵粉, orig: 50 公克, two: 約 33 公克, kind: calc, basis: 原文 50 公克的三分之二；原文作者說用中筋麵粉}
    - {item: 牛奶, orig: 600 毫升, two: 400 毫升, kind: calc, basis: 原文 600 毫升的三分之二}
    - {item: 玉米筍, orig: 4 根, two: 約 3 根, kind: calc, basis: 原文 4 根的三分之二}
    - {item: 香菇, orig: 5、6 朵, two: 約 3 至 4 朵, kind: calc, basis: 原文 5、6 朵的三分之二}
    - {item: 洋蔥, orig: 半顆, two: 約三分之一顆, kind: calc, basis: 原文半顆的三分之二}
    - {item: 義大利麵, orig: 一碗公（約 3 人份）, two: 200 公克, kind: sug, basis: 來源②：每人 100 公克乾麵；來源③說一般份量每人 70 至 80 公克，胃口小可以少放}
    - {item: 雞胸肉, orig: 一大塊, two: 150 公克, kind: ok, basis: 依據來源④一人份用 75 公克；其他食譜差很多（來源⑤兩人份用 400 公克）}
    - {item: 煮麵水, orig: 沒寫, two: 2 公升, kind: sug, basis: 來源②③：每 100 公克麵配 1 公升水}
    - {item: 煮麵鹽, orig: 一些, two: 20 公克, kind: sug, basis: 來源②③：每 1 公升水 10 公克鹽}
    - {item: 蒜頭, orig: 少許, two: 2 瓣, kind: sug, basis: 來源⑥四人份 2 瓣、來源④一人份 2 瓣；喜歡蒜味可以多放}
    - {item: 炒料用油, orig: 沒寫, two: 2 大匙, kind: sug, basis: 來源④一人份 1 大匙}
    - {item: 調味鹽, orig: 一點, two: 邊試味邊加, kind: na, basis: 沒找到可靠的參考量，不亂補}
missing:
  - 雞胸肉、義大利麵的克數，麵用哪一種形狀
  - 煮麵水和鹽要放多少、炒料要放多少油、蒜頭幾瓣、調味鹽多少（上面有建議值）
  - 除了白醬的小火，其他步驟用什麼火、炒多久
  - 燒開煮麵水要多久、麵泡冷水要泡多久
  - 雞肉怎麼看熟了、上桌要多熱
notes:
  - 白醬先做好放旁邊。加牛奶時要先離火，先倒大約三分之一，把麵粉全部攪開再倒其餘的（原文）。
  - 白醬太稠，是煮太久、收汁收過頭（原文作者回覆）。最後拌炒收汁也一樣，看到醬汁包住麵就可以起鍋。
  - 雞肉要炒到表面全部變白、切開沒有粉紅色（原文沒寫，這是一般判斷方法）。
  - 原文另外寫了「焗烤」做法（灑起司進烤箱），是選做，這頁不做。
compare:
  - 原文把煮好的麵撈起泡冷水；另一份義大利麵指南（來源③）說煮好不要再沖水，會洗掉澱粉。這頁照原文，試做後可以在 Notion 紀錄比較。
  - 這頁原本是另一份不加肉的白醬麵食譜，改成這份雞肉香菇的家常做法。
steps:
  a3:
    time: 煮約 6–7 分鐘（原文）；不同的麵時間不同，也可以照包裝
  a7:
    heat: 原文沒寫；要拌炒收汁，所以開火（推論）

intro: 奶油、麵粉和牛奶煮成滑順白醬，搭配雞肉、香菇、洋蔥與玉米筍，口味溫和帶奶香，適合全家一起吃。
card: 先煮好奶油白醬，再把炒香的雞肉、香菇、玉米筍和麵拌在一起，醬汁薄薄裹住麵條就起鍋。
variant: 雞肉香菇・爐上版，不焗烤
burners: 用兩口爐較順手：一口做白醬，另一口煮麵並炒料；白醬完成後先離火放旁邊。
spice:
  mode: addon
notes:
- 加牛奶前先將鍋子離火，分次倒入並攪拌至滑順。
- 白醬和麵拌炒至醬汁裹住麵條就起鍋，避免收汁過頭。
- 雞肉炒至熟透再加入麵和白醬。
compare:
- 煮好的麵先放冷水備用；若想保留麵條表面澱粉，也可瀝乾後直接拌醬。
steps:
  a2:
    title: 煮麵水
    heat: 大火
    done:
    - 水滾後再下麵。
    flow: 煮滾
  a3:
    title: 煮麵
    heat: 大火
    time: 約 6–7 分鐘
    done:
    - 麵條煮熟仍有彈性。
  a5:
    title: 炒香洋蔥與蒜頭
    heat: 中火
    done:
    - 洋蔥略呈焦黃色，蒜頭散出香氣。
  a6:
    title: 炒熟配料
    heat: 中大火
    done:
    - 雞肉炒熟，香菇與玉米筍變軟。
  a7:
    title: 拌麵收汁
    heat: 中火
    done:
    - 白醬裹住麵條即可起鍋。

tool_alts:
  tool/stock_pot: 沒有湯鍋時，可用炒鍋煮麵。
  tool/frying_pan: 沒有平底鍋時，可用炒鍋做白醬。
  tool/wok: 沒有炒鍋時，可用平底鍋炒料。

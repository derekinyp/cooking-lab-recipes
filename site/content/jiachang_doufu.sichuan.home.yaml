tag: pending
tag_note: 主要食譜（四川地方標準）沒寫總共要多久，也沒寫每一步多久，要試做計時。
card: 豆腐切片先煎到兩面變黃；鍋裡燒油把肉片炒熟，下郫縣豆瓣炒香，加高湯、豆腐、鹽和醬油用中小火燒透，最後放蒜苗、勾芡收汁。鹹鮮微辣，豆腐軟嫩、形狀完整。
variant: 川式家常版
intro: 份量和做法照四川的地方標準（來源①，豆腐 300 克、豬肉 100 克、郫縣豆瓣 35 克）。標準寫豆腐放進 210 度的油裡煎或炸，這頁改用平底鍋少油煎，這是家庭改法（推論）。另外三份做法放在下面對照，數字不混在一起用。
spice:
  mode: separate
  text: 辣味來自郫縣豆瓣，要在肉片炒熟後、加高湯前下鍋炒香，沒辦法最後才分開加。
  mild: [不辣那份要另外做一鍋，不放豆瓣，用醬油、鹽和高湯調味；標準沒有這種做法，份量要試做後再定（推論）。]
  yours: [照食譜做。這道菜沒有花椒。]
burners: 先用平底鍋煎豆腐，再用炒鍋燒，前後接著做，同一時間只用 1 口爐（推論）。
ing:
  i_douban:
    note: 原文要求先剁細再下鍋
  i_oil:
    note: 原文寫煎炸用油 1500 克、約用掉 80 克；家裡少油煎，用多少油原文沒寫
  i_msg:
    note: 可以不放
missing:
  - 每一步要多久
  - 煎豆腐、炒肉片用什麼火
  - 不用溫度計時，油燒到 210 度、150 度怎麼看
  - 豬肉片切多厚
compare:
  - 來源②的燒豆腐不用豆瓣：板豆腐 300 公克、豬肉絲 30 公克、紅辣椒絲 5 公克，用醬油、糖、米酒和水小火煮約 2 分鐘。
  - 來源③用豆豉、紅辣椒末和蒜苗，加水燜煮 6～7 分鐘到湯汁略乾，勾芡後淋辣油。
  - 來源④用豆腐 300 克、豬瘦肉 100 克，肉先醃 10 分鐘，豆腐用平底鍋煎到兩面金黃，下紅油豆瓣醬，小火燒 2 分鐘。
notes:
  - 豆腐要煎到兩面變黃、外皮酥；燒的時候用中小火、控制好燒的時間，豆腐才能保持完整（原文）。
  - 起鍋後趁熱吃，原文說起鍋到上桌最好不超過 10 分鐘。
steps:
  a9:
    heat: 中小火
    time: 燒透（多久原文沒寫）

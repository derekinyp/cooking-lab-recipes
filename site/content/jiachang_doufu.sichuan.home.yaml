intro: 豆腐先煎到兩面金黃，再與豬肉、郫縣豆瓣醬和蒜苗燒煮，芡汁濃亮，鹹鮮微辣，適合配飯。
card: 豆腐先煎出金黃外皮，再與炒熟豬肉、郫縣豆瓣醬和蒜苗燒煮，最後勾芡收汁，豆腐軟嫩完整。
variant: 川式家常版
burners: 用一口爐先煎豆腐，再以炒鍋炒肉、燒豆腐和收汁；切配可先完成。
spice:
  mode: separate
  text: 辣味來自郫縣豆瓣醬，會先炒香再加高湯；不吃辣可另做一鍋，不放豆瓣醬並以醬油和鹽調味。
  mild:
  - 不吃辣可另做一鍋，省略郫縣豆瓣醬，以醬油和鹽調味。
  hot:
  - 照食譜加入郫縣豆瓣醬，整鍋帶微辣。
notes:
- 郫縣豆瓣醬先剁細再下鍋，炒到油色轉紅、香氣出來。
- 豆腐煎至兩面變黃，燒煮時避免大力翻動，以保持形狀完整。
- 太白粉水攪勻後再加入鍋中，芡汁濃亮即可起鍋。
- 豆腐中心達 74°C 後趁熱上桌。
compare:
- 這道以郫縣豆瓣醬炒出紅油香；家常燒豆腐也可用醬油、米酒和砂糖調味，另有加入豆豉、辣椒與辣油的做法。
steps:
  a1:
    title: 切豆腐
    done:
    - 切成長約 6 公分、寬約 3 公分、厚約 0.5 公分的片。
    flow: 切豆腐
  a2:
    title: 切豬肉
    done:
    - 切成薄片，厚薄盡量一致。
    flow: 切肉
  a3:
    title: 切蒜苗
    done:
    - 切成長約 4 公分的段。
    flow: 切蒜苗
  a4:
    title: 煎豆腐
    heat: 中大火
    done:
    - 兩面煎至金黃，外皮略酥後取出。
    flow: 煎豆腐
  a5:
    title: 加熱炒鍋油
    heat: 中火
    done:
    - 油熱後放入豬肉片。
    flow: 熱油
  a6:
    title: 炒熟肉片
    heat: 中火
    time: 約 2–3 分鐘
    done:
    - 肉片變色熟透。
    flow: 炒肉
  a7:
    title: 炒香豆瓣醬
    heat: 中火
    time: 約 30–60 秒
    done:
    - 豆瓣醬香氣出來，鍋中油色轉紅。
    flow: 炒豆瓣
  a8:
    title: 燒豆腐
    heat: 中小火
    done:
    - 加入高湯、豆腐、食鹽、醬油與味精，燒至豆腐熱透並保持完整。
    flow: 燒豆腐
  a9:
    title: 蒜苗勾芡
    heat: 中火
    time: 約 1–2 分鐘
    done:
    - 加入蒜苗和太白粉水，攪拌至芡汁濃亮。
    flow: 收汁
  a10:
    title: 盛盤
    done:
    - 芡汁濃亮、蒜苗熟香時盛盤趁熱食用。
    flow: 盛盤

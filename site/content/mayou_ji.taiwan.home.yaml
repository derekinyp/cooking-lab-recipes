tag: weekend
tag_note: 主要食譜寫小火煮 30 分鐘到熟爛，已經超過平日 20 分鐘；爆香、燒開米酒的時間原文沒寫，所以放在假日做。
card: 麻油小火爆香老薑片，下雞塊大火炒 1 分鐘，倒米酒燒開再加水、鹽、糖，水滾轉小火煮 30 分鐘到熟爛，起鍋前淋黑麻油。
variant: 台式家常版
intro: 份量和做法照楊桃美食網轉載的食譜（來源①，土雞半隻）。另外兩份麻油雞（來源②③）放在下面對照，數字不混在一起用。這頁用湯鍋，不用烤箱。
spice:
  mode: none
  text: 三份食譜都沒有辣椒和花椒，整鍋就是不辣那份。
  mild: [照食譜做就好。]
  yours: [想吃辣，盛碗後另外加辣椒（原文沒有，份量自己抓）。]
burners: 全程 1 口爐、1 只湯鍋（原文只寫「取一鍋」，用湯鍋是我們的安排）；另一口爐可以做別的菜。
ing:
  i_chicken:
    note: 原文只寫「土雞 1/2 隻」，沒寫部位；請攤商切塊
  i_water:
    note: 原文只寫「適量」，沒寫加多少
  i_mayou_finish:
    note: 原文炒薑用「麻油」、起鍋淋「黑麻油」，兩種油的差別原文沒寫
missing:
  - 幾人份
  - 水要加多少
  - 爆香薑片要多久
  - 米酒燒開用什麼火、多久
  - 燉煮要不要蓋鍋蓋、中途要不要翻
  - 米酒的酒精會不會煮掉
compare:
  - 來源②不加水：雞肉 900 公克、薑片 100 公克、黑麻油 3 大匙、米酒 1200㏄，小火燜煮約 40 分鐘；材料表沒有水、鹽、糖。
  - 來源③（品牌官網）用帶皮雞腿肉 2 磅、米酒 1½ 杯、枸杞，中大火把雞皮朝下煎出油、薑片邊緣略焦後再倒米酒，燜煮 25 分鐘後加枸杞再煮 5 分鐘。
notes:
  - 雞肉熟爛可以用筷子戳戳看，戳得穿就好（這是我們的判斷建議，原文只寫煮 30 分鐘至熟爛）。
  - 黑麻油是起鍋前才淋，不要一開始就全部下。
steps:
  a5:
    heat: 大火
    time: 炒 1 分鐘
  a7:
    heat: 小火
    time: 水滾後煮 30 分鐘到熟爛

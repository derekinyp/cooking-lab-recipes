intro: 麻油與老薑慢慢炒出香氣，再加入土雞、米酒和水煮到熟爛。湯頭帶著薑香與麻油香，適合天冷時趁熱喝。
card: 老薑用小火炒香，雞塊大火炒過後加入米酒與水燉煮，起鍋前淋黑麻油提香。
variant: 台式家常版
burners: 全程用 1 口爐和 1 只湯鍋，先爆香薑片，再依序炒雞、煮湯。
spice:
  mode: addon
  text: 這鍋本身不辣；想吃辣，盛碗後另加辣椒片或辣椒醬。
  mild:
  - 照食譜煮，不另外加辣椒。
  hot:
  - 辣椒片或辣椒醬另放小碟，依個人口味添加。
notes:
- 請攤商將土雞切塊，回家後再洗淨瀝乾。
- 黑麻油在起鍋前才淋入，保留香氣。
compare:
- 另一種做法不加水，以米酒燉煮，酒香更突出。
- 也有帶皮雞腿先煎出雞油，再加入米酒燜煮的做法。
steps:
  a4:
    title: 小火炒香薑片
    heat: 小火
    done:
    - 薑片香氣明顯。
  a5:
    title: 大火炒雞塊
    heat: 大火
    time: 炒 1 分鐘
    done:
    - 雞塊表面變色。
  a6:
    title: 加入米酒與調味料
    heat: 大火
    done:
    - 湯汁滾起後加入水、鹽與砂糖。
  a7:
    title: 小火煮至熟爛
    heat: 小火
    time: 水滾後煮 30 分鐘
    done:
    - 雞肉熟透軟嫩。
  a8:
    title: 淋黑麻油
    done:
    - 起鍋前淋入黑麻油。
ing:
  i_chicken:
    suggest: 半隻，請攤商切塊
  i_water:
    suggest: 加到湯汁足以包覆雞肉
  i_mayou_finish:
    suggest: 5 小匙
states:
  s_cooked: 煮至熟爛的麻油雞

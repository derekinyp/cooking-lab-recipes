intro: 菜脯先乾炒去水，再拌入蔥花蛋液煎成金黃。鹹香配飯，也適合當家常早餐或配菜。
card: 菜脯先乾炒去水，再拌進蔥花蛋液；小火煎到兩面金黃，外層微酥、裡面柔嫩。
variant: 台式家常版
burners: 用一口爐和一只平底鍋，先乾炒菜脯取出，再用同鍋煎蛋。
spice:
  mode: addon
  text: 菜脯蛋本身不辣；想吃辣，盛盤後再撒辣椒粉或花椒粉。
  mild:
  - 照食譜煎好即可。
  hot:
  - 盛盤後依喜好撒辣椒粉或花椒粉。
notes:
- 菜脯鹹度不同，洗淨瀝乾後可先試一小口，再決定是否多洗一次。
- 翻面不順手時，可用盤子協助翻面。
steps:
  a1:
    title: 洗菜脯
    done:
    - 略洗後瀝乾。
    flow: 洗淨瀝乾
  a2:
    title: 乾炒菜脯
    heat: 小火
    time: 約 1 至 3 分鐘
    done:
    - 炒到表面乾爽，取出備用。
    flow: 乾炒去水
  a3:
    title: 拌蛋液
    done:
    - 雞蛋打散，加入蔥花、菜脯與調味料拌勻。
    flow: 拌勻蛋液
  a4:
    title: 炒至略凝固
    heat: 中火
    time: 約 30 秒至 1 分鐘
    done:
    - 蛋液略凝固後轉小火。
    flow: 炒至凝固
  a4b:
    title: 煎第一面
    heat: 小火
    time: 約 1 至 3 分鐘
    done:
    - 邊緣定型、底面微金黃。
    flow: 煎至定型
  a5:
    title: 翻面煎熟
    heat: 小火
    time: 約 1 分鐘
    done:
    - 另一面煎成金黃色。
    flow: 翻面煎香

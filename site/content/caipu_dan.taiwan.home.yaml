tag: pending
tag_note: 主要食譜沒寫總共要多久；另外兩份參考食譜寫的時間互相對不起來，所以要你做一次計時才知道平日能不能做。
card: 菜脯先乾炒去水，拌進蔥花蛋液，平底鍋煎到兩面金黃。
spice:
  mode: addon
  text: 三份參考食譜都沒有辣椒、花椒，整份太太可以直接吃。
  wife: [照食譜做，不另外加。]
  yours: [盛盤後，在你那份另外撒辣椒或花椒粉。原文沒有這一步，份量你自己抓。]
burners: 全程只用 1 口爐、1 只平底鍋：先乾炒菜脯盛起，再用同一只鍋煎蛋。
missing:
  - 幾人份（只寫雞蛋 3 顆）
  - 菜脯乾炒要多久、第一面煎多久
  - 翻面的方法
  - 上桌溫度
notes:
  - 菜脯鹹度不一樣：主要食譜只寫「略洗淨」，另一份食譜會先泡水再換水，免得太鹹。要不要泡，試做時嚐一下再決定。
steps:
  a5:
    tips: [翻面方法原文沒寫。翻不過來時，可以參考來源③：用盤子蓋住鍋子把蛋翻過來。]

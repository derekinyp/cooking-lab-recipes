tag: pending
tag_note: 主要食譜只標「30 分鐘內」（不是 20 分鐘），步驟沒寫要炒幾分鐘，要試做計時。
card: 韭菜花切丁，豆豉沖水擰乾；熱油爆香蒜末和豆豉，下絞肉和韭菜花拌炒，加調味料大火炒到收汁；辣椒最後才分開加。
variant: 台式家常版
intro: 份量和做法照楊桃美食網的食譜（來源①，絞肉 100 公克、韭菜花 200 公克）。另外兩份蒼蠅頭（來源②③）放在下面對照，數字不混在一起用。
spice:
  mode: addon
  text: 主要食譜的辣椒片是和蒜末、豆豉一起爆香，這頁改成先不下辣椒、最後才分開加，所以可以一鍋兩吃。這是改法（推論），辣味會比原文淡。
  mild: [炒到收汁後，先盛出不辣那份。]
  yours: [鍋裡剩下的再加辣椒片拌炒一下（原文 30 公克是整鍋的量；分開加多少要試做）。這道菜沒有花椒。]
burners: 全程只用 1 只炒鍋（原文標「一鍋到底」）；另一口爐可以做別的菜。
ing:
  i_douchi:
    note: 原文沒寫是黑豆豉還是蔭豆豉
  i_sesame:
    note: 原文只寫「適量」
missing:
  - 幾人份
  - 爆香、拌炒各要多久
  - 絞肉的肥瘦
  - 韭菜花丁切多大
  - 用哪種油
compare:
  - 來源②的韭菜花比較少（100 公克）、絞肉比較多（150 公克），絞肉先炒乾盛起，起鍋前才下韭菜花，保持爽脆。
  - 來源③先把肉末醃 20 分鐘，中高火炒 2 分鐘，再下韭菜苔、蒜、薑、豆豉、辣椒，加水煮 2 分鐘調味。
notes:
  - 豆豉要先沖一下水再擰乾（原文作法）。
steps:
  a4:
    heat: 大火
    time: 炒到收汁，原文沒寫幾分鐘

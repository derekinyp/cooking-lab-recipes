intro: 蒜末、豆豉與辣椒先爆香，再加入絞肉和韭菜花快炒收汁。鹹香帶辣，適合配白飯。
card: 蒜末和豆豉先爆香，加入絞肉與韭菜花快炒收汁；豆豉鹹香、韭菜花爽脆，是很下飯的家常小炒。
variant: 台式家常版
burners: 全程用一只炒鍋依序完成，備料時可先把韭菜花切段、豆豉瀝乾。
spice:
  mode: addon
  text: 先不放辣椒，炒好後先盛出不辣份；再把辣椒片拌入鍋中，炒到辣味釋出。
  mild:
  - 爆香時先不下辣椒，完成後先盛出不辣份。
  hot:
  - 盛出不辣份後，再加入辣椒片拌炒。
notes:
- 豆豉沖洗後要瀝乾，避免下鍋時油花噴濺。
- 韭菜花切成小段，較容易熟得均勻。
compare:
- 這道做法把韭菜花與絞肉一同拌炒；也可先炒熟絞肉，最後才下韭菜花，口感會更爽脆。
steps:
  a1:
    title: 切韭菜花
    done:
    - 洗淨後切成小段。
    flow: 韭菜花切段
  a2:
    title: 處理豆豉
    done:
    - 沖洗後瀝乾。
    flow: 豆豉瀝乾
  a3:
    title: 爆香配料
    heat: 小火
    time: 約 30 秒至 2 分鐘
    done:
    - 炒出蒜香與豆豉香。
    flow: 蒜豉爆香
  a4:
    title: 快炒收汁
    heat: 大火
    time: 約 3 至 5 分鐘
    done:
    - 絞肉炒熟，韭菜花轉翠綠，醬汁收濃。
    flow: 炒熟收汁

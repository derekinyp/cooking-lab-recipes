tag: pending
tag_note: 主要食譜沒寫要做多久，要試做才知道；另一份食譜（來源②）標準備 9 分鐘、烹調 5 分鐘，但那是不同的做法，只能參考。
card: 番茄和蔥小火爆香，加番茄醬、高湯、糖煮開勾芡先起鍋；另熱鍋把加鹽打勻的蛋快速炒到稍凝固，再把番茄倒回去拌勻。
variant: 家常版
intro: 份量和做法照一份有完整份量的家常影音食譜（來源①）。另外兩份家常食譜（來源②③）放在下面對照，數字不混在一起用。
spice:
  mode: none
  text: 三份食譜都沒有辣椒和花椒，整盤就是不辣那份。
  mild: [照食譜做就好。]
  yours: [想吃辣，盛盤後另外加辣椒（原文沒有，份量自己抓）。]
burners: 番茄先起鍋備用，再用同一口爐炒蛋，全程 1 口爐就夠（推論）。
ing:
  i_oil:
    note: 主要食譜只寫「倒入沙拉油」「適量油」，沒寫多少；另一份食譜（來源②）兩次各下 1 大匙油，可以參考
  i_stock:
    note: 原文寫 50 西西，就是 50 毫升；另一份食譜（來源②）是用清水煮番茄
  i_slurry:
    note: 主要食譜沒寫太白粉和水怎麼調；另一份食譜（來源②）是 1 匙太白粉加 1 匙水
  i_salt:
    note: 鹽是加在蛋液裡打勻的
missing:
  - 油要放多少
  - 幾人份
  - 每一步要多久
  - 煮番茄醬汁和炒蛋用什麼火（只有爆香寫小火）
  - 勾芡要多稠（另一份食譜寫「勾到有點濃稠度就可以」）
notes:
  - 主要食譜是先把番茄煮好勾芡起鍋，再炒蛋，最後合在一起；另外兩份是先炒蛋盛出，再炒番茄，最後把蛋倒回去。兩種順序都可以，這頁照主要食譜。
  - 另一份食譜（來源②）最後關火加 1 茶匙烏醋，說能讓味道更開胃；主要食譜沒有。
  - 炒蛋炒到稍凝固就好，還要跟番茄一起拌，太熟會乾。
steps:
  a2:
    heat: 小火（主要食譜）
  a4:
    tips: 蛋液下鍋快速炒勻，稍微凝固就停，不用炒到全熟

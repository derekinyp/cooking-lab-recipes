intro: 番茄先與蔥炒出香氣，再加高湯和番茄醬煮成微稠醬汁，最後拌入柔嫩蛋塊。適合搭飯，也能當簡單家常菜。
card: 先把番茄煮成微稠醬汁，再快速炒蛋至柔嫩，最後合炒，讓蛋塊均勻裹上酸甜番茄香。
variant: 家常版
burners: 一口爐依序煮番茄醬汁、炒蛋，再合炒；切配和打蛋可先在一旁完成。
spice:
  mode: none
notes:
- 太白粉水先攪勻再倒入鍋中，避免沉底結塊。
- 蛋液炒到大致凝固就加入番茄，保留柔嫩口感。
steps:
  a1:
    title: 切料打蛋
    done:
    - 番茄切小塊、青蔥切小段，蛋液加鹽打勻。
    flow: 切料打蛋
  a2:
    title: 炒番茄與青蔥
    heat: 小火
    done:
    - 炒出蔥香，番茄邊緣略軟。
    flow: 炒香番茄
  a3:
    title: 煮醬汁勾芡
    heat: 中火
    done:
    - 加入番茄醬、高湯和砂糖煮開，再拌入太白粉水至醬汁微稠。
    flow: 煮汁勾芡
  a4:
    title: 炒蛋
    heat: 中大火
    done:
    - 蛋液快速炒至大致凝固，仍柔軟濕潤。
    tips:
    - 不要炒到全乾，合炒時還會繼續受熱。
    flow: 炒至柔嫩
  a5:
    title: 合炒起鍋
    heat: 中火
    done:
    - 番茄醬汁均勻裹上蛋塊即可起鍋。
    flow: 合炒起鍋
ing:
  i_oil:
    suggest: 約 2 大匙

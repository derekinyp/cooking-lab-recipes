intro: 豬絞肉先捶出黏性，再拌入蒜末、青蔥、醬瓜與調味料，放入耐熱容器蒸熟。成品鹹香帶漬瓜甘味，適合配飯。
card: 豬絞肉捶出黏性後拌入醬瓜與蒜末，調味整平後用電鍋蒸熟，撒上青蔥即可上桌。
variant: 台式家常版
burners: 備料完成後以電鍋蒸煮，全程不需使用瓦斯爐。
spice:
  mode: none
notes:
- 肉餡分次加入漬物汁與醬油拌勻，再加入太白粉。
- 醬瓜切碎後拌入肉餡，使味道均勻。
- 蒸好後趁熱撒上預留的青蔥。
steps:
  a1:
    title: 切好配料
    done:
    - 醬瓜切小塊，蒜切末，青蔥切小段並留一部分作點綴。
  a2:
    title: 捶打豬絞肉
    done:
    - 用刀捶打至肉餡出現黏性。
  a3:
    title: 拌成肉餡
    done:
    - 依序拌入蒜末、青蔥、醬瓜和調味料，直到均勻。
  a4:
    title: 整平肉餡
    done:
    - 移入耐熱容器，將表面抹平。
  a5:
    title: 電鍋蒸熟
    time: 依電鍋蒸至肉餡熟透
    done:
    - 中心熟透，切開不見生肉色。
  a6:
    title: 撒上青蔥
    done:
    - 撒上預留的青蔥，趁熱上桌。

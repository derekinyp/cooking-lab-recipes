card: 豬絞肉先捶出黏性，再和蒜、蔥、漬物及調味料拌成肉餡，放進耐熱容器整平後用電鍋蒸熟，最後撒上蔥花。成品是帶有漬物風味的蒸肉，外觀與口感原文沒寫。
variant: 台式家常版
intro: 依照主要食譜的做法，用電鍋蒸肉餡。漬物是否拌進肉餡，原文沒寫；若加入是推論。
burners: 備料後放入電鍋蒸，不用瓦斯爐（推論）。
missing:
  - 漬物是否拌進肉餡
  - 蒸多久、怎麼判斷熟了
  - 耐熱容器的大小
  - 成品的顏色、味道與口感
  - 電鍋外鍋那杯水的容量
steps:
  a2:
    heat: 不用爐火，用菜刀捶肉；捶多久原文沒寫
    time: 捶到肉餡出現黏性；所需時間原文沒寫
  a3:
    heat: 不用加熱
    time: 依序拌勻；所需時間原文沒寫
  a4:
    heat: 不用加熱
    time: 把肉餡放入耐熱容器並整平；所需時間原文沒寫
  a5:
    heat: 電鍋按下開關，沒有爐火可調
    time: 原文沒寫蒸多久
tag: weekday
tag_note: 主要食譜標示調理時間 20 分鐘；備料與蒸製時間是否都算在內，原文沒寫。

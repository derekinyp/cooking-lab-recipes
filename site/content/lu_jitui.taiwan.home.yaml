intro: 先把草果、小茴、花椒、甘草、八角和肉桂包成滷包，與蔥、薑、紅辣椒、醬油、米酒、細砂糖一起煮成滷汁。棒棒腿擦乾後煎到金黃，倒入滷汁煮滾，小火微滾再關火燜到入味，醬色油亮、鹹香帶甜。筷子從骨邊一插就進、流出清汁就可以盛盤，配白飯或裝便當都很適合。
card: 自製滷汁煮好後，棒棒腿煎香再滷，小火微滾後關火燜到入味，醬色油亮、鹹甜下飯。
variant: 台式家常版
burners: 全程使用一口爐與一只炒鍋。煮好滷汁先盛出，再熱鍋煎雞腿，接著倒回滷汁。
spice:
  mode: separate
  text: 紅辣椒會和蔥、薑一起爆香，滷汁帶有淡淡辛香；不吃辣可省略紅辣椒，其餘照做。
  mild:
  - 不放紅辣椒，其餘照做。
  hot:
  - 想吃更辣，起鍋後可另加切好的紅辣椒。
notes:
- 雞腿用廚房紙巾徹底擦乾再下鍋，熱油比較不會噴濺，也比較容易上色。不要用水沖洗生雞肉。
- 判斷熟度時，把筷子從骨邊插進去，插得進、流出清澈肉汁就可以起鍋。
- 這一鍋滷汁份量較多，滷雞腿取 600 毫升即可，剩餘放涼後冷藏，之後還可以滷其他食材。
- 若家中已有現成滷汁，可用 600 毫升市售滷汁代替自製滷汁，直接從煎雞腿做起。
steps:
  a1:
    title: 處理雞腿
    done:
    - 用廚房紙巾把雞腿徹底擦乾，在肉厚處劃一刀。
    - 下鍋前表面要乾，減少熱油噴濺。
  a2:
    title: 包滷包
    done:
    - 草果、小茴、花椒、甘草、八角、肉桂放進棉袋，袋口紮緊。
  a3:
    title: 切配料
    done:
    - 蔥切段、薑切片，紅辣椒剖半後拍鬆。
  a4:
    title: 爆香
    heat: 中火
    time: 約 30–120 秒
    done:
    - 鍋中加少許沙拉油，蔥薑辣椒下鍋，聞到香氣即可。
  a5:
    title: 加水煮滾
    heat: 中大火
    time: 約 3–15 分鐘
    done:
    - 倒入 1500 毫升水，煮到整鍋大滾。
  a6:
    title: 加調味再煮滾
    heat: 中大火
    time: 約 3–10 分鐘
    done:
    - 加入醬油、細砂糖和滷包，再煮到整鍋滾沸、糖化開。
  a7:
    title: 小火煮滷汁
    heat: 小火
    time: 約 5 分鐘
    done:
    - 轉小火煮約 5 分鐘，等到香味散發出來，再倒入米酒。
    - 滷汁盛到大碗裡備用。
  a8:
    title: 煎上色
    heat: 中火
    time: 約 2–5 分鐘
    done:
    - 原鍋倒入 2 大匙沙拉油，雞皮朝下先煎，表面金黃微焦再翻面。
  a9:
    title: 倒入滷汁煮滾
    heat: 中大火
    time: 約 3–15 分鐘
    done:
    - 倒入 600 毫升滷汁，煮到整鍋大滾冒泡。
  a10:
    title: 小火微滾
    heat: 小火
    time: 約 5 分鐘
    done:
    - 改轉小火，開蓋微滾約 5 分鐘。
  a11:
    title: 關火燜
    time: 燜 20 分鐘
    done:
    - 蓋上鍋蓋，關火燜 20 分鐘。
    - 筷子從骨邊插得進、流出清澈肉汁就完成了。
  a12:
    title: 盛盤
    done:
    - 先試一口滷汁的鹹淡，雞腿夾出盛盤，淋上少許滷汁。
ing:
  i_oil_sauce:
    note: 夠爆香即可。
  i_a:
    note: 選棒棒腿，一人一隻。

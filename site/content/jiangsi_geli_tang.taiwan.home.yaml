intro: 蛤蜊搭配薑絲煮成清爽鮮甜的家常湯，最後撒上蔥末提香，適合配飯或當作簡單湯品。
card: 蛤蜊和薑絲放進煮開的水裡，煮到蛤蜊開口後以米酒、鹽和少許雞粉調味，熄火撒上蔥末。
variant: 台式家常版
burners: 全程用 1 口爐和 1 只湯鍋；蛤蜊吐沙、洗切備料時不需開火。
spice:
  mode: none
notes:
- 蛤蜊吐沙後再洗淨，煮湯用水另計。
steps:
  a1:
    title: 蛤蜊吐沙
    done:
    - 蛤蜊吐沙後以清水沖洗乾淨。
    flow: 吐沙洗淨
  a2:
    title: 準備薑絲與蔥末
    done:
    - 薑切絲，蔥切末備用。
    flow: 切配
  a3:
    title: 煮開蛤蜊
    heat: 中火
    done:
    - 水再次滾開，蛤蜊殼打開。
    flow: 煮至開口
  a4:
    title: 調味起鍋
    heat: 小火
    done:
    - 加入調味料拌勻，熄火撒上蔥末。
    flow: 調味
also:
- name: 虱目魚肚湯
  text: 把蛤蜊換成虱目魚肚，薑絲照放。蛤蜊本身帶鹹味，換成魚肚後要先試味道再補鹽；魚肚很快就熟，湯滾了再放，煮到肉變白就關火，不要煮太久。

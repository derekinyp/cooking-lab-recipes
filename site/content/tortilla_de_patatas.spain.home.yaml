intro: 馬鈴薯用橄欖油慢慢煨軟，和洋蔥、蛋液混合後煎成厚實蛋餅；外層金黃，中心柔嫩，適合當早午餐或輕食。
card: 馬鈴薯切薄片以小火煨軟，拌入炒軟洋蔥和蛋液，平底鍋煎成外層金黃、中心柔嫩的厚蛋餅。
variant: 西班牙家常版（平底鍋）
burners: 全程一口爐即可；先炒洋蔥，再用同一口爐油煨馬鈴薯，最後煎蛋餅。
spice:
  mode: none
notes:
- 洋蔥可依喜好省略。
- 翻面時用比鍋面大的平盤蓋住鍋子，握穩後倒扣，再將蛋餅滑回鍋中。
- 油煨馬鈴薯至軟而不焦黃，與煎至焦糖色的做法不同。
steps:
  a2:
    title: 炒軟洋蔥
    heat: 小火
    done:
    - 洋蔥變軟、略透明。
  a3:
    title: 煨軟馬鈴薯
    heat: 小火
    done:
    - 馬鈴薯可用叉子刺穿，表面不焦黃。
  a5:
    title: 煎蛋餅底面
    heat: 中小火
    done:
    - 邊緣凝固並開始離鍋。
  a6:
    title: 翻面煎熟
    heat: 中小火
    done:
    - 兩面金黃，中心熟而濕潤。
ing:
  i_oil:
    suggest: 約 500 毫升，油量需足以煨軟馬鈴薯

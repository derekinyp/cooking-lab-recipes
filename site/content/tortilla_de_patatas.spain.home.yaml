tag: pending
tag_note: 主要食譜沒寫要做多久，要試做才知道；另一份食譜（來源③）標總時間 60 分鐘，只能參考。
card: 馬鈴薯切薄片用大量橄欖油小火慢慢泡軟，和炒軟的洋蔥、打散的蛋拌在一起，平底鍋煎到邊緣離鍋，用盤子翻面再煎另一面。
variant: 西班牙家常版（平底鍋）
intro: 份量和做法照西班牙公共電視台的食譜（來源①）。另外兩份西班牙食譜（來源②③）放在下面對照，數字不混在一起用。全程用平底鍋，不用烤箱。
spice:
  mode: none
  text: 三份食譜都沒有辣椒和花椒，整份就是不辣那份。
  mild: [照食譜做就好。]
  yours: [想吃辣，切好盛盤後另外配辣椒醬（原文沒有，份量自己抓）。]
burners: 洋蔥和馬鈴薯可以用同一口爐分批做，全程 1 口爐就夠（推論）。
ing:
  i_onion:
    note: 主要食譜寫洋蔥可加可不加，這頁照加洋蔥的做法
  i_oil:
    note: 原文沒寫多少，只說用「大量」橄欖油泡馬鈴薯
  i_salt:
    note: 原文沒寫多少，蛋液混好後調味
missing:
  - 幾人份
  - 油和鹽要放多少
  - 每一步要多久、用什麼火
  - 泡過馬鈴薯的油要不要先倒掉一些
notes:
  - 另一份食譜（來源③）寫小火炒軟洋蔥，煎蛋餅用中大火、每面約 45 秒；主要食譜沒寫火力，第一次做可以參考。
  - 另一份食譜（來源②）的洋蔥、馬鈴薯和大蒜炒了 35 分鐘到焦糖色，跟主要食譜的「軟而不上色」是不同做法。
  - 翻面時用比鍋子大的盤子蓋住平底鍋，一手壓住盤子整個倒扣，再把蛋餅滑回鍋裡煎另一面；最後用鍋鏟把邊緣整圓。
steps:
  a2:
    heat: 原文沒寫火力
    time: 原文沒寫
  a3:
    heat: 小火慢慢泡（原文寫低溫，沒寫火力大小）
    time: 泡到馬鈴薯變軟、還沒上色，原文沒寫多久
  a5:
    heat: 原文沒寫火力，讓蛋慢慢凝固
    time: 原文沒寫

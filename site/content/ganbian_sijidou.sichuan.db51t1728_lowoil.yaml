tag: pending
tag_note: 原文沒寫總共要多久，要試做計時。
card: 平底鍋少油煸四季豆到起皺，再和肉末、芽菜一起炒香。
spice:
  mode: addon
  text: 這個少油版沒有辣椒、花椒，整份不辣，可以直接當不辣那份。
  mild: [照食譜做，不另外加。]
  yours: [起鍋後在你那份另外加辣椒油或花椒粉。原文沒有這一步，份量你自己抓。]
burners: 全程只用 1 口爐、1 只平底鍋：先炒肉末盛起，再用同一只鍋煸四季豆、最後合炒。
missing:
  - 幾人份（只寫四季豆 250 克）
  - 炒肉末用多少油、用什麼火
  - 四季豆要煸多久（以「好了的樣子」為準）
compare:
  - 官方原版是把四季豆下油鍋炸，要用很多油；這頁照你選的少油版，用平底鍋 1 大匙油煸，官方版只留作對照。
  - 官方版顏色要碧綠；少油版會是黃綠帶一點焦斑，這是少油版的樣子。
  - 原文都是先煸豆再炒肉；這頁改成先炒肉末盛起，是為了只用一只鍋。
steps:
  g4:
    time: 原文沒寫要煸多久，以「好了的樣子」為準
    tips: [下鍋前四季豆一定要擦乾，帶水下鍋會出水、不會焦香。]

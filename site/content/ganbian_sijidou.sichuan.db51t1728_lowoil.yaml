intro: 四季豆用平底鍋少油煸到表皮起皺，再和絞肉、碎米芽菜拌炒。成品乾香鹹鮮，適合配飯。
card: 平底鍋少油煸四季豆至表皮起皺，再與絞肉和碎米芽菜炒香，鹹鮮乾香又不油膩。
variant: 少油家庭版
burners: 一口爐和一只平底鍋即可完成；先炒肉臊盛起，再煸四季豆，最後合炒。
spice:
  mode: addon
  text: 菜本身不辣；想吃辣可在盛盤後另加辣椒油或花椒粉。
  mild:
  - 照原味做，不另外加辣味調料。
  hot:
  - 盛盤後依喜好加辣椒油或花椒粉。
notes:
- 四季豆下鍋前要擦乾，表面有水會不易煸出香氣。
- 四季豆煸至起皺、熟透即可，不要煸焦。
steps:
  g1:
    title: 處理四季豆
    done:
    - 去筋切段，洗淨後完全擦乾。
    flow: 切段擦乾
  g4:
    title: 少油煸豆
    heat: 中大火
    done:
    - 四季豆鋪平少翻，表皮起皺、黃綠色且熟透即可。
    tips:
    - 下鍋前擦乾四季豆，帶水會出水、不易煸香。
    flow: 煸至起皺
  g5:
    title: 加入肉臊芽菜
    heat: 中火
    done:
    - 加入碎米芽菜、肉臊與調味料炒香，均勻裹上四季豆後盛盤。
    flow: 拌炒盛盤
ing:
  g_beans:
    suggest: 約 250 公克
  g_oil_beans:
    suggest: 約 1 大匙

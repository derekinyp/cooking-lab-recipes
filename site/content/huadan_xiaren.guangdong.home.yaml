intro: 蝦仁先醃過再快炒，拌入蛋液以小火炒至凝固，成品柔軟滑嫩、蛋香和蝦鮮相互襯託，適合趁熱配飯。
card: 蝦仁先炒至八成熟，再拌進加了鹽與太白粉的蛋液，以小火快炒，讓蛋保持滑嫩。
variant: 廣式家常版
burners: 用一口爐和一只炒鍋，先炒蝦仁盛起，再炒蛋液；等待蝦仁放涼時可拌好蛋液。
spice:
  mode: none
notes:
- 蝦仁洗淨後擦乾，較容易炒出香氣。
- 蛋液下鍋後轉小火，快速不停翻炒；蛋略凝固時可先離火，用餘溫炒到喜歡的滑度。
- 白胡椒粉可減少蝦腥味，太白粉可幫助蛋液減少出水。
compare:
- 這道做法先炒蝦仁再拌入蛋液；另有先汆燙蝦仁再拌蛋液，或先煮濃稠醬汁再加入蛋液的做法。
steps:
  a1:
    title: 打勻蛋液
    done:
    - 蛋黃與蛋白充分打散。
    flow: 打蛋
  a2:
    title: 清理蝦仁
    done:
    - 去腸、洗淨並擦乾。
    flow: 清蝦
  a3:
    title: 醃蝦仁
    time: 約 10–20 分鐘
    done:
    - 加入鹽、白胡椒粉與太白粉拌勻。
    flow: 醃蝦
  a4:
    title: 炒蝦仁
    heat: 大火
    time: 約 1–2 分鐘
    done:
    - 炒至蝦身轉粉白、仍略帶彈性，盛起放涼。
    flow: 炒蝦
  a5:
    title: 拌入蛋液
    done:
    - 蝦仁、蛋液、鹽與太白粉拌勻。
    flow: 拌合
  a6:
    title: 小火炒蛋
    heat: 小火
    time: 約 1–2 分鐘
    done:
    - 蛋液剛凝固就盛起，避免炒得過乾。
    flow: 炒蛋
  a7:
    title: 撒上蔥花
    done:
    - 撒上蔥花趁熱食用。
    flow: 收尾
ing:
  i_scallion:
    suggest: 約 1 大匙
  i_starch_egg:
    suggest: 約 1/4 小匙

tag: pending
tag_note: 主要食譜沒寫任何時間，炒蝦仁、炒蛋要多久都要試做計時。
card: 雞蛋打勻；蝦仁去腸擦乾，加鹽、白胡椒粉、太白粉醃；大火炒蝦仁到八成熟盛起放涼，倒進蛋液加調味料拌勻；再熱油倒入，轉小火快速炒到蛋液凝固，撒上蔥。
variant: 廣式家常版
intro: 份量和做法照一個香港親子食譜網站的食譜（來源①，4 人份，蝦 6 兩、雞蛋 5 顆）。另外兩份滑蛋蝦仁（來源②③）放在下面對照，數字不混在一起用。
spice:
  mode: none
  text: 三份食譜都沒有辣椒和花椒，整鍋就是不辣那份。白胡椒粉是醃蝦用的，不算辣的配料。
  mild: [照食譜做就好。]
  yours: [想吃辣，盛盤後另外加辣椒（原文沒有，份量自己抓）。]
burners: 先大火炒蝦仁盛起，再小火炒蛋，兩步先後做，只用 1 口爐、1 只炒鍋（推論）。
ing:
  i_shrimp:
    note: 原文寫「海蝦 6 兩」；「兩」是常用的重量單位，原文沒換算
  i_scallion:
    note: 原文只寫「少許」
  i_starch_egg:
    note: 原文只寫「少許」；原文說蛋液加一點太白粉，炒蛋比較不會出水
missing:
  - 醃蝦要醃多久
  - 炒蝦仁、炒蛋各要多久
  - 總時間
  - 蔥怎麼切
compare:
  - 來源②先把蝦仁燙熟再拌進蛋液，另外加金針菇、蔥花和味醂；雞蛋 8 顆、蝦仁 150 克。
  - 來源③是先勾芡再淋蛋液的做法，整道只用 1 顆蛋，另加毛豆仁。
notes:
  - 下蛋液後要轉小火，快手不停炒，蛋才會滑嫩（原文提醒）。
  - 炒到差不多可以先離火再炒幾下，炒到自己喜歡的滑度（原文提醒）。
  - 加一點白胡椒粉可以去掉蝦的腥味（原文提醒）。
steps:
  a4:
    heat: 大火
    time: 炒到八成熟，原文沒寫多久
  a6:
    heat: 小火
    time: 快速炒到蛋液凝固

intro: 烤香的英式瑪芬鋪上熱火腿和水波蛋，再淋檸檬奶油荷蘭醬。蛋黃溫熱流心，適合週末早午餐，完成後趁熱享用。
card: 英式瑪芬烤到金黃，鋪上熱火腿與流心水波蛋，再淋檸檬奶油荷蘭醬，趁熱享用。
variant: 水波蛋組裝與荷蘭醬分別依食譜製作
tools:
  tool/bain_marie: 炒鍋加水，放上不鏽鋼碗隔水加熱
  tool/saucepan: 湯鍋煮水波蛋
spice:
  mode: addon
  text: 荷蘭醬帶少許卡宴辣椒粉；想要不辣，可先留出不加辣椒粉的醬。
  mild:
  - 荷蘭醬不加卡宴辣椒粉。
  hot:
  - 卡宴辣椒粉拌入荷蘭醬。
burners: 先完成澄清奶油和荷蘭醬，離火保溫；接著煮水波蛋，同時以另一口爐加熱火腿。
notes:
- 瑪芬以平底鍋乾烙至表面金黃。
- 荷蘭醬以不鏽鋼碗隔水加熱，避免水滾得太劇烈。
- 荷蘭醬依食譜保溫最多 2 小時，使用不鏽鋼容器。
steps:
  b1:
    title: 烤瑪芬
    heat: 中小火
    time: 約 2–3 分鐘
    done:
    - 切面金黃、表面乾爽。
    tool: 平底鍋乾烙
  b2:
    title: 抹奶油
    done:
    - 瑪芬抹上薄薄一層奶油，放入盤中。
  b3:
    title: 加熱火腿
    heat: 中火
    time: 1 分鐘
    done:
    - 火腿熱透即可。
  b4:
    title: 放上火腿
    done:
    - 將熱火腿放在瑪芬上。
  b5:
    title: 放上水波蛋
    done:
    - 瀝乾水波蛋後放在火腿上。
  b6:
    title: 淋荷蘭醬
    done:
    - 淋上每份 50 毫升荷蘭醬，立刻上桌。

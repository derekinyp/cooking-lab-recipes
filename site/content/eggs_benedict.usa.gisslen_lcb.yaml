tag: pending
tag_note: 荷蘭醬的來源寫準備時間 15 分鐘，但整道菜要做三樣東西，總時間原文沒寫，要試做計時。
card: 烤過的英式瑪芬放熱火腿和半熟水波蛋，淋上檸檬奶油味的荷蘭醬。
intro: 烤過的英式瑪芬上放熱火腿和半熟的水波蛋，淋上帶檸檬香的奶油蛋黃醬（荷蘭醬），做好立刻吃。
variant: 兩份來源組合：組裝照廚藝教科書，荷蘭醬照法國藍帶廚藝學校
tools:
  tool/bain_marie: 炒鍋＋不鏽鋼碗（隔水加熱）
  tool/saucepan: 炒鍋（煮水波蛋）
spice:
  mode: addon
  text: 荷蘭醬裡有一撮卡宴辣椒粉，會有一點辣。
  wife: [荷蘭醬先不加卡宴辣椒粉。]
  yours: [卡宴辣椒粉最後撒一點在你那份的醬上（家庭改法，原文是加在整碗醬裡）。]
burners: 最多同時 2 口爐。先用炒鍋隔水做澄清奶油和荷蘭醬，做好離火放著；再用炒鍋煮水波蛋，同時用平底鍋熱火腿。
missing:
  - 隔水加熱和煮水波蛋要放多少水
  - 瑪芬用什麼烤、烤到什麼顏色
  - 荷蘭醬做好後在家裡怎麼保溫
notes:
  - 家裡沒有烤箱：瑪芬原文只寫「烤」，可以用平底鍋乾烙到表面上色（家庭改法，原文沒寫）。
  - 家裡沒有專用的隔水鍋和小鍋：用炒鍋裝微滾的水、上面放不鏽鋼碗來隔水加熱；水波蛋也用炒鍋煮（家庭改法）。
  - 荷蘭醬保溫不要超過 2 小時，剩下的丟掉、不要和新做的混在一起；不要用鋁製容器，器具要完全乾淨（教科書的提醒）。
steps:
  h2:
    heat: 水要微滾、不可以大滾（原文）
  e2:
    time: 煮 3–5 分鐘（原文）
  b1:
    tips: [家裡沒有烤箱：可用平底鍋乾烙（家庭改法）。]
  b3:
    time: 1 分鐘（原文）

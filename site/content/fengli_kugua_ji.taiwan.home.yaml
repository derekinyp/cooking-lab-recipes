intro: 雞肉先汆燙，再與白苦瓜、綠苦瓜、新鮮鳳梨和薑片同煮。湯頭清甜帶微苦回甘，適合天涼時一家人分享。
card: 白、綠苦瓜搭配新鮮鳳梨入湯，雞肉先汆燙再慢煮，湯頭清甜回甘，帶有淡淡薑香。
variant: 台式家常版
burners: 一口爐和一只湯鍋依序完成；汆燙雞肉時可在旁切苦瓜、鳳梨與薑片。
spice:
  mode: separate
  text: 湯底本身不辣；想吃辣可另外準備辣椒末沾料，不吃辣就不加。
  mild:
  - 湯裡不加辣椒，照原味盛碗。
  hot:
  - 辣椒末另放小碟，依喜好搭配。
notes:
- 雞肉汆燙後撈起，沖去浮沫再放入清水中煮。
- 冰糖先少量加入，試味後再調整甜度。
steps:
  a1:
    title: 汆燙雞肉
    heat: 大火
    done:
    - 雞肉表面轉白後撈起，沖去浮沫。
    flow: 汆燙雞肉
  a2:
    title: 切苦瓜
    done:
    - 白苦瓜與綠苦瓜去籽、去頭尾後切塊。
    flow: 切苦瓜
  a3:
    title: 切鳳梨
    done:
    - 鳳梨切成片狀。
    flow: 切鳳梨
  a4:
    title: 煮雞肉
    heat: 中小火
    time: 煮 10 分鐘
    done:
    - 水滾後放入雞肉，維持微滾。
    flow: 煮雞肉
  a5:
    title: 加入苦瓜鳳梨
    heat: 小火
    time: 續煮 25 分鐘
    done:
    - 加入苦瓜、鳳梨、薑片與部分蔥段，煮至苦瓜柔軟。
    flow: 續煮湯料
  a6:
    title: 調味
    heat: 小火
    done:
    - 加入米酒、鹽與冰糖，煮至糖融化、湯味融合。
    flow: 調味起鍋
ing:
  i_chicken:
    suggest: 約 400 公克
  i_water:
    suggest: 約 1500 毫升

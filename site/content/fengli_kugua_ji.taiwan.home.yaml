tag: weekend
tag_note: 主要食譜寫雞肉煮 10 分鐘，再和苦瓜、鳳梨等續煮 25 分鐘，合計 35 分鐘，超過平日能做的時間，所以放在假日做。
card: 雞肉先汆燙，再放入煮滾的水中煮；接著加入白、綠苦瓜、鳳梨、薑和蔥一起煮，最後用米酒、鹽和冰糖調味。湯裡有苦瓜和鳳梨，喝起來清爽，雞肉和苦瓜的樣子原文沒寫。
variant: 台式家常版
intro: 做法照主要食譜，使用雞肉塊、白苦瓜、綠苦瓜和新鮮鳳梨。原文沒寫人份數，也沒寫雞肉部位。
spice:
  mode: separate
  text: 主要食譜沒有加辣椒或花椒，整鍋就是不辣那份。對照做法把辣椒末放在另外準備的沾料裡，可以做好後再分開加；不辣那份不加辣椒末。
  mild: [照主要食譜煮，不加辣椒或花椒。]
  yours: [主要食譜沒有辣椒或花椒；若參考另外的沾料做法，可自行把辣椒末加在自己的沾料裡。]
burners: 用湯鍋在爐上依序煮（推論）；切配可以和汆燙同時準備（推論）。
missing:
  - 汆燙要用多少水、汆燙多久
  - 各步要用什麼火力
  - 雞肉煮好和苦瓜煮好的樣子
  - 調味後要煮多久
  - 鳳梨要怎麼切
  - 上桌的時間和溫度
steps:
  a1:
    heat: 原文沒寫
    time: 原文沒寫
  a4:
    heat: 水煮滾後放入雞肉，接著煮的火力原文沒寫
  a5:
    heat: 原文沒寫
    time: 煮 25 分鐘
  a6:
    time: 煮入味要多久，原文沒寫

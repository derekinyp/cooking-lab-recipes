intro: 黑白胡椒先乾炒出香，再與薑蒜、帶殼大蝦同炒，最後加入米酒和醬油收乾，胡椒香濃、蝦肉彈嫩。
card: 黑白胡椒先不放油乾炒出香，再炒香薑蒜與大蝦，沿鍋邊淋入米酒、醬油收乾，帶出濃郁胡椒香。
variant: 台式家常版
burners: 全程用一口爐和一只炒鍋，依序乾炒胡椒、爆香薑蒜再炒蝦。
spice:
  mode: addon
  text: 主菜以黑白胡椒調味，不含辣椒；想增加辣味，可在炒薑蒜時另加辣椒。
notes:
- 蝦剪開背部取出腸泥，洗淨後擦乾再下鍋。
- 黑白胡椒先乾炒至聞到香氣，再盛起備用。
- 蝦要炒到外殼轉紅、蝦身不透明且乾爽。
compare:
- 這道做法先乾炒黑白胡椒再與蝦同炒；另有以蒜末、少量黑胡椒和醬油快炒的版本，也有人加入辣椒、蒜和蔥花。
steps:
  a1:
    title: 磨胡椒
    done:
    - 磨出黑胡椒與白胡椒備用。
    flow: 磨胡椒
  a2:
    title: 處理蝦與薑
    done:
    - 薑切絲，蝦剪去蝦槍蝦腳、開背去腸，洗淨擦乾。
    flow: 備料
  a3:
    title: 乾炒胡椒
    heat: 小火
    time: 5 分鐘
    done:
    - 不放油乾炒，聞到香氣後盛起。
    flow: 乾炒
  a4:
    title: 爆香薑蒜
    heat: 中火
    time: 2 分鐘
    done:
    - 炒出薑蒜香氣，不要炒焦。
    flow: 爆香
  a5:
    title: 炒蝦
    heat: 大火
    time: 1 分鐘
    done:
    - 蝦殼轉紅、蝦身開始彎曲。
    flow: 炒蝦
  a6:
    title: 加入胡椒與鹽
    heat: 大火
    time: 1 分鐘
    done:
    - 翻炒至胡椒均勻附著蝦身。
    flow: 調味
  a7:
    title: 淋酒收乾
    heat: 大火
    time: 約 4 分鐘
    done:
    - 淋入紹興酒和醬油，炒至蝦身乾爽。
    flow: 收乾
  a8:
    title: 加入蔥花
    done:
    - 下蔥花拌勻即可。
    flow: 收尾

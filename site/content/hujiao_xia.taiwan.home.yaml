tag: weekend
tag_note: 主要食譜標準備 10 分鐘、烹煮 15 分鐘，加起來 25 分鐘，超過平日 20 分鐘，所以放在假日做。
card: 黑、白胡椒不放油用小火乾炒 5 分鐘到聞到香味盛起；中火熱油炒薑和蒜 2 分鐘，下蝦炒 1 分鐘，加胡椒和鹽炒 1 分鐘，沿鍋邊淋酒、加生抽炒約 4 分鐘到蝦乾身，最後下蔥花。
variant: 家常版
intro: 份量和做法照一家醬料品牌香港官網的食譜（來源①，4 人份，大蝦 10 隻）。台灣熱炒店常見的胡椒蝦做法可能不同，這份只照原文記錄。另外兩份胡椒蝦（來源②③）放在下面對照，數字不混在一起用。
spice:
  mode: none
  text: 主要食譜沒有辣椒和花椒，整鍋就是不辣那份；胡椒的辣味是整鍋一起的，沒辦法分開。
  mild: [照食譜做就好。]
  yours: [想吃辣，盛盤後另外加辣椒（原文沒有，份量自己抓）。]
burners: 全程只用 1 口爐、1 只炒鍋依序做（推論）；另一口爐可以做別的菜。
ing:
  i_oil:
    note: 原文的材料表沒列油，也沒寫要放多少
  i_pepper_black:
    note: 原文用品牌的即磨黑胡椒 1 湯匙，現磨就好
  i_garlic:
    note: 原文用瓶裝蒜末 3 茶匙
missing:
  - 油要放多少
  - 蝦有多大、多重
  - 炒蝦以後各步用什麼火
  - 胡椒要磨多粗
compare:
  - 來源②用冷凍白蝦 600 公克、橄欖油 1.5 大匙、蒜末 2 大匙、黑胡椒 1/4 茶匙，加一點糖，蝦只翻炒半分鐘，炒到汁乾、蝦剛熟。
  - 來源③用台灣蝦 1 公斤，加蒜、辣椒、蔥各 50 公克和紹興酒，炒到蝦兩面金黃、汁快乾時撒蔥花和胡椒粉。
notes:
  - 胡椒先不放油乾炒，聞到香味就盛起（原文作法）。
  - 蝦要剪開背部取出蝦腸，洗淨後擦乾再下鍋。
steps:
  a3:
    heat: 小火
    time: 乾炒 5 分鐘到聞到香味
  a4:
    heat: 中火
    time: 炒 2 分鐘
  a5:
    time: 炒 1 分鐘
  a6:
    time: 炒 1 分鐘
  a7:
    time: 炒約 4 分鐘到蝦乾身

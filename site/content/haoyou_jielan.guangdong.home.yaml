intro: 芥蘭汆燙後淋上蠔油，保留青菜清爽的微苦與脆嫩，適合作為家常餐桌上的一道青菜。
card: 汆燙水加入沙拉油和細砂糖，讓芥蘭保持翠綠、減少苦味，起鍋後直接淋上蠔油。
variant: 廣式家常版
burners: 全程用一口爐和一只湯鍋汆燙，洗切芥蘭時可先備好蠔油。
spice:
  mode: none
notes:
- 芥蘭頭尾切齊，整株汆燙；菜梗較粗時可先下鍋，葉片稍後放入。
- 水滾後計時 10 秒，撈起瀝乾再盛盤。
- 細砂糖加入汆燙水，可減少芥蘭苦味。
compare:
- 這道菜以蠔油直接淋在汆燙芥蘭上；也有人把蠔油與高湯、太白粉煮成濃稠醬汁，或先爆香蒜末再煮蠔油醬。
steps:
  a1:
    title: 整理芥蘭
    done:
    - 切齊頭尾，洗淨瀝乾。
    flow: 洗切
  a2:
    title: 燒汆燙水
    heat: 大火
    time: 約 5–8 分鐘
    done:
    - 水滾後加入沙拉油和細砂糖。
    flow: 燒水
  a3:
    title: 汆燙芥蘭
    heat: 大火
    time: 水滾後 10 秒
    done:
    - 菜梗轉翠綠、仍帶脆度時撈起瀝乾。
    flow: 汆燙
  a4:
    title: 淋上蠔油
    done:
    - 蠔油均勻淋在芥蘭上即可。
    flow: 淋醬
ing:
  i_gailan:
    suggest: 約 2 大把
  i_oyster:
    suggest: 約 2 大匙

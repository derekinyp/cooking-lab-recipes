tag: pending
tag_note: 主要食譜沒寫總時間；寫出來的只有水滾 10 秒就撈起，洗菜、燒水要多久原文沒寫，要試做計時。
card: 芥藍頭尾切齊；燒一鍋水，水滾後加沙拉油和糖，放芥藍翻動汆燙，水滾 10 秒後撈起裝盤，淋上蠔油。
variant: 廣式家常版
intro: 份量和做法照楊桃美食網轉載的雜誌食譜（來源①，芥藍 600 公克）。另外兩份蠔油芥藍（來源②③）放在下面對照，數字不混在一起用。
spice:
  mode: none
  text: 三份食譜都沒有辣椒和花椒，整盤就是不辣那份。
  mild: [照食譜做就好。]
  yours: [想吃辣，另外加辣椒（原文沒有，份量自己抓）。]
burners: 只用 1 口爐、1 只湯鍋汆燙，淋蠔油不用開火（推論）；另一口爐可以做別的菜。
ing:
  i_sugar:
    note: 糖是加在汆燙的水裡，原文說加糖汆燙可以去掉苦澀味
  i_oyster:
    note: 原文是直接淋在燙好的芥藍上，不用先煮
missing:
  - 幾人份
  - 燒水、汆燙用什麼火
  - 芥藍要不要切段、切多長
  - 燙好要不要泡冷水
  - 總時間
compare:
  - 來源②把蠔油、雞粉、糖、醬油膏、太白粉和高湯 110㏄ 煮到濃稠做成蠔油芡，芥藍燙過沖冷水保持鮮綠，炒熟後淋芡。
  - 來源③（香港政府的食譜單張）先爆香蒜蓉，下蠔油炒勻、灒酒，加鹽和糖略煮，再澆在煮熟的芥藍上；調味料份量原文沒寫。
notes:
  - 加糖汆燙可以去掉苦澀味（原文提醒）。
steps:
  a2:
    title: 燒一鍋 600 毫升的水，水滾後加入沙拉油和細砂糖
  a3:
    time: 水滾 10 秒後撈起

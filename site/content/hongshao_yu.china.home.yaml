intro: 整尾魚先煎至兩面焦黃，再和蔥、薑、紅辣椒一起燒煮，醬油與砂糖調出鹹甜醬香，適合配白飯。
card: 先把魚煎出焦黃表面，再回鍋與蔥薑辣椒燒煮，讓醬油湯汁收濃裹住魚身。
variant: 家常版
burners: 用一口爐依序煎魚、爆香和燒煮；備料可在熱鍋前完成。
spice:
  mode: separate
  text: 紅辣椒會和蔥、薑一起爆香，想吃不辣可省略紅辣椒；要同鍋分出辣味，可將辣椒另放小碟，起鍋後自行添加。
  mild:
  - 不放紅辣椒，其餘照做。
  hot:
  - 想吃辣，起鍋後另加切好的紅辣椒。
notes:
- 魚身兩側各劃 2 刀，深至骨頭處但不要切斷。
- 煎魚前擦乾表面水分，魚皮較容易煎上色。
- 小火燒至湯汁收乾，期間不時輕推魚身，避免沾鍋。
- 魚肉中心達 63°C 後即可上桌。
steps:
  a1:
    title: 魚身劃刀
    done:
    - 兩側各劃 2 刀，深至骨頭但不切斷。
    flow: 劃刀
  a2:
    title: 準備配料
    done:
    - 蔥切段，薑切絲，紅辣椒去蒂去籽切絲。
    flow: 切配
  a3:
    title: 熱油
    heat: 中火
    done:
    - 油面略冒煙即可放入魚。
    flow: 熱油
  a4:
    title: 煎魚
    heat: 小火
    time: 每面約 2–3 分鐘
    done:
    - 魚身兩面煎至焦黃，起鍋瀝油。
    flow: 煎魚
  a5:
    title: 爆香蔥薑辣椒
    heat: 中火
    time: 約 30–60 秒
    done:
    - 聞到蔥薑香氣即可。
    flow: 爆香
  a6:
    title: 燒魚收汁
    heat: 中火煮滾後轉小火
    done:
    - 湯汁收濃並裹住魚身，魚肉中心達 63°C。
    flow: 燒魚
  a7:
    title: 盛盤
    done:
    - 整尾魚盛盤，淋上鍋中醬汁。
    flow: 盛盤
ing:
  i_fish:
    suggest: 約 1 尾

tag: pending
tag_note: 主要食譜沒寫總時間，也沒寫各步驟要多久；原文沒寫，需試做計時。
card: 整尾魚先劃刀、煎到兩面焦黃，再和蔥、薑、紅辣椒一起爆香，加醬油、細砂糖和水燒煮，直到湯汁收乾。成品魚面焦黃，醬汁裹在魚身上。
variant: 家常版
intro: 魚種、魚重和份數原文沒寫。魚先煎再放回鍋裡燒，魚種不同可能影響煎煮時間（推論）；請看魚面是否焦黃、湯汁是否收乾來判斷。
spice:
  mode: separate
  text: 紅辣椒和蔥、薑一起爆香，之後也和魚同鍋燒煮，不能在最後才從同一鍋分開加。不辣那份要另外做一鍋（推論）。
  mild:
    - 不辣那份省略紅辣椒，其他材料照做（推論）；份量原文沒寫。
    - 若想同時做辣與不辣兩份，先另外煮不辣那份，再把紅辣椒另放小碟，讓要吃辣的人自行添加（推論）。
  yours:
    - 想吃辣就照食譜放紅辣椒；要放多少辣椒，原文沒寫。
burners: 煎魚用平底鍋，燒魚用炒鍋，前後接著做，同一時間只用一口爐（推論）。
missing:
  - 份數、魚種和魚重
  - 煎魚時間
  - 爆香火力和時間
  - 燒煮時間
  - 鍋具種類原文沒寫；平底鍋和炒鍋是家庭改法（推論）
notes:
  - 魚身兩側各劃2刀，劃深至骨頭處但不切斷。
  - 魚以小火煎至兩面焦黃，起鍋稍微瀝油；煎多久原文沒寫。
  - 爆香火力和時間原文沒寫；聞到香氣即可（推論）。
  - 加入醬油、細砂糖和水後，中火煮至水滾，再轉小火；不時剷動魚身以免沾鍋，燒煮時間原文沒寫。
  - 湯汁收乾即可；上桌溫度、食用時限和成品口感原文沒寫。
steps:
  a3:
    heat: 中火
    time: 燒至油略冒煙；多久原文沒寫
  a4:
    heat: 小火
    time: 煎至兩面焦黃；多久原文沒寫
  a5:
    heat: 原文沒寫
    time: 爆香時間原文沒寫
  a6:
    heat: 中火煮至水滾後轉小火
    time: 燒至湯汁收乾；多久原文沒寫

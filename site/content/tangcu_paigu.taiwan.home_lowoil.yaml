intro: 排骨以平底鍋煎上色，再和蔬菜、番茄與酸甜醬炒勻，不用油炸，適合家常配飯。
card: 排骨醃過後用平底鍋煎上色，再和洋蔥、番茄、甜椒及酸甜醬炒勻，少油也有香氣。
variant: 少油家庭版（不油炸）
burners: 平底鍋煎排骨時，可用另一口爐炒蔬菜與醬料；最後合鍋拌勻。
spice:
  mode: addon
  text: 主菜不辣；想吃辣可在起鍋前把紅辣椒片另外拌入一部分。
  mild:
  - 照食譜製作，不加辣椒。
  hot:
  - 起鍋前另取部分排骨與紅辣椒片拌炒。
notes:
- 排骨醃製時可同時洗切蔬菜、調好酸甜醬。
- 煎排骨時分批放入，讓每面都能煎上色。
compare:
- 這個做法用平底鍋煎排骨，少油且不油炸。
- 酸甜醬以檸檬汁帶出果香，不另外勾芡。
steps:
  a0:
    title: 醃排骨
    time: 醃 10～20 分鐘
    done:
    - 排骨與醃料抓勻。
  a1:
    title: 切配蔬菜
    done:
    - 番茄、青椒、甜椒和洋蔥切塊，蔥切段。
  a2:
    title: 煎排骨
    heat: 小火煎，最後轉中大火逼油
    done:
    - 兩面煎上色，最厚處熟透。
  a3:
    title: 炒香配料
    heat: 中火
    done:
    - 洋蔥和蔥白炒出香氣，再放番茄略炒。
  a4:
    title: 拌炒甜椒
    heat: 中大火
    done:
    - 青椒與甜椒炒至顏色鮮亮。
  a5:
    title: 加入排骨與酸甜醬
    heat: 中火
    done:
    - 醬汁煮滾並均勻裹住排骨，試味微調。
  a6:
    title: 加入蔥綠
    heat: 中火
    done:
    - 拌炒均勻即可起鍋。
ing:
  i_rib:
    suggest: 500 公克
  i_onion:
    suggest: 1 顆
  i_gpepper:
    suggest: 1 顆
  i_ypepper:
    suggest: 1 顆
  i_tomato:
    suggest: 2 顆
  i_scallion:
    suggest: 3 根
  i_oil_fry:
    suggest: 約 2 大匙
  i_oil_stir:
    suggest: 約 1 大匙

tag: weekend
tag_note: 原文標 45 分鐘（4 人份），超過平日 20 分鐘。
card: 排骨醃過用平底鍋煎上色，不油炸，和蔬菜、酸甜醬炒勻。
spice:
  mode: addon
  text: 這個少油版的主要食譜沒有辣椒，整份不辣，可以直接當不辣那份。
  mild: [照食譜做，不另外加。]
  yours: [最後在你那份加紅辣椒片（勞動部原版有紅辣椒；這裡沒有份量）。]
burners: 平底鍋煎排骨，同時用炒鍋炒蔬菜。
missing:
  - 排骨要醃多久
  - 煎排骨用多少油、煎多久、怎麼看熟
  - 炒蔬菜用什麼火、切多大塊
  - 上桌溫度
compare:
  - 勞動部原版是排骨沾乾粉下油鍋炸，醬汁是自選調味；這頁照你選的少油版用平底鍋煎，原版只留作對照。
  - 主要食譜用檸檬汁代替白醋，也沒有另外勾芡。

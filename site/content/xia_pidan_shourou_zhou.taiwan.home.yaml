tag: weekend
tag_note: 原文標 60 分鐘（泡米半小時、下米後小火 25 分鐘、再 5 分鐘）；炒蝦殼和煮湯底的時間另外算，要試做計時。
card: 蝦殼和鹹蛋黃炒香煮成湯底，生米直接下鍋煮成粥，再下皮蛋、豬肉片和蝦仁，一只湯鍋做到底。
variant: 蝦殼鹹蛋黃湯底・湯鍋一鍋到底
intro: 先用湯鍋把蝦頭、蝦殼和鹹蛋黃炒香，加水煮成湯底後撈掉殼；再下泡過的生米蓋鍋小火煮成粥，最後下皮蛋、豬肉片、蝦仁和青江菜。
spice:
  mode: none
  text: 原文沒有辣椒和花椒，整鍋就是不辣那份。胡椒是最後才撒的，可以各自在碗裡加。
  mild: [醃蝦仁的白胡椒可以省；最後的胡椒不加。]
  yours: [盛碗後自己撒胡椒（白胡椒或黑胡椒都可以）。]
burners: 全程只用 1 口爐、1 只湯鍋。
ing:
  i_shrimp:
    suggest: 帶殼約 8 隻（來源④）。原文的 150 克是剝好的蝦仁重；殼和頭要留著煮湯，所以買帶殼蝦
  i_yolk:
    suggest: 2 顆（照來源③的米和蛋黃比例）；怕太鹹用 1 顆
  i_pork:
    suggest: 約 300 公克（照來源⑥的米和肉比例），看包裝標重就好
  i_pork_sauce:
    suggest: 醬油 2 大匙，醃 10 分鐘（來源⑧）
  i_oil:
    suggest: 2 大匙，分兩次下：先炒殼，再補油炒蛋黃（來源③）
  i_wine:
    suggest: 1 大匙（來源③）
  i_ginger:
    suggest: 4 片（來源③）
  i_salt:
    note: 鹹蛋黃和醃肉醬油都帶鹹，先下一半，試過味道再補
missing:
  - 豬肉、醃肉醬油、鹹蛋黃、炒殼的油、米酒、薑的量（主要食譜沒有這幾樣，上面附了建議值）
  - 炒蝦殼要多久、兩次下油各多少
  - 蝦仁要醃多久、青江菜要煮多久
  - 粥煮好是什麼樣子（主要食譜沒寫，這頁用「米粒開花」當參考）
  - 湯鍋要多大：水有 1350 毫升，再加米和料，粥滾時會冒泡要攪拌，建議用明顯大於這個量、還留得出攪拌空間的鍋（推論）
notes:
  - 米要先洗好、泡水半小時；泡米的水不算在 1350 毫升裡。
  - 量米用電鍋附的量米杯：白米 1 米杯、水 7½ 米杯（1 米杯是 180 毫升）。
  - 煮粥時要不時攪拌，避免黏鍋。
  - 皮蛋用剪的剪成塊，比較不黏刀。
  - 炒蝦殼也可以改用炒鍋：另一只炒鍋把蝦頭煎香、加熱水煮約 5 分鐘，再把湯倒回湯鍋（另一份食譜的做法）。
steps:
  a6:
    tips: [炒鍋替代做法：用炒鍋炒蝦殼、加熱水煮約 5 分鐘，再把湯倒回湯鍋。]

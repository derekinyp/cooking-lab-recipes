intro: 蝦頭與蝦殼先炒香，再和鹹蛋黃煮成湯底；泡過的白米在同一鍋煮成粥，最後加入皮蛋、豬肉片、蝦仁和青江菜。
card: 蝦殼與鹹蛋黃炒香煮成鮮味湯底，泡過的生米直接入鍋煮粥，最後加入皮蛋、豬肉片、蝦仁和青江菜。
variant: 蝦殼鹹蛋黃湯底・湯鍋一鍋到底
burners: 全程用一口爐和一只湯鍋；泡米與切配時可先備好其他材料。
spice:
  mode: addon
  text: 粥底不辣；胡椒粉可在盛碗後各自加入，醃蝦仁的白胡椒也可省略。
notes:
- 白米洗淨後泡水半小時，泡米水不計入煮粥用水。
- 煮粥時不時攪拌，避免米粒黏鍋。
- 皮蛋用剪刀剪成塊，較不容易黏刀。
steps:
  a6:
    title: 炒香蝦殼
    heat: 大火
    done:
    - 蝦殼變色並散出香氣，輕壓蝦頭可擠出蝦膏。
    flow: 炒蝦殼
  a7:
    title: 炒香鹹蛋黃
    heat: 中小火
    done:
    - 鹹蛋黃炒出泡沫。
    flow: 炒蛋黃
  a8:
    title: 煮蝦殼湯底
    done:
    - 湯汁煮滾後撈出蝦頭與蝦殼。
    flow: 煮湯底
  a9:
    title: 煮粥
    heat: 小火
    time: 蓋鍋小火煮 25 分鐘
    done:
    - 米粒膨開、熟透軟化。
    tips:
    - 煮的過程不時攪拌，避免黏鍋。
    flow: 煮粥
  a10:
    title: 加入皮蛋、豬肉與蝦仁
    heat: 小火
    time: 蓋鍋小火煮 5 分鐘
    done:
    - 豬肉與蝦仁變色熟透。
    flow: 煮熟配料
  a11:
    title: 加入青江菜調味
    done:
    - 青江菜轉深綠、菜梗稍軟；試味後再補鹽。
    flow: 調味

tag: pending
tag_note: 複製醬油可以前一天做；當天煮肉要多久原文沒寫，要試做計時。
card: 帶皮豬肉煮熟切薄片，拌上蒜泥味汁的冷盤。紅油用市售辣椒油。
tool_alts:
  tool/stock_pot: 沒有湯鍋時，可以用炒鍋
tools:
  tool/spice_bag: 香料包（可買滷包袋）
spice:
  mode: addon
  text: 原文的蒜泥味汁是整碗加辣椒油。照你的決定，紅油直接用市售辣椒油；這頁改成辣椒油只加在你那份。
  mild: [用複製醬油、芝麻油、蒜泥拌一份不加辣椒油的味汁。]
  yours: [你那份照原文加市售辣椒油（整份用量 35 克）。這道菜沒有花椒粉這類麻的配料。]
burners: 複製醬油前一天做；當天只有煮肉用 1 口爐。
missing:
  - 幾人份（只寫豬肉 165 克）
  - 煮肉、泡肉各要多久，怎麼看剛熟
  - 香料包什麼時候拿出來、醬油要不要過濾
  - 複製醬油可以放多久
notes:
  - 紅油照你 11 月 20 日的決定，直接買市售辣椒油，不自己煉。
  - 肉片要切得很薄、皮肉連在一起，這是最難的一步。

intro: 帶皮豬肉煮熟後泡在原湯裡，再切成薄片拌蒜泥味汁，蒜香濃、酸甜鹹辣，是適合聚餐分享的冷盤。
card: 帶皮豬肉煮熟後泡原湯回溫，再切成皮肉相連的薄片，拌上蒜泥味汁與市售辣椒油。
variant: 四川傳統風味
burners: 當天用一口爐煮肉，煮好後泡在原湯中回溫；複製醬油先行備妥。
spice:
  mode: addon
  text: 先將蒜泥味汁分成兩份，不辣的那份不加辣椒油；另一份拌入市售辣椒油。
  mild:
  - 蒜泥味汁不加辣椒油。
  hot:
  - 另一份蒜泥味汁拌入市售辣椒油。
notes:
- 豬肉煮熟後留在原湯中泡至溫熱，再撈起切片。
- 肉片盡量切薄，讓豬皮和瘦肉保持相連。
- 墊底蔬菜可選蔥、小黃瓜或青筍。
steps:
  w1:
    title: 煮豬肉
    heat: 中火
    done:
    - 煮至中心至少 63°C，肉剛熟。
  w2:
    title: 原湯浸泡
    done:
    - 豬肉泡在原湯中至溫熱後撈起。
  w3:
    title: 切薄片
    done:
    - 切成厚薄均勻、皮肉相連的薄片。
  w4:
    title: 拌味汁
    done:
    - 肉片與蒜泥味汁拌勻。
  w5:
    title: 盛盤
    done:
    - 可用蔥、小黃瓜或青筍墊底。
tool_alts:
  tool/stock_pot: 沒有湯鍋時，可用炒鍋煮肉。
tools:
  tool/spice_bag: 香料包可裝入滷包袋。

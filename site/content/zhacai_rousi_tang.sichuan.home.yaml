card: 豬肉切絲、榨菜切細絲，泡過水後先汆熟撈起，再用汆過食材的湯撈除浮沫，最後把肉絲和榨菜放回湯裡調味。成品是清湯，肉絲嫩、榨菜脆；這些成品描述出自待核草稿，原文沒寫。
variant: 川式家常版
intro: 目前存檔無法核實這份食譜的完整做法和份量，以下內容是待核草稿所記的流程，不代表來源已確認。
burners: 草稿記載用湯鍋完成；改用家裡的湯鍋是家庭改法（推論）。
missing:

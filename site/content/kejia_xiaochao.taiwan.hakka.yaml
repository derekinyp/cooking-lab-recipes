tag: weekend
tag_note: 主要食譜標 30 分鐘，超過平日 20 分鐘；乾魷魚泡發要多久原文沒寫（另一份食譜寫約 30 分鐘），實際會更久。
card: 五花肉乾鍋煸出油，下豆干煸到金黃，再炒魷魚和蒜片，加糖、胡椒、蠔油、醬油、米酒翻炒，最後下芹菜和蔥段，起鍋前鍋邊嗆烏醋。
variant: 台灣客家家常版
intro: 份量和做法照一份有完整份量的客家小炒食譜（來源①，5 人份）。另外兩份（來源②③）放在下面對照，數字不混在一起用。全程只用一只炒鍋，沒有烤箱、氣炸鍋或蒸籠的步驟。
spice:
  mode: addon
  text: 主要食譜的辣椒是和芹菜、蔥段一起拌炒，這頁改成先盛出不辣那份，鍋裡剩下的才加辣椒，一鍋兩吃。這是改法（推論），原文沒有分開做。
  mild: [芹菜和蔥段拌勻後先盛出不辣那份，不放辣椒；起鍋前的烏醋照原文放。]
  yours: [鍋裡剩下的加辣椒炒熟（原文整道用 10 克，你那份放多少要自己抓）。這道菜沒有花椒。]
burners: 全程用 1 口爐、1 只炒鍋依序做（推論，原文沒寫爐口）；乾魷魚先在碗裡泡著，不用開火。
ing:
  i_squid:
    note: 原文寫的是泡發好的乾魷魚重量，泡多久沒寫；另一份食譜（來源③）把魷魚逆紋剪小條，用冷水泡約 30 分鐘
  i_garlic:
    note: 原文寫「蒜片 1 克」，量很少，數字照原文
  i_sugar:
    note: 原文只寫「1 匙」，沒說是大匙還是小匙，照原文不換算
  i_pepper:
    note: 原文只寫「1 匙」，沒說是大匙還是小匙，照原文不換算
  i_vinegar:
    note: 起鍋前才從鍋邊嗆進去
missing:
  - 魷魚泡水要泡多久
  - 肉、豆干、魷魚怎麼切（原文只寫「所有食材備便」）
  - 每一步用什麼火、要多久（只有來源③寫中火煸五花肉）
  - 糖、胡椒的「1 匙」是大匙還是小匙
  - 煮好的顏色和口感
compare:
  - 來源②先把五花肉炒到金黃起鍋，豆干和蒜煸香後再回鍋合炒，醬料的蠔油用 2 大匙，炒到鍋底收乾。
  - 來源③是出版書的摘錄：五花肉切成約 1 公分寬的小條，用中火乾鍋煸香，調味後上蓋悶一下，還有蒜苗；主要食譜沒有蒜苗。
notes:
  - 乾魷魚要提前泡軟，所以這是假日菜。
  - 五花肉先用乾鍋煸，會自己出油，不另外放油（原文沒寫油）。
  - 烏醋最後才從鍋邊嗆進去，不要太早放。
steps:
  a3:
    heat: 原文沒寫火力（來源③寫中火）
  a9:
    tips: 起鍋前才從鍋邊嗆少許烏醋，聞到醋香就可以盛盤。

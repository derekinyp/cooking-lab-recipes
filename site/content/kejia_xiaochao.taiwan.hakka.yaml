intro: 五花肉乾鍋煸出油脂，再與豆乾、魷魚和蒜片炒香，最後用芹菜、蔥段與鍋邊烏醋收尾，鹹香下飯。
card: 五花肉乾鍋煸出油脂，豆乾煸到金黃，再炒魷魚和蒜片；醬料炒勻後下芹菜、蔥段，最後鍋邊嗆烏醋。
variant: 台灣客家家常版
burners: 全程用 1 口爐和 1 只炒鍋；魷魚先泡軟，其他食材切好後依序快炒。
spice:
  mode: addon
  text: 先盛出不辣的份量，再把辣椒放進鍋中與剩下的菜炒香。
  mild:
  - 芹菜和蔥段拌炒後，先盛出不加辣椒的份量。
  hot:
  - 鍋中剩下的菜加入辣椒炒香。
notes:
- 乾魷魚剪成小條後先泡軟，瀝乾再下鍋。
- 五花肉以乾鍋煸出油脂，不必另外加油。
- 烏醋在起鍋前從鍋邊加入，香氣較明顯。
steps:
  a1:
    title: 泡軟魷魚
    done:
    - 魷魚泡軟後瀝乾。
    flow: 泡軟瀝乾
  a2:
    title: 切配食材
    done:
    - 五花肉、豆乾與魷魚切條；芹菜、蔥切段，蒜切片。
    flow: 切配
  a3:
    title: 煸香五花肉
    heat: 中火
    done:
    - 五花肉出油，表面略上色。
    flow: 煸出油脂
  a4:
    title: 煸豆乾
    heat: 中大火
    done:
    - 豆乾表面呈金黃色。
    flow: 煸至金黃
  a5:
    title: 炒魷魚與蒜片
    heat: 中大火
    done:
    - 聞到魷魚與蒜片香氣。
    flow: 炒出香氣
  a6:
    title: 加入調味料
    heat: 中火
    done:
    - 食材均勻裹上調味，香氣升起。
    flow: 炒勻嗆香
  a7:
    title: 加入芹菜與蔥
    heat: 中大火
    done:
    - 芹菜轉鮮綠，蔥段均勻裹上鍋料。
    flow: 拌炒蔬菜
  a8:
    title: 分開加辣
    heat: 中大火
    done:
    - 辣椒炒出香氣。
    flow: 辣味另炒
  a9:
    title: 鍋邊嗆烏醋
    heat: 中大火
    done:
    - 聞到烏醋香氣即可起鍋。
    flow: 嗆醋起鍋
ing:
  i_squid:
    suggest: 乾魷魚剪小條後泡軟
  i_garlic:
    suggest: 少量蒜片
  i_sugar:
    suggest: 1 匙
  i_pepper:
    suggest: 1 匙
  i_vinegar:
    suggest: 1 大匙

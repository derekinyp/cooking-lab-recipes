# 收錄進度頁用（中性內容）。累計數字是計畫值；實際數字由程式從食譜檔計算。
target: 120
intro: 食譜庫先收 120 道家常菜，每週新增 10 道；之後並列收錄中華八大菜系的核心料理和歐美各國的經典料理，再逐步擴展到其他地區。每道菜都用同一套格式記錄材料、份量、做法和出處，累積後可以跨菜系比較。
weeks:
  - {week: 2026 第 48 週, theme: 第一批家常菜, plan: 25}
  - {week: 2026 第 49 週, theme: 台式平日快炒, plan: 35}
  - {week: 2026 第 50 週, theme: 電鍋菜與湯, plan: 45}
  - {week: 2026 第 51 週, theme: 燉、滷、燒, plan: 55}
  - {week: 2026 第 52 週, theme: 麵飯主食, plan: 65}
  - {week: 2026 第 53 週, theme: 中式各地常見家常菜, plan: 75}
  - {week: 2027 第 1 週, theme: 西式家常菜, plan: 85}
  - {week: 2027 第 2 週, theme: 台式年菜與宴客家常, plan: 95}
  - {week: 2027 第 3 週, theme: 海鮮、蔬菜、涼拌, plan: 105}
  - {week: 2027 第 4 週, theme: 粵式家常, plan: 115}
  - {week: 2027 第 5 週, theme: 補齊還沒收到的做法和味道, plan: 120}
after:
  - 120 道家常菜之後，主軸是中華八大菜系的核心料理和歐美各國的經典料理，兩條線並列優先。
  - 每週 10 道：八大菜系 6 道、歐美經典 4 道。
  - 八大菜系兩個一組輪流：川菜和魯菜 → 粵菜和蘇菜 → 浙菜和閩菜 → 湘菜和徽菜，每週每個菜系 3 道，每系先收 20 道核心菜。
  - 歐美經典一週一國輪流：義大利 → 法國 → 西班牙 → 英國和美國 → 德國和奧地利 → 希臘、葡萄牙等，先收約 100 道。
  - 兩條線大約同時收完之後，再依序擴展到日本、韓國、東南亞、印度、中東、墨西哥和拉丁美洲、非洲，並補上八大菜系以外的中國地方菜。
  - 需要烤箱的經典菜照樣收錄給比較用，頁面會標明家裡的爐具做不做得到。

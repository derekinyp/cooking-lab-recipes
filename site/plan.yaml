# 內部規劃用，網站不顯示。已不再用「每週 10 道」與週主題，批次內容見規劃文件。
target: 120
west_target: 100
# 第三階段（歐美經典）的菜系代碼；食譜檔的菜系屬於這些的，歸「歐美經典」，不算進 120 道中式家常菜
west_cuisines: [cuisine/italian, cuisine/french, cuisine/american, cuisine/spanish, cuisine/british, cuisine/german, cuisine/greek, cuisine/portuguese]
after:
  - 第二階段：中華八大菜系經典菜。川、魯、粵、蘇、浙、閩、湘、徽，每個菜系先收 20 道核心經典，共 160 道。
  - 之後每批 10 道，兩個菜系各 5 道，兩兩一組輪流：川菜和魯菜 → 粵菜和蘇菜 → 浙菜和閩菜 → 湘菜和徽菜，四輪共 16 批。
  - 第三階段：歐美經典菜約 100 道，一週一國輪流：義大利 → 法國 → 西班牙 → 英國和美國 → 德國和奧地利 → 希臘、葡萄牙等。已經收進來的歐美菜算在這 100 道裡。
  - 各階段都不收甜點和烘焙（蛋糕、麵包、甜湯、糕點等）。
  - 需要烤箱的鹹味經典菜照樣收錄給比較用，頁面會標明家裡的爐具做不做得到。
  - 三個階段都完成後，再依序擴展到日本、韓國、東南亞、印度、中東、墨西哥和拉丁美洲、非洲，並補上八大菜系以外的中國地方菜。

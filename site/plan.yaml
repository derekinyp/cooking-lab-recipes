# 第三階段（歐美經典）的菜系代碼；食譜檔的菜系屬於這些的，歸「歐美經典」，不算進 120 道中式家常菜
west_cuisines: [cuisine/italian, cuisine/french, cuisine/american, cuisine/spanish, cuisine/british, cuisine/german, cuisine/greek, cuisine/portuguese]
intro: 食譜庫分三個階段依序收錄：先收 120 道中式家常菜（含台式），每週新增 10 道；接著收中華八大菜系的經典菜；最後收歐美各國經典菜約 100 道。之前已經收進來的歐美菜保留在庫裡，歸到歐美經典，不算進 120 道。每道菜都用同一套格式記錄材料、份量、做法和出處，累積後可以跨菜系比較。
weeks:
  - {week: 2026 第 48 週, theme: 第一批家常菜, plan: 21}
  - {week: 2026 第 49 週, theme: 台式平日快炒, plan: 31}
  - {week: 2026 第 50 週, theme: 電鍋菜與湯, plan: 41}
  - {week: 2026 第 51 週, theme: 燉、滷、燒, plan: 51}
  - {week: 2026 第 52 週, theme: 麵飯主食, plan: 61}
  - {week: 2026 第 53 週, theme: 中式各地常見家常菜, plan: 71}
  - {week: 2027 第 1 週, theme: 蛋、豆腐、素菜與涼拌, plan: 81}
  - {week: 2027 第 2 週, theme: 台式年菜與宴客家常, plan: 91}
  - {week: 2027 第 3 週, theme: 海鮮、蔬菜與其他, plan: 101}
  - {week: 2027 第 4 週, theme: 粵式家常, plan: 111}
  - {week: 2027 第 5 週, theme: 點心、甜品與補缺口, plan: 120}
after:
  - 第二階段：中華八大菜系經典菜。川、魯、粵、蘇、浙、閩、湘、徽，每個菜系先收 20 道核心經典，共 160 道。
  - 每週 10 道，兩個菜系各 5 道，兩兩一組輪流：川菜和魯菜 → 粵菜和蘇菜 → 浙菜和閩菜 → 湘菜和徽菜，四輪共 16 週。
  - 第三階段：歐美經典菜約 100 道，一週一國輪流：義大利 → 法國 → 西班牙 → 英國和美國 → 德國和奧地利 → 希臘、葡萄牙等。已經收進來的歐美菜算在這 100 道裡。
  - 需要烤箱的經典菜照樣收錄給比較用，頁面會標明家裡的爐具做不做得到。
  - 三個階段都完成後，再依序擴展到日本、韓國、東南亞、印度、中東、墨西哥和拉丁美洲、非洲，並補上八大菜系以外的中國地方菜。

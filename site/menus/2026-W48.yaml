    items:
      - {day: 週六 11/28 早午餐, slug: xia_pidan_shourou_zhou, why: 原文標 60 分鐘（泡米半小時、小火 25 分鐘、再 5 分鐘）, spice: 不辣, burners: 1 口爐、1 只湯鍋}
      - {day: 週六 11/28 晚餐, slug: yanduxian, why: 光燉就要半小時、再 20 分鐘、最後 5 分鐘, spice: 不辣, burners: 1 口爐、1 只湯鍋}
      - {day: 週六 11/28 晚餐, slug: qingzheng_yu, why: 原文標準備 30 分鐘、料理 10 分鐘, spice: 不辣；想吃辣的那份另加辣椒, burners: 電鍋蒸魚不佔爐口；最後用平底鍋燒熱油，加上醃篤鮮剛好 2 口爐}
      - {day: 週日 11/29 午餐, slug: gaolicai_fan, new: true, why: 主要食譜標 30 分鐘（小火 15 分鐘、再悶 10 分鐘），還要先泡米, spice: 不辣, burners: 1 口爐、1 只湯鍋}
      - {day: 週日 11/29 晚餐, slug: tangcu_paigu, why: 原文標 45 分鐘, spice: 不辣；想吃辣的那份另加紅辣椒片, burners: 平底鍋煎排骨、炒鍋炒蔬菜，2 口爐}
skipped:
  - 麻婆豆腐：也要另做不辣那份，一週排一道這種菜就好。
  - 蒜泥白肉：要前一天先做複製醬油，當天煮肉多久原文沒寫。
  - 滷肉飯：週日已經有高麗菜飯，兩道飯不重複。
  - 法式胡椒牛排、班尼迪克蛋、波隆那肉醬寬麵：時間長或步驟多，留到之後。

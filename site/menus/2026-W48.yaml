week: 2026 第 48 週
range: 11/23（一）– 11/29（日）
intro: 這週 10 道：平日 5 道、假日 5 道。平日只排原文標 20 分鐘內、或步驟少的菜；要 30 分鐘到 1 小時以上的排假日。整週同一時間最多用 2 口爐，只用電鍋、炒鍋、平底鍋、湯鍋。
rules:
  - 原文標 20 分鐘的（白醬義大利麵、三杯雞）排在週前段；原文沒寫總時間、要試做計時的（宮保雞丁、乾煸四季豆、菜脯蛋）排在後段。
  - 宮保雞丁本身麻辣，另外做一份不辣不麻的；其他 9 道整份不辣，想吃辣的那份最後再加。
  - 新菜高麗菜飯排在週日：主要食譜標 30 分鐘，還要先泡米。
sections:
  - name: 平日
    kind: weekday
    items:
      - {day: 週二 11/24, slug: pasta_bianca, why: 原文標 20 分鐘；第一次做燒水可能多花一點時間, spice: 不辣, burners: 平底鍋做白醬、湯鍋煮麵，再用炒鍋炒料；同時最多 2 口爐}
      - {day: 週三 11/25, slug: sanbei_ji, why: 原文標 20 分鐘，平日勉強可以, spice: 主鍋不放辣椒，想吃辣的那份最後加辣椒片, burners: 1 口爐、1 只炒鍋}
      - {day: 週四 11/26, slug: gongbao_jiding, why: 原文沒寫總時間，要試做計時；材料先備好，開火後很快, spice: 兩份：一份照食譜，另一份不放乾辣椒和花椒, burners: 1 只炒鍋，先做不辣那份、再做麻辣那份}
      - {day: 週五 11/27, slug: ganbian_sijidou, why: 原文沒寫總時間，要試做計時；少油版只用一只平底鍋, spice: 整份不辣，想吃辣的那份起鍋後加辣椒油或花椒粉, burners: 1 口爐、1 只平底鍋}
      - {day: 週五 11/27, slug: caipu_dan, why: 原文沒寫總時間，要試做計時；步驟少，當配菜, spice: 整份不辣, burners: 另一口爐、另一只鍋；和乾煸四季豆同時做剛好 2 口爐}

# 滑蛋蝦仁（廣式家常版）— 起始草稿，規格 v1.0
# 主來源 M＝My School HK〈滑蛋蝦仁〉：蝦仁、蛋、蔥、醃料、蛋液調味、兩段火力與完成狀態只用 M 的數字，不混拼。
# S1、S2 僅進比較表與 notes；來源沒寫的數字一律 null＋status: missing，不補、不估、不換算。
schema_version: "1.0"
recipe:
  id: huadan_xiaren.guangdong.home
  version: "1.0"
  kind: dish
  dish_concept: dish/huadan_xiaren
  name: {zh_hant: 滑蛋蝦仁, zh_hans: 滑蛋虾仁, en: Scrambled eggs with shrimp (Cantonese)}
  variant: 廣式家常版
  summary: 蝦仁去腸抹乾，用鹽、白胡椒粉、太白粉醃過；大火炒至八成熟盛起待涼，拌入加了鹽與太白粉的蛋液；燒熱油鑊轉小火快炒至蛋液凝固，放上蔥成菜。
  cuisine:
    - {id: cuisine/yue, basis: "編者分類（推論）：本庫把滑蛋蝦仁列在粵式家常；主來源 M 是香港親子食譜網站，來源沒有主張菜系"}
    - {id: region/hongkong, basis: "編者分類（推論）：主來源 M 為香港食譜網站；網站所在地不證明料理地域歸屬"}
  flavor_template: {ref: flavor/xian_xian, basis: "鹽、白胡椒調味，突出蝦與蛋本味（對照味型範本）", evidence: M}
  servings: {value: 4, status: sourced, evidence: M, note: "M 標『材料: (4人份)』"}
  status: cross_checked
  sources:
    - id: M
      title: "My School HK〈滑蛋蝦仁（4個更好吃的小秘訣）〉"
      url: https://www.myschool.hk/Recipes/Stir-fried-shrimp-and-eggs
      level: C
      type: web
      accessed: 2026-11-27
      note: "主來源。4人份；海蝦 6兩、雞蛋 5隻、蔥 少許；調味料（入蛋液）鹽 1/2 茶匙、生粉 少許；醃料鹽 1/2 茶匙、白胡椒粉 1/2 茶匙、生粉 1/2 茶匙；兩次下油各約1湯匙。作法六步：雞蛋打勻備用；蝦仁去腸洗淨抹乾加入醃料；燒熱鑊下油約1湯匙大火炒蝦仁至八成熟盛起待涼；蝦仁放入打好的蛋液加調味料拌匀；燒熱油鑊下油約1湯匙倒入蝦仁蛋液轉小火快速炒至蛋液凝固盛起；放上蔥即成。貼士：①下蛋液後轉小火快手不停炒；②稍炒後可先離火再炒幾下到自己心水的滑度；③蛋液加少許生粉可減少出水；④白胡椒粉可去蝦腥味。"
    - id: S1
      title: "楊桃美食網〈滑蛋蝦仁(8)〉（B03-0796）"
      url: https://www.ytower.com.tw/recipe/B03-0796
      level: C
      type: web
      accessed: 2026-11-27
      note: "對照（蝦仁先汆燙至熟、再拌入蛋液路線，無蝦仁醃料）。蝦仁150克、雞蛋8顆、金針菇50克、蔥花30克、太白粉水1大匙、香油2大匙；調味料鹽1小匙、糖1小匙、味醂1大匙、米酒1大匙、白胡椒粉少許。作法：金針菇切段、雞蛋打散；滾水將蝦仁去腸泥洗淨汆燙至熟撈起；調味料與太白粉水、香油拌勻，再加蔥花、蛋液、金針菇段、蝦仁拌勻；熱油鍋加少許沙拉油，倒入蝦仁蛋液慢慢翻炒至蛋液略凝固後關火盛盤。份數、火力、時間原文沒寫。"
    - id: S2
      title: "〈滑蛋蝦仁〉，出處《教瑪麗亞作菜》（楊桃美食網轉載，B04-036）"
      url: https://www.ytower.com.tw/recipe/B04-036
      level: B
      type: book
      accessed: 2026-11-27
      note: "對照（勾芡後淋蛋液的滑溜芡路線）。網頁標示示範者與出版書名，原書未直接翻閱，份量與做法均從網頁原文讀到。蝦仁20尾、毛豆仁1杯、蛋1個、蒜末1大匙；調味料1 鹽1小匙；調味料2 鹽2小匙、糖1/3大匙、白胡椒粉1小匙、香油2小匙；調味料3 水1杯；調味料4 太白粉1/2大匙、水2大匙。作法：蝦仁牙籤挑腸泥洗淨擦乾；毛豆仁加少許鹽汆燙1～2分鐘沖涼；蛋打勻；起油鍋爆香蒜末，下蝦仁、毛豆仁翻炒至半熟；加水1杯煮沸加調味料(2)煮至熟透；調味料(4)太白粉水調勻勾芡；倒入蛋液快速拌勻至略熟盛起。頁面備註：『蛋多、油多，才滑得出軟嫩的口感；蛋稍凝固即熄火，再以餘溫炒熟即可』。份數、火力原文沒寫。"

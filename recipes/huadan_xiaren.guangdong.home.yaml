  completion:
    - {observe: 上桌溫度與食用時限, target: 原文沒寫, method: null}
  sensory_target: {texture: "M 貼士強調蛋滑嫰；具體口感形容原文沒寫", taste: 原文沒寫, color: 原文沒寫}

notes:
  weekday: "原文沒寫總時間，待試做計時：M 無任何分鐘數；可見加熱步驟為大火炒蝦仁至八成熟、小火快炒蛋液至凝固，各步時間原文沒寫。對照 S1 無時間、S2 僅毛豆仁汆燙 1～2 分鐘（不同食譜，只作參考）。平日能不能做，待試做計時。"
  burners: "全程最多 1 口爐、1 只炒鍋：先大火炒蝦仁盛起待涼，再同鍋（或另鍋）小火炒蛋（M 步驟 3、5 先後進行；同鍋先後為推論）。爐口安排是家庭安排（推論），原文沒寫爐口數。"
  oven_airfryer: "M、S1、S2 皆未用烤箱、氣炸鍋或蒸籠；M 用鑊（炒鍋），家庭廚具已備，無需家庭改法。"
  spicy_split: "三份來源都沒有辣椒、花椒、辣豆瓣；白胡椒粉用於醃蝦仁去腥（M 貼士四），不是麻辣配料。主體整鍋即不辣那份，無需分流；若要分碗，白胡椒可改最後各自在碗裡加（推論，M 原文是下醃料）。"
  no_scale: "無秤版：蝦仁 6 兩看包裝標重或以次數估量（推論，原文沒寫量具）；茶匙、湯匙照 M 原文單位，不換算克數。"
  pot_size: "炒鍋容量原文沒寫；已知雞蛋 5 隻、蝦仁 6 兩，建議用裝得下並能翻拌蛋液的鍋（推論，無來源數字）。"
  compare: "S1 路線：蝦仁汆燙至熟再拌入蛋液，無蝦仁醃料，另加金針菇、蔥花、香油、味醂、米酒。S2 路線：先勾芡再淋蛋液（滑溜芡），全菜僅 1 個蛋，另加毛豆仁、蒜末。"
  decisions: "主來源選 M（My School HK）：三份中唯一同時列出蝦仁醃料、蛋液調味、兩段火力（大火／小火）與完成狀態（八成熟、凝固、心水滑度）的版本；主體份量只用 M 數字，S1、S2 僅進比較表與本節 note。"
  missing: "原文沒寫：醃料醃漬時間；炒蝦仁時間；炒蛋時間；總製作時間；蝦仁大小與是否去殼購買；油溫；蔥的切法；八成熟與滑嫩的具體色澤／口感標準；成品色澤；上桌溫度與食用時限；鍋具容量。"
  spec_gaps: "「生粉」在 M 同時用於醃料與蛋液，粉水比例原文沒寫；「少許」無標準量；兩次下油拆成兩條食材記錄；網頁貼士無專屬欄位，寫在 action note 與 serving sensory_target。"

  - {id: s_final, label: 麻婆豆腐, role: final}

actions:
  - id: m1
    technique: tech/cut
    term: 豆腐切大丁
    inputs: [m_tofu]
    outputs: [s_tofu_cut]
    tool: tool/knife
    params: {cut: {shape: cut/ding_large, size_mm: {min: null, max: null}, raw: "豆腐切成大丁", evidence: S1, note: "標準未給毫米"}}
    completion: [{observe: 豆腐, target: 切成大丁, method: null, evidence: S1}]
  - id: m2
    technique: tech/wash_soak
    term: 放入有食鹽的沸水中浸泡
    inputs: [s_tofu_cut, m_salt_soak, m_water_soak]
    outputs: [s_tofu_soaked]
    tool: tool/stock_pot
    params:
      duration:
        min_s: 60
        max_s: 120
        raw: null
        is_guide: true
        evidence: null
        status: inferred
      temperature: {target: liquid, min_c: null, max_c: null, raw: "表 4：保持一定的溫度（未給度數）", evidence: S1}
      heat:
        level: heat/low
        raw: null
        evidence: null
    completion:
      - observe: 豆腐
        target: 豆腐丁浸入鹽水後撈起瀝乾，表面完整、不散開。
        method: 目測
        evidence: null
    can_overlap: [m3, m4, m5, m6, m7]
    note: "家庭安排（非原文，原文沒規定爐口數與保溫方法）：這一鍋保溫浸泡佔 1 口，炒鍋佔 1 口，合計 2 口。同一只炒鍋依序用：先炒牛肉臊子（m4）盛起，之後才開始 m6 燒油、m7 炒香；補寫依據：沸水加入豆腐後轉小火保溫浸泡，依一般家庭做法浸泡 1–2 分鐘去除豆腥味。"
  - id: m5
    technique: tech/cut
    term: 蒜苗切馬耳朵形或長約 3 cm 的節
    inputs: [m_garlic_sprout]
    outputs: [s_garlic_sprout_cut]
    tool: tool/knife
    params: {cut: {shape: cut/segment, size_mm: {min: null, max: null}, raw: "切成馬耳朵形或長約 3cm 的節", evidence: S1, note: "原文是『長約 3cm』的近似值，不寫成固定毫米上下限；另一選項馬耳朵形（cut/ma_er_duo）原文未給尺寸"}}
    completion: [{observe: 蒜苗, target: 馬耳朵形或約 3 cm 的節, method: 目測, evidence: S1}]
  - id: m6
    technique: tech/heat_oil
    term: 鍋中放油燒至 100°C
    inputs: [m_oil]
    outputs: [s_oil_100]
    tool: tool/wok
    params:
      temperature: {target: oil, min_c: 100, max_c: 100, raw: "鍋中放油燒至 100℃", evidence: S1}
      heat: {level: heat/low, raw: null}
      duration:
        min_s: 30
        max_s: 60
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - observe: 油
        target: 油面微微流動、尚未冒煙時即可下香料。
        method: 目測
        evidence: null
    must_finish_before: [m7]
    requires_state: [s_beef_cooked]
    constraint: "家庭安排（非原文）：與牛肉臊子共用同一只炒鍋，牛肉臊子炒好盛起後才開始這一步"
    note: 補寫依據：來源要求油加熱至 100°C，依一般家庭做法用小火慢慢加熱食用油約 30–60 秒。
  - id: m7
    technique: tech/aromatics
    term: 放郫縣豆瓣、辣椒粉、蒜米、豆豉炒香
    inputs: [s_oil_100, m_douban, m_chili_powder, m_garlic, m_douchi]
    outputs: [s_red_oil_base]
    tool: tool/wok
    params: {agitation: {mode: 翻炒}, heat: {level: heat/medium_low, raw: null, evidence: null}, duration: {min_s: 30, max_s: 120, raw: null, is_guide: true, evidence: null, status: inferred}}
    completion:
      - {observe: 香氣, target: 炒香, method: 嗅覺, evidence: S1}
      - {observe: 油色, target: 油呈紅色, method: 目測, evidence: S1}
    risk: "豆瓣與辣椒粉易焦（料理提醒，非原文）"
    constraint: "表 1 注 b：郫縣豆瓣應先剁細，再入鍋炒香且油呈紅色；應依豆瓣含鹽量調整食鹽用量"
    note: "剁細併在此說明，不另立步驟；補寫依據：依補寫常識表，爆香用中小火約 30–120 秒，炒至香氣出來且油色轉紅。"
  - id: m8
    technique: tech/shao
    term: 摻入高湯，入醬油、豆腐、牛絞肉燒至成熟
    inputs: [s_red_oil_base, m_stock, m_soy, s_tofu_soaked, s_beef_cooked]
    outputs: [s_braised]
    tool: tool/wok
    params: {duration: {min_s: 180, max_s: 300, raw: null, is_guide: true, evidence: null, status: inferred}, heat: {level: heat/medium_low, raw: null}}
    completion:
      - observe: 牛絞肉與豆腐
        target: 牛絞肉全熟，豆腐熱透且保持完整。
        method: 目測
        evidence: null
    note: "豆腐從浸泡的鹽水中撈出的方式與是否瀝水，原文沒寫；補寫依據：依補寫常識表，燉煮用小火至中小火約 180–300 秒，讓豆腐與牛肉入味並熟透。"
  - id: m9
    technique: tech/thicken
    term: 入蒜苗、（味精）、花椒粉、太白粉水，收汁濃稠呈干二流芡
    inputs: [s_braised, s_garlic_sprout_cut, m_msg, m_pepper_powder, m_starch]
    outputs: [s_thickened]
    tool: tool/wok
    params: {thickening: {starch_ref: m_starch}, loading: {batches: null, note: "表 4：水澱粉應分 2～3 次加入，以免豆腐吐水芡稀"}, heat: {level: heat/medium, raw: null, evidence: null}, duration: {min_s: 60, max_s: 120, raw: null, is_guide: true, evidence: null, status: inferred}}
    completion:
      - {observe: 滋汁, target: 收汁濃稠，呈干二流芡（芡汁包裹食材表面、呈糊漿狀，見標準 3.5）, method: 目測, evidence: S1}
      - {observe: 表面, target: 亮油, method: 目測, evidence: S1}
      - {observe: 蒜苗, target: 保持翠綠, method: 目測, evidence: S1}
    timing: {phase: 出鍋前加入蒜苗（表 4：蒜苗應在出鍋前加入）, evidence: S1, status: sourced}
    note: "規格的 thickening.type 列舉沒有『干二流芡』，所以只寫在完成條件；水澱粉分次數只能寫 2～3 次的原文，batches 是單一整數；補寫依據：依補寫常識表，收汁用中火約 60–120 秒，至芡汁包住食材且表面亮油。"
  - id: m10
    technique: tech/plate
    term: 盛碗
    inputs: [s_thickened]
    outputs: [s_final]
    tool: tool/bowl
    completion: [{observe: 成品, target: 裝碗, method: 目測, evidence: S1}]


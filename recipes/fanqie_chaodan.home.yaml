notes:
  weekday: "原文沒寫時間、待試做：M 無任何時間與份數；對照 S1 標準備 9 分鐘＋烹調 5 分鐘，只適用 S1 那份食譜，不能當作 M 的時間；平日門檻為使用者條件，是否符合待試做"
  burners: "家庭安排（推論，非原文）：照 M 順序（番茄先勾芡起鍋備用→另熱鍋炒蛋→合炒）可用 1 口爐依序做"
  spicy_split: "M、S1、S2 都不含辣椒、花椒、辣豆瓣，整鍋即『不辣那份』，無需分鍋"
  compare: "M（主）：蛋5顆、牛番茄3顆、蔥40g、高湯50cc、番茄醬3大匙、糖1大匙、鹽1/4茶匙、太白粉水1大匙；小火爆香蔥、番茄，加調料煮開勾芡後起鍋備用，另鍋炒蛋後合炒（其他步驟火力原文沒寫）。S1：番茄1個、蛋3個、蔥1支、番茄醬2大匙、烏醋1茶匙、糖1茶匙、太白粉1大匙、油各1大匙；中火；先炒蛋半熟取出，最後關火下醋與蛋；總 14 分鐘（9+5）。S2：蛋3顆、番茄3顆（數字與名稱對應不明）、蒜末、蔥2根、番茄醬1大匙、鹽適量；先炒蛋盛出再炒番茄，加熱水滾煮；無時間火力"
  oven_airfryer: "三來源都不用烤箱、氣炸鍋、蒸籠，不需家庭改法；炒鍋即家庭廚具"
  missing: "原文沒寫：沙拉油量、份數、各步時間、炒蛋與收汁火力、爆香完成狀態、芡汁濃稠度、上桌溫度"

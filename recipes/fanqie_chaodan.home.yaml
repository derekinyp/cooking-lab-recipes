  variant: 家常版
  summary: 番茄切小塊、蔥切小段，蛋液加鹽打勻；小火爆蔥、番茄，加入番茄醬、高湯、糖煮開，勾芡後起鍋備用；另熱鍋快速炒勻蛋液至稍凝固，再加入炒好的番茄拌炒均勻。

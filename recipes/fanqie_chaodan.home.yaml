  - {id: i_sugar, concept: ing/white_sugar, label: 砂糖, role: 調料, qty: {value: 1, unit: tbsp, raw_text: "細砂糖 1大匙", evidence: M, status: sourced, note: "M 原量；對照 S1『糖：1茶匙』。S1 內文另提到熬番茄時『加入半茶匙糖』，與其食材表的糖1茶匙不同"}}
  - {id: i_salt, concept: ing/salt, label: 鹽（入蛋液）, role: 調料, qty: {value: 0.25, unit: tsp, raw_text: "鹽 1/4茶匙", evidence: M, status: sourced, note: "M 原量，『加入鹽打勻備用』。S1 主張加番茄醬後不要再加鹽（其文章論點，只作參考）"}}
  - {id: i_slurry, concept: ing/starch_slurry_1to1, label: 太白粉水, role: 調料, qty: {value: 1, unit: tbsp, raw_text: "太白粉水 1大匙", evidence: M, status: sourced, note: "M 原量。M 沒寫太白粉水的粉水比例；對照 S1『1匙太白粉加1匙水調合成水澱粉』（即 1:1，只作參考）"}}


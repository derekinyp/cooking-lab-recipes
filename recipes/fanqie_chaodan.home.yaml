# 番茄炒蛋（家常版）— 規格 v1.0 起始檔
# 主來源 M＝楊桃美食網影音食譜〈番茄炒蛋〉（李德全，2014-03-10）：蛋、番茄、蔥、高湯、番茄醬、糖、鹽、太白粉水只用 M 的數字，不混拼。
# M 沒寫的：沙拉油量（只有「沙拉油」「適量油」）、時間、份數、炒蛋火力、完成狀態細節。
# 比較來源 S1＝食貨誌（有時間、中火、完成狀態，步驟的 200cc 清水沒列在食材表）；S2＝愛料理 490472（食材對應以網頁結構化資料為準）。

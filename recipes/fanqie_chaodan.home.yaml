    completion:
      - {observe: 蔥、番茄, target: 爆香（香氣、程度原文只寫『爆香』，沒寫更具體狀態）, method: 聞, evidence: M}
  - id: a3
    technique: tech/thicken
    term: 加番茄醬、高湯、細砂糖煮開，用太白粉水勾芡後起鍋備用

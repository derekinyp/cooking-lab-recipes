  status: cross_checked
  sources:
    - {id: M, title: "楊桃美食網 影音食譜〈番茄炒蛋〉（李德全，2014-03-10）", url: "https://www.ytower.com.tw/videos/mov-1241", level: C, type: media, accessed: 2026-11-23, note: "主來源（份量與做法）。材料：雞蛋5顆、牛番茄3顆、蔥40公克；調味料：高湯50cc、番茄醬3大匙、細砂糖1大匙、鹽1/4茶匙、太白粉水1大匙。沙拉油只寫『倒入沙拉油』『適量油』沒有量；火力只寫『小火』；無時間、無份數。做法三步：番茄洗淨切小塊；蔥切小段；雞蛋打入碗中，加入鹽打勻備用 → 熱鍋倒入沙拉油，小火爆香蔥、番茄，再加入番茄醬、高湯、細砂糖煮開，用太白粉水勾芡後起鍋備用 → 另熱鍋倒入適量油，倒入蛋液快速炒勻至稍凝固，再加入炒好的番茄拌炒均勻即可"}
    - {id: S1, title: "食貨誌〈番茄炒蛋如何才能滑嫩且風味濃厚〉（ohmylife，2024-09-05）", url: "https://foodieat.tw/fired-tomato-n-eggs/", level: C, type: web, accessed: 2026-11-23, note: "比較與對照。4 人份、準備時間 9 分鐘、烹調時間 5 分鐘；番茄1個、雞蛋3個、青蔥1支、番茄醬2大匙、烏醋1茶匙、糖1茶匙、太白粉1大匙、清水1大匙（食材表，步驟寫『1匙太白粉加1匙水』，是勾芡用水）、食用油適量（步驟寫『下1大匙油』兩次）；中火熱鍋；先炒蛋至半熟取出，再爆香蔥白炒番茄，小火煮 2 分鐘、加番茄醬再煮 1 分鐘，勾芡後關火下烏醋與蛋拌勻。注意：步驟『加200cc清水』煮番茄，這 200cc 沒列在食材表"}
    - {id: S2, title: "愛料理 角落媽媽的家常餐桌〈番茄炒蛋〉（食譜 490472）", url: "https://icook.tw/recipes/490472", level: C, type: web, accessed: 2026-11-23, note: "比較。網頁結構化資料的食材：番茄 3顆、雞蛋 3顆、蒜末 2大匙、蔥末 2根、鹽巴 適量、番茄醬 1大匙（頁面文字區的名稱以圖片呈現，與數字分開）。步驟：蛋液加鹽打勻 → 油熱快炒蛋至半熟盛出 → 蒜末爆香炒番茄加熱水滾煮、加一匙番茄醬 → 收汁後回鍋蛋炒至收汁 → 加蔥花。無份數、無時間、無火力寫法"}

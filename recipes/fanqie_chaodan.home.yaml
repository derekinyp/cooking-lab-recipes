  - {id: s_tomato_fried, label: 小火爆香的蔥與番茄}
  - {id: s_sauce, label: 勾芡煮好的番茄（M 稱『炒好的番茄』）}
  - {id: s_egg_soft, label: 快炒至稍凝固的蛋}
  - {id: s_final, label: 番茄炒蛋, role: final}

actions:
  - id: a1
    technique: tech/cut
    term: 番茄洗淨切小塊；蔥切小段；雞蛋打入碗中加鹽打勻備用

  - {id: i_scallion, concept: ing/scallion, label: 青蔥, role: 輔料, qty: {value: 40, unit: g, raw_text: "蔥 40公克", evidence: M, status: sourced, note: "M 原量，切小段（M 步驟）；對照 S1『青蔥：1支』"}}
  - {id: i_oil, concept: ing/cooking_oil, label: 沙拉油, role: 油脂, qty: {value: 2, unit: tbsp, raw_text: "倒入沙拉油", evidence: M, status: inferred, note: "M 只寫『倒入沙拉油』『適量油』，量沒寫。對照：S1 步驟兩次各『1大匙油』、S2『油可以多一點』（皆只作參考，不進主體數字）；補寫依據：這道菜分兩次下鍋，先煮番茄醬汁、再炒蛋；各取 1 大匙油，讓番茄不易黏鍋並使蛋液能快速凝固。"}}
  - {id: i_ketchup, concept: ing/ketchup, label: 番茄醬, role: 調料, qty: {value: 3, unit: tbsp, raw_text: "番茄醬 3大匙", evidence: M, status: sourced, note: "M 原量；對照 S1『番茄醬：2大匙』、S2『一匙番茄醬』"}}

notes:
  diff_from_wda: "與勞動部 302-2 原版（W1）逐點比較：①熟化：W1 排骨沾乾粉炸酥熟上色；本版醃料含太白粉、平底鍋小火兩面煎（C1），不油炸。『醃料拌粉』不是 W1 的『沾乾粉』。②配料：W1 為青椒、紅辣椒、罐頭鳳梨、蒜頭（W2 版本另有洋蔥）；C1 為洋蔥、番茄、青椒、黃甜椒、蔥，沒有鳳梨與紅辣椒。③醬汁：W1 調味料自選（鹽、醬油、番茄醬、酒、糖、味精、白醋、香油、太白粉水），不定量，並要『拌裹包芡成脆溜菜』、『盤底無多餘醬汁或不得有多量醬汁，不得濃縮出油，規定材料不得短少』；C1 有定量酸甜醬、用檸檬汁取代白醋、沒有另外勾芡。C1 未寫掛汁程度，不能說成『醃料裡的太白粉讓醬汁稍掛』。W1 的番茄醬屬自選調味，不是官方強制配方。④口感：W1 要求排骨『需有粉質外衣』；煎的版本外衣較薄（推論，待試做），不能轉成 sourced 感官目標。⑤份量：W1 小排骨 300 g 是題組供料，不是官方人份規格；C1 是 500 g、4 人份"
  wda_versions: "W1（104-06-17 審定參考資料）302-2 材料組合：罐頭鳳梨、青椒、紅辣椒、蒜頭、小排骨，烹調法脆溜；W2（刀工規格卡）材料組合：罐頭鳳梨、洋蔥、青椒、小排骨，烹調法溜，小排骨塊邊長 2.0～4.0。兩份版本不同，以 W1 為參照文字"
  spicy_split: "C1 沒有辣椒，主體就是不辣版。W1 原版有紅辣椒（拌裹時下鍋）；家庭版改為要辣的那份最後另加紅辣椒片（推論，無數字）"
  weekday: "C1 標 45 分鐘（4 人份），平日（≤20 分鐘）不建議。C1 只寫『趁煎排骨的時候先將酸甜醬調好』，沒有寫可前一晚備妥，不能據此推成能壓進 20 分鐘"
  burners: "家庭安排（推論，非原文）：a2 平底鍋煎排骨（1 口）可與 a3 炒鍋炒料（1 口）同時進行，最多 2 口。C1 分別寫平底鍋、炒鍋，未寫爐口數"
  compare: "C2 LadyMoko（免油炸，2 人份）：排骨 500 g 麵粉洗淨（步驟重複 2～3 次，水呈現清澈就差不多了），熱鍋熱油煎到稍微上色，中間加砂糖 4T 炒焦糖、米酒 1T，加入煮滾的熱水（醃過排骨的份量即可）、八角 1 個、薑 3 片，糖醋醬汁 糖 4t：黑醋 3t：生抽/醬油 2t：米酒 1t，大火燜煮約 15 分鐘（期間開蓋攪拌，避免焦底），勾芡水 60 g（水 45 g＋玉米粉 15 g）可省略；醬汁煮到喜歡的濃稠度後起鍋；風味偏紅燒、作者自評偏甜醋弱。C3 楊桃（快樂廚房 123 期，油炸）：排骨 500 g，醃料蛋 1 顆、鹽 1/2 茶匙、太白粉 1 大匙、米酒 1 大匙，沾太白粉，熱油鍋至 180 度略炸約 5 分鐘至表面金黃；番茄醬：糖：白醋＝4：4：4 大匙炒滾，加綜合彩椒 120 g 與排骨翻炒至均勻沾滿醬汁。C4 鍋寶小林師傅（半煎炸）：植物油 300 ml、開大火加熱至 170 度，以半煎炸方式把排骨炸熟"
  missing: "原文沒寫：醃多久、煎排骨的油量與時間、排骨判熟方法、炒料火力、切塊大小、上桌溫度"

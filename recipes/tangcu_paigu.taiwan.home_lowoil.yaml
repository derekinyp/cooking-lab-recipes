states:
  - {id: s_rib_marinated, label: 醃好的排骨}
  - {id: s_onion_cut, label: 切塊的洋蔥}
  - {id: s_tomato_cut, label: 切塊的番茄}
  - {id: s_pepper_cut, label: 切塊的青椒與黃甜椒}
  - {id: s_scallion_white, label: 蔥白段}
  - {id: s_scallion_green, label: 蔥綠段}
  - {id: s_rib_fried, label: 兩面煎上色、逼過油的排骨}
  - {id: s_aromatics, label: 炒香的洋蔥、蔥白與略炒的番茄}
  - {id: s_peppers, label: 加入青椒、甜椒拌炒}
  - {id: s_sauced, label: 排骨與酸甜醬煮滾炒勻}
  - {id: s_final, label: 糖醋排骨, role: final}

actions:
  - id: a0
    technique: tech/marinate
    term: 排骨洗淨瀝乾，加入醃料抓勻
    inputs: [i_rib, s_marinade]
    outputs: [s_rib_marinated]
    tool: tool/bowl
    params: {duration: {min_s: null, max_s: null, raw: "C1 沒寫醃多久", status: missing}}
    completion: [{observe: 排骨, target: 與醃料抓勻, method: 目測, evidence: C1}]
  - id: a1
    technique: tech/cut
    term: 甜椒、洋蔥、蕃茄和蔥洗淨備用；蕃茄、青椒、甜椒、洋蔥切塊，蔥切段
    inputs: [i_tomato, i_gpepper, i_ypepper, i_onion, i_scallion]
    outputs: [s_onion_cut, s_tomato_cut, s_pepper_cut, s_scallion_white, s_scallion_green]
    tool: tool/knife
    params: {cut: {shape: cut/kuai, size_mm: {min: null, max: null}, raw: "蕃茄、青椒、甜椒、洋蔥切塊，蔥切段", evidence: C1, note: "大小 C1 沒寫。同一步含洗淨（C1 步驟 1）與切配；schema 每步只能一個刀工 id，蔥切段對應 cut/duan 只能寫在 note。蔥白、蔥綠分開用（C1 步驟 3、5）"}}
    completion: [{observe: 蔬菜, target: 洗淨、切塊，蔥切段, method: 目測, evidence: C1}]
    note: "刀、盆是家庭選用工具（推論；C1 未指定）"
  - id: a2
    technique: tech/pan_fry
    term: 平底鍋放比平時炒菜多一點的油燒熱，排骨小火慢煎，一面上色後翻面，另一面也煎上色，最後開中大火逼油，起鍋
    inputs: [s_rib_marinated, i_oil_fry]
    outputs: [s_rib_fried]
    tool: tool/frying_pan
    params:
      heat: {level: heat/low, raw: "小火慢煎……翻面後持續用小火……最後開中大火逼油", evidence: C1}
      duration: {min_s: null, max_s: null, raw: "C1 沒寫煎多久", status: missing}
    completion:
      - {observe: 排骨兩面, target: 都煎上色, method: 目測, evidence: C1}
      - {observe: 熟度, target: 原文沒寫, method: null, note: "C1 沒寫判熟方法；後面只再煮滾炒勻。是否已熟待試做確認，不把來源未說的檢查結果當成已驗證標準"}
    note: "火力分兩段：小火慢煎、最後中大火逼油；heat.level 只能放一個，放主要的小火"
  - id: a3
    technique: tech/aromatics
    term: 炒鍋燒熱加少許油，放洋蔥和蔥白炒香，放番茄略微拌炒
    inputs: [s_onion_cut, s_scallion_white, s_tomato_cut, i_oil_stir]
    outputs: [s_aromatics]
    tool: tool/wok
    params: {heat: {level: null, raw: "C1 沒寫火力"}}
    completion: [{observe: 洋蔥與蔥白, target: 炒香, method: 嗅覺, evidence: C1}]
    can_overlap: [a2]
    note: "C1 准許『趁煎排骨的時候先將酸甜醬調好』，沒有明寫同時用炒鍋炒菜。與 a2 同時進行是「最多同時用兩口爐」的排程（推論），不能據此宣稱已知省時成果"
  - id: a4
    technique: tech/stir_fry
    term: 放入青椒與黃甜椒拌炒
    inputs: [s_aromatics, s_pepper_cut]
    outputs: [s_peppers]
    tool: tool/wok
    completion: [{observe: 青椒與甜椒, target: 拌炒（C1 沒寫炒到什麼程度）, method: 目測, evidence: C1}]
  - id: a5
    technique: tech/stir_fry
    term: 放入煎好的排骨，倒入酸甜醬煮滾炒勻，試味道微調
    inputs: [s_peppers, s_rib_fried, s_sauce]
    outputs: [s_sauced]
    tool: tool/wok
    completion:
      - {observe: 醬汁, target: 煮滾、炒勻, method: 目測, evidence: C1}
      - {observe: 味道, target: 試味道做微調, method: 試吃, evidence: C1}
    note: "原用 tech/shao（燒）語意過推：詞表含『汁收味入、口感柔韌』，C1 只寫『煮滾炒勻』，改標炒，不另加收汁或軟化終點"
  - id: a6
    technique: tech/toss_in
    term: 加入蔥綠拌炒均勻即可起鍋
    inputs: [s_sauced, s_scallion_green]
    outputs: [s_final]
    tool: tool/wok
    completion: [{observe: 蔥綠, target: 拌炒均勻, method: 目測, evidence: C1}]


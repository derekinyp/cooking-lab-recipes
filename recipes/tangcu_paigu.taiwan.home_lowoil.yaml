# 糖醋排骨（少油家庭版，不油炸）— 起始檔，規格 v1.0
# 版本選擇：主版本是少油家庭版；勞動部丙級 302-2 原版（排骨沾乾粉炸酥熟上色、脆溜）只當參照（W1），不另建檔。
# 主來源 C1＝Cookpad 廚房女漢子-Ritas〈糖醋排骨（免油炸）〉：排骨醃料含太白粉、平底鍋小火兩面煎上色、番茄醬酸甜醬——
#   是本次找到的公開免油炸做法裡較接近 302-2 選版目標（帶粉醃料、番茄醬、青椒）的一份；不是與官方技法相同。份量與醬汁比例只用 C1，不混拼。
#   Kimi 原本選的 LadyMoko（C2，焦糖＋黑醋燜煮、不沾粉）與 302-2 風味差太多，改列對照。
# 爐口（家庭安排，非原文）：平底鍋煎排骨（1 口）＋炒鍋炒料（1 口），最多同時 2 口。

states:
  - {id: s_beans_cut, label: 去筋切段的四季豆}
  - {id: s_beans_wrinkled, label: 少油煸到皺縮的四季豆}
  - {id: s_final, label: 乾煸四季豆, role: final}

actions:
  - id: g1
    technique: tech/cut
    term: 四季豆去筋，切成段
    inputs: [g_beans]
    outputs: [s_beans_cut]
    tool: tool/knife
    params: {cut: {shape: cut/duan, size_mm: {min: null, max: null}, raw: "去筋，切成段", evidence: S1, note: "段長原文沒寫；C1 寫掰成 5 cm（C 級，未採用）"}}
    completion:
      - {observe: 四季豆, target: 去筋、成段, method: 目測, evidence: S1}
      - {observe: 四季豆表面, target: 洗淨後吸乾全部水分（帶水下鍋會出水、不焦香）, method: 目測, evidence: C1, note: "S1 沒寫；C1『洗净后厨房纸吸干全部水分』、C2『甩干/厨房纸按干』都要求，本檔採用"}
  - id: g4
    technique: tech/dry_fry
    term: 平底鍋少油，把四季豆鋪平煸到表皮皺縮（取代官方的 150°C 過油）
    requires_state: [s_pork_crumble]
    constraint: "家庭安排（推論）：與肉臊共用同一只平底鍋，肉臊炒好盛起後才開始這一步"
    inputs: [s_beans_cut, g_oil_beans]
    outputs: [s_beans_wrinkled]
    tool: tool/frying_pan
    params:
      heat: {level: heat/medium_high, raw: "中大火把四季豆鋪平，保持“滋滋”聲少翻動", evidence: C2}
      duration: {min_s: null, max_s: null, raw: "C2 時間軸區段『2’–5’ 少油干煸起“虎皮”』（是時間軸，不是時長）", is_guide: true, status: missing}
      agitation: {mode: 鋪平少翻，一面起皺微焦再翻面, continuous: false}
    completion:
      - {observe: 四季豆, target: 煸至乾扁脫水皺縮，呈黃綠而不焦黑, method: 目測, evidence: W1}
      - {observe: 焦斑, target: 焦黑部份不得超過總量之 1/4（W1 評分容許上限，不是目標；理想是不焦黑）, method: 目測, evidence: W1}
      - {observe: 熟度, target: 斷生、熟透（官方要求既要熟透又不能焦）, method: null, evidence: S1, note: "判熟方法原文沒寫（推論：試吃確認無生豆味）"}
    risk: "四季豆沒熟透會中毒（C1 警語）；火太大容易外焦裡生（C1）"
    note: "時長原文沒寫（C2 只有時間軸 2’–5’；C1 另一做法中小火 5–7 分鐘見 notes），以完成狀態為準。平底鍋是本版工具選擇（推論；C2 原文是炒鍋、S1 是鍋）。技法用 tech/dry_fry 作菜式分類；詞表定義是『少油慢火持續翻炒』，C2 這步是中大火、少翻動，動作上較接近煎（tech/pan_fry），列為詞表不足。C2 是分次煸，本檔不補批數。煸好後豆子留在鍋裡直接進下一步是本檔的安排（推論）；C2 是先盛出再『同锅留约 1 茶匙油』炒料"
  - id: g5
    technique: tech/dry_fry
    term: 下芽菜、肉臊炒出香味，入食鹽、（味精）、醬油、芝麻油煸炒入味，盛盤
    inputs: [s_beans_wrinkled, g_yacai, s_pork_crumble, g_salt, g_msg, g_soy, g_sesame]
    outputs: [s_final]
    tool: tool/frying_pan
    params:
      heat: {level: heat/medium, raw: "表 4：煸炒四季豆時應用中火，並控制好油溫，以免炒焦", evidence: S1}
      duration: {min_s: null, max_s: null, raw: "原文沒寫時間", status: missing}
    completion:
      - {observe: 香氣, target: 四季豆、芽菜、肉臊炒出香味, method: 嗅覺, evidence: S1}
      - {observe: 成品, target: 不得出油而油膩, method: 目測, evidence: W1}
    note: "官方這一步是『锅中放油烧至 120°C』再下料；少油版不另加油，用鍋裡剩下的油（推論）。不量油溫"


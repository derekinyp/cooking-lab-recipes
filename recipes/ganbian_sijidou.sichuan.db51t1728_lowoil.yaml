# 乾煸四季豆（少油家庭版）— 正式檔，規格 v1.0
# 版本選擇：主版本是少油家庭版；官方過油版（DB51/T 1728 D.11：四季豆入 150°C 油炸，食用油 1000 g 約耗 50 g）只當參照，不另建檔。
# 份量（四季豆、豬肉、芽菜、調味料）全部沿用 DB51 D.11；煸豆的用油量、火力、翻炒方式改用公開少油食譜（C 級，C2，屬改編），入鍋前擦乾依 C1／C2。
# 「不過油、直接煸到皺縮」有官方依據：勞動部丙級 301-1 烹調規定第 2 條「或以煸炒法煸至乾扁脫水皺縮呈黃綠而不焦黑」。
# 爐口（家庭安排，推論）：全程 1 口、1 只平底鍋，依序做：先炒肉臊盛起，再煸豆、合炒（官方與 C1、C2 都是先豆後肉，本檔對調）。

notes:
  diff_from_official: "與官方過油版（S1）逐點比較：①熟化：官方 150°C 油炸到皮皺、斷生、色綠撈出；本版平底鍋 1 湯匙油中大火煸到皺縮（C2；W1 第 2 條允許）。②用油：官方 1000 g（約耗 50 g）＋合炒時再放油燒至 120°C；本版 1 湯匙，合炒不另加油（推論）。③顏色：官方碧綠；本版黃綠帶焦斑（W1 的標準）。④油溫：官方兩個油溫數字本版都不用，改看完成狀態。⑤調味料份量、合炒時的下料與調味次序、合炒用中火、上桌溫度與時間：照官方。⑥預處理順序：官方先炸豆再炒肉；本版先炒肉臊盛起、再煸豆（一鍋安排，推論）。⑦豆子煸好後留鍋直接合炒（官方是撈出再放入）。⑧入鍋前擦乾四季豆（C1、C2）。"
  wda_comparison: "WDA 301-1 版材料與 DB51 不同：四季豆 200 g（每支 14 cm 以上）、蝦米 10 g、冬菜 10 g、蔥（須含蔥花）、中薑、蒜頭 10 g（4–5 瓣）、五花絞肉 50 g；調味料自選、不定量。本檔主體依 DB51，WDA 只採『可不過油』的規定與完成標準"
  lowoil_alternatives: "C1：鍋燒熱放『比炒菜多一點油』、撒一點鹽，中小火慢煸 5–7 分鐘、勤翻動，至表皮起皺、布滿淺褐虎皮、整體變軟；回鍋時『開最大火快速翻炒30秒』。與 C2 火力相反，待試做比較"
  burners: "全程 1 口爐（家庭安排，推論）：先炒肉臊盛起，再用同一只平底鍋煸豆、合炒；這個先肉後豆的順序是本檔對調，原文都是先豆後肉"
  cross_check: "兩邊比對過（2026-11-20）：Kimi 主抽＋獨立複核；Codex 交叉核對 19:51 補跑成功（codex-X1-ganbian-retry.md（3 分 31 秒）與 kimi-X1b-ganbian-retry.md（10 分 34 秒））；不一致逐項以原文裁決，紀錄見 research/p1/核對紀錄-乾煸四季豆.md"

# 客家小炒（台灣客家家常版）— 起始檔，規格 v1.0
# 主來源 M＝愛料理 浦維老師的料理廚房〈客家小炒〉（5 人份、30 分鐘）：份量、調味、步驟順序只用 M 的數字，不混拼。
# M 的「匙」未註明大匙／小匙，照原文保留、不換算。M 沒寫火力檔位與各步時間（全菜僅標 30 分鐘）。
# 辣椒依家庭條件改為最後分開加（M 原文是與芹菜、蔥段同下，見 notes.spicy_split）。
schema_version: "1.0"
recipe:
  id: kejia_xiaochao.taiwan.hakka
  version: "1.0"
  kind: dish
  dish_concept: dish/kejia_xiaochao
  name: {zh_hant: 客家小炒, zh_hans: 客家小炒, en: "Hakka stir-fry (pork belly, dried squid, tofu gan)"}
  variant: 台灣客家家常版
  summary: 五花肉乾鍋煸出油脂，下豆干煸到金黃，再炒魷魚、蒜片，加糖、胡椒、蠔油、醬油、米酒嗆香，最後下芹菜、蔥段（辣椒分開最後加），起鍋前鍋邊嗆烏醋。
  cuisine:
    - {id: cuisine/taiwanese.hakka, basis: "M 為台灣客家菜食譜（編者分類）", claim: primary, evidence: M}
    - {id: region/taiwan, basis: "主來源為台灣食譜平台愛料理；平台本身不單獨證明料理地域歸屬，此為編者分類", claim: primary, evidence: M}
  flavor_template: null
  servings: {value: 5, status: sourced, evidence: M, note: "M 標『份量 5 人份』"}
  status: cross_checked
  sources:
    - {id: M, title: "愛料理 浦維老師的料理廚房〈客家小炒〉（2022-08-15）", url: "https://icook.tw/recipes/420249", level: C, type: web, accessed: 2026-11-24,
       note: "主來源。5 人份、30 分鐘。五花肉 200克、乾魷魚 100克、豆乾 200克、芹菜 100克、蔥段 20克、蒜片 1克、辣椒 10克、醬油 1大匙、蠔油 1大匙、米酒 2大匙、糖 1匙、胡椒粉 1匙、烏醋 1大匙。步驟：備料（乾魷魚原先泡水軟化）→五花肉乾鍋煸炒出油脂、放豆乾煸至金黃→放魷魚炒出香氣、放蒜片翻炒出蒜香→加糖、胡椒粉、蠔油、醬油、米酒鍋煸嗆香翻炒均勻→拌入芹菜、蔥段、辣椒翻炒均勻→起鍋前鍋邊嗆少許烏醋"}
    - {id: S1, title: "愛料理 男人廚房1+1〈客家小炒〉（2023-08-11）", url: "https://icook.tw/recipes/444111", level: C, type: web, accessed: 2026-11-24,
       note: "對照。豬五花肉 250g、乾魷魚(泡發) 半隻、豆干 8片(約250g)、芹菜 1把、青蔥 3根、辣椒 2根、大蒜 3瓣；醬料：蠔油 2大匙、醬油 1.5大匙、米酒 1.5大匙、砂糖 0.5小匙。步驟：五花肉炒至金黃起鍋備用→同鍋大蒜與豆乾煸香→加魷魚、五花肉與醬料拌炒至鍋底收乾→加芹菜炒至斷生→起鍋前加蔥段、辣椒。頁面未標份數與總時間"}
    - {id: S2, title: "愛料理 愛生活〈【客家菜】客家小炒〉（出自出版書《客家人的惜物廚房》，頁面未標日期）", url: "https://icook.tw/recipes/86306", level: C, type: web, accessed: 2026-11-24,
       note: "對照（書摘，書為 B 級但本引用經 C 級網頁）。可確認：五花肉 350g、乾魷魚 1/2尾、豆干 5片；乾魷魚逆紋剪小條、冷水浸泡約30分鐘；五花肉切小條約1cm寬度；乾鍋中火煸香（煸至出油、表面略上色）；加豆干、蒜頭、辣椒、魷魚爆炒；加調味料略燒，最後加青蔥段、芹菜段、蒜苗段翻炒均勻，上蓋悶一下。食材表中蔥／芹菜／蒜苗／蒜頭等對應的支數標示在擷取時遺失標籤，不逐一引用"}
  extracted_by: [kimi, codex]
  changelog:
    - {version: "1.0", date: 2026-11-24, change: "起始檔：以 M 為主來源；份量、調味只用 M；辣椒改最後分開加；S1、S2 放比較與 notes", by: kimi}
    - {version: "1.0", date: 2026-11-27, change: "Codex 交叉核對後修正：辣椒分流與不辣另做改標推論；嗆醋的完成狀態改標推論；食材備便不再說成指定切法；米酒與烏醋步驟分開描述", by: codex}
    - {version: "1.0", date: 2026-11-27, change: "Codex 4 複核通過（上一輪必修項已修好、未引入新錯誤），升為 cross_checked", by: codex}


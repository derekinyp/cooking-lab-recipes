states:
  - {id: s_squid_soaked, label: 泡軟的乾魷魚}
  - {id: s_all_cut, label: 切好的五花肉條、豆干條、魷魚條、芹菜段、蔥段、蒜片、辣椒段}
  - {id: s_pork_rendered, label: 煸出油脂的五花肉}
  - {id: s_dougan_golden, label: 煸至金黃的豆干}
  - {id: s_squid_garlic, label: 炒出魷魚香與蒜香的鍋料}
  - {id: s_seasoned, label: 下調味料嗆香拌勻的鍋料}
  - {id: s_with_veg, label: 拌入芹菜蔥段的鍋料}
  - {id: s_ready, label: 可嗆醋的鍋料（不辣那份或已加辣椒）}
  - {id: s_final, label: 客家小炒, role: final}

actions:
  - id: a1
    technique: tech/wash_soak
    term: 乾魷魚泡水軟化
    inputs: [i_squid]
    outputs: [s_squid_soaked]
    tool: tool/bowl
    params: {duration: {min_s: null, max_s: null, raw: "M 只寫『乾魷魚原先泡水軟化』，泡多久沒寫；S2『浸泡冷水約30分鐘』", status: missing}}
    completion: [{observe: 魷魚, target: 泡軟（原文只寫『泡水軟化』，軟的判斷標準原文沒寫）, method: 目測、手戳（判斷方式為推論，M 沒寫）}]
    can_overlap: [a2]
    note: "S2：逆紋剪小條再泡，約 30 分鐘即可（整條泡要好幾小時）"
  - id: a2
    technique: tech/cut
    term: 所有食材備便（五花肉、豆干、魷魚切條；芹菜、蔥切段；蒜切片）
    inputs: [i_pork, i_dougan, s_squid_soaked, i_celery, i_scallion, i_garlic, i_chili]
    outputs: [s_all_cut]
    tool: tool/knife
    params: {cut: {shape: cut/tiao, raw: "M 只寫『將所有食材備便』，切法沒寫；S2『五花肉切成小條狀，約1cm寬度』『豆干切成和五花肉一樣的長條狀』", evidence: S2}}
    completion: [{observe: 食材, target: 食材備便（M 原文『將所有食材備便』；具體切法 M 沒指定）, method: 目測, evidence: M}]
    note: "切條的形狀依 S2（對照），M 未指定"
  - id: a3
    technique: tech/render
    term: 五花肉乾鍋煸炒出油脂
    inputs: [s_all_cut]
    outputs: [s_pork_rendered]
    tool: tool/wok
    params:
      heat: {level: null, raw: "M 沒寫火力；S2『以中火煸香』", evidence: S2}
      duration: {min_s: null, max_s: null, raw: "原文沒寫時間", status: missing}
    completion: [{observe: 五花肉, target: 煸出油脂（M 原文『煸炒出油脂』）, method: 目測, evidence: M}]
    note: "M 寫『乾鍋』，無另外放油；油用量因此無、不列食材（M 沒寫）"
  - id: a4
    technique: tech/stir_fry
    term: 放豆乾煸至金黃
    inputs: [s_pork_rendered]
    outputs: [s_dougan_golden]
    tool: tool/wok
    params:
      heat: {level: null, raw: "原文沒寫火力"}
      duration: {min_s: null, max_s: null, raw: "原文沒寫時間", status: missing}
    completion: [{observe: 豆干, target: 金黃（M 原文『煸至金黃』）, method: 目測, evidence: M}]
  - id: a5
    technique: tech/stir_fry
    term: 放魷魚炒出魷魚香氣，再放蒜片翻炒出蒜香
    inputs: [s_dougan_golden]
    outputs: [s_squid_garlic]
    tool: tool/wok
    params:
      heat: {level: null, raw: "原文沒寫火力"}
      duration: {min_s: null, max_s: null, raw: "原文沒寫時間", status: missing}
    completion:
      - {observe: 香氣, target: 出魷魚香氣（M 原文）, method: 聞, evidence: M}
      - {observe: 香氣, target: 出蒜香（M 原文）, method: 聞, evidence: M}
  - id: a6
    technique: tech/stir_fry
    term: 加糖、胡椒粉、蠔油、醬油、米酒鍋煸嗆香，翻炒均勻
    inputs: [s_squid_garlic, i_sugar, i_pepper, i_oyster, i_soy, i_wine]
    outputs: [s_seasoned]
    tool: tool/wok
    params:
      heat: {level: null, raw: "原文沒寫火力"}
      duration: {min_s: null, max_s: null, raw: "原文沒寫時間", status: missing}
    completion: [{observe: 鍋料, target: 翻炒均勻（M 原文）；米酒嗆香的程度原文沒寫, method: 目測、聞, evidence: M}]
    note: "酒沿鍋邊下、嗆香的細節 M 沒寫怎麼下，依原文照炒（推論：調味料一起下鍋）"
  - id: a7
    technique: tech/toss_in
    term: 拌入芹菜、蔥段，翻炒均勻
    inputs: [s_seasoned, i_celery, i_scallion]
    outputs: [s_with_veg]
    tool: tool/wok
    params: {duration: {min_s: null, max_s: null, raw: "原文沒寫時間", status: missing}}
    completion: [{observe: 鍋料, target: 翻炒均勻（M 原文）；芹菜要炒到什麼程度 M 沒寫（S1 對照『炒至斷生』）, method: 目測, evidence: M}]
    note: "M 原文這步同時拌入辣椒；本檔把辣椒拆到 a8（見 notes.spicy_split）"
  - id: a8
    technique: tech/toss_in
    term: （加辣版）下辣椒炒熟
    inputs: [s_with_veg, i_chili]
    outputs: [s_ready]
    tool: tool/wok
    optional_branch: {at: a7 之後起鍋前, input: i_chili, action: "（推論，家庭改法）加辣那份下辣椒炒熟後進入 a9；不辣那份不放辣椒，直接進入 a9。M 只寫辣椒與芹菜、蔥段同鍋翻炒，沒有分流步驟；炒辣椒的完成狀態對照 S1", evidence: S1}
    completion: [{observe: 辣椒, target: 炒熟（S1 原文『起鍋前再加入蔥段、辣椒炒熟』）, method: 目測, evidence: S1}]
    note: "一鍋兩吃：a7 先把不辣的那份盛出，鍋中剩下的加辣椒炒熟（推論：分流方式原文沒寫，M 是一鍋全加）"
  - id: a9
    technique: tech/deglaze
    term: 起鍋前，鍋邊嗆少許烏醋
    inputs: [s_ready, i_vinegar]
    outputs: [s_final]
    tool: tool/wok
    timing: {phase: 起鍋前, evidence: M, status: sourced}
    completion: [{observe: 香氣, target: 原文沒寫完成狀態（M 只寫『起鍋前，鍋邊嗆少許烏醋即可』；以聞到醋香為準是推論）, method: 聞（推論）}]

serving:
  completion:
    - {observe: 上桌溫度與時限, target: 原文沒寫, method: null}
  sensory_target: {color: 原文沒寫, taste: "M 描述『食材香氣層層堆疊，口感、香氣、味道有層次』（非感官目標原文）", texture: 原文沒寫}

notes:
  weekday: "非平日菜：M 標總時間 30 分鐘，超過平日 ≤20 分鐘；且魷魚泡發時間 M 沒寫（S2 約 30 分鐘，若照 S2 另計），實際更久。平日門檻是使用者條件，不是來源數字"
  burners: "步驟以一只炒鍋依序乾鍋煸炒；來源沒寫爐口數，全程 1 口爐是依步驟安排的推論"
  spicy_split: "M 原文辣椒與芹菜、蔥段同鍋拌炒，無法從鍋中分出；本檔改法（推論）：a7 芹菜蔥段拌勻後先盛出不辣那份，鍋中餘料下辣椒（a8）炒熟。不辣那份完全不碰辣椒。若不想分流，不辣那份需另外用一個鍋做、不放辣椒（推論，家庭改法）；調味份量可參照 M，其餘份量與做法依 M"
  tools_home: "M 全程炒鍋，無烤箱／氣炸鍋／蒸籠，不需家庭改法。M 沒寫油（乾鍋），家中無秤可用 M 的匙、大匙計量；200 g 類重量看包裝標重（推論）"
  compare: "S1：五花肉先炒至金黃起鍋備用、回鍋合炒，醬料含蠔油 2大匙；收乾標準『至鍋底收乾』。S2（書摘）：五花肉 350g、乾魷魚 1/2尾、豆干 5片；中火煸五花肉、加豆干蒜頭辣椒魷魚爆炒；調味後『上蓋悶一下』；有蒜苗（M 無）。S2 食材表部分標籤擷取遺失，份量不逐一引用"
  missing: "原文沒寫：魷魚泡發時間、所有刀工切法（M）、各步火力（除 S2 中火外）、各步時間、成品色澤口感目標、上桌溫度、鍋子大小"

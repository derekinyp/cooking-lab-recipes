  pot_size: "湯鍋容量 M 沒寫。已知：水 800㏄，另加排骨 150 g、白蘿蔔 200 g、紅蘿蔔 80 g、玉米 1 根、薑片 20 g；建議選裝得下、滾煮時不溢出的鍋（推論，無來源數字）。"

schema_version: "1.0"
recipe:
  id: luobo_paigu_tang.taiwan.home
  version: "1.0"
  kind: dish
  dish_concept: dish/luobo_paigu_tang
  name: {zh_hant: 蘿蔔排骨湯, zh_hans: 萝卜排骨汤, en: Pork rib and white radish soup}
  variant: 台式家常版
  summary: 排骨與白蘿蔔、紅蘿蔔、玉米先分別汆燙洗淨，同入湯鍋加水以小火煮約 45 分鐘，最後加鹽調味的清湯。
  cuisine:
    - {id: cuisine/taiwanese.home, basis: "主來源 M 為台灣家常一鍋到底湯品（#中式家常 #一鍋到底）（編者分類）", claim: primary, evidence: M}
    - {id: region/taiwan, basis: "主來源為台灣食譜平台楊桃美食網；平台本身不單獨證明料理地域歸屬，此為編者分類", claim: primary, evidence: M}
  flavor_template: null
  servings: {value: null, status: missing, note: "M 沒標人份"}
  status: cross_checked
  sources:
    - id: M
      title: "楊桃美食網〈蘿蔔排骨湯(5)〉（出處《快樂廚房雜誌第68期》）"
      url: https://www.ytower.com.tw/recipe/F01-1428
      level: C
      type: web
      accessed: 2026-11-27
      note: "主來源。材料：去皮白蘿蔔200公克、紅蘿蔔80公克、玉米1根、豬肩排150公克、去皮中薑片20公克、水800㏄；調味料：鹽1/2小匙。作法：1. 白蘿蔔切滾刀塊、紅蘿蔔去皮切滾刀塊、玉米洗淨切小段、豬肩排洗淨剁小塊備用；2. 各食材分別放入滾沸的水中汆燙，撈出洗淨備用；3. 取一湯鍋，放入所有食材和水以小火煮約45分鐘，再加入鹽調味即可。頁面標籤：#中式家常 #快速上桌 #30 分鐘內 #新手入門 #一鍋到底。"
    - id: S2
      title: "Soy, Rice, Fire〈White Asian radish and pork rib soup〉（2022-01-21，作者 Simon Fan）"
      url: https://soyricefire.com/2022/01/20/white-asian-radish-and-pork-rib-soup/
      level: C
      type: personal
      accessed: 2026-11-27
      note: "對照。2 人份；白蘿蔔 255 g、排骨 340 g、蔥 1 根（蔥白／蔥綠分開）、薑 1 英寸（2.5 cm）切片、紹興酒 1 大匙、水 710 ml；鹽與現磨白胡椒 season to taste（無量）。排骨冷水下鍋汆燙 2 分鐘，撈起冷水沖洗；湯鍋下排骨、蔥白、薑、酒、水，大火煮滾後轉小火維持微滾，加蓋煮約 45 分鐘至排骨 tender，撈除蔥白後下蘿蔔續煮約 10 分鐘至蘿蔔 tender，最後以鹽、胡椒調味，撒蔥綠。"
    - id: S3
      title: "Wok's Love〈Homemade Radish and Pork Rib Soup (Luo Bo Dun Pai Gu)〉（作者 Lin，中餐廚師背景）"
      url: https://woksoflove.com/radish-pork-rib-soup-luo-bo-dun-pai-gu/
      level: C
      type: personal
      accessed: 2026-11-27
      note: "對照。4 人份；排骨 450 g、白蘿蔔約 1 kg（切約 4 cm 塊）、薑 4 片、蔥 2 段、料酒 1 大匙（15 ml，汆燙用）、白胡椒 ½ 小匙（1 g）、鹽 1 小匙（5 g）、熱水約 6 杯（1.5 L），收尾撒蔥花。排骨冷水＋料酒下鍋，中大火煮滾後煮 1–2 分鐘撇沫，撈起熱水沖洗；砂鍋／陶瓷鍋下排骨、蘿蔔塊、香料與熱水，煮滾後轉小火幾乎不冒泡，煮約 1 小時至蘿蔔半透明、筷子戳無阻力、肉易離骨；最後幾分鐘才下白胡椒與鹽。食品安全：豬肉 ≥145°F（63°C）。"
  extracted_by: [doubao]
  changelog:
    - {version: "1.0", date: 2026-11-27, change: "起始檔：以 M 為主來源，份量與時間照 M 原量；S2、S3 作對照；M 沒寫的數字留 null＋missing，不補不估", by: doubao}
    - {version: "1.0", date: 2026-11-27, change: "Codex X7 複核通過（上一輪必修項已修好、未引入新錯誤），升為 cross_checked", by: codex}

ingredients:
  - {id: i_rib, concept: ing/pork, label: 豬肩排（剁小塊）, role: 主料,
     qty: {value: 150, unit: g, raw_text: "豬肩排150公克", evidence: M, status: sourced, note: "M 原量"}}
  - {id: i_radish_white, concept: ing/white_radish, label: 去皮白蘿蔔（滾刀塊）, role: 主料,
     qty: {value: 200, unit: g, raw_text: "去皮白蘿蔔200公克", evidence: M, status: sourced, note: "M 原量"}}
  - {id: i_carrot, concept: ing/carrot, label: 紅蘿蔔（滾刀塊）, role: 輔料,
     qty: {value: 80, unit: g, raw_text: "紅蘿蔔80公克", evidence: M, status: sourced}}
  - {id: i_corn, concept: ing/corn, label: 玉米（小段）, role: 輔料,
     qty: {value: 1, unit: stalk, raw_text: "玉米1根", evidence: M, status: sourced, note: "M 原量"}}
  - {id: i_ginger, concept: ing/ginger, label: 去皮中薑片, form: 片, role: 香料,
     qty: {value: 20, unit: g, raw_text: "去皮中薑片20公克", evidence: M, status: sourced}}
  - {id: i_water, concept: ing/water, label: 水, role: 液體,
     qty: {value: 800, unit: ml, raw_text: "水800㏄", evidence: M, status: sourced, note: "M 原量；㏄ 照原文保留，等同毫升。此水為煮湯用水；汆燙用水 M 未計量，不計入此量（推論）"}}
  - {id: i_salt, concept: ing/salt, label: 鹽, role: 調料,
     qty: {value: 0.5, unit: tsp, raw_text: "鹽1/2小匙", evidence: M, status: sourced}}

states:
  - {id: s_radish_cut, label: 切滾刀塊的白蘿蔔}
  - {id: s_carrot_cut, label: 切滾刀塊的紅蘿蔔}
  - {id: s_corn_cut, label: 切小段的玉米}
  - {id: s_rib_cut, label: 剁小塊的豬肩排}
  - {id: s_blanched, label: 汆燙洗淨的排骨與蔬菜}
  - {id: s_soup, label: 小火煮好的蘿蔔排骨湯（未調味）}
  - {id: s_final, label: 蘿蔔排骨湯, role: final}

actions:
  - id: a1
    technique: tech/cut
    term: 白蘿蔔、紅蘿蔔切滾刀塊；玉米切小段；豬肩排剁小塊
    inputs: [i_radish_white, i_carrot, i_corn, i_rib]
    outputs: [s_radish_cut, s_carrot_cut, s_corn_cut, s_rib_cut]
    tool: tool/knife
    params:
      cut: {shape: cut/gun_dao, raw: "白蘿蔔、紅蘿蔔切滾刀塊；玉米洗淨切小段；豬肩排洗淨剁小塊", evidence: M, note: "玉米段長度、排骨塊大小 M 沒寫毫米；滾刀塊邊長 vocab 無官方尺寸"}
    completion:
      - {observe: 材料, target: 切好備用（M 作法 1「備用」）, method: 目測, evidence: M}
    can_overlap: [a2]
  - id: a2
    technique: tech/blanch
    term: 各食材分別放入滾沸的水中汆燙，撈出洗淨備用
    inputs: [s_radish_cut, s_carrot_cut, s_corn_cut, s_rib_cut]
    outputs: [s_blanched]
    tool: tool/stock_pot
    params:
      heat: {level: null, raw: "放入滾沸的水中汆燙", evidence: M}
      duration: {min_s: null, max_s: null, raw: "原文沒寫汆燙多久", status: missing}
    completion:
      - {observe: 食材, target: 撈出洗淨備用（M 作法 2）, method: 目測, evidence: M}
    note: "家庭改法（推論）：M 沒寫汆燙用哪種鍋；家用以湯鍋燒滾水汆燙，撈起洗淨後換水煮湯。M 將白蘿蔔、紅蘿蔔、玉米與排骨分別汆燙；對照 S2、S3 只汆燙排骨，蔬菜後下鍋。"
  - id: a3
    technique: tech/simmer
    term: 湯鍋放入所有食材和水，以小火煮約 45 分鐘
    inputs: [s_blanched, i_ginger, i_water]
    outputs: [s_soup]
    tool: tool/stock_pot
    params:
      heat: {level: heat/low, raw: "以小火煮約45分鐘", evidence: M}
      duration: {min_s: 2700, max_s: 2700, raw: "煮約45分鐘", is_guide: true, evidence: M, status: sourced}
    completion:
      - {observe: 計時, target: 小火煮約滿 45 分鐘, method: 計時, evidence: M}
      - {observe: 食材熟度, target: 原文沒寫, method: null, evidence: M}
    note: "M 作法 3 原文：「取一湯鍋，放入作法2所有食材和水以小火煮約45分鐘」。M 未寫是否加蓋；湯鍋加蓋慢煮為家庭慣例（推論）。M 從頭就把蘿蔔下鍋；S2 是排骨先煮 45 分鐘、蘿蔔後下 10 分鐘，順序不同，主體照 M。"
  - id: a4
    technique: tech/season
    term: 加入鹽調味即可
    inputs: [s_soup, i_salt]
    outputs: [s_final]
    tool: tool/stock_pot
    completion:
      - {observe: 湯的鹹度, target: 加鹽調味即可（M 作法 3）, method: 試吃（判斷方式為推論，M 原文沒寫）, evidence: M}
    note: "M 調味只有鹽；白胡椒、料酒、蔥花、香菜 M 皆未列。對照 S2、S3 白胡椒與鹽都在最後幾分鐘才下。"

serving:
  completion:
    - {observe: 上桌溫度與時限, target: 原文沒寫, method: null}
  sensory_target: {color: 原文沒寫, taste: 原文沒寫, texture: 原文沒寫}

notes:
  weekday: "假日菜（推論）：M 小火煮約 45 分鐘；另加汆燙與切配時間，M 沒寫總時長。另見 E：頁面標籤 #30 分鐘內 與作法 45 分鐘互相矛盾。"
  burners: "全程 1 口爐、1 只湯鍋（M 作法 3「取一湯鍋」）；汆燙與煮湯用同一湯鍋先燙再換水（家庭改法，推論）。任何時刻不超過 2 口爐。"
  spicy_split: "M、S2、S3 都沒有辣椒、花椒、辣豆瓣；主體整鍋就是不辣那份，不需一鍋兩吃分流。對照來源的白胡椒屬最後加的配料，不辣那份可不加胡椒（推論）。"
  oven_airfryer: "M 未使用烤箱、氣炸鍋、蒸籠；本檔不需改法。家庭可用湯鍋爐上煮，或電鍋外鍋加水燉煮（電鍋做法 M 沒寫，屬推論，時間待試做）。"
  missing: "原文沒寫：人份數、汆燙時間與汆燙火力、湯鍋大小、煮好的完成狀態（蘿蔔軟度、排骨熟度、湯色）、上桌溫度與食用時限、白胡椒／料酒／蔥／香菜等調味、玉米段長度與蘿蔔塊尺寸、是否需先泡血水。"
  compare: "M 為排骨與蘿蔔同鍋從頭煮 45 分鐘；S2 排骨先煮 45 分鐘、蘿蔔後下 10 分鐘；S3 同鍋煮約 1 小時。M 調味僅鹽；S2、S3 最後加白胡椒與鹽。"
  pot_size: "湯鍋容量 M 沒寫。已知：水 800㏄，另加排骨 150 g、白蘿蔔 200 g、紅蘿蔔 80 g、玉米 1 根、薑片 20 g；建議選裝得下、滾煮時不溢出的鍋（推論，無來源數字）。"

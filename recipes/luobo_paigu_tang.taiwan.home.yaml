  spicy_split: "M、S2、S3 都沒有辣椒、花椒、辣豆瓣；主體整鍋就是不辣那份，不需一鍋兩吃分流。對照來源的白胡椒屬最後加的配料，不辣那份可不加胡椒（推論）。"

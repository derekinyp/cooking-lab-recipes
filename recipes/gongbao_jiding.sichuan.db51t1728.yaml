states:
  - {id: s_diced, label: 雞肉中丁}
  - {id: s_marinated, label: 碼味上漿雞丁}
  - {id: s_chili_seg, label: 乾辣椒節（2 cm）}
  - {id: s_hot_oil, label: 150°C 熱油}
  - {id: s_aromatic, label: 煳辣香油底}
  - {id: s_chicken_cooked, label: 斷生雞丁}
  - {id: s_fragrant, label: 雞丁＋薑蒜蔥炒香}
  - {id: s_coated, label: 包芡雞丁}
  - {id: s_final, label: 宮保雞丁, role: final}

actions:
  - id: a1
    technique: tech/cut
    term: 切中丁
    inputs: [i_chicken]
    outputs: [s_diced]
    tool: tool/knife
    params: {cut: {shape: cut/ding_medium, size_mm: {min: null, max: null}, raw: 中丁, evidence: S1, note: "標準未給毫米；網路常見 15 mm（C 級，未採用）"}}
    completion: [{observe: 雞丁, target: 大小一致的中丁, method: 目測}]
    can_overlap: [a3]
  - id: a2
    technique: tech/marinate_coat
    term: 碼味上漿
    inputs: [s_diced, i_salt_m, i_wine_m, i_starch_m]
    outputs: [s_marinated]
    params: {duration: {min_s: null, max_s: null, raw: 標準未註明, status: missing}, agitation: {mode: 拌勻}}
    completion: [{observe: 雞丁, target: 均勻裹漿, method: 目測／手感}]
  - id: a3
    technique: tech/cut
    term: 切節
    inputs: [i_chili]
    outputs: [s_chili_seg]
    tool: tool/knife
    params: {cut: {shape: cut/segment, size_mm: {min: 20, max: 20}, raw: "長 2cm 的節", evidence: S1}}
    completion: [{observe: 辣椒, target: 長 2 cm 的節, method: 目測, evidence: S1}]
  - id: a4
    technique: tech/heat_oil
    term: 燒油
    inputs: [i_oil]
    outputs: [s_hot_oil]
    tool: tool/wok
    params:
      temperature: {target: oil, min_c: 150, max_c: 150, raw: "油燒至 150℃", evidence: S1}
      heat: {level: null, raw: 標準未寫火力檔位}
    completion: [{observe: 油溫, target: 150°C, method: 溫度計或經驗, evidence: S1}]
  - id: a5
    technique: tech/qiang
    term: 炒香（熗辣椒花椒）
    inputs: [s_hot_oil, s_chili_seg, i_pepper]
    outputs: [s_aromatic]
    tool: tool/wok
    params: {agitation: {mode: 翻炒, continuous: true}}
    completion: [{observe: 辣椒花椒色澤, target: 棕紅、出香、勿焦, method: 目測與嗅覺, evidence: S1}]
    risk: 最易失敗步驟：過火即焦苦
  - id: a6
    technique: tech/stir_fry_slide
    term: 入雞丁炒斷生
    inputs: [s_aromatic, s_marinated]
    outputs: [s_chicken_cooked]
    tool: tool/wok
    params: {agitation: {mode: 翻炒／炒散, continuous: true}}
    completion: [{observe: 雞丁熟度, target: 剛熟（斷生）, method: 目測（變白、無血色）, evidence: S1}]
  - id: a7
    technique: tech/stir_fry
    term: 入薑蒜蔥炒香
    inputs: [s_chicken_cooked, i_ginger, i_garlic, i_scallion]
    outputs: [s_fragrant]
    tool: tool/wok
    completion: [{observe: 香氣, target: 出香, method: 嗅覺}]
  - id: a8
    technique: tech/pour_sauce_thicken
    term: 倒芡汁收汁
    inputs: [s_fragrant, s_sauce]
    outputs: [s_coated]
    tool: tool/wok
    params: {thickening: {type: 包芡, starch_ref: j_starch}}
    completion:
      - {observe: 芡汁, target: 濃稠包裹、亮油, method: 目測, evidence: S1}
      - {observe: 澱粉糊化後, target: 及時起鍋、不宜久炒, method: 目測, evidence: S1}
  - id: a9
    technique: tech/toss_in
    term: 下酥花生炒勻
    inputs: [s_coated, i_peanut]
    outputs: [s_final]
    tool: tool/wok
    completion: [{observe: 花生, target: 香脆不返軟, method: 口感, evidence: S1}]
    timing: {phase: 起鍋前, evidence: S1, status: sourced}

serving:
  completion:
    - {observe: 菜品中心溫度, target: "≥70°C", method: 溫度計, evidence: S1}

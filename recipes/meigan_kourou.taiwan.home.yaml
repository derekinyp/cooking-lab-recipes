  - {id: s_skin_pricked, label: 扎孔、塗醬油晾乾的肉方}
  - {id: s_pork_seared, label: 煎至表面起泡的肉方}
  - {id: s_pork_sliced, label: 約1.5公分厚肉片}
  - {id: s_meigan_fried, label: 炒至水分收乾的梅乾菜}
  - {id: s_pork_sauced, label: 略煮勻的肉片與湯汁}
  - {id: s_steamed, label: 電鍋蒸好的扣肉}
  - {id: s_final, label: 梅干扣肉（倒扣裝盤）, role: final}

actions:
  - id: a1
    technique: tech/boil
    term: 整塊五花肉洗淨，入滾水加薑片、蔥段煮約40分鐘，撈出瀝乾
    inputs: [i_pork, i_ginger, i_scallion]
    outputs: [s_pork_boiled]
    tool: tool/stock_pot
    params:
      heat: {level: null, raw: "入滾水中（原文未寫爐火檔位）", evidence: M}
      duration: {min_s: null, max_s: null, raw: "約煮40分鐘", is_guide: true, evidence: M, status: sourced}
    completion:
      - {observe: 五花肉, target: 撈出瀝乾備用（原文）；煮到多熟的判斷條件原文沒寫, method: 目測, evidence: M}
    note: "薑片、蔥段在此步下鍋（M 作法1）。"
  - id: a2
    technique: tech/cut
    term: 竹籤在豬皮表面扎孔，越密越好；塗上少許醬油於皮上，晾乾備用
    inputs: [s_pork_boiled, i_soy_c]
    outputs: [s_skin_pricked]
    tool: null
    params:
      duration: {min_s: null, max_s: null, raw: "晾乾多久原文沒寫", status: missing}
    completion:
      - {observe: 豬皮, target: 扎孔越密越好；皮上塗好醬油、晾乾（原文）, method: 目測, evidence: M}
    note: "竹籤扎孔屬表面前處理；以切配作較寬泛的技法分類。"
  - id: a3
    technique: tech/pan_fry
    term: 鍋內放1大匙油，五花肉皮朝下煎至表面起泡
    inputs: [s_skin_pricked, i_oil_pan]
    outputs: [s_pork_seared]
    tool: tool/frying_pan
    params:
      heat: {level: null, raw: "原文沒寫火力檔位", evidence: M}
      duration: {min_s: null, max_s: null, raw: "煎多久原文沒寫", status: missing}
    completion:
      - {observe: 肉皮, target: 表面起泡（原文「煎至表面起泡」）, method: 目測, evidence: M}
    note: "家庭改法（推論）：M 只寫「鍋內」，家庭可用平底鍋；無深炸設備，不採油炸。"
  - id: a4
    technique: tech/cut
    term: 肉方取出切約1.5公分厚肉片
    inputs: [s_pork_seared]
    outputs: [s_pork_sliced]
    tool: tool/knife
    params:
      cut: {shape: cut/pian, size_mm: {min: null, max: null}, raw: "切約1.5公分厚肉片", evidence: M}
    completion:
      - {observe: 肉片, target: 厚約1.5公分（原文）, method: 目測, evidence: M}
  - id: a5
    technique: tech/dry_fry
    term: 梅乾菜洗淨切碎，加調味料B（八角、糖）小火炒至水分收乾，取出備用
    inputs: [i_meigan, i_star_anise, i_sugar_b]
    outputs: [s_meigan_fried]
    tool: tool/wok
    params:
      heat: {level: heat/low, raw: "小火炒至水分收乾", evidence: M}
      duration: {min_s: null, max_s: null, raw: "炒多久原文沒寫", status: missing}
    completion:
      - {observe: 梅乾菜, target: 水分收乾（原文「炒至水分收乾」）, method: 目測, evidence: M}
    note: "梅乾菜是否先泡水、泡水多久，M 沒寫；對照 S1 冷水清洗5～6次、S2 泡水洗淨。"
  - id: a6
    technique: tech/stir_fry_mixed
    term: 鍋中加1大匙油，蒜末炒香，下厚肉片、米酒、水、調味料A略煮勻
    inputs: [s_pork_sliced, i_garlic, i_oil_stir, i_wine, i_water, i_soy_a, i_sweet_bean, i_sugar_a]
    outputs: [s_pork_sauced]
    tool: tool/wok
    params:
      heat: {level: null, raw: "原文沒寫火力檔位", evidence: M}
      duration: {min_s: null, max_s: null, raw: "略煮多久原文沒寫", status: missing}
    completion:
      - {observe: 鍋中料, target: 略煮勻（原文「略煮勻」）；勻的程度原文沒寫, method: 目測, evidence: M}
  - id: a7
    technique: tech/steam
    term: 肉片排入碗內，蓋上梅乾菜，淋上作法5湯汁，放入電鍋蒸2小時
    inputs: [s_pork_sauced, s_meigan_fried]
    outputs: [s_steamed]
    tool: tool/electric_cooker
    params:
      duration: {min_s: 7200, max_s: 7200, raw: "放入電鍋蒸2小時", is_guide: true, evidence: M, status: sourced}
      heat: {level: null, raw: "電鍋蒸煮，原文未寫爐火檔位", evidence: M}
    completion:
      - {observe: 扣肉, target: 蒸好的軟爛狀態 M 原文沒寫；以筷子戳得動、肉軟爛為準（推論，感官判斷，不用溫度計）, method: 戳、目測, note: "完成判斷為家庭推論；M 未寫熟度狀態"}
    note: "家庭改法（推論）：大同式電鍋外鍋加水蒸；外鍋加水量 M 沒寫，不自編。"
  - id: a8
    technique: tech/plate
    term: 取出倒扣入盤
    inputs: [s_steamed]
    outputs: [s_final]
    completion:
      - {observe: 成品, target: 倒扣入盤（原文「再到扣入盤內即可」，「到扣」為原文筆誤）, method: 目測, evidence: M}

serving:
  completion:
    - {observe: 上桌溫度與食用時限, target: 原文沒寫, method: null}
  sensory_target: {texture: "M 原文沒寫；對照此類菜品為肉軟爛、肥而不膩（推論）", taste: "M 原文沒寫；鹹甜醬香（推論）"}

notes:
  weekday: "假日菜：M 記五花肉「約煮40分鐘」、電鍋「蒸2小時」，另煎肉、炒梅乾菜、略煮的時間原文沒寫；總時長超過平日 20 分鐘門檻（20 分鐘為家庭條件，非來源數字）。"
  burners: "先後各用 1 口瓦斯爐：湯鍋煮肉（a1）、平底鍋煎肉（a3）、炒鍋炒梅乾菜（a5）與略煮肉片（a6）；電鍋蒸製（a7）不佔瓦斯爐口。炒梅乾菜可與煮肉同時進行，那時最多 2 口，任何時刻不超過 2 口。"
  spicy_split: "主體 M 沒有辣椒、花椒、辣豆瓣、胡椒，整鍋即為不辣那份。對照 S2：辣椒2支在作法2與蒜片、八角一起爆香（一開始下鍋），無法事後分出；若依 S2 做法，不辣那份要另外做（推論：爆香前先分出一份蒜末、八角、梅乾菜用另一鍋炒，辣椒整支不入不辣鍋；不辣鍋的份量無來源數字，不補）。"
  oven_airfryer: "M 未用烤箱、氣炸鍋、蒸籠；最後蒸製原文即指定電鍋。若改用其他來源的蒸籠做法：家庭改法（推論）為電鍋外鍋加水蒸，不加自編水量；若來源用油炸肉皮，家庭無深炸設備，可改平底鍋油煎（推論）。"
  no_scale: "M 份量為公克／CC／大匙／根／粒；家中無料理秤，公克項看包裝標重目測（推論，無換算數字）；大匙、杯照 M 原文保留，不換算公克或 CC。"
  compare: "S1（C，一鍋到底）：五花肉1斤、梅干菜2卷、醬油6大匙、米酒3大匙、糖1大匙、鹽少許、水適量；大火煮滾轉小火20分，加梅干菜再煮15分，食用前蒸10分。S2（B，雜誌44期）：五花肉片300克、梅干菜150克、蒜頭10粒、辣椒2支、八角2粒、太白粉水適量；醬油1/2杯、胡椒1小匙、香菇精粉2小匙、糖1大匙、米酒1大匙、高湯800cc；大火沸騰後小火悶50分，湯汁1杯太白粉水勾芡。"
  missing: "原文沒寫：份數；梅乾菜是否先泡水及泡水時間；煎肉時間與火力；炒梅乾菜時間；略煮肉片時間與火力；各步驟爐火檔位（僅 a5 寫小火）；肉煮好的熟度判斷；豬皮晾乾時間；蒸好的軟爛完成狀態；電鍋外鍋加水量與檔位；鍋碗尺寸；上桌溫度與食用時限。"
  pot_size: "扣碗與鍋具尺寸 M 沒寫。已知：五花肉 800 公克整塊、梅乾菜 150 公克；建議選裝得下肉片排鋪、能蓋鍋的深碗（推論，無來源數字）。"

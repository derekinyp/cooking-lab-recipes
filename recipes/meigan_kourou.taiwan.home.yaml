      note: "對照（一鍋到底家常版）。五花肉1斤、梅干菜2卷；醬油6大匙、米酒3大匙、糖1大匙、鹽少許、水適量。川燙至表皮熟透切約1公分厚片；肉與調味料入鍋加水淹過，大火水開後轉小火煮20分鐘，放入洗淨切小段梅干菜再煮15分；放涼排碗皮朝下填梅干菜，食用前再蒸10分鐘倒扣。梅干菜以冷水清洗5～6次去除多餘鹽份與沙塵。頁面標籤 #中式家常 #快速上桌 #30 分鐘內 #新手入門 #一鍋到底。"

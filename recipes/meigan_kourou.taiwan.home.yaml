  flavor_template: null
  servings: {value: null, status: missing, note: "M 未標份數；主料五花肉 800 公克"}
  status: cross_checked
  sources:
    - id: M
      title: "楊桃美食網〈梅乾菜扣肉〉（出處《快樂廚房雜誌第106期》）"
      url: "https://www.ytower.com.tw/recipe/iframe-recipe.asp?seq=A02-3643"
      level: B
      type: book
      accessed: 2026-11-28
      note: "主來源。標籤 #中式家常 #電鍋料理。五花肉800公克、梅乾菜150公克；整塊肉滾水煮約40分鐘，竹籤扎孔塗醬油晾乾，煎至表面起泡切約1.5公分厚片；梅乾菜加調味料B小火炒至水分收乾；蒜末炒香後下肉片、米酒、水、調味料A略煮勻；排入碗中蓋梅乾菜淋湯汁，電鍋蒸2小時後倒扣。"
    - id: S1
      title: "楊桃美食網〈梅干扣肉〉（示範者邱平英）"
      url: "https://www.ytower.com.tw/recipe/A02-008"
      level: C
      type: web
      accessed: 2026-11-28
      note: "對照（一鍋到底家常版）。五花肉1斤、梅干菜2卷；醬油6大匙、米酒3大匙、糖1大匙、鹽少許、水適量。川燙至表皮熟透切約1公分厚片；肉與調味料入鍋加水淹過，大火水開後轉小火煮20分鐘，放入洗淨切小段梅干菜再煮15分；放涼排碗皮朝下填梅干菜，食用前再蒸10分鐘倒扣。梅干菜以冷水清洗5～6次去除多餘鹽份與沙塵。頁面標籤 #中式家常 #快速上桌 #30 分鐘內 #新手入門 #一鍋到底。"
    - id: S2
      title: "楊桃美食網〈梅干扣肉(2)〉（出處《快樂廚房雜誌第44期》）"
      url: "https://www.ytower.com.tw/recipe/A02-792"
      level: B
      type: book
      accessed: 2026-11-28
      note: "對照。五花肉片300克、梅干菜150克、蒜頭10粒、辣椒2支、八角2粒、太白粉水適量；醬油1/2杯、胡椒1小匙、香菇精粉2小匙、糖1大匙、米酒1大匙、高湯800cc。蒜片辣椒片八角爆香後下梅干菜炒香；肉片滾水汆燙；湯鍋加肉片、梅干菜與所有調味料，大火煮至沸騰後蓋鍋小火悶煮50分鐘；扣碗壓緊扣盤；湯汁1杯煮沸以太白粉水勾芡淋上。"

# 梅干扣肉（客家家常版・電鍋蒸）— 規格 v1.0，起始草稿
# 主來源 M＝楊桃美食網〈梅乾菜扣肉〉（出處《快樂廚房雜誌第106期》）：
#   主料、調味、份量、時間、刀工只用 M 的數字，不與 S1／S2 混拼；S1／S2 僅放比較表與 notes。
# 家庭條件：兩口瓦斯爐；電鍋（大同式外鍋加水蒸）、炒鍋、平底鍋、湯鍋；無烤箱、氣炸鍋、蒸籠、溫度計、料理秤。

    - id: S1
      title: "楊桃美食網〈蒼蠅頭(7)〉"
      url: https://www.ytower.com.tw/recipe/F02-0751
      level: C
      type: web
      accessed: 2026-11-27
      note: "對照。材料：韭菜花100公克、豬絞肉150公克、豆豉10公克、紅辣椒1支、蒜頭4粒；調味料：醬油1大匙、糖1小匙、米酒1大匙、五香粉1/2小匙；沙拉油適量。作法：絞肉先入鍋炒乾備用；熱鍋加適量沙拉油，蒜碎、辣椒碎、豆豉炒香，再加絞肉及所有調味料炒勻，起鍋前下切小段韭菜花，略拌炒均勻至翠綠。備註：絞肉應爆炒至微乾焦、香氣溢出才調味並放韭菜花，以保韭菜花爽脆。頁面結構化資料標示日期 2014-07-21。"
    - id: S2
      title: "DayDayCook 日日煮〈蒼蠅頭〉"
      url: https://www.daydaycook.com/zh-Hans/recipe/stir-fried-minced-pork-with-chinese-chives-and-salted-black-bean
      level: C
      type: media
      accessed: 2026-11-27
      note: "對照。時間 15-30 分鐘；配料：豬肉末300g、韭菜苔200g、豆豉15g、紅辣椒1pc、指天椒2pc、蒜蓉2tbsp、薑蓉1tbsp、水20ml、紹興酒1tbsp、生抽1tbsp、麻油1tsp、砂糖5g、生粉5g、胡椒粉3tsp。作法：韭菜苔洗淨切丁；肉加入紹興酒、生抽、麻油、砂糖、生粉及胡椒粉拌勻醃製20分鐘；中高火燒熱鍋加少許油，下肉末炒2分鐘，再加韭菜、蒜蓉、薑蓉、豆豉、紅辣椒及指天椒炒勻；加少許水煮2分鐘，加砂糖、胡椒粉及麻油炒勻即成。原文配料表砂糖、麻油、胡椒粉各重複列出兩筆。"

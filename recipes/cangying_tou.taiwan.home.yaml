notes:
  weekday: "平日（≤20 分鐘）判定：M 頁面標籤為 #30 分鐘內，已超過平日 20 分鐘門檻（門檻是使用者條件，非來源數字）；步驟本身未給烹炒分鐘數，實際可否在平日完成原文沒寫，待試做計時。"
  burners: "本食譜使用 1 只炒鍋；M 標籤為 #一鍋到底。爐口數原文沒寫。"
  spicy_split: "M 的辣椒片在步驟2與蒜末、豆豉同鍋爆香，不是最後分開下鍋，無法在同一鍋分出。不辣那份要另外做（推論）：爆香時先不下辣椒，辣椒另置小碗備妥，起鍋前只加到吃辣那份（推論，無來源數字）。本檔無花椒、無辣豆瓣。"
  oven_airfryer: "M 未使用烤箱、氣炸鍋或蒸籠；家庭廚具僅有電鍋、炒鍋、平底鍋、湯鍋，本檔用炒鍋即可對應，無需家庭改法。"
  no_scale: "家中無料理秤；M 公克項目的無秤量法原文沒寫，待試做建立。匙類照原文大匙／小匙，不換算。"
  compare: "S1（楊桃 F02-0751）：絞肉先入鍋炒乾備用，蒜碎、辣椒碎、豆豉炒香後回鍋調味，起鍋前才下韭菜花炒至翠綠；備註主張絞肉爆炒至微乾焦、香氣溢出才調味下韭菜花，以保韭菜花爽脆。S2（DayDayCook）：肉先以紹興酒、生抽、麻油、糖、生粉、胡椒醃 20 分鐘，中高火炒肉末 2 分鐘，再加韭菜、蒜蓉、薑蓉、豆豉、辣椒炒勻，加水煮 2 分鐘調味。"
  missing: "原文沒寫：份數、各步驟分鐘數、爆香完成狀態、絞肉部位與肥瘦、豆豉種類、辣椒品種、韭菜花丁尺寸、油的種類、上桌溫度與時限、成品色澤口感。"
  decisions: "主來源選 M（F01-0964）：五項指定材料（絞肉、韭菜花、豆豉、辣椒、醬油）均有份量，明示大火與油量，調味料清單完整；S1、S2 僅作對照，其數字不進主體。"
  family_adapt: "未使用溫度計；完成判斷僅用看、聞、試吃等感官，M 未給任何攝氏溫度數字。"
  spec_gaps: "頁面標籤（#30 分鐘內、#一鍋到底、#快速上桌）無對應結構欄位，僅能記於 notes；一鍋兩吃（一半不辣）無法以結構化成品表示，頂層僅一個 final 成品。"

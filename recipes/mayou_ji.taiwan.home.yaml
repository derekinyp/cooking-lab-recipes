# 麻油雞（台式家常版）— 起始檔，規格 v1.0
# 主來源 M＝《40種餐廳必點雞肉料理》（楊桃美食網 A03-402 轉載）：雞肉部位與份量、老薑、麻油、米酒、水、鹽、糖、火力、時間只用 M 的數字，不混拼。
# S2＝《四季滋補料理》（楊桃美食網 A03-1549 轉載）、S3＝李錦記美國官網食譜，僅放比較表與 notes。
# 三份來源皆無辣椒、花椒、辣豆瓣；本身不辣不麻。米酒酒精是否煮掉，三份原文都沒寫，照實記錄。

notes:
  weekday: "假日菜：M 有時間數字的步驟為大火炒 1 分鐘＋小火煮 30 分鐘，已超過平日 20 分鐘門檻；爆香薑片、米酒燒開、起鍋淋油的時間 M 原文沒寫，待試做計時。平日（≤20 分鐘）不可做（依 M 的 30 分鐘燉煮判斷；門檻是家庭條件，不是來源數字）"
  burners: "全程 1 口爐、1 只湯鍋（家庭改法推論：M 只寫「取一鍋」）；任何時刻不超過 2 口爐。碗、鍋蓋不另占爐口"
  spicy_split: "M、S2、S3 主體都沒有辣椒、花椒、辣豆瓣，整鍋即不辣那份；本菜無麻味來源。三份來源皆未把辣椒／花椒一開始下鍋，無「無法分出」的情形。若要做一鍋兩吃：辣椒／花椒最後分開加在要辣的那份（推論；三份來源都沒有此配料，量原文沒寫、不另編數字）"
  alcohol: "米酒酒精是否煮掉，M、S2、S3 原文都沒寫；照原文記錄，不推論是否揮發完畢"
  tools_family: "三份來源都沒用烤箱、氣炸鍋或蒸籠，不需器材改法；家庭廚具為電鍋（大同式外鍋加水蒸）、炒鍋、平底鍋、湯鍋，無料理溫度計、無料理秤。M 原文未指明鍋具，本檔用湯鍋（家庭改法推論）；完成判斷全用看、聞、聽、戳、試吃，不靠溫度計"
  compare: "S2（《四季滋補料理》）為純酒無水流派：雞肉塊 900 公克、薑片 100 公克、黑麻油 3 大匙、米酒 1200㏄、雞粉適量，小火燜煮約 40 分鐘至入味；材料表未列水、鹽、糖。S3（李錦記官網）：帶皮雞腿肉 2 磅、米酒 1½ 杯（另 2 茶匙泡枸杞）、枸杞 1 安士、油 1 茶匙、薑 1 塊、芝麻油 3 湯匙（先 2 後 1）、雞粉 2 茶匙，開中大火、雞皮朝下加油和生薑片，熬出雞油且生薑邊緣略焦後轉中火，燜煮 25 分鐘後加枸杞與收尾麻油、雞粉小火慢煮 5 分鐘。三家雞肉部位、水量、酒水量差異大，主體不混拼"
  missing: "原文沒寫：份數、雞肉部位（腿／胸）、水量（M 為適量）、爆香薑片時間、炒雞塊的完成狀態、米酒燒開的火力與時間、燉煮是否加蓋、中途是否翻拌、兩種麻油的油品差異、鍋具種類與大小、成品顏色、上桌溫度與食用時限、酒精是否煮掉"
  source_access: "愛料理 icook.tw 搜尋頁與大同電鍋官方平台 cooking.tatung.com 本次被 robots.txt 擋自動存取，未能開啟，故未列入來源；未引用任何未親自開過的頁面。勞動部中餐丙級術科鏡像檔（07602 題組）檢索無「麻油雞」菜色，僅有「雞肉麻油飯」「薑味麻油肉片」"

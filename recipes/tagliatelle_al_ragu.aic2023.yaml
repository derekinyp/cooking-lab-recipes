              - {id: f_oil, concept: ing/evoo, label: 特級初榨橄欖油, role: 油脂, qty: {value: 3, unit: cucchiaio, evidence: R1, status: sourced}}
            actions:
              - {id: f1, technique: tech/mince, term: 剁碎豬腹肉, inputs: [f_pancetta], outputs: [fs_pancetta_minced], tool: tool/knife,
                 params: {raw: "macinata o tritata"}, completion: [{observe: 豬腹肉, target: 絞碎或剁碎, method: 目測, evidence: R1}]}
              - {id: f2, technique: tech/mince, term: 在砧板上剁細蔬菜, inputs: [f_onion, f_carrot, f_celery], outputs: [fs_battuto], tool: tool/knife,
                 params: {cut: {shape: cut/fine_mince, raw: "tritati finemente sul tagliere (non usare il mixer)", evidence: R1}},
                 can_overlap: [f1], constraint: "不可用食物調理機（原文明示）",
                 completion: [{observe: 蔬菜, target: 細碎, method: 目測, evidence: R1}]}
              - {id: f3, technique: tech/render, term: 豬腹肉加油煸化, inputs: [fs_pancetta_minced, f_oil], outputs: [fs_fat],
                 tool: tool/stock_pot, note: "原文用厚底鍋，鍋徑 24–26 cm；本版改以湯鍋為主，炒鍋為替代做法（家庭改法，不是原文）",
                 completion: [{observe: 豬腹肉, target: 油脂化出, method: 目測, evidence: R1}]}
              - {id: f4, technique: tech/sweat, term: 小火慢炒蔬菜至軟, inputs: [fs_fat, fs_battuto], outputs: [s_soffritto], tool: tool/stock_pot,
                 params: {heat: {level: heat/medium_low, raw: "calore medio basso", evidence: R1}, agitation: {mode: 木勺持續攪拌, continuous: true}},
                 completion: [{observe: 洋蔥, target: 軟化、絕不可有焦味, method: 目測與嗅覺, evidence: R1}]}
      actions:
        - {id: r1, technique: tech/brown, term: 轉大火下絞肉拌炒, inputs: [s_soffritto, r_beef], outputs: [rs_browned], tool: tool/stock_pot,
           params: {heat: {level: null, raw: "Alzare il calore（提高火力）", evidence: R1}, duration: {min_s: 600, max_s: 600, raw: "per una decina di minuti", is_guide: true, evidence: R1, status: sourced}},

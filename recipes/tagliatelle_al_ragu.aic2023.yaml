        - {id: r2, technique: tech/deglaze_reduce, term: 下酒收乾, inputs: [rs_browned, r_wine], outputs: [rs_deglazed], tool: tool/stock_pot,
           completion: [{observe: 氣味, target: 聞不到酒味, method: 嗅覺, evidence: R1}]}
        - {id: r3, technique: tech/combine, term: 加番茄膏與番茄泥, inputs: [rs_deglazed, r_paste, r_passata], outputs: [rs_tomato], tool: tool/stock_pot}
        - {id: r4, technique: tech/simmer_covered, term: 加熱高湯加蓋慢燉, inputs: [rs_tomato, r_broth], outputs: [rs_simmered], tool: tool/stock_pot,
           params: {heat: {level: heat/low, raw: "cuocere piano, a recipiente coperto", evidence: R1},
                    duration: {min_s: 7200, max_s: 10800, raw: "per circa 2 ore (anche 3 ore)", is_guide: true, evidence: R1, status: sourced}},
           control: "持續：按需添加熱高湯（觀察→補加→續燉，單一複合動作內的迴圈）",
           optional_branch: {at: 燉煮中段, input: r_milk, action: 加牛奶並收乾, evidence: R1},
           completion: [{observe: 湯汁, target: 不乾鍋；乾了就補熱高湯, method: 目測, evidence: R1}]}
        - {id: r5, technique: tech/season, term: 以鹽與胡椒調味, inputs: [rs_simmered, r_salt_pepper, r_milk], outputs: [s_ragu], tool: tool/stock_pot,
           note: "r_milk 為可省略的分支材料，實際在 r4 燉煮中段加入（見 r4.optional_branch）；此處列入只為讓材料有去處",
           completion: [{observe: 外觀, target: "深橘色、包覆感、綿滑（arancione scuro, avvolgente e cremoso）", method: 目測, evidence: R1}]}


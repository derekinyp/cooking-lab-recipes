states:
  - {id: s_crushed, label: 壓碎的黑白胡椒}
  - {id: s_seasoned, label: 裹胡椒與海鹽的牛排}
  - {id: s_rare, label: 煎到 rare 的牛排}
  - {id: s_rested, label: 靜置好的牛排}
  - {id: s_final, label: 法式胡椒牛排, role: final}

actions:
  - id: p1
    technique: tech/crush
    term: 黑、白胡椒粒用研缽壓碎
    inputs: [p_black, p_white]
    outputs: [s_crushed]
    tool: tool/mortar_pestle
    completion: [{observe: 胡椒, target: 壓得很碎（crush well）, method: 目測, evidence: H1}]
    note: "原文替代法：沒有研缽就放在平面上，用厚底鍋來回壓碎"
  - id: p2
    technique: tech/season
    term: 牛排用壓碎的胡椒與海鹽調味
    inputs: [p_steak, s_crushed, p_salt]
    outputs: [s_seasoned]
    completion: [{observe: 牛排, target: 表面沾上胡椒與鹽, method: 目測, note: "原文只寫 season，完成狀態為推論"}]
  - id: p3
    technique: tech/pan_fry
    term: 熱平底鍋加一點油，把牛排煎到 rare
    inputs: [s_seasoned, p_oil]
    outputs: [s_rare]
    tool: tool/frying_pan
    params:
      heat: {level: heat/high, raw: null, evidence: H1}
      duration:
        min_s: 120
        max_s: 300
        raw: null
        is_guide: true
        evidence: null
        status: inferred
      temperature: {target: core, min_c: null, max_c: null, raw: "until rare（中心溫度原文沒寫）"}
    completion:
      - observe: 牛排熟度
        target: 煎至表面上色，中心保持偏紅；牛排中心至少達 63°C，依美國農業部整塊牛肉安全溫度。
        method: 目測
        evidence: null
    note: 補寫依據：煎的火候以中火至中小火、每面 120–300 秒為常見範圍；此食譜要求熱鍋煎牛排，採較高火力並依厚度觀察。
  - id: p4
    technique: tech/rest
    term: 牛排取出放一旁靜置
    inputs: [s_rare]
    outputs: [s_rested]
    params: {duration: {min_s: 180, max_s: 180, raw: null, is_guide: true, evidence: null, status: inferred}}
    completion:
      - observe: 牛排
        target: 離鍋靜置 3 分鐘，讓肉汁回穩。
        method: 目測
        evidence: null
    can_overlap: [q1, q2, q3, q4]
    must_finish_before: [p5]
    note: 補寫依據：整塊牛肉離火後靜置 3 分鐘，依食品安全常識表的整塊肉靜置時間。
  - id: p5
    technique: tech/plate
    term: 牛排配胡椒醬上桌
    inputs: [s_rested, s_sauce]
    outputs: [s_final]
    optional_branch: {at: "加完鮮奶油之後、調味之前（原文第 6 步）", action: "牛排若不夠熟，放回鍋中與湯汁一起再煮到想要的熟度", evidence: H1}
    completion: [{observe: 成品, target: 牛排淋上或搭配胡椒醬, method: 目測, note: "上桌方式原文沒寫；原文只建議配粗薯條、沙拉、烤馬鈴薯或烤蔬菜"}]


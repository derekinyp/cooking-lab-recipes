    note: "必須在 p4 牛排離鍋後，用同一只鍋（鍋底留有煎牛排的油與焦香）接著做；規格無法讓子食譜直接吃父層的『鍋底』，以 requires_state 與 note 表達"
    definition:
      recipe:
        id: poivre_pan_sauce.heathcote2015
        version: "1.0"
        kind: sauce
        name: {zh_hant: 胡椒紅酒鮮奶油鍋底醬, fr: sauce au poivre}
        status: cross_checked
      ingredients:
        - {id: q_fond, concept: ing/pan_fond, label: 鍋底（煎牛排後同一只鍋裡的油與焦香）, role: 油脂, qty: {qualitative: 煎完牛排的鍋底, status: inferred, note: "原文第 4 步『Turn down the heat』直接接在同一只鍋；量原文沒寫。規格不足：子食譜無法以父層步驟產出當輸入"}}
        - {id: q_butter, concept: ing/butter, label: 奶油, role: 油脂, qty: {value: 25, unit: g, raw_text: "25g of butter", evidence: H1, status: sourced}}

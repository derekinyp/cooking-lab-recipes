        - {id: q_brandy, concept: ing/brandy, label: 白蘭地, role: 液體, qty: {qualitative: 一點, raw_text: "1 dash of brandy", evidence: H1, status: sourced}}
        - {id: q_wine, concept: ing/red_wine, label: 紅酒, role: 液體, qty: {value: 75, unit: ml, raw_text: "75ml of red wine", evidence: H1, status: sourced}}
        - {id: q_cream, concept: ing/double_cream, label: 高脂鮮奶油（double cream）, role: 液體, qty: {value: 100, unit: ml, raw_text: "100ml of double cream", evidence: H1, status: sourced}}
        - {id: q_green, concept: ing/green_peppercorn, label: 綠胡椒粒, role: 香料, qty: {value: 1, unit: tbsp, raw_text: "1 tbsp of green peppercorns", evidence: H1, status: sourced, note: "英式大匙；不換算毫升。鹽漬或乾燥原文沒寫"}}

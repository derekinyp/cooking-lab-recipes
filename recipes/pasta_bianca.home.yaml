notes:
  main_source: "主來源只有 M。主體數字只照抄 M；T1–T3 只提供 M 沒寫的項目的建議值，T4、T5 只作對照，都不混進主體"
  two_serving: "兩人份（M 是 3 人份）。已確認（2026-11-21 選定）：雞胸肉 150 公克（依據 T3 每人 75g）。照 M 比例 ×⅔：奶油約 33 公克、中筋麵粉約 33 公克、牛奶 400 毫升、玉米筍約 3 根、香菇約 3 至 4 朵、洋蔥約 ⅓ 顆。建議值（有出處）：義大利麵 200 公克（T1 每人 100g）、煮麵水 2 公升與鹽 20 公克（T1／T2 每 100g 麵 1 公升水、每 1 公升水 10g 鹽）、蒜頭 2 瓣（T5／T3）。原文沒寫也沒有建議值：炒料油（T3 一人份 1 大匙是醃雞加煎雞共用，只作參考）、調味鹽（試味）、各步驟火力與時間（除煮麵 6–7 分鐘）"
  burners: "兩口爐：可以先做白醬（平底鍋，1 口爐），同時另一口爐燒煮麵水（湯鍋）；煮麵時另一口爐炒料（炒鍋）。白醬做好離火放旁邊，不佔爐口。原文沒寫要幾口爐，這是推論"
  no_bake: "M 的焗烤是「另外想做成焗烤的話」的選做，本檔不做（起司量、烤溫、烤多久原文都沒寫）"
  compare: "M 煮好的麵撈起放入冷水備用；T2 說濾水後不要再用冷水或熱水沖麵，會沖掉太多澱粉。本檔照 M。另外 T3、T4、T5 的白醬分別用鮮奶油或濃湯粉，做法不同，不混用"
  spicy_split: "主體沒有辣椒、花椒，整盤不辣不麻。要辣的人盛盤後自己加（原文沒有，份量自己抓）"
  missing: "原文沒寫：雞胸肉與義大利麵的克數、麵形、煮麵水量與鹽量、炒料油量、蒜瓣數、調味鹽量、各步驟火力（除白醬的小火）、白醬與炒料的分鐘數、燒水要多久、泡冷水多久、雞肉怎麼看熟、上桌溫度"
  schema_gaps: "can_overlap 不能指向子食譜，白醬和燒水同時做只能寫在 notes。一個切配步驟有三種切法，cut 只能填一種。兩人份換算與建議值沒有專用欄位，只能寫在 note。香菇 5、6朵用 min／max 表示"

          completion: [{observe: 奶油, target: 全部融化, method: 目測, evidence: M}]
          note: "工具改寫（推論）：M 作者回覆煮白醬用『一般般的鐵鍋』，本檔用平底鍋；炒鍋可替代"
        - id: w2
          technique: tech/make_roux
          term: 奶油全部融化後加入麵粉，一直攪拌到有絲滑感
          inputs: [s_butter_melted, w_flour]
          outputs: [s_roux]
          tool: tool/frying_pan
          params:
            heat: {level: heat/low, raw: "承上小火；作者回覆『加麵粉的時候沒有關火』", evidence: M}
            duration: {min_s: null, max_s: null, raw: "時間原文沒寫", status: missing}
            agitation: {mode: 一直攪拌, continuous: true}

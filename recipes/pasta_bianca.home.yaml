          term: 移開火源，分批加入牛奶：先倒約三分之一，確定麵粉都攪開，再加入全部牛奶
          inputs: [s_roux, w_milk]
          outputs: [s_milk_mixed]
          tool: tool/frying_pan
          completion: [{observe: 麵糊, target: 全部的麵粉都攪拌開來，沒有結塊, method: 目測, evidence: M}]
          note: "M 原文寫『先倒入約3/1』，依上下文是三分之一（推論）。作者回覆：加牛奶的時候有關火"
        - id: w4
          technique: tech/simmer
          term: 移回爐上，小火持續攪拌到濃稠，盛起放旁邊備用

    definition:
      recipe:
        id: white_sauce.pasta_bianca.home
        version: "2.0"
        kind: sauce
        name: {zh_hant: 白醬}
        status: cross_checked
        extracted_by: [grokbot]
      ingredients:
        - {id: w_butter, concept: ing/butter, label: 奶油, role: 油脂,
           qty: {value: 50, unit: g, raw_text: "奶油 50g", evidence: M, status: sourced, note: "M 原量（3 人份）；沒寫有鹽或無鹽。兩人份照比例約 33 公克（50 × ⅔ ≈ 33.3）"}}
        - {id: w_flour, concept: ing/all_purpose_flour, label: 中筋麵粉, role: 輔料,
           qty: {value: 50, unit: g, raw_text: "麵粉 50g", evidence: M, status: sourced, note: "M 原量（3 人份）。麵粉種類：作者在留言回覆『我是用中筋麵粉唷』。兩人份照比例約 33 公克"}}
        - {id: w_milk, concept: ing/milk, label: 牛奶, role: 液體,
           qty: {value: 600, unit: ml, raw_text: "牛奶 600cc", evidence: M, status: sourced, note: "M 原量（3 人份）；沒寫全脂或冰的。兩人份照比例 400 毫升（600 × ⅔）"}}
      states:
        - {id: s_butter_melted, label: 融化的奶油}
        - {id: s_roux, label: 攪到絲滑的奶油麵糊}
        - {id: s_milk_mixed, label: 離火加好牛奶的麵糊}
        - {id: s_white_sauce, label: 煮好的白醬}
      actions:
        - id: w1
          technique: tech/melt_butter
          term: 小火將奶油煮融化
          inputs: [w_butter]
          outputs: [s_butter_melted]
          tool: tool/frying_pan
          params:
            heat: {level: heat/low, raw: "小火將奶油煮融化", evidence: M}

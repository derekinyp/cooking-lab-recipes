# 白醬義大利麵（雞肉香菇・爐上版、不焗烤）— B 版，規格 v1.0
# 主來源 M＝愛料理 蓁心蓁意の料理〈白醬義大利麵〉（icook 159170，3 人份、20 分鐘）。本檔數字只照抄 M：
#   奶油 50g、麵粉 50g、牛奶 600cc、玉米筍 4根、香菇 5、6朵、洋蔥 半顆、煮麵約 6-7 分鐘。
#   M 只寫目測詞或沒寫的（雞胸肉「ㄧ大塊」、義大利麵「ㄧ碗公約3人份」、蒜頭「少許」、煮麵水、煮麵鹽「ㄧ些」、炒料油、調味鹽「ㄧ點」）
#   保留原文、標 missing 或定性；有出處的「建議值」只寫在 note 與 notes.two_serving，不進主體數字。
# 兩人份：M 是 3 人份。M 的數字照比例 ×⅔ 的換算只放 notes.two_serving，主體仍是 M 原量。
# 原本以 Dassana（Veg Recipes of India）為主來源的版本存於 research/p2/dassana-版存檔/，不刪。
# 鍋具：煮麵用湯鍋；白醬用平底鍋（M 作者說用「一般般的鐵鍋」）；炒料與拌麵用炒鍋（M 寫「炒」）。工具分配是推論。

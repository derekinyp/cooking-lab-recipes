  oven_airfryer: "M 未使用烤箱、氣炸鍋、蒸籠，不需改用其他廚具。"
  tools_adapt: "原文未指明鍋具；本版煎魚用平底鍋、紅燒用炒鍋，均屬家庭改法（推論）。無料理溫度計、無料理秤；完成判斷只用看、聞、聽、剷動與試吃等感官。"

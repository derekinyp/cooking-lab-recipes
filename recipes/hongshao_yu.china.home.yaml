    technique: tech/cut
    term: 蔥切段；薑去皮切絲；紅辣椒去蒂及籽切細絲
    inputs: [i_scallion, i_ginger, i_chili]
    outputs: [s_scallion_cut, s_ginger_cut, s_chili_cut]
    tool: tool/knife
    params: {cut: {raw: "蔥洗淨，切段；薑去皮，切絲；紅辣椒洗淨，去蒂及籽後切成細絲", evidence: M}}
    completion: [{observe: 配料, target: 切好備用, method: 目測, evidence: M}]
  - id: a3
    technique: tech/heat_oil
    term: 熱鍋下油，開中火燒至油略冒煙
    inputs: [i_oil]
    outputs: [s_hot_oil]
    tool: tool/frying_pan
    params:
      heat: {level: heat/medium, raw: "開中火", evidence: M}
      temperature: {target: oil, min_c: null, max_c: null, raw: "油略冒煙", evidence: M}
    completion: [{observe: 油, target: 略冒煙, method: 目測, evidence: M}]
    note: "家庭改法（推論）：原文未指明鍋具；本版煎魚用平底鍋。油溫只保留原文「略冒煙」，不換算成度數"
  - id: a4
    technique: tech/pan_fry
    term: 魚以小火煎至兩面焦黃，起鍋稍微瀝油
    inputs: [s_fish_scored, s_hot_oil]
    outputs: [s_fish_fried]
    tool: tool/frying_pan
    params:
      heat: {level: heat/low, raw: "以小火煎", evidence: M}
      duration:
        min_s: 300
        max_s: 300
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion: [{observe: 魚皮色澤, target: 兩面焦黃, method: 目測, evidence: M}]
    note: 補寫依據：煎為每面約 120–300 秒的一般做法，兩面合計以 300 秒估計。
  - id: a5
    technique: tech/aromatics
    term: 鍋中放蔥、薑、紅辣椒爆香
    inputs: [s_scallion_cut, s_ginger_cut, s_chili_cut]
    outputs: [s_aromatic]
    tool: tool/wok
    params:
      heat: {level: heat/medium, raw: null, evidence: null}
      duration:
        min_s: 30
        max_s: 60
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion: [{observe: 香氣, target: 爆香、出香, method: 聞, evidence: M}]
    note: "家庭改法（推論）：原文「作法3的鍋繼續加熱」未指明鍋具；本版紅燒用炒鍋。魚此時先起鍋備用（M）；補寫依據：爆香一般以中火或中小火炒 30–120 秒，蔥薑辣椒炒出香氣即可。"
  - id: a6
    technique: tech/braise_red
    term: 魚放回，加醬油、細砂糖、水，中火煮至水滾後關小火，不時剷動魚身以防沾鍋，煮至湯汁收乾
    inputs: [s_aromatic, s_fish_fried, i_soy, i_sugar, i_water]
    outputs: [s_braised]
    tool: tool/wok
    params:
      heat: {level: heat/medium, raw: null, evidence: M}
      duration:
        min_s: 180
        max_s: 300
        raw: null
        is_guide: true
        evidence: null
        status: inferred
      agitation: {mode: 不時剷動魚身以防沾鍋, continuous: false}
    completion:
      - {observe: 湯汁, target: 煮至水滾, method: 目測／聽, evidence: M}
      - {observe: 湯汁, target: 煮至湯汁收乾, method: 目測, evidence: M}
    note: 補寫依據：煮一般以中火或中大火進行 180–900 秒；煮至水滾後轉小火，燒至湯汁收乾。

      level: C
      type: web
      accessed: 2026-11-27
      note: "主來源。材料：肉羹100g、乾香菇5朵、高湯1200cc；調味料 A 太白粉2大匙、水3大匙；B 鹽1/4茶匙、味精1/4茶匙、糖1/4茶匙；C 柴魚片10g、蒜酥10g；D 胡椒粉適量、香油適量、烏醋適量、香菜少許。作法：1.乾香菇泡水切絲；調味料A調成太白粉水備用。2.取一湯鍋，倒入高湯後，加入調味料B、作法1的香菇絲及肉羹煮至湯汁滾沸，放入蒜酥、柴魚片。3.待湯汁再度微滾時關至小火，以邊倒入太白粉水邊用湯勺攪拌的方式勾芡成琉璃芡。4.食用前加香菜、香油、胡椒粉烏醋即可。"

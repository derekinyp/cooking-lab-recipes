      accessed: 2026-11-27
      note: "對照（酸辣肉羹麵，含辣醬入湯底）。原文標 Ingredients (3 to 4 portions)?；肉羹2 cups、無鹽雞高湯5 cups、香菇5朵、木耳4朵、紅蘿蔔1根（作者自註忘記用）、小竹筍1支、香菜一小把、紅蔥頭2瓣、蒜2瓣、橄欖油3 tbsp、烏醋3 tbsp、醬油 some、中式辣醬1 tsp、薑末1 tsp、鹽½ tsp、黑胡椒½ tsp、白胡椒粉 some、玉米粉水 some、鹼麵 some。步驟：爆香紅蔥頭蒜鹽胡椒，medium-high heat 約2分鐘；加香菇木耳炒軟，再加竹筍薑末醬油炒1分鐘；倒高湯、烏醋、辣醬、肉羹，煮滾後轉小火一點 simmer 約10分鐘；加香菜白胡椒；邊攪邊慢慢倒玉米粉水；麵另煮。"

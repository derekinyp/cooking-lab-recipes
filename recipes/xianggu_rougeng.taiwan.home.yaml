notes:
  weekday: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  burners: "全程 1 口爐、1 只湯鍋（M 作法第 2 步寫「取一湯鍋」；來源沒寫爐口數，1 口是依步驟安排的推論）。任何時刻不超過 2 口；另一口爐可同時做別的菜（推論）"
  spicy_split: "M 主體沒有辣椒、花椒；胡椒粉、烏醋、香油、香菜在食用前才加（M 第 4 步），可各自在碗裡分開加，不辣那份不需另外做。對照 S2 的中式辣醬（1 tsp）是在煮湯底時一起下鍋、無法分出；若仿 S2 做法，不辣那份要另外做（家庭改法，推論），辣醬份額原文沒寫、不自編數字。"
  oven_airfryer: "M、S2 的可核實步驟使用湯鍋／鍋具，沒有記載烤箱、氣炸鍋或蒸籠；M 用湯鍋，不需改法。家中無料理溫度計、無料理秤，完成判斷只用看、聞、聽、戳、試吃"
  no_scale: "無秤版：太白粉 2 大匙、水 3 大匙、鹽／味精／糖各 1/4 茶匙照原文匙／茶匙量；肉羹 100g、柴魚片 10g、蒜酥 10g 看包裝標重；高湯 1200cc 用量瓶或杯量（杯容量 M 沒定義，不換算）"

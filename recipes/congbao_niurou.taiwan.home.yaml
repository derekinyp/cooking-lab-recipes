# 蔥爆牛肉（台式家常版）— 起始檔 draft，規格 v1.0
# 主來源 S1＝楊桃美食網〈蔥爆牛肉〉（出處《快樂廚房雜誌第96期》）：牛肉份量、蔥量、醃料、調味料、步驟只用 S1 的數字，不混拼。
# S1 無蠔油、無火力檔位、無份數；S2、S3 放比較表與 notes。
schema_version: "1.0"
recipe:
  id: congbao_niurou.taiwan.home
  version: "1.0"
  kind: dish
  dish_concept: dish/congbao_niurou
  name: {zh_hant: 蔥爆牛肉, zh_hans: 葱爆牛肉, en: Stir-fried beef with scallions}
  variant: 台式家常版
  summary: 牛肉絲先用米酒、醬油、糖、水抓拌吸收，最後拌入太白粉保護；起鍋倒入少許沙拉油，放入蒜片爆香，下牛肉絲拌炒至肉色變白，再下醬油、糖、蔥段、紅椒絲拌炒均勻即起。
  cuisine:
    - {id: cuisine/taiwanese.home, basis: "主來源 S1 為台灣食譜平台楊桃美食網之中式家常料理（編者分類）", claim: primary, evidence: S1}
    - {id: region/taiwan, basis: "主來源為台灣平台，平台本身不單獨證明料理地域歸屬，此為編者分類", claim: primary, evidence: S1}
  flavor_template: {ref: flavor/jiachang, basis: "S1 調味僅醬油與細砂糖，為台灣家常鹹香微甜做法（編者分類）", evidence: S1}
  servings: {value: null, status: missing, note: "S1 未標份數；主料牛肉絲 150 公克"}
  status: cross_checked
  sources:
    - id: S1
      title: "楊桃美食網〈蔥爆牛肉〉（出處《快樂廚房雜誌第96期》）"
      url: https://www.ytower.com.tw/recipe/A01-1206
      level: C
      type: web
      accessed: 2026-11-24
      note: "主來源。材料：牛肉絲150公克、青蔥5支、紅辣椒1支、蒜仁2顆；醃料：米酒1大匙、醬油1大匙、細砂糖1小匙、水1大匙、太白粉1/2小匙；調味料：醬油1大匙、細砂糖1小匙；作法 3 步。頁面標籤 #30分鐘內 #新手入門。未寫份數、火力、沙拉油用量、各步時間、上桌溫度。牛肉不過油，直接拌炒。"
    - id: S2
      title: "愛料理 Hank Chung〈蔥爆牛肉〉（食譜 50247）"
      url: https://icook.tw/recipes/50247
      level: C
      type: web
      accessed: 2026-11-24
      note: "比較用。3人份、5分鐘。步驟：牛肉用醃料醃約10分鐘；3大匙油爆香薑絲、蔥白、蒜末後盛起；油倒入牛肉拌一拌再入鍋炒至半熟；加爆香料與醬油、蠔油、米酒；快熟時放蔥青、紅辣椒段，蔥青變色後倒烏醋拌勻。存檔食材表有名稱與數量（例如火鍋牛肉片 300g、紅辣椒段 3支、蔥段 8支等）。本檔以 S1 為主來源，S2 數字只作對照、不採入主體。作者小撇步：辣椒放最後才放（家裡辣椒太辣），可作為一鍋兩吃改法的參考（推論，S2 沒有提出一鍋兩吃）。"
    - id: S3
      title: "李錦記台灣〈蔥爆牛肉〉美味食譜"
      url: https://tw.lkk.com/zh-hk/recipes/twnds19
      level: C
      type: web
      accessed: 2026-11-24
      note: "比較用（品牌食譜）。材料：牛肉片200克、洋蔥40克、青蔥2根、蒜頭15克、辣椒1條；醃料：蠔油1茶匙、醬油1茶匙、米酒1茶匙、蛋清1顆、太白粉1茶匙，醃約10分鐘；調味料：蠔油1茶匙、醬油1茶匙、米酒1大匙、白胡椒粉1/8茶匙；1大匙油爆香洋蔥絲、蒜片、辣椒片、蔥白，下牛肉拌炒，起鍋前加蔥綠段大火拌炒。S1 無蠔油，此為蠔油用法對照。"
  extracted_by: [kimi, codex]
  changelog:
    - {version: "1.0", date: 2026-11-24, change: "起始檔：主來源 S1（楊桃），份量與步驟全用 S1；S2、S3 比較用", by: kimi}
    - {version: "1.0", date: 2026-11-24, change: "Codex 交叉核對後修正：牛肉改用不指定肥瘦的 ing/beef；爐口安排改標推論、刪去來源沒寫的大火；去掉把直接拌炒寫成『少油版』的說法", by: codex}
    - {version: "1.0", date: 2026-11-27, change: "Codex 4 複核通過（上一輪必修項已修好、未引入新錯誤），升為 cross_checked", by: codex}


      url: https://icook.tw/recipes/50247
      level: C
      type: web
      accessed: 2026-11-24
      note: "比較用。3人份、5分鐘。步驟：牛肉用醃料醃約10分鐘；3大匙油爆香薑絲、蔥白、蒜末後盛起；油倒入牛肉拌一拌再入鍋炒至半熟；加爆香料與醬油、蠔油、米酒；快熟時放蔥青、紅辣椒段，蔥青變色後倒烏醋拌勻。存檔食材表有名稱與數量（例如火鍋牛肉片 300g、紅辣椒段 3支、蔥段 8支等）。本檔以 S1 為主來源，S2 數字只作對照、不採入主體。作者小撇步：辣椒放最後才放（家裡辣椒太辣），可作為一鍋兩吃改法的參考（推論，S2 沒有提出一鍋兩吃）。"

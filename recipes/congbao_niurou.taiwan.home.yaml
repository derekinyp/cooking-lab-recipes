states:
  - {id: s_veg_cut, label: 切段的青蔥、去籽切絲的紅辣椒、蒜片}
  - {id: s_beef_mar, label: 抓拌好醃料的牛肉絲}
  - {id: s_garlic_bloomed, label: 爆香蒜片的油}
  - {id: s_beef_white, label: 拌炒至肉色變白的牛肉絲}
  - {id: s_final, label: 蔥爆牛肉, role: final}

actions:
  - id: a1
    technique: tech/cut
    term: 青蔥切段、紅辣椒去籽切絲、蒜仁切片
    inputs: [i_scallion, i_chili, i_garlic]
    outputs: [s_veg_cut]
    tool: tool/knife
    params: {cut: {shape: cut/duan, raw: "青蔥洗淨、切段；紅辣椒去籽、切絲；蒜仁切片", evidence: S1}}
    completion: [{observe: 配料, target: 切好備用（原文：備用）, method: 目測, evidence: S1}]
    can_overlap: [a2]
  - id: a2
    technique: tech/marinate
    term: 牛肉絲加米酒、醬油、糖、水抓拌，最後加太白粉拌勻
    inputs: [i_beef, i_m_wine, i_m_soy, i_m_sugar, i_m_water, i_m_starch]
    outputs: [s_beef_mar]
    tool: tool/bowl
    params:
      duration: {min_s: null, max_s: null, raw: "S1 沒寫醃多久（對照：S2『醃約10分鐘』、S3『醃約10分鐘』）", status: missing}
    completion:
      - {observe: 牛肉絲, target: 先吸收醬汁風味再拌入太白粉（S1 小撇步）, method: 目測, evidence: S1}
      - {observe: 拌勻, target: 拌勻（原文）, method: 目測, evidence: S1}
    note: "太白粉最後加是 S1 原文要求；醃多久原文沒寫"
  - id: a3
    technique: tech/aromatics
    term: 起鍋倒少許沙拉油，蒜片爆香
    inputs: [i_oil, s_veg_cut]
    outputs: [s_garlic_bloomed]
    tool: tool/wok
    params:
      heat: {level: null, raw: "S1 沒寫火力（S3 起鍋前寫『大火拌炒』，僅對照）"}
      duration: {min_s: null, max_s: null, raw: "原文沒寫時間", status: missing}
    completion: [{observe: 蒜片, target: 爆香（香氣出來；原文沒寫判斷方式）, method: 嗅覺, note: "原文沒寫完成狀態，以嗅覺判斷為推論"}]
    note: "全程用 1 只炒鍋依序做（推論；來源沒寫爐口數或火力）"
  - id: a4
    technique: tech/stir_fry
    term: 下牛肉絲拌炒至肉色變白
    inputs: [s_garlic_bloomed, s_beef_mar]
    outputs: [s_beef_white]
    tool: tool/wok
    params:
      heat: {level: null, raw: "原文沒寫火力"}
      duration: {min_s: null, max_s: null, raw: "原文沒寫時間", status: missing}
    completion: [{observe: 牛肉絲, target: 肉色變白, method: 目測, evidence: S1}]
    note: "S1 沒有過油步驟；倒入少許沙拉油後直接拌炒；S3 也是直接下鍋拌炒，S2 則是先爆香盛起再回鍋。牛肉最怕炒太老（S1 小撇步標題）"
  - id: a5
    technique: tech/stir_fry
    term: 加入調味料、蔥段、紅椒絲，拌炒均勻即可
    inputs: [s_beef_white, i_soy, i_sugar, s_veg_cut]
    outputs: [s_final]
    tool: tool/wok
    params:
      heat: {level: null, raw: "原文沒寫火力"}
      duration: {min_s: null, max_s: null, raw: "原文沒寫時間", status: missing}
    completion: [{observe: 全鍋, target: 拌炒均勻即可（原文；沒寫更具體狀態）, method: 目測, evidence: S1}]
    note: "S1 的紅辣椒絲在此步與蔥段一起下鍋（非一開始爆香），一鍋兩吃可行：先盛出『不辣那份』，剩下的再加辣椒絲拌炒（家庭改法，推論）"

serving:
  completion:
    - {observe: 上桌溫度與時限, target: 原文沒寫, method: null}
  sensory_target: {color: 原文沒寫, taste: 原文沒寫（僅知醬油鹹香帶微甜，由 S1 調味料推論）, texture: 牛肉絲軟嫩、肉汁不流失（S1 小撇步）}

notes:
  weekday: "來源只標頁面標籤『#30 分鐘內』，是否 ≤20 分鐘原文沒寫，平日可不可做待試做計時；S2 標 5 分鐘（不同食譜，只作參考）"
  burners: "步驟用 1 只炒鍋依序進行；來源沒寫爐口數，1 口爐是依步驟安排的推論"
  spicy_split: "S1 的紅辣椒絲在最後一步（a5）才與蔥段同下，不是一開始爆香，可以一鍋兩吃：a5 先盛出『不辣那份』，鍋中剩餘再加辣椒絲拌炒（家庭改法，推論）；S2 作者也把辣椒放最後才放。不需另外做一鍋"
  compare: "S2（愛料理 50247）：3人份、5分鐘；3大匙油先爆香薑絲、蔥白、蒜末盛起，再與牛肉合炒，調味用醬油、蠔油、米酒，起鍋前加蔥青與辣椒段、淋烏醋。S3（李錦記）：牛肉片200克配蔥2根，有洋蔥40克，醃料與調味都有蠔油、米酒、白胡椒，起鍋前蔥綠大火拌炒。S1 無蠔油、無洋蔥、無薑；本檔不加（不混拼）"
  missing: "原文沒寫：份數、沙拉油用量、全部火力檔位、全部時間、醃漬時間、蔥段長度、上桌溫度、成品顏色與味道目標"

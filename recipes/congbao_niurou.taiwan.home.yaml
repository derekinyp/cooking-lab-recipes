states:
  - {id: s_veg_cut, label: 切段的青蔥、去籽切絲的紅辣椒、蒜片}
  - {id: s_beef_mar, label: 抓拌好醃料的牛肉絲}
  - {id: s_garlic_bloomed, label: 爆香蒜片的油}
  - {id: s_beef_white, label: 拌炒至肉色變白的牛肉絲}
  - {id: s_final, label: 蔥爆牛肉, role: final}

actions:
  - id: a1
    technique: tech/cut
    term: 青蔥切段、紅辣椒去籽切絲、蒜仁切片
    inputs: [i_scallion, i_chili, i_garlic]
    outputs: [s_veg_cut]
    tool: tool/knife
    params: {cut: {shape: cut/duan, raw: "青蔥洗淨、切段；紅辣椒去籽、切絲；蒜仁切片", evidence: S1}}
    completion:
      - observe: 配料
        target: 蔥切成方便入口的段，紅辣椒去籽切絲，蒜頭切薄片備用。
        method: 目測
        evidence: null
    can_overlap: [a2]
  - id: a2
    technique: tech/marinate
    term: 牛肉絲加米酒、醬油、糖、水抓拌，最後加太白粉拌勻
    inputs: [i_beef, i_m_wine, i_m_soy, i_m_sugar, i_m_water, i_m_starch]
    outputs: [s_beef_mar]
    tool: tool/bowl
    params:
      duration:
        min_s: 600
        max_s: 1200
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - observe: 牛肉絲
        target: 抓拌到醃料大致吸收，再拌入太白粉，表面均勻薄薄裹上一層。
        method: 目測
        evidence: null
    note: "太白粉最後加是 S1 原文要求；醃多久原文沒寫；補寫依據：參照兩種蔥爆牛肉做法皆醃約 10 分鐘；以 10–20 分鐘家常醃肉範圍安排。"
  - id: a3
    technique: tech/aromatics
    term: 起鍋倒少許沙拉油，蒜片爆香
    inputs: [i_oil, s_veg_cut]
    outputs: [s_garlic_bloomed]
    tool: tool/wok
    params:
      heat: {level: heat/medium_low, raw: null}
      duration:
        min_s: 30
        max_s: 60
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - observe: 蒜片
        target: 蒜香明顯、蒜片邊緣微微轉金黃即可。
        method: 目測
        evidence: null
    note: "全程用 1 只炒鍋依序做（推論；來源沒寫爐口數或火力）；補寫依據：爆香依常識表用小火至中火約 30–120 秒；蒜片易焦，採中小火約 30–60 秒。"
  - id: a4
    technique: tech/stir_fry
    term: 下牛肉絲拌炒至肉色變白
    inputs: [s_garlic_bloomed, s_beef_mar]
    outputs: [s_beef_white]
    tool: tool/wok
    params:
      heat: {level: heat/medium_high, raw: null}
      duration:
        min_s: 60
        max_s: 120
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion: [{observe: 牛肉絲, target: 肉色變白, method: 目測, evidence: S1}]
    note: "S1 沒有過油步驟；倒入少許沙拉油後直接拌炒；S3 也是直接下鍋拌炒，S2 則是先爆香盛起再回鍋。牛肉最怕炒太老（S1 小撇步標題）；補寫依據：炒依常識表用中大火至大火約 60–300 秒；150 公克牛肉絲快速炒至肉色變白，抓 60–120 秒。"
  - id: a5
    technique: tech/stir_fry
    term: 加入調味料、蔥段、紅椒絲，拌炒均勻即可
    inputs: [s_beef_white, i_soy, i_sugar, s_veg_cut]
    outputs: [s_final]
    tool: tool/wok
    params:
      heat: {level: heat/medium_high, raw: null}
      duration:
        min_s: 60
        max_s: 120
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - observe: 全鍋
        target: 蔥段略軟、調味均勻裹上牛肉即可起鍋。
        method: 目測
        evidence: null
    note: "S1 的紅辣椒絲在此步與蔥段一起下鍋（非一開始爆香），一鍋兩吃可行：先盛出『不辣那份』，剩下的再加辣椒絲拌炒（家庭改法，推論）；補寫依據：炒依常識表用中大火至大火約 60–300 秒；加入蔥段、紅椒絲與調味料拌匀至蔥段稍軟，抓 60–120 秒。"


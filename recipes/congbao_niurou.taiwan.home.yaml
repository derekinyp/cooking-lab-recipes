  spicy_split: "S1 的紅辣椒絲在最後一步（a5）才與蔥段同下，不是一開始爆香，可以一鍋兩吃：a5 先盛出『不辣那份』，鍋中剩餘再加辣椒絲拌炒（家庭改法，推論）；S2 作者也把辣椒放最後才放。不需另外做一鍋"
  compare: "S2（愛料理 50247）：3人份、5分鐘；3大匙油先爆香薑絲、蔥白、蒜末盛起，再與牛肉合炒，調味用醬油、蠔油、米酒，起鍋前加蔥青與辣椒段、淋烏醋。S3（李錦記）：牛肉片200克配蔥2根，有洋蔥40克，醃料與調味都有蠔油、米酒、白胡椒，起鍋前蔥綠大火拌炒。S1 無蠔油、無洋蔥、無薑；本檔不加（不混拼）"
  missing: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  total_min: '25'
  time_basis: 蔬菜約 300 公克，備料約 3–5 分鐘；牛肉絲 150 公克，依每 200 公克切肉約 5 分鐘估備料 5 分鐘；醃肉抓拌約 1 分鐘、靜置 10 分鐘；爆香約 1 分鐘、牛肉拌炒約 2 分鐘、合炒約 1 分鐘，合計約 20–25 分鐘，取 25 分鐘。

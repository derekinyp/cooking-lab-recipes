notes:
  weekday: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  burners: "全程 1 口爐、1 只湯鍋（推論；M 沒寫爐口安排）。切配備料可與汆燙平行進行，不佔爐；任何時刻最多 1 口，未超過 2 口。"
  spicy_split: "主體 M 沒有辣椒、花椒、辣豆瓣，整鍋即不辣那份。對照 S1：辣椒末只在沾料（最後分開沾），不辣那份沾料可不加辣椒末；S1 的黃豆瓣醬在作法(4)一開始下鍋，若採 S1 做法，不辣那份要另外做（家庭改法，推論），此改法不編任何數字。"
  oven_airfryer: "M、S1、S2 都沒用烤箱、氣炸鍋或蒸籠，主體不需改蒸。S2 原為 Thermomix 機器食譜；家庭改法（推論）：用湯鍋爐上煮；S2 的機器程式步驟讀不到，不套用其設定。"
  no_scale: "無秤版：M 份量為公克與 cc，來源沒給杯匙換算；鹽1小匙、米酒1大匙可用量匙，冰糖為少許。雞肉 400g 換隻數或塊數原文沒寫，待試做。"
  compare: "S1 走豆醬燉煮路線：丁香魚熬高湯、薑片爆香炒雞塊，加黃豆瓣醬與米酒，大火煮開轉小火燜煮10～15分鐘，另備辣椒末沾料。S2 走蔭鳳梨＋豆豉路線：帶皮帶骨雞腿肉300g、苦瓜300g、蔭鳳梨150g、紅蘿蔔20g、水1200g，總時間 1 h 10 min。三者鳳梨型態不同：M 新鮮鳳梨60g、S1 新鮮鳳梨1/2顆、S2 蔭鳳梨150g。"
  missing: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  spec_gaps: "蔥段分汆燙與煮湯兩處使用、只有總量 10g 無分項數字，只能寫在 note；規格無「分項用量」結構。S1「半鍋水」這類容器相對水量、S2 機器程式步驟，規格均無對應結構。"
  total_min: '75'
  time_basis: 明列煮雞肉 10 分鐘、續煮 25 分鐘；汆燙約 2 分鐘、調味後煮約 5 分鐘；切苦瓜、鳳梨、薑與蔥約 10–15 分鐘，合計約 52–57 分鐘，取 75 分鐘含煮沸與操作餘裕。

    - id: S1
      title: "楊桃美食網〈鳳梨苦瓜雞〉（頁面未顯示上線日期）"
      url: https://www.ytower.com.tw/recipe/iframe-recipe.asp?seq=A03-003
      level: C
      type: web
      accessed: 2026-11-27
      note: "對照。雞1/2隻、鳳梨1/2顆、苦瓜1條、丁香魚1兩、黃豆瓣醬1/3碗、薑片10片、油3大匙；調味：糖1小匙、鹽少許、米酒3大匙；沾料：蔥花1大匙、辣椒末少許、蒜末1小匙、醬油1小匙、香油1小匙。丁香魚熬高湯；薑片爆香炒雞塊至變色，下鳳梨苦瓜拌炒，倒酒與黃豆瓣醬炒勻，回高湯大火煮開轉小火燜煮10～15分鐘；雞肉就著沾料食用。"

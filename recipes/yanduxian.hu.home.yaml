  schema_gaps: "duration 只收秒，權威以 raw 的原文時間為準。每步只能一個火力檔，「煮開再轉小火」只能擇一記錄。size_mm 只能放一個尺寸區間，無法同時表達寬與厚，故寸法只保存在 raw。沒有「與食材齊平」的專用容量欄。原文陶瓷煲可用 tool/clay_pot 記錄，本檔改以湯鍋為主要鍋具，只能把對照與替代寫在 note。"

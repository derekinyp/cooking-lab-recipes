  main_source: "主來源 S1（澎湃轉載《食品與生活》楊周彝）。份量、刀工、黃酒與各段時間全部只取 S1；S2／S3／S4 的數字只出現在比較表與本 notes。Kimi 起草用的下厨房 107507396 無法重開核對，不採用該頁任何數字"
  equipment: "S1 燉煮用陶瓷煲。本檔以湯鍋為主要鍋具，焯水與燉煮皆然；炒鍋或平底鍋可作替代，不改份量、水位與時間。燉湯水只跟原文「與肉塊齊平」"
  electric_cooker: "燉煮段（a6–a8，半小時＋20 分＋5 分）也可改放電鍋內鍋（替代做法）。內鍋水面仍只跟「與肉塊齊平」；外鍋水量原文沒寫，不自編。S1 不是電鍋食譜，不能宣稱電鍋時間與爐上相同，待試做"
  spicy_split: "S1／S3 主體都無辣椒、花椒。S2 起鍋前用白胡椒粉提鮮（胡椒不是花椒的麻），且僅對照來源有，本檔主體不加。若要辣味，盛碗後另加（不辣版分開做；推論，無來源數字）"
  weekday: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  burners: "爐口安排（推論，非原文）：切配與備料不占爐口；汆燙與燉煮可依序用同一口湯鍋完成。原文未寫需要幾口爐，本檔不另填爐口數字"
  author_cautions: "S1 小提示：①春筍不必沸水汆透，以免失去鮮脆嫩；②肉、筍、百葉結不可同時下鍋，因為春筍太熟會偏軟、百葉結容易煮糊爛；③不要加萵筍、青菜、黃豆芽，不要用雞肉／排骨／蹄髈代替五花，不要用冬筍或筍乾代替春筍，不要用火腿代替鹹肉；④不宜燉太久；鹹肉已鹹，不必放鹽，吃口較重才稍加"
  compare: "S2 搜狐（約 3–4 人份）：春筍 2 根（中等大小）、鹹肉 1 小把（約三指寬一條）、豬骨或五花拳頭大、百葉結 5 個左右、蔥 2 根、薑 4 片、料酒 1 勺、鹽半小勺（看鹹肉鹹度再定）、白胡椒少許；鹹肉提前一晚泡水、第二天換 2–3 次水，切成約兩公分厚片；筍加一小勺鹽、水開後煮 5 分鐘撈出過涼水；骨肉冷水下鍋加 2 片薑、1 勺料酒，水開後煮 3 分鐘；砂鍋或厚底鍋加沒過食材兩指的熱水，大火保持翻滾 10 分鐘轉最小火蓋留一縫燉 40 分鐘，下百葉結和春筍塊再燉 15 分鐘，蔥結煮 2 分鐘；強調一定用熱水、鍋蓋留縫，完成看奶白湯。S3 大廚網：春筍 5 支、鹹肉 150 g（切成約 3 cm 塊）、五花 250 g、千張結 15 個、料酒 2 大勺；砂鍋加水大概至四分之三處，大火煮肉、撇沫下酒，小火 30 分，中火下筍 15 分，下千張結後先拌勻再加蓋中火 10 分。S4 自由時報（6–10 人份，餐館式）：五花 200 g、鹹肉 50 g、竹筍 1 支、百頁紙 20 張、青江菜適量、1/4 雞骨架、金華火腿 250 g、米酒 50 g、蒜苗絲少許；五花可蒸約 4 小時（或汆燙去血水），再重壓約 1 小時後切成寬約 1.5 公分長條；鹹肉水滾後轉小火煮約 4 小時，切約 2–3 小塊；雞骨架與金華火腿放入 700 c.c. 滾水中小火燉 8 小時以上至湯頭乳白（或 700 c.c. 滾水加干貝粉／雞粉作簡易高湯）；百頁紙對摺兩次打結，溫水加小蘇打粉浸泡約 1 小時，沖至觸感較澀、完全不滑；砂鍋小火煨至少 40 分鐘至表面一層油膜，起鍋前青江菜約 3 分鐘，上桌前放蒜苗絲。與 S1 差異大，尤其是長時間高湯與用火腿、雞骨，不混用"

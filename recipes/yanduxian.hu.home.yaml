  time_basis: 肉類 600 公克依每 200 公克約備料 5 分鐘估 15 分鐘；春筍、百葉結洗切備料約 5 分鐘；開火時間按來源肉燉 30 分鐘、筍燉 20 分鐘、百葉結汆燙 2 分鐘、百葉結入鍋燉 5 分鐘，肉汆燙與煮沸另估 23 分鐘，合計 100 分鐘。

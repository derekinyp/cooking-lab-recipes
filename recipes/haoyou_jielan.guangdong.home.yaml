  no_scale: "無秤版：芥蘭菜 600 公克看包裝標重或分次估量（推論）；水 600cc 用湯鍋附量杯或湯碗量（推論，原文沒寫量具）；大匙照 M 原文單位，不換算克數。"
  pot_size: "湯鍋容量原文沒寫；已知水 600cc、芥蘭菜 600 公克，建議用裝得下並能翻動的鍋（推論，無來源數字）。"
  compare: "S1 走勾芡蠔油芡路線：調味料加高湯 110㏄、太白粉煮開至濃稠，芥蘭汆燙後沖冷水保持鮮綠，炒熟淋芡。S2 走蒜蓉蠔油汁路線：爆香蒜蓉、下蠔油炒勻、灒酒、鹽糖調味略煮後澆在煮熟芥蘭上；調味份量原文沒寫。"
  decisions: "主來源選 M（F02-1111）：三份中唯一食材與調味全部給出份量、汆燙條件完整；主體份量只用 M 數字，S1、S2 僅進比較表與本節 note。"
  missing: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  total_min: '20'
  time_basis: 600 公克芥蘭洗切約 6–10 分鐘，依每 300 公克約 3–5 分鐘；燒水與汆燙約 10 分鐘，汆燙以水滾後 10 秒計，整體估 20 分鐘。

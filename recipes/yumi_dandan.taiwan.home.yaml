notes:
  weekday: "平日可做（推論依據 M 時間）：M 標準備 2 分鐘、烹煮 8 分鐘（原文分列，未寫總時間）。各步驟細項時間 M 沒寫，待試做計時"
  burners: "全程 1 口爐、1 只湯鍋（家庭安排，推論；M 只寫「鍋裡」，未指定鍋具與爐口數）"
  spicy_split: "M、S1、S2 都沒有辣椒、花椒、辣豆瓣，整鍋就是不辣那份，一鍋兩吃不需分流；白胡椒粉最後調入，不辣那份可少放或不放。要辣／麻者各自在碗裡另加（推論，無來源數字）"
  oven_airfryer: "三份來源都不用烤箱、氣炸鍋、蒸籠；本版廚具為湯鍋與調理碗，不需家庭改法"
  no_scale: "無秤版：玉米茸用罐頭、蛋用顆數、水用杯、生粉與雞粉用湯匙、芝麻油用茶匙；杯、匙容量 M 沒定義，不換算克數"
  compare: "S1（楊桃〈玉米濃湯〉，頁面分類標西式料理）：玉米醬 1 罐、雞蛋 1 顆、高湯 600㏄，小火加鹽、糖、白胡椒粉，太白粉水勾薄芡後熄火才加蛋液。S2（英語部落格）：高湯 5 cups、甜玉米 1 can、蛋 4 顆，另加薑、青蔥；勾芡煮 1 分鐘至濃稠；蛋液與青蔥綠色部分打勻，關火淋入蛋液、靜置 30 秒再拌；正文作法最後淋芝麻油並加剩餘青蔥，結構化食譜步驟只寫淋芝麻油。各家份量差異大，主體只用 M"
  missing: "原文沒寫：生粉種類、勾芡用水實際量、勾芡與下蛋的火力、各步驟時間、蛋花完成狀態（絲狀／片狀）、鍋具大小、杯／湯匙／茶匙容量定義、上桌溫度與時限"

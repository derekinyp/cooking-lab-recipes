states:
  - {id: s_egg_beaten, label: 打散的雞蛋液}
  - {id: s_slurry, label: 調成糊狀的太白粉水}
  - {id: s_soup_base, label: 玉米茸煮滾調味的湯底}
  - {id: s_thickened, label: 勾芡濃稠的湯}
  - {id: s_final, label: 玉米蛋花湯, role: final}

actions:
  - id: a1
    technique: tech/combine
    term: 雞蛋打散成雞蛋液備用
    inputs: [i_egg]
    outputs: [s_egg_beaten]
    tool: tool/bowl
    completion:
      - {observe: 蛋液, target: 打散成雞蛋液（M 步驟 1）, method: 目測, evidence: M}
  - id: a2
    technique: tech/boil
    term: 鍋裡倒入清水加入玉米茸，大火煮沸，放入鮮味雞粉和鹽調味
    inputs: [i_water, i_corn, i_chicken_powder, i_salt]
    outputs: [s_soup_base]
    tool: tool/stock_pot
    params:
      heat: {level: heat/high, raw: "大火煮沸", evidence: M}
      duration: {min_s: null, max_s: null, raw: "原文沒寫這步多久", status: missing}
    completion:
      - {observe: 湯底, target: 煮沸（M 步驟 2「大火煮沸」）, method: 目測、聽, evidence: M}
    note: "M 只寫「鍋裡」，未指定鍋具；用湯鍋為家庭改法（推論）"
  - id: a3
    technique: tech/combine
    term: 用少許水將太白粉調成糊狀（M 寫在煮沸調味之後、勾芡之前）
    inputs: [i_starch, i_slurry_water]
    outputs: [s_slurry]
    tool: tool/bowl
    completion:
      - {observe: 太白粉糊, target: 調成糊狀（M 步驟 2「用少許水將太白粉調成糊狀」）；有無粉粒、濃稠程度原文沒寫, method: 目測, evidence: M}
    note: "粉水比 M 沒寫；勾芡用水只寫「少許水」"
  - id: a4
    technique: tech/thicken
    term: 倒入太白粉糊勾芡，使湯汁濃稠
    inputs: [s_soup_base, s_slurry]
    outputs: [s_thickened]
    tool: tool/stock_pot
    params:
      heat: {level: null, raw: "勾芡火力 M 沒寫"}
      duration: {min_s: null, max_s: null, raw: "原文沒寫勾芡時間", status: missing}
      thickening: {type: 薄芡, starch_ref: i_starch}
    completion:
      - {observe: 湯汁, target: 勾芡使湯汁濃稠（M 步驟 2）；濃稠程度原文沒寫, method: 目測, evidence: M}
    note: "「薄芡」為推論的芡分類；M 原文只寫「勾芡使湯汁濃稠」。對照 S1 寫「勾薄芡」"
  - id: a5
    technique: tech/cuan
    term: 待湯再次燒開後放入蛋液，攪拌後調入白胡椒粉和芝麻油即可
    inputs: [s_thickened, s_egg_beaten, i_pepper, i_sesame]
    outputs: [s_final]
    tool: tool/stock_pot
    params:
      heat: {level: null, raw: "M 只寫「待湯再次燒開後」，未寫火力檔位"}
      duration: {min_s: null, max_s: null, raw: "原文沒寫下蛋與收尾時間", status: missing}
    completion:
      - {observe: 湯底, target: 再次燒開（M 步驟 3「待湯再次燒開後」）, method: 目測、聽, evidence: M}
      - {observe: 蛋液, target: 放入後攪拌，調入白胡椒粉和芝麻油即可（M 步驟 3）；蛋花成形的細緻程度原文沒寫, method: 目測, evidence: M}
    note: "vocab 無「淋蛋液成蛋花」專屬技法，本步暫歸 tech/cuan 是編者分類（推論），M 沒指定技法，只寫湯再次燒開後放入蛋液、攪拌。下蛋時機各來源不同：M 為湯再燒開後下蛋攪拌；S1 為熄火後下蛋略拌；S2 為關火淋蛋靜置 30 秒。"


  name: {zh_hant: 玉米蛋花湯, zh_hans: 玉米蛋花汤, en: Corn egg drop soup}
  variant: 台式家常版
  summary: 清水加入玉米茸大火煮沸，以雞粉和鹽調味；太白粉用少許水調成糊勾芡，待湯再次燒開後淋入蛋液攪拌，最後調入白胡椒粉和芝麻油。
  cuisine:
    - {id: cuisine/taiwanese.home, basis: "編者分類（推論）：本庫把玉米蛋花湯列在台式家常；主來源 M 是品牌台灣官網，來源沒有主張菜系"}
    - {id: region/taiwan, basis: "編者分類（推論）：主來源是李錦記台灣官網；網站所在地不證明料理地域歸屬"}
  flavor_template: null
  servings: {value: 4, status: sourced, evidence: M, note: "M 標『份量 Serves: 4』，主體用 M 原量不縮放"}
  status: cross_checked
  sources:
    - id: M
      title: "李錦記台灣官網〈粟米蛋花湯〉（頁面標題：玉米蛋花湯，小朋友的最愛）"
      url: https://tw.lkk.com/zh-hk/recipes/corn-and-egg-drop-soup
      level: A
      type: official
      accessed: 2026-11-27
      note: "主來源。4 人份；準備 2 分鐘、烹煮 8 分鐘（原文分列）。材料：玉米茸 1 罐、雞蛋 2 個、清水 7 杯、生粉 3 湯匙；調味：李錦記鮮味雞粉 2 湯匙、芝麻油 2 茶匙、白胡椒粉適量、鹽適量。步驟：雞蛋打散成雞蛋液備用；鍋裡倒入清水加入玉米茸，大火煮沸，放入鮮味雞粉和鹽調味，用少許水將生粉調成糊狀勾芡使湯汁濃稠；待湯再次燒開後放入蛋液，攪拌後調入白胡椒粉和芝麻油即可。"
    - id: S1
      title: "楊桃美食網〈玉米濃湯〉（出處《廚房粉類一次弄清楚》）"
      url: https://www.ytower.com.tw/recipe/F05-0222
      level: C
      type: web
      accessed: 2026-11-27
      note: "對照。份數沒寫；玉米醬 1 罐、雞蛋 1 顆、高湯 600㏄；調味：鹽 1/4 茶匙、細砂糖 1/4 茶匙、白胡椒粉 1/4 茶匙、太白粉水 2 大匙。作法：取一湯鍋，倒入高湯及玉米醬煮開，轉小火加入鹽、細砂糖及白胡椒粉；以小火煮開後，用太白粉水勾薄芡拌勻後熄火，加入打散的雞蛋略拌勻即可。頁面標籤 #快速上桌 #30 分鐘內 #新手入門 #一鍋到底；頁面分類標「西式料理」。"
    - id: S2
      title: "Tiffy Cooks〈Super Simple Classic Egg Drop Soup〉"
      url: https://tiffycooks.com/egg-drop-soup/
      level: C
      type: web
      accessed: 2026-11-27
      note: "對照（英語部落格）。4 servings；材料表依序：5 cups Chicken Stock、1 can Sweet Corn、2 Tbsp Sesame Oil、2 Ginger (thin slices)、4 Large Eggs、1 Tsp Salt、1 tsp White Pepper、1 Green Onion（optional）、2 tbsp Corn Starch、1 tsp White Pepper、1 tsp Salt、2 tbsp water（鹽與白胡椒在材料表出現兩次，照錄）。中大火煮 2-3 分鐘，勾芡煮 1 分鐘至濃稠；關火淋入蛋液，靜置 30 秒再拌；正文作法最後淋芝麻油並加剩餘青蔥，結構化食譜步驟只寫淋芝麻油。Cook Time 5 分鐘。"
  extracted_by: [doubao]

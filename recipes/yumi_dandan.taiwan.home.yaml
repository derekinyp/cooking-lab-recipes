  - {id: s_slurry, label: 調成糊狀的太白粉水}
  - {id: s_soup_base, label: 玉米茸煮滾調味的湯底}
  - {id: s_thickened, label: 勾芡濃稠的湯}
  - {id: s_final, label: 玉米蛋花湯, role: final}

actions:
  - id: a1
    technique: tech/combine
    term: 雞蛋打散成雞蛋液備用
    inputs: [i_egg]
    outputs: [s_egg_beaten]
    tool: tool/bowl
    completion:
      - {observe: 蛋液, target: 打散成雞蛋液（M 步驟 1）, method: 目測, evidence: M}
  - id: a2
    technique: tech/boil
    term: 鍋裡倒入清水加入玉米茸，大火煮沸，放入鮮味雞粉和鹽調味
    inputs: [i_water, i_corn, i_chicken_powder, i_salt]
    outputs: [s_soup_base]
    tool: tool/stock_pot
    params:
      heat: {level: heat/high, raw: "大火煮沸", evidence: M}
      duration:
        min_s: 180
        max_s: 420
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - {observe: 湯底, target: 煮沸（M 步驟 2「大火煮沸」）, method: 目測、聽, evidence: M}
    note: "M 只寫「鍋裡」，未指定鍋具；用湯鍋為家庭改法（推論）；補寫依據：清水 7 杯與 1 罐玉米茸加熱至沸騰，依一般家庭煮湯做法估 3–7 分鐘，視爐火與鍋具而定。"
  - id: a3
    technique: tech/combine
    term: 用少許水將太白粉調成糊狀（M 寫在煮沸調味之後、勾芡之前）
    inputs: [i_starch, i_slurry_water]
    outputs: [s_slurry]
    tool: tool/bowl
    completion:
      - observe: 太白粉糊
        target: 攪拌至看不見乾粉和明顯粉粒，呈均勻流動的糊狀。
        method: 目測
        evidence: null
    note: "粉水比 M 沒寫；勾芡用水只寫「少許水」"
  - id: a4
    technique: tech/thicken
    term: 倒入太白粉糊勾芡，使湯汁濃稠
    inputs: [s_soup_base, s_slurry]
    outputs: [s_thickened]
    tool: tool/stock_pot
    params:
      heat: {level: heat/medium, raw: null}
      duration:
        min_s: 30
        max_s: 60
        raw: null
        is_guide: true
        evidence: null
        status: inferred
      thickening: {type: 薄芡, starch_ref: i_starch}
    completion:
      - observe: 湯汁
        target: 湯汁略帶稠度，能薄薄附在湯匙表面。
        method: 目測
        evidence: null
    note: "「薄芡」為推論的芡分類；M 原文只寫「勾芡使湯汁濃稠」。對照 S1 寫「勾薄芡」；補寫依據：湯底保持小滾，太白粉糊分次加入並攪拌至湯汁濃稠，依一般家庭勾芡做法估 30–60 秒。"
  - id: a5
    technique: tech/cuan
    term: 待湯再次燒開後放入蛋液，攪拌後調入白胡椒粉和芝麻油即可
    inputs: [s_thickened, s_egg_beaten, i_pepper, i_sesame]
    outputs: [s_final]
    tool: tool/stock_pot
    params:
      heat: {level: heat/medium, raw: null}
      duration:
        min_s: 30
        max_s: 60
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - observe: 蛋花
        target: 蛋液凝成柔嫩蛋花，湯面重新微滾即可調入白胡椒粉和芝麻油。
        method: 目測
        evidence: null
    note: "vocab 無「淋蛋液成蛋花」專屬技法，本步暫歸 tech/cuan 是編者分類（推論），M 沒指定技法，只寫湯再次燒開後放入蛋液、攪拌。下蛋時機各來源不同：M 為湯再燒開後下蛋攪拌；S1 為熄火後下蛋略拌；S2 為關火淋蛋靜置 30 秒；補寫依據：來源要求湯再次燒開後加入蛋液；中火攪拌至蛋花凝固約需 30–60 秒，依一般家庭煮蛋花湯做法估計。"


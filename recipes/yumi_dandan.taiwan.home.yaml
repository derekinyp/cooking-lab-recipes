  spicy_split: "M、S1、S2 都沒有辣椒、花椒、辣豆瓣，整鍋就是不辣那份，一鍋兩吃不需分流；白胡椒粉最後調入，不辣那份可少放或不放。要辣／麻者各自在碗裡另加（推論，無來源數字）"

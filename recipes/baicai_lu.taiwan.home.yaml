        target: 聞得到蔥、薑與香菇香氣，紅蘿蔔顏色轉亮。
        method: 目測
        evidence: null
    note: "鍋具用炒鍋為家庭慣用選擇（M 只寫「熱鍋」，沒寫鍋型）；補寫依據：爆香依補寫常識表約 30–120 秒；以蔥、薑、香菇與紅蘿蔔出香為止。"
  - id: a5
    technique: tech/simmer
    term: 放入白菜，加高湯與紅蔥肉燥，小火煮約5分鐘至白菜軟爛
    inputs: [s_aromatic, s_cabbage_blanched, i_stock, i_meat_sauce]
    outputs: [s_final]
    tool: tool/wok
    params:
      heat: {level: heat/low, raw: "小火", evidence: M}
      duration: {min_s: 300, max_s: 300, raw: "約5分鐘", is_guide: true, evidence: M, status: sourced}
    completion:
      - observe: 白菜
        target: 葉梗軟透、用筷子能輕易夾斷，湯汁仍略帶濕潤即可。
        method: 目測
        evidence: null
    note: "是否加蓋 M 沒寫；是否收汁 M 沒寫"


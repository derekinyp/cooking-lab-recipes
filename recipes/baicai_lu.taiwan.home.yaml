    note: "家庭改法（推論）：M 未指明鍋具；用湯鍋爐上燒沸水汆燙，不用蒸籠。汆燙後是否沖涼 M 沒寫；補寫依據：汆燙依補寫常識表使用沸水與大火，時間採 30–180 秒範圍；原食譜已給約 30 秒，照原數字操作即可。"

      url: https://www.ytower.com.tw/recipe/F02-0726
      level: C
      type: web
      accessed: 2026-11-28
      note: "主來源。材料：大白菜300公克、泡發香菇50公克、紅蘿蔔絲50公克、蔥段30公克、薑片20公克；調味料：牛頭牌紅蔥肉燥5大匙、牛頭牌原味高湯200㏄。作法：①大白菜切大塊後用沸水汆燙約30秒後撈起瀝乾；泡發香菇切絲備用。②熱鍋下少許油，小火爆香蔥段、薑片、香菇絲、紅蘿蔔絲，再放入作法1的白菜。③加入牛頭牌原味高湯及牛頭牌紅蔥肉燥，以小火煮約5分鐘至白菜軟爛即可。小撇步：辛香料事先爆香散發香氣，再加入所有食材燉滷，比起直接燉滷更香。"
    - id: S1
      title: "楊桃美食網〈開陽白菜〉（出處《點菜率最高的聚餐下飯菜》）"
      url: https://www.ytower.com.tw/recipe/F02-0572
      level: C
      type: web
      accessed: 2026-11-28
      note: "對照。材料：大白菜600公克、乾香菇3朵、蝦米25公克、蒜末10公克、高湯200㏄、太白粉水少許；調味料A：鹽1/2小匙、糖1/4小匙、雞粉1/4小匙；調味料B：香油1小匙。作法：白菜洗淨切片，香菇泡水切絲，蝦米泡水；熱鍋倒2大匙油，蒜末爆香，加香菇絲與蝦米炒香；下白菜炒至微軟，倒高湯蓋鍋蓋燜煮入味後加調味料A炒勻；以太白粉水勾芡，淋入香油即可。燜煮時間與火力原文沒寫。"

notes:
  weekday: "原文沒寫總時間，待試做計時。M 作法可見時間：汆燙約30秒、小火煮約5分鐘；切配與爆香時間 M 沒寫。頁面標籤含 #30 分鐘內（不是 20 分鐘），家庭自訂平日門檻為20分鐘；目前不能直接判定平日可做"
  burners: "M 未寫爐口數；爆香後同鍋加入白菜、高湯與肉燥續煮。汆燙另用湯鍋（家庭改法，推論）；是否與爆香同時進行原文沒寫"
  oven_airfryer: "M、S1 未用烤箱、氣炸鍋、蒸籠；S2 存檔空白，無法核對。汆燙以湯鍋爐上燒沸水代替（家庭改法，推論）。家中無溫度計、無料理秤"
  spicy_split: "主體無辣椒、花椒、辣豆瓣，亦無胡椒（M 調味只有肉燥與高湯）；不辣那份即主體，可直接上桌。若要加白胡椒，最後各自在碗裡加（推論）；本菜不存在辣椒／花椒必須一開始下鍋、無法分出的情況"
  no_scale: "無秤版：大白菜 300 公克、香菇 50 公克等公克數無秤無法直接量（M 未給杯匙換算，不換算）；高湯 200㏄ 可用量米杯或湯匙計量（推論，無來源數字）；肉燥 5 大匙用湯匙量"
  compare: "S1 開陽白菜：白菜 600g、乾香菇 3 朵、蝦米 25g、蒜末 10g、高湯 200㏄、太白粉水少許；鹽 1/2 小匙、糖 1/4 小匙、雞粉 1/4 小匙、香油 1 小匙；油 2 大匙；高湯蓋鍋燜煮入味後勾芡淋香油，燜煮時間與火力原文沒寫。S2 存檔空白，草稿中對其材料、數字與作法的描述無法核對"
  missing: "原文沒寫：份數、油量數字（僅少許）、白菜切塊大小、爆香時間、煮時是否加蓋、是否收汁、成品色澤與味道、上桌溫度與時限、鍋型與鍋子大小、香菇乾鮮來源"
  spec_gaps: "見輸出（E）規格不足段落"

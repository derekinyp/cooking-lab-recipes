# 塔香茄子（台式家常版）— 起始檔，規格 v1.0
# 主來源 M1＝NoobCook〈Claypot Eggplant with Basil（九层塔茄子煲）〉：已開啟公開頁逐句核對；
#   食材與醬汁逐項份量、份數、Prep/Cook 時間、完成狀態句最完整。本檔份量只用 M1，不與其他來源混拼。
# 對照來源 X1–X4 重抓存檔只有驗證／錯誤頁，未採用；X5 存檔可讀，未採用。
# 辣椒與辣豆醬在爆香步驟即下鍋、無法最後分開；不辣那份另做，見 notes.spicy_split。
# 爐口：全程 1 口爐、1 只炒鍋；預熟茄子用電鍋蒸（不占爐口），任何時刻 ≤2 口。

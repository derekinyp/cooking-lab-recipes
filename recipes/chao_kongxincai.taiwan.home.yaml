states:
  - {id: s_kxc_clean, label: 洗淨切段的空心菜}
  - {id: s_aromatics, label: 爆香的蒜頭與薑絲}
  - {id: s_final_mild, label: 蒜炒空心菜（不辣）, role: final}
  - {id: s_final_spicy, label: 蒜炒空心菜（加辣椒絲）, note: "辣版為不辣成品分盤後另加辣椒絲；辣度最後加可分開"}

actions:
  - id: a1
    technique: tech/cut
    term: 空心菜洗淨，切段備用
    inputs: [i_kongxincai]
    outputs: [s_kxc_clean]
    tool: tool/knife
    params: {cut: {shape: cut/duan, raw: "空心菜洗淨，切段備用", evidence: M}}
    completion:
      - observe: 空心菜
        target: 洗淨瀝乾，切成方便入口的段。
        method: 目測
        evidence: null
    note: "洗滌併入本步；段的長度 M 沒寫"
  - id: a2
    technique: tech/aromatics
    term: 熱油鍋，爆香蒜頭、薑絲
    inputs: [i_oil, i_garlic, i_ginger]
    outputs: [s_aromatics]
    tool: tool/wok
    params:
      heat: {level: heat/medium_low, raw: null, evidence: M}
      duration:
        min_s: 30
        max_s: 120
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - observe: 蒜頭與薑絲
        target: 聞到蒜香與薑香，蒜頭尚未變焦褐色。
        method: 目測
        evidence: null
    note: "鍋具用炒鍋為家庭慣用選擇（M 只寫『鍋』沒寫鍋型）。不辣那份：本步維持原樣；補寫依據：爆香依補寫常識表使用小火至中火，約 30–120 秒；蒜香出來即可下菜。"
  - id: a3
    technique: tech/stir_fry_quick
    term: 加入空心菜，以大火快炒至變色，加鹽、雞粉拌炒均勻即可盛出
    inputs: [s_aromatics, s_kxc_clean, i_salt, i_chicken_powder]
    outputs: [s_final_mild]
    tool: tool/wok
    params:
      heat: {level: heat/high, raw: "以大火快炒至變色時", evidence: M}
      duration:
        min_s: 60
        max_s: 180
        raw: null
        is_guide: true
        evidence: null
        status: inferred
      agitation: {mode: 拌炒, continuous: true}
    completion:
      - observe: 空心菜
        target: 葉片轉深綠、菜梗轉亮並仍帶脆度，調味拌勻即可盛出。
        method: 目測
        evidence: null
    note: "M 作法兩步原文即為本步；時間長短原文沒寫，完成以變色為準。「連續翻炒」是依快炒做法的推論，M 沒明寫；補寫依據：炒依補寫常識表約 60–300 秒；空心菜量少且要求大火快炒，以 60–180 秒觀察至變色。"
  - id: a4
    technique: tech/toss_in
    term: 辣椒絲最後分開加
    inputs: [s_final_mild, i_chili]
    outputs: [s_final_spicy]
    tool: tool/wok
    params:
      heat: {level: null, raw: "原文沒寫（M 原文是開頭與蒜同爆）"}
      duration: {min_s: null, max_s: null, raw: "原文沒寫", status: missing}
    completion:
      - observe: 辣椒絲
        target: 拌入吃辣那份即可，不辣份保持未接觸辣椒。
        method: 目測
        evidence: null
    note: "家庭改法（推論）：M 原文辣椒絲在 a2 與蒜頭、薑絲同爆；因家中要『不辣不麻』一份，本檔把辣椒絲改為起鍋後分盤、最後拌入辣的那份，一鍋兩吃；不辣那份完全不接觸辣椒。辣的那份用鍋餘溫或小火拌一下即可，火力與時間原文沒寫"

serving:
  completion:
    - {observe: 上桌溫度與時限, target: 炒好立即盛盤上桌。, method: null, evidence: null, note: 補寫依據：一般家庭做法，空心菜快炒後趁熱食用，顏色與脆度較佳。}
  sensory_target: {color: "顏色很綠很漂亮（M 小撇步）", texture: 菜梗爽脆、葉片柔軟，不過度軟爛。, taste: 蒜香與薑香明顯，鹹淡適中；辣椒份帶微辣。}

notes:
  weekday: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  burners: "全程 1 口爐、1 只炒鍋；任何時刻不超過 2 口"
  no_scale: "無秤版：空心菜照原文 6 兩（看攤販台兩標示）；蒜頭 2 瓣數數即可；鹽、雞粉為『少許』，邊炒邊試吃（推論）"
  spicy_split: "主體（a1–a3）無辣椒、無花椒、無麻味來源；辣椒絲集中在 a4 最後分開加，不辣那份即 s_final_mild，可直接上桌，無需另外做一鍋。花椒、辣豆瓣本菜皆無"
  decisions: "主來源選 M：M 有明確菜量（6 兩）、蒜量（2 瓣）、火力（大火）與完成狀態（變色），比 C1 完整；C1 份量（1把、大匙）不混入主體"
  missing: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  spec_gaps: "見輸出（E）規格不足段落"
  total_min: '20'
  time_basis: 空心菜洗切約 3–5 分鐘；爆香約 1 分鐘、快炒約 1–3 分鐘，另計熱鍋與備料整理時間，抓整數約 20 分鐘。

  - {id: i_ginger, concept: ing/ginger, label: 薑絲, form: 絲, role: 香料, qty: {value: 1, unit: tsp, raw_text: "薑絲少許", evidence: M, status: inferred, note: "M 原量（定性）；刀工對 cut/si_fine；補寫依據：一般家庭做法以 1 小匙薑絲提香，和蒜頭一同爆香即可。"}}
  - {id: i_chili, concept: ing/chili_fresh, label: 辣椒絲, form: 絲, role: 香料, optional: true, qty: {value: 1, unit: tsp, raw_text: "辣椒絲少許", evidence: M, status: inferred, note: "M 原文辣椒絲與蒜頭、薑絲一起爆香；本檔依一鍋兩吃需求改為最後分開加（家庭改法，推論），見 a4；補寫依據：一般家庭做法以 1 小匙辣椒絲作為額外辣味配料，最後加入吃辣那份。"}}
  - {id: i_salt, concept: ing/salt, label: 鹽, role: 調料, qty: {value: 0.25, unit: tsp, raw_text: "鹽少許", evidence: M, status: inferred, note: "M 只寫『少許』，無數字；補寫依據：一般家庭做法先用 1/4 小匙鹽調味，再視口味少量增減。"}}
  - {id: i_chicken_powder, concept: ing/chicken_powder, label: 雞粉, role: 調料, qty: {value: 0.25, unit: tsp, raw_text: "雞粉少許", evidence: M, status: inferred, note: "M 只寫『少許』。對照 C1『雞粉0.5匙』（大匙或小匙原文沒寫；不同來源，只作參考）；補寫依據：一般家庭做法先用 1/4 小匙雞粉提鮮，再視口味少量增減。"}}

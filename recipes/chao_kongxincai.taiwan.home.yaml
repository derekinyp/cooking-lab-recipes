# 蒜炒空心菜（台式家常版）— 起始檔，規格 v1.0
# 主來源 M＝楊桃美食網〈炒空心菜〉（出處《10分鐘做廣東粥》）：空心菜 6兩、蒜頭 2瓣、
# 薑絲／辣椒絲／鹽／雞粉 少許，大火快炒至變色。份量只用 M 的數字，不混拼。
# 對照 C1＝Cookpad 台灣站 May〈蒜炒空心菜〉：蒜末 1大匙、橄欖油 1大匙、雞粉 0.5匙、
# 2人份、預備 10 分鐘＋步驟 10 分鐘，只放比較表與 note。
# 單位「兩」照原文保留，詞表 unit/liang，不換算克數。

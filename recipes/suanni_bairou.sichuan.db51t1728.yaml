states:
  - {id: s_pork_cooked, label: 煮到剛熟的整塊豬肉（連原湯）}
  - {id: s_pork_warm, label: 原湯浸泡至溫熱的豬肉}
  - {id: s_slices, label: 皮肉相連的薄片}
  - {id: s_dressed, label: 拌好味汁的肉片}
  - {id: s_final, label: 蒜泥白肉, role: final}

actions:
  - id: w1
    technique: tech/boil
    term: 豬肉煮至剛熟
    inputs: [w_pork, w_water]
    outputs: [s_pork_cooked]
    tool: tool/stock_pot
    params: {duration: {min_s: null, max_s: null, raw: "原文沒寫煮多久", status: missing}, heat: {level: null, raw: "原文沒寫火力"}}
    completion: [{observe: 豬肉, target: 剛熟（表 1：煮至刚熟）, method: null, evidence: S1, note: "判熟方法原文沒寫"}]
  - id: w2
    technique: tech/soak_in_broth
    term: 用原湯浸泡至溫熱，撈出
    inputs: [s_pork_cooked]
    outputs: [s_pork_warm]
    tool: tool/stock_pot
    params: {duration: {min_s: null, max_s: null, raw: "原文沒寫泡多久", status: missing}}
    completion: [{observe: 豬肉, target: 浸泡至溫熱, method: null, evidence: S1, note: "檢測方法原文沒寫；『使其吸收水分，便於刀工處理』是表 1 的目的說明，不是完成條件"}]
    note: "家庭安排（推論）：浸泡可關火，不佔爐口；原文只寫浸泡"
  - id: w3
    technique: tech/cut
    term: 片（或切）成皮肉相連的薄片
    inputs: [s_pork_warm]
    outputs: [s_slices]
    tool: tool/knife
    params: {cut: {shape: cut/pian_thin_skin_on, size_mm: {min: null, max: null}, raw: "长约10cm、宽约5cm、厚约0.15cm的薄片", evidence: S1,
                   note: "原文是『約』值且有長寬厚三維，size_mm 不寫成固定上下限、留空；以 raw 的原文為準"}}
    completion: [{observe: 肉片, target: 皮肉相連、厚薄均勻, method: 目測, evidence: S1}]
    risk: "肉片很薄，刀工是最難的一步（料理提醒，非原文）"
  - id: w4
    technique: tech/ban
    term: 放入肉片拌勻
    inputs: [s_slices, s_sauce]
    outputs: [s_dressed]
    tool: tool/bowl
    completion: [{observe: 肉片, target: 與味汁拌勻, method: 目測, evidence: S1}]
  - id: w5
    technique: tech/plate
    term: 裝盤（可先墊蔬菜）
    inputs: [s_dressed, w_veg]
    outputs: [s_final]
    completion: [{observe: 成品, target: 裝盤；可選用蔥、黃瓜、青筍等蔬菜墊底, method: 目測, evidence: S1}]

serving:
  completion:
    - {observe: 上桌溫度, target: 常溫, evidence: S1}
    - {observe: 製作完成至食用, target: "1 小時內食用為宜", evidence: S1}
  sensory_target: {color: 色澤紅亮, taste: 鹹、鮮、辣、微甜，蒜味濃厚, texture: 肉片厚薄均勻、肉質軟嫩}

notes:
  hongyou: "振達 2026-11-20 決定：紅油直接用市售辣椒油，不自製（原自製子食譜的油量、辣椒量、油溫、產量都是原文沒寫，已移除）。用量 35 g 依 DB51/T 1728 表 A.1。之前 Kimi 提的下廚房 C 級配方（https://www.xiachufang.com/recipe/100526289/）不採用"
  burners: "複製醬油前一天做；辣椒油用市售；當天只有煮肉 1 口爐"
  cross_check: "兩邊比對過（2026-11-20）：Kimi 主抽＋獨立複核；Codex 交叉核對 19:51 補跑成功（codex-X1-suanni-retry.md（1 分 55 秒））；不一致逐項以原文裁決，紀錄見 research/p1/核對紀錄-蒜泥白肉.md"

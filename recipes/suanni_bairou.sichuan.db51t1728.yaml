# 蒜泥白肉（四川傳統，地方標準版）— 正式檔，規格 v1.0。三層遞迴：複製醬油 → 蒜泥味汁 → 蒜泥白肉（辣椒油用市售成品）
# 數值全部來自 DB51/T 1728-2014 附錄 A.1、表 1 第 1 列與表 1 注 a（複製醬油製法有克數）。
# 辣椒油：振達 2026-11-20 決定直接用市售辣椒油（紅油），不再有自製紅油子食譜；用量 35 g 依表 A.1。
# 爐口（家庭安排，非原文）：複製醬油可前一天做（1 口）；當天只有煮肉 1 口。任何時刻不超過 2 口。

        target: 烏醋均勻淋入，芹菜珠散在米粉中。
        method: 目測
        evidence: null
    note: "重點 3：淋烏醋再燜，醋香味濃。"
  - id: a11
    technique: tech/rest
    term: 上蓋燜 1 分鐘

  - {id: s_noodle_soaked, label: 燜軟翻鬆的米粉}
  - {id: s_shallot_fragrant, label: 爆香的紅蔥頭}
  - {id: s_meat_fragrant, label: 煸香的肉絲、香菇絲與蝦米}
  - {id: s_veg_soft, label: 煮軟的高麗菜絲與紅蘿蔔絲}
  - {id: s_sauce_boiling, label: 調味料水煮滾的鍋底}
  - {id: s_noodle_braised, label: 上蓋燜過的米粉}
  - {id: s_dry, label: 湯汁收乾的米粉}
  - {id: s_vinegar, label: 淋上烏醋與芹菜珠的米粉}
  - {id: s_rested, label: 蓋鍋燜過的米粉}
  - {id: s_final, label: 炒米粉, role: final}

actions:
  - id: a1
    technique: tech/cut
    term: 肉絲、紅蘿蔔絲、高麗菜絲、香菇絲切絲；紅蔥頭切碎；芹菜切珠
    inputs: [i_pork, i_carrot, i_cabbage, i_shiitake, i_shallot, i_celery]
    outputs: [s_prep_cut]
    tool: tool/knife
    params: {cut: {shape: cut/si, raw: "材料名稱含「絲／碎／珠」；M 作法未寫切配動作", evidence: M}}
    completion:
      - observe: 備料
        target: 豬肉、紅蘿蔔、高麗菜與香菇切成細絲，紅蔥頭切碎，芹菜切成小珠。
        method: 目測
        evidence: null
    note: "刀工形狀來自 M 材料名稱；M 作法步驟未描述切配。"
  - id: a2
    technique: tech/blanch
    term: 燒一鍋水，放入米粉汆燙至滾，濾掉水分
    inputs: [i_noodle]
    outputs: [s_noodle_blanched]
    tool: tool/stock_pot
    params:
      heat: {level: heat/high, raw: null}
      duration:
        min_s: 60
        max_s: 180
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - observe: 米粉與水
        target: 水滾後米粉散開變軟，撈起瀝乾。
        method: 目測
        evidence: null
    note: "家庭改法（推論）：M 寫「燒一鍋水」未指定鍋具；家庭無蒸籠，汆燙用湯鍋。重點 1：米粉不泡水，燙過再燜口感最Q；補寫依據：汆燙使用沸水，依常識表汆燙火候用大火、時間 20–180 秒；米粉燙至水再度滾起即可瀝水。"
  - id: a3
    technique: tech/rest
    term: 蓋上鍋蓋，燜 3 分鐘至米粉軟透，開蓋翻鬆米粉
    inputs: [s_noodle_blanched]
    outputs: [s_noodle_soaked]
    tool: tool/stock_pot
    params: {duration: {min_s: 180, max_s: 180, raw: "燜3分鐘至米粉軟透", is_guide: true, evidence: M, status: sourced}, heat: {level: heat/low, raw: null, evidence: null}}
    completion: [{observe: 米粉, target: 軟透，開蓋翻鬆（原文）, method: 目測, evidence: M}]
    note: 補寫依據：蓋鍋燜米粉依一般家庭做法轉小火；來源明列燜 3 分鐘。
  - id: a4
    technique: tech/aromatics
    term: 熱鍋倒入 3 大匙沙拉油，紅蔥頭碎入鍋爆香
    inputs: [i_oil, i_shallot]
    outputs: [s_shallot_fragrant]
    tool: tool/wok
    params: {heat: {level: heat/medium_low, raw: null}, duration: {min_s: 30, max_s: 120, raw: null, is_guide: true, evidence: null, status: inferred}}
    completion:
      - observe: 紅蔥頭
        target: 香氣明顯、邊緣微微轉金黃。
        method: 目測
        evidence: null
    note: 補寫依據：紅蔥頭爆香依常識表使用小火至中小火，時間 30–120 秒。
  - id: a5
    technique: tech/stir_fry
    term: 放入豬肉絲煸至肉焦香，再放入香菇絲、蝦米炒香
    inputs: [s_shallot_fragrant, s_prep_cut, i_shrimp]
    outputs: [s_meat_fragrant]
    tool: tool/wok
    params:
      heat: {level: heat/medium, raw: null}
      duration:
        min_s: 300
        max_s: 900
        raw: null
        is_guide: true
        evidence: null
        status: inferred
      agitation: {mode: 翻炒, continuous: true}
    completion:
      - observe: 豬肉絲
        target: 肉絲表面微焦、沒有生肉色，聞得到肉香。
        method: 目測
        evidence: null
      - observe: 香菇絲、蝦米
        target: 香氣飄出，香菇略收乾。
        method: 目測
        evidence: null
    note: 補寫依據：肉絲煸香、香菇與蝦米炒香依常識表煸炒使用中火至中小火，合計約 5–15 分鐘；肉絲炒至表面焦香且熟透，絞肉安全溫度 71°C 不適用於此整條肉絲。
  - id: a6
    technique: tech/stir_fry
    term: 加入高麗菜絲、紅蘿蔔絲煮軟
    inputs: [s_meat_fragrant, s_prep_cut]
    outputs: [s_veg_soft]
    tool: tool/wok
    params:
      heat: {level: heat/medium_high, raw: null}
      duration:
        min_s: 180
        max_s: 300
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - observe: 蔬菜
        target: 高麗菜變軟、紅蘿蔔略軟，仍保有形狀。
        method: 目測
        evidence: null
    note: 補寫依據：蔬菜下鍋翻炒煮軟依常識表炒菜使用中大火至大火，約 3–5 分鐘。
  - id: a7
    technique: tech/boil
    term: 再加入水、醬油、細砂糖、白胡椒粉煮滾
    inputs: [s_veg_soft, i_water, i_soy, i_sugar, i_pepper]
    outputs: [s_sauce_boiling]
    tool: tool/wok
    params: {duration: {min_s: 180, max_s: 300, raw: null, is_guide: true, evidence: null, status: inferred}, heat: {level: heat/medium_high, raw: null, evidence: null}}
    completion:
      - observe: 鍋中湯汁
        target: 湯汁表面持續冒泡，達到沸騰。
        method: 目測
        evidence: null
    note: 補寫依據：湯汁煮滾依常識表煮的火候與時間範圍；調味液沸騰即可下米粉。
  - id: a8
    technique: tech/simmer_covered
    term: 加入燙過的米粉略翻動均勻，轉中火，上蓋燜 2 分鐘
    inputs: [s_sauce_boiling, s_noodle_soaked]
    outputs: [s_noodle_braised]
    tool: tool/wok
    params:
      heat: {level: heat/medium, raw: "轉中火", evidence: M}
      duration: {min_s: 120, max_s: 120, raw: "上蓋燜2分鐘", is_guide: true, evidence: M, status: sourced}
      agitation: {mode: 略翻動, continuous: false}
    completion:
      - observe: 米粉
        target: 米粉均勻沾上湯汁，燜後柔軟入味。
        method: 目測
        evidence: null
  - id: a9
    technique: tech/reduce
    term: 開蓋翻動米粉至湯汁收乾
    inputs: [s_noodle_braised]
    outputs: [s_dry]
    tool: tool/wok
    params: {duration: {min_s: 60, max_s: 240, raw: null, is_guide: true, evidence: null, status: inferred}, agitation: {mode: 翻動, continuous: true}, heat: {level: heat/medium, raw: null, evidence: null}}
    completion:
      - observe: 湯汁
        target: 鍋底看不見游動湯汁，米粉濕潤但不泡湯。

  completion:
    - {observe: 上桌溫度與食用時限, target: 原文沒寫, method: null}
  sensory_target: {taste: "M 未寫成品味型描述；調味為醬油、糖、白胡椒，起鍋前淋烏醋（依 M 材料推得）", texture: "M 重點寫「燙過再燜口感最Q」；其餘口感原文沒寫"}

notes:
  weekday: "不可判定：M 未標總烹調時間。可計時的燜製為 3＋2＋1 分鐘；切配、爆香、煸肉、炒蔬菜、收汁時間原文沒寫，待試做計時。平日（家庭條件：平日菜 ≤20 分鐘，是使用者自訂判準，非來源數字）可不可做，待試做確認。"
  burners: "家庭改法（推論）：汆燙／燜米粉用湯鍋，炒料用炒鍋，兩者先後進行；M 未指定鍋具，爐口數原文沒寫。"
  spicy_split: "M 主體沒有辣椒、花椒、辣豆瓣，整鍋即不辣那份。白胡椒粉在 a7 與其他調味料一起下鍋；若要分成兩碗，可把白胡椒粉改最後各自在碗裡加（推論，M 原文是下鍋）。烏醋不是辣味。對照 S1 用 TOBASCO 1 茶匙（辣味調味），若做 S1 版本，辣味需另外評估分開方式，本檔不採用。"
  oven_airfryer: "三份來源都沒有使用烤箱、氣炸鍋或蒸籠；家庭廚具不需改法。M 米粉前處理是汆燙後蓋鍋燜，用湯鍋即可，不需蒸籠。"
  no_scale: "無秤版：M 份量以公克／cc／茶匙／大匙為主；無秤時 g、cc 無法換算成杯匙（原文沒給對應），茶匙、大匙照原文用量取。"
  compare: "S1《廈門炒米粉》（出版書轉錄）：細米粉 1/2 包、火腿片 2 片、韭黃 20 公克、蝦仁 50 公克、銀芽 30 公克、青椒絲 20 公克、紅椒絲 10 公克、洋蔥絲 40 公克、蒜末 1/2 茶匙、水 200㏄；沙拉油 2 大匙（作法第 2 步，不算入 M 材料）；蠔油 1 大匙、鹽 1/4 茶匙、蕃茄醬 1 大匙、TOBASCO 1 茶匙、糖 1 茶匙、胡椒粉 1/2 匙；滾水一滾起撈出、用盤子蓋上燜約 5 分鐘；最後炒 2 分鐘。S2《新竹米粉》（英文部落格）：4 人份；細米粉 300 g 溫水泡約 8 分鐘；豬肉 250 g、蝦米 40 g、乾香菇 6 朵、高麗菜 300 g、紅蘿蔔 2 根、紅蔥頭 6 瓣、青蔥 4 支；醬油 3 大匙、深色醬油 1 大匙、米酒 1 大匙、糖 1 茶匙、白胡椒 1 茶匙、高湯 250 ml＋泡香菇水；油 4 大匙；Prep 30 分鐘＋浸泡、Cook 20 分鐘。"
  missing: "原文沒寫：份數、米粉種類（新竹／埔里、炊粉／水粉）、豬肉部位、乾香菇乾重、泡香菇水是否入菜、蝦米是否泡水、汆燙在滾水中的時間、各步火力（僅 a8 寫轉中火）、爆香／煸肉／炒蔬菜／收汁時間、總時間、成品色澤口感描述、鍋具種類與大小、上桌溫度與時限。"

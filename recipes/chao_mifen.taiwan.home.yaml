    note: 補寫依據：收汁依常識表使用中火至中大火，約 1–4 分鐘；看到鍋底湯汁收乾即可。
  - id: a10
    technique: tech/season
    term: 關火淋入烏醋和芹菜珠
    inputs: [s_dry, i_vinegar, i_celery]
    outputs: [s_vinegar]
    tool: tool/wok
    completion:

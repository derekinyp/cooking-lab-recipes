    completion: [{observe: 豬肉, target: 切成片, method: 目測, evidence: S1}]
  - id: a3
    technique: tech/cut
    term: 蒜苗切成馬耳朵形或長約 4cm 的節
    inputs: [i_sprout]
    outputs: [s_sprout_cut]
    tool: tool/knife
    params: {cut: {shape: cut/ma_er_duo, size_mm: {min: null, max: null}, raw: "蒜苗切成馬耳朵形或長約 4cm 的節", evidence: S1, note: "馬耳朵形原文未給尺寸；4cm 為近似值"}}
    completion: [{observe: 蒜苗, target: 馬耳朵形或長約 4cm 的節, method: 目測, evidence: S1}]
  - id: a4
    technique: tech/heat_oil
    term: 豆腐入 210℃ 油中煎（或炸）
    inputs: [i_oil]
    outputs: [s_oil_210]
    tool: tool/frying_pan
    params:
      temperature: {target: oil, min_c: 210, max_c: 210, raw: "入 210℃油中煎（或炸）", evidence: S1}
      heat: {level: heat/medium_high, raw: null, evidence: S1}
      duration:
        min_s: 120
        max_s: 300
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion: [{observe: 油溫, target: 210℃（原文度數保留；家用無溫度計，感官判斷法原文沒寫，待試做校準，不換算成幾成熱）, method: null, evidence: S1}]
    note: "家庭改法（推論）：標準寫『煎（或炸）』、未指明鍋具；家用無炸鍋，改用平底鍋少油煎。對照 S2 熱鍋約 1 大匙油煎至兩面焦黃、S4 平底鍋 2 大匙油中大火煎至兩面金黃；家庭用油量原文沒另給，不補；補寫依據：煎一般以中火或中小火每面 120–300 秒，豆腐煎至兩面變黃即可。"
  - id: a5
    technique: tech/pan_fry
    term: 煎至兩面變黃時撈出
    inputs: [s_tofu_cut, s_oil_210]
    outputs: [s_tofu_fried]
    tool: tool/frying_pan
    completion:
      - {observe: 豆腐兩面, target: 兩面變黃（D.9.2.1）, method: 目測, evidence: S1}
      - {observe: 豆腐外皮, target: 皮酥、色金黃（表 4）, method: 目測, evidence: S1}
  - id: a6
    technique: tech/heat_oil
    term: 鍋中放油燒至 150℃
    inputs: [i_oil]
    outputs: [s_oil_150]
    tool: tool/wok
    params:
      temperature: {target: oil, min_c: 150, max_c: 150, raw: "鍋中放油燒至 150℃", evidence: S1}
      heat: {level: heat/medium, raw: null}
      duration:
        min_s: 120
        max_s: 180
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion: [{observe: 油溫, target: 150℃（原文度數保留；感官判斷法原文沒寫）, method: null, evidence: S1}]
    note: "家庭安排（推論）：與 a7 同一炒鍋；食用油在煎豆腐與炒肉片之間怎麼分配，原文沒寫，不另補油量；補寫依據：一般家庭炒肉片以中火快炒至變色熟透，約 120–180 秒。"
  - id: a7
    technique: tech/stir_fry
    term: 放入肉片炒熟
    inputs: [s_oil_150, s_pork_cut]
    outputs: [s_meat_cooked]
    tool: tool/wok
    params: {agitation: {mode: 炒散}, heat: {level: heat/medium, raw: null, evidence: null}, duration: {min_s: 120, max_s: 180, raw: null, is_guide: true, evidence: null, status: inferred}}
    completion: [{observe: 肉片, target: 炒熟（原文「放入肉片炒熟」）, method: 目測, evidence: S1}]
    note: 補寫依據：炒一般以中火或中大火 60–300 秒，炒至肉片變色熟透即可。
  - id: a8
    technique: tech/aromatics
    term: 入郫縣豆瓣炒香
    inputs: [s_meat_cooked, i_douban]
    outputs: [s_douban_fragrant]
    tool: tool/wok
    params: {agitation: {mode: 翻炒}, heat: {level: heat/medium, raw: null, evidence: null}, duration: {min_s: 30, max_s: 60, raw: null, is_guide: true, evidence: null, status: inferred}}

    inputs: [i_tofu]
    outputs: [s_tofu_cut]
    tool: tool/knife
    params:
      cut: {shape: cut/pian, size_mm: {min: null, max: null}, raw: "豆腐切成長約 6cm、寬約 3cm、厚約 0.5cm 的片", evidence: S1, note: "三維尺寸（長/寬/厚）規格 range_mm 只有一對 min/max，細節留在 raw"}
    completion: [{observe: 豆腐, target: 長約 6cm、寬約 3cm、厚約 0.5cm 的片, method: 目測, evidence: S1}]
  - id: a2
    technique: tech/cut
    term: 豬肉切成片
    inputs: [i_pork]
    outputs: [s_pork_cut]

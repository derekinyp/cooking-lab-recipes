# 家用條件：兩口瓦斯爐（同時最多 2 口）；廚具＝電鍋（大同式外鍋加水蒸）、炒鍋、平底鍋、湯鍋；
#           無烤箱、氣炸鍋、蒸籠、料理溫度計、料理秤。完成判斷只用感官（看、聞、聽、戳、試吃）。

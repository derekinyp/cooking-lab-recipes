    constraint: "表 1 注：豆瓣應先剁細再入鍋炒香；剁細併在此說明，不另立步驟"
    note: 補寫依據：爆香一般以中火或中小火炒 30–120 秒，炒到豆瓣香氣出來且油色轉紅即可。
  - id: a9
    technique: tech/shao
    term: 摻入高湯，入豆腐、食鹽、醬油、（味精）燒透
    inputs: [s_douban_fragrant, i_stock, s_tofu_fried, i_salt, i_soy, i_msg]
    outputs: [s_braised]
    tool: tool/wok
    params:
      heat: {level: heat/medium_low, raw: "表 4：燒製豆腐應用中小火", evidence: S1}
      duration: {min_s: null, max_s: null, raw: "燒透（原文沒寫時間）", status: missing}
    completion:

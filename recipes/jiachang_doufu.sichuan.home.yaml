# 家常豆腐（川式家常版）— 起始草稿，規格 v1.0
# 主來源 S1＝DB51/T 1728-2014 附錄 D.9、表 4 第 9 列；主體份量、尺寸、溫度、完成狀態只用 S1 原文數字。

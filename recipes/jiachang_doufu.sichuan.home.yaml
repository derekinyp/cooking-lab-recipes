  burners: "家庭安排（推論）：先以平底鍋煎豆腐（1 口爐），再用炒鍋燒製（1 口爐）；先煎後燒，同一時間 1 口爐；爐口數原文沒寫"
  oven_airfryer: "S1 與對照來源皆未用烤箱、氣炸鍋、蒸籠；S1 的油炸家庭改為平底鍋少油煎（推論，見 a4 note）。本菜未用到電鍋與湯鍋"
  spicy_split: "S1 的辣味來自郫縣豆瓣 35 g；豆瓣需先剁細，並在肉片炒熟後、摻鮮湯前入鍋炒香（D.9.2.2），無法最後分開加。本菜配方沒有花椒。不辣版本省略豆瓣是家庭改法（推論），需獨立另做一份、另鍋製作：省略郫縣豆瓣，以醬油、食鹽、鮮湯調成鹹鮮底（對照 S2 未用豆瓣、未用花椒的家常燒豆腐：醬油、細砂糖、米酒、水，但原文含紅辣椒絲 5 公克；若要不辣，省略辣椒是家庭改法（推論））；不補豆瓣替代份量。對照 S3 的辣油 1 小匙雖是起鍋前最後拌入、可分開，但 S3 的紅辣椒末 1 根在第一步爆香，同樣無法分出；S4 的紅油豆瓣醬在步驟 5 炒香，亦無法分出"
  no_scale: "無秤版：S1 份量皆為公克；無秤時如何用杯、匙換算，原文沒寫，不換算。湯匙＝S1 未給杯匙單位；S2/S3/S4 的大匙、小匙、cc 只保留在比較表"
  missing: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  compare: "S2（楊桃〈家常燒豆腐〉）未用豆瓣、未用花椒，但含紅辣椒絲 5 公克；板豆腐 300 公克、豬肉絲 30 公克，醬油、糖、米酒、水小火煮約 2 分鐘。S3（楊桃〈湖南豆腐〉）用豆豉、紅辣椒末、蒜苗，加水 200cc 燜煮，太白粉水勾芡、淋辣油。S4（快懂百科）北豆腐 300 克、豬瘦肉 100 克，中大火煎兩面金黃，紅油豆瓣醬，小火煨 2 分鐘。三份數字都只作對照，未進主體"
  total_min: '30'
  time_basis: 切豆腐、豬肉與蒜苗約 10 分鐘；煎豆腐約 8 分鐘，炒肉與豆瓣約 3 分鐘，燒透及收汁約 8 分鐘，合計估 29 分鐘，取 30 分鐘。
  food_safety_basis: 對外文字用到的溫度 74°C：美國農業部（USDA）食品安全安全內部溫度表（禽肉 74、絞肉 71、整塊肉與魚貝 63）

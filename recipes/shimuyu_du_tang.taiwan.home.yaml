notes:
  weekday: "平日（≤20 分鐘）可行性：M 沒寫總製作時間，原文沒寫、待試做計時。已標分段烹煮時間為薑絲湯底 2～3 分鐘＋魚肚 6～10 分鐘，合計約 8～13 分鐘（推論加總，非 M 總時間；不含解凍、清洗、切配）。20 分鐘平日門檻是家庭自訂條件，不是來源數字。"
  burners: "全程 1 口爐、1 只湯鍋（M 作法未寫平行第二鍋）。任何時刻不超過 2 口爐；另一口爐若同時做別的菜屬家庭安排（推論）。"
  oven_airfryer: "M、S2、S3 皆未使用烤箱、氣炸鍋、蒸籠；不需改法。S1 原為 Thermomix 機器食譜，公開頁無機器步驟；本檔主體用湯鍋爐上煮，屬家庭改法（推論）。電鍋外鍋加水燉煮為 M 未寫做法，屬推論，時間待試做。"
  spicy_split: "M、S2、S3 主體都沒有辣椒、花椒、辣豆瓣；整鍋即為不辣那份。白胡椒粉為最後各自加的香料，可省略（推論）；S1 亦無麻辣配料。"
  pot_size: "湯鍋容量 M 沒寫。已知：清水約 1,000 毫升、魚肚 500～600 公克、薑約 25 公克；建議選裝得下、滾煮時不溢出的湯鍋（推論，無來源數字）。"
  compare: "摘要見 (F) 公開食譜比較表。主體份量、調味、火力、完成狀態全部照 M；S1（官方平台機器食譜，步驟未開放）、S2（英文部落格）、S3（無份量手繪食譜）只作對照。"
  missing: "原文沒寫：總製作時間、魚肚是否去刺（僅提醒細刺風險）、鍋具種類與容量、是否加蓋、鹽與白胡椒的確實份量（原文為適量／少許）、芹菜珠份量、成品湯色與口感描述、上桌溫度與食用時限、清洗與解凍時長。"
  spec_gaps: "servings 只有單一 value，無法直接記 3～4 人份範圍；63°C 溫度計門檻在無溫度計家庭只能保留原文、完成判定改感官；魚肚「2 片」的數量詞無對應單位；同一食材分兩次下鍋（薑絲）規格無分次投料欄位，靠 action note 表達。"

states:
  - {id: s_fish_clean, label: 沖洗、吸乾的蝨目魚肚}
  - {id: s_ginger_shred, label: 薑絲（一半先煮、一半收尾）}
  - {id: s_scallion, label: 蔥花}
  - {id: s_celery, label: 芹菜珠}
  - {id: s_ginger_broth, label: 煮出薑香的湯底}
  - {id: s_fish_in, label: 魚肚入鍋、撈除浮沫的湯}
  - {id: s_fish_cooked, label: 煮熟的魚肚湯（尚未最後調味）}
  - {id: s_final, label: 蝨目魚肚湯, role: final}

actions:
  - id: a1
    technique: tech/rinse
    term: 蝨目魚肚退冰後以流動清水快速沖洗，紙巾輕輕吸乾
    inputs: [i_fish]
    outputs: [s_fish_clean]
    tool: tool/bowl
    params: {duration: {min_s: null, max_s: null, raw: "清洗時間原文沒寫", status: missing}}
    completion:
      - {observe: 魚肚腹腔, target: 沒有明顯血水與殘留雜質，表面輕輕吸乾（M 作法 1）, method: 目測, evidence: M}
    note: "冷凍商品 M 建議先在冷藏完整解凍；本檔未記解凍時長（原文沒寫）。"
  - id: a2
    technique: tech/cut
    term: 薑切絲；青蔥切蔥花；芹菜切芹菜珠（可省）
    inputs: [i_ginger, i_scallion, i_celery]
    outputs: [s_ginger_shred, s_scallion, s_celery]
    tool: tool/knife
    params:
      cut: {shape: cut/si_fine, raw: "薑 約 25 公克，切絲；青蔥 2 支，切蔥花（M 食材表）；芹菜珠 M 未寫切法", evidence: M, note: "薑絲對應 cut/si_fine（vocab 示例即薑絲）；蔥花對應 cut/cong_hua；芹菜珠粒狀對應 cut/li。絲、花、粒的毫米尺寸 M 沒寫"}
    completion:
      - {observe: 配料, target: 切好備用, method: 目測}
  - id: a3
    technique: tech/boil
    term: 鍋中加入清水與一半薑絲，煮滾後轉中火續煮 2～3 分鐘
    inputs: [s_ginger_shred, i_water]
    outputs: [s_ginger_broth]
    tool: tool/stock_pot
    params:
      heat: {level: heat/medium, raw: "煮滾後轉中火續煮 2～3 分鐘", evidence: M}
      duration: {min_s: 120, max_s: 180, raw: "2～3 分鐘", is_guide: true, evidence: M, status: sourced}
    completion:
      - {observe: 湯底香氣, target: 薑香先進入湯裡（M 作法 2）, method: 聞, evidence: M}
    note: "家庭改法（推論）：M 只寫「鍋中」，未指明鍋具；本檔用湯鍋爐上煮。薑絲一半先下、另一半留到 a6（M 作法 2、6）。"
  - id: a4
    technique: tech/boil
    term: 魚肚魚皮朝下滑入鍋中，避免用力攪動；湯重新滾起後撈除表面浮沫
    inputs: [s_ginger_broth, s_fish_clean]
    outputs: [s_fish_in]
    tool: tool/stock_pot
    params: {heat: {level: null, raw: "M 此步未另寫火力（接續湯底）"}, duration: {min_s: null, max_s: null, raw: "原文沒寫此步時間", status: missing}}
    completion:
      - {observe: 湯面, target: 湯重新滾起，表面浮沫撈除（M 作法 3）, method: 目測, evidence: M}
    note: "M 提醒避免用力攪動；大滾容易讓魚肉破碎、湯頭混濁。"
  - id: a5
    technique: tech/simmer
    term: 轉中小火，依魚肚大小煮約 6～10 分鐘
    inputs: [s_fish_in]
    outputs: [s_fish_cooked]
    tool: tool/stock_pot
    params:
      heat: {level: heat/medium_low, raw: "轉中小火，依魚肚大小煮約 6～10 分鐘", evidence: M}
      duration: {min_s: 360, max_s: 600, raw: "6～10 分鐘", is_guide: true, evidence: M, status: sourced}
      temperature: {target: core, min_c: 63, raw: "使用溫度計時，中心至少達 63°C", evidence: M}
    completion:
      - {observe: 魚肚最厚處, target: 魚肉由半透明轉為完全不透明，能沿著肌理分開即可（M 作法 5）, method: 目測、輕戳（推論：M 未寫觸判方式）, evidence: M}
    note: "M 另附分形態時間對照：切塊約 3～4 公分煮 4～6 分鐘；一般整片每片約 200～250 公克煮 6～8 分鐘；厚切整片每片約 250～300 公克以上煮 8～10 分鐘。煮熟後不要持續大滾。"
  - id: a6
    technique: tech/season
    term: 加入米酒與鹽調整味道，放入剩餘薑絲，撒上蔥花或芹菜珠後關火
    inputs: [s_fish_cooked, s_ginger_shred, s_scallion, s_celery, i_wine, i_salt, i_wp]
    outputs: [s_final]
    tool: tool/stock_pot
    completion:
      - {observe: 湯的鹹度, target: 先試味道再逐步加鹽調整（M 作法 6 與調味建議）, method: 試吃, evidence: M}
      - {observe: 收尾配料, target: 剩餘薑絲、蔥花（或芹菜珠）放入／撒上後關火（M 作法 6）, method: 目測, evidence: M}
    note: "米酒、鹽都在魚肚煮熟後才下（M 作法 6）。白胡椒粉最後各自在碗裡加；不辣那份可不放胡椒（推論）。"


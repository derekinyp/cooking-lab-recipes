  flavor_template: null
  servings: {value: null, status: sourced, evidence: M, note: "M 標『家常虱目魚肚湯做法：3～4 人份』（範圍；單一數字原文沒給，不換算）"}
  status: cross_checked
  sources:
    - id: M
      title: "北投之家海鮮買賣平台〈虱目魚肚湯怎麼煮？薑絲做法、時間、去腥與家常食譜〉"
      url: "https://seafood.beitouhome.com/seafood-recipes/fish/milkfish-belly-soup/"
      level: C
      type: web
      accessed: 2026-11-27
      note: "主來源。3～4 人份。食材：虱目魚肚 2 片約 500～600 公克、薑約 25 公克切絲、青蔥 2 支切蔥花、清水約 1,000 毫升、米酒 1 大匙、鹽適量、白胡椒少許可省略。作法：魚肚流動清水快速沖洗、紙巾吸乾；清水與一半薑絲煮滾後轉中火續煮 2～3 分鐘；魚肚魚皮朝下滑入、避免用力攪動，湯重新滾起後撈除浮沫；轉中小火依魚肚大小煮約 6～10 分鐘；最厚處由半透明轉完全不透明、能沿肌理分開（溫度計中心至少 63°C）；最後加米酒與鹽、放入剩餘薑絲，撒蔥花或芹菜珠後關火。"
    - id: S1
      title: "Cookidoo® 官方 Thermomix® 食譜平台〈薑絲魚肚湯〉（r86727）"
      url: "https://cookidoo.ca/recipes/recipe/en-CA/r86727"
      level: A
      type: official
      accessed: 2026-11-27
      note: "對照（官方品牌食譜平台；食譜為 Thermomix 機器專用）。公開頁僅顯示食材與營養，機器烹調步驟、火力未開放讀取，故不引用其做法。4 人份；Prep 10 min、Total 25 min；薑切絲 20 克、水 600 克、虱目魚肚切塊（約 2 公分）250 克、鹽 2 小撮、香油 3–5 滴、蔥少許斜切。"
    - id: S2
      title: "bakukitchen〈Milkfish Soup (虱目魚湯)〉（Chef Baku，Updated September 2026）"
      url: "https://bakukitchen.com/milkfish-soup/"
      level: C
      type: personal
      accessed: 2026-11-27
      note: "對照（英文個人部落格）。serves 4；Prep 20 minutes、Cook 25 minutes。食材：milkfish belly 600 g、醃魚鹽 1 teaspoon、water 1.2 litres、ginger 8 cm（fine julienne）、spring onions 3（cut in lengths）、rice wine 1 tablespoon、salt and white pepper；收尾：fried shallot 1 tablespoon、coriander leaves a few、sesame oil a little、其餘生薑絲。作法：鹽擦魚醃 10 分鐘後沖洗擦乾；水＋大部分薑絲微滾約 10 分鐘；下魚肚 bare simmer 約 4 分鐘；撇除浮沫、倒入米酒；轉不透明即離火；調鹽與白胡椒；下蔥段餘溫 1 分鐘；上桌鋪生薑絲、油蔥酥、香菜。"
    - id: S3
      title: "無毒農 greenbox〈【手繪食譜】去刺虱目魚肚料理教學：香酥乾煎與清甜煮湯一次學會〉（2026-01-16）"
      url: "https://greenbox.tw/Blog/BlogPostNew/8471/"
      level: C
      type: web
      accessed: 2026-11-27
      note: "對照。無具體份量（魚肚、薑片適量、蔥段適量、醬油少許）。煮湯：湯鍋加適量清水或高湯、放薑片開火煮滾；水滾後放入魚肚及蔥段；轉中小火煮至魚肉熟透（約 3-5 分鐘，視魚肉厚度）；起鍋前加少許醬油或鹽；最後撒蔥花。"

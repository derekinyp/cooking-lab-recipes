recipe:
  id: shimuyu_du_tang.taiwan.home
  version: "1.0"
  kind: dish
  dish_concept: dish/shimuyu_du_tang
  name: {zh_hant: 蝨目魚肚湯, zh_hans: 虱目鱼肚汤, en: Milkfish belly soup}
  variant: 台式家常版
  summary: 魚肚沖洗吸乾；清水煮滾先下一半薑絲煮出薑香，魚肚魚皮朝下滑入、撈除浮沫，轉中小火煮至魚肉完全不透明，最後下米酒、鹽、其餘薑絲與蔥花（或芹菜珠）的台式清湯。
  cuisine:

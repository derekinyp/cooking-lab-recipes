# 虱目魚肚湯（台式家常版）— 起始檔，規格 v1.0
# 主來源 M＝北投之家海鮮買賣平台〈虱目魚肚湯怎麼煮？薑絲做法、時間、去腥與家常食譜〉：
#   主料、調味、火力、時間、完成狀態只用 M 的數字；S1/S2/S3 僅放比較表與 notes，不混進主體比例。
# 家庭條件：兩口瓦斯爐；廚具僅電鍋（大同式外鍋加水蒸）、炒鍋、平底鍋、湯鍋；無烤箱、氣炸鍋、蒸籠、溫度計、料理秤。

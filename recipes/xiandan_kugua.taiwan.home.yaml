notes:
  weekday: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  burners: "汆燙用湯鍋佔 1 口爐；炒鍋爆香與拌炒佔 1 口爐；兩階段先後進行，任何時刻最多 1 口（推論；來源沒寫爐口安排）。切配備料可與汆燙平行（推論）。全程不超過 2 口。"
  spicy_split: "M 的紅辣椒片原文與蒜末同時下鍋爆香，照原文做就無法從同一鍋分出不辣那份。本檔改法（家庭改法，推論）：主體爆香時不下辣椒，a6 拌勻後先盛出不辣那份，鍋中剩下的再拌入紅辣椒片（a7），一鍋兩吃；辣味會比原文淡、口感不同，待試做。想要原文的辣味，加辣那份就另外一鍋照 M 爆香（推論）。S1 無辣椒；S2 步驟有辣椒末爆香，用量鏡像材料欄未列。"
  oven_airfryer: "三份來源都沒用烤箱、氣炸鍋或蒸籠；M 汆燙用家用湯鍋（家庭改法，推論；M 沒寫鍋具）。家庭無蒸籠，本菜無需改蒸。"
  no_scale: "無秤版：苦瓜300公克、蒜末10公克、紅辣椒片10公克沒有對應杯匙換算（來源沒給，待試做）；鹹蛋2顆、米酒1大匙、雞粉1/4小匙可照顆數與量匙。"
  missing: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  compare: "S1 用蔥、薑、水、香油，汆燙約10秒鐘沖涼，小火炒香再中火續炒約30秒；S2（山苦瓜）鹹蛋黃壓泥、蛋白切末分開處理，川燙1分鐘，加高湯2大匙煨煮收汁，起鍋前放蔥花。"
  total_min: '30'
  time_basis: 頁面標示 30 分鐘內；備料與烹調合計以 30 分鐘安排。

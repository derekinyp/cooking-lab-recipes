  - {id: s_final, label: 鹹蛋苦瓜, role: final}

actions:
  - id: a1
    technique: tech/cut
    term: 苦瓜洗淨去頭尾，切開去籽後切片
    inputs: [i_melon]
    outputs: [s_melon_cut]
    tool: tool/knife
    params: {cut: {shape: cut/pian, size_mm: {min: null, max: null}, raw: "切片", evidence: M, note: "M 沒給厚度毫米；S1 寫『切薄片』，S2 寫『切成薄片』，厚度均未給數字"}}
    completion:
      - {observe: 苦瓜, target: 去頭尾、切開去籽、切片（M 作法 1）, method: 目測, evidence: M}
    can_overlap: [a3]
  - id: a2
    technique: tech/blanch
    term: 苦瓜片放入滾沸的水中汆燙約5分鐘，撈出瀝乾水份
    inputs: [s_melon_cut, i_water_blanch]
    outputs: [s_melon_blanched]
    tool: tool/stock_pot
    params:
      heat: {level: heat/high, raw: null}
      duration: {min_s: 300, max_s: 300, raw: "汆燙約5分鐘", is_guide: true, evidence: M, status: sourced}
    completion:
      - {observe: 苦瓜片, target: 撈出瀝乾水份（M 作法 1）, method: 目測, evidence: M}
    note: "家庭改法（推論）：M 沒寫汆燙用哪種鍋；家庭廚具無蒸籠，此處用湯鍋沸水汆燙。汆燙用水水量 M 沒寫；補寫依據：來源明列汆燙約 5 分鐘；汆燙依補寫常識表使用沸水大火，時間照來源。"
  - id: a3
    technique: tech/cut
    term: 鹹蛋去外殼，切小塊備用
    inputs: [i_egg]
    outputs: [s_egg_cut]
    tool: tool/knife
    params: {cut: {shape: cut/kuai, size_mm: {min: null, max: null}, raw: "切小塊", evidence: M}}
    completion:
      - {observe: 鹹蛋, target: 去外殼、切小塊備用（M 作法 2）, method: 目測, evidence: M}
  - id: a4
    technique: tech/aromatics
    term: 熱鍋倒入沙拉油燒熱，中火爆香蒜末
    inputs: [i_oil, i_garlic]
    outputs: [s_aromatic]
    tool: tool/wok
    params: {heat: {level: heat/medium, raw: "以中火爆香蒜末和紅辣椒片", evidence: M}, duration: {min_s: 30, max_s: 120, raw: null, is_guide: true, evidence: null, status: inferred}}
    completion:
      - {observe: 蒜末, target: 爆香出香（M 作法 3「爆香蒜末」）, method: 目測、聞, evidence: M}
    note: "M 原文此步連紅辣椒片一起爆香；主體不下辣椒，見 notes.spicy_split。爆香時間 M 沒寫；補寫依據：爆香依補寫常識表為 30–120 秒，取此範圍至蒜末出香。"
  - id: a5
    technique: tech/stir_fry
    term: 放入鹹蛋塊炒香
    inputs: [s_aromatic, s_egg_cut]
    outputs: [s_egg_fragrant]
    tool: tool/wok
    params: {duration: {min_s: 60, max_s: 120, raw: null, is_guide: true, evidence: null, status: inferred}, heat: {level: heat/medium, raw: null, evidence: null}}
    completion:
      - {observe: 鹹蛋塊, target: 炒香（M 作法 3「放入作法2的鹹蛋塊炒香」）, method: 目測、聞, evidence: M}
    note: 補寫依據：炒依補寫常識表可用中火或中大火 60–300 秒，取 60–120 秒至鹹蛋炒香。
  - id: a6
    technique: tech/stir_fry_mixed
    term: 放入苦瓜片和所有調味料拌炒均勻
    inputs: [s_egg_fragrant, s_melon_blanched, i_salt, i_powder, i_sugar, i_wine]
    outputs: [s_mixed]
    tool: tool/wok
    params: {duration: {min_s: 60, max_s: 180, raw: null, is_guide: true, evidence: null, status: inferred}, heat: {level: heat/medium, raw: null, evidence: null}}
    completion:
      - {observe: 鍋中材料, target: 拌炒均勻即可（M 作法 3）, method: 目測、試吃（試吃為推論）, evidence: M}
    note: 補寫依據：炒依補寫常識表可用中火或中大火 60–300 秒，取 60–180 秒至苦瓜和調味料拌勻、熱透。
  - id: a7
    technique: tech/toss_in
    term: （加辣那份）先盛出不辣那份，鍋中剩下的拌入紅辣椒片
    inputs: [s_mixed, i_chili]
    outputs: [s_final]
    tool: tool/wok
    optional_branch: {at: a6 之後起鍋前, input: i_chili, action: "（推論，家庭改法）不辣那份在 a6 拌勻後先盛出、不放辣椒；加辣那份把紅辣椒片拌入。M 原文是紅辣椒片與蒜末一開始一起爆香，沒有分流，也沒有最後才加辣椒的寫法"}
    completion:
      - observe: 辣椒片
        target: 辣椒片均勻散在鍋中即可盛出。
        method: 目測
        evidence: null
    note: "辣味比原文的一開始爆香淡、口感不同，待試做（推論）；補寫依據：一般家庭做法以中小火拌入辣椒片 10–20 秒，辣椒分布均勻即可。"

    params:
      heat:
        level: heat/medium_low
        raw: null
        evidence: null
      duration:

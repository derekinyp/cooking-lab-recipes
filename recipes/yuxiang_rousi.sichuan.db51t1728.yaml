  flavor_template: {ref: flavor/yuxiang, basis: "DB51/T 1728-2014 附錄 A.4 為魚香味型標準配方；投料順序『泡辣椒、薑蒜炒香，倒入兌好的芡汁』與味型詞表 order 一致", evidence: S1}
  servings: {value: null, status: missing, note: "標準未標份數。表 A.4 豬肉 200 g，不可據此推算份數"}
  status: cross_checked
  catalog:
    - {list: 中國烹飪協會2018地域經典名菜, region: 四川, listed: null, note: "魚香肉絲是否入選四川名錄待 K4 核對"}
  sources:
    - id: S1
      title: "DB51/T 1728-2014《中國川菜經典菜餚製作工藝規範》附錄 A.4（鱼香肉丝的配方及制作工艺）"
      url: https://dbba.sacinfo.org.cn/portal/download/16132ff757ea958e03976e65675614f1
      level: A
      type: standard
      accessed: 2026-11-24
      note: "配方允許誤差 ≤10%；水澱粉＝澱粉:水 1:1（標準總則註）；味精可選用或不選用。本機 sources/db51t1728-2014.txt 第 966–1014 行"
    - id: T1
      title: "愛料理 🌿跳Tone的廚房〈【魚香肉絲】撩起來勢洶洶的😋食慾！〉（2022-12-25）"
      url: https://icook.tw/recipes/429566
      level: C
      type: web
      accessed: 2026-11-24
      note: "台灣家常對照。4 人份、20 分鐘；用涼薯（豆薯）與新鮮筍絲、辣豆瓣醬（辣椒醬）取代標準的青筍與泡辣椒；肉絲先滑散快炒盛出，另鍋爆香。步驟原文：『油熱放入醃好的豬肉絲滑散快炒，盛盤備用。』『另起一個鍋倒入2 大匙的沙拉油』『再放入辣豆瓣醬(辣椒醬)煸炒』『大火快炒』。網頁結構化資料有完整食材表（對照用，不採進主體數字）"
    - id: T2
      title: "愛料理 黃二姐美食〈正宗魚香肉絲〉（2024-12-24）"
      url: https://icook.tw/recipes/471062
      level: C
      type: web
      accessed: 2026-11-24
      note: "台灣家常對照。2 人份、20 分鐘；肉絲以蛋白、鹽、薑末、太白粉、植物油醃製至少 10 分鐘，中火炒至變白盛出；辣豆瓣醬小火拌炒出香味，蔥薑蒜爆香，木耳青椒紅蘿蔔筍絲大火快炒 2-3 分鐘，回鍋肉絲與醬汁拌炒。網頁結構化資料有完整食材表（僅作對照，未採入主體數字）"
  extracted_by: [kimi, codex]

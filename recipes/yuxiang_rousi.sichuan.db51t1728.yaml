  - id: a1
    technique: tech/cut
    term: 切成二粗絲
    inputs: [i_pork]
    outputs: [s_shredded]
    tool: tool/knife
    params: {cut: {shape: cut/si_ercu, size_mm: {min: null, max: null}, raw: "二粗絲", evidence: S1, note: "標準未給毫米；cut/si_ercu 為建議新增 id"}}
    completion: [{observe: 肉絲, target: 大小一致的二粗絲, method: 目測（推論：原文只寫形狀名，沒寫判斷方式）}]
  - id: a2
    technique: tech/marinate_coat
    term: 醃肉
    inputs: [s_shredded, i_salt_m, i_wine_m, i_starch_m]
    outputs: [s_marinated]
    tool: tool/bowl
    params: {duration: {min_s: 600, max_s: 1200, raw: null, is_guide: true, evidence: null, status: inferred}, agitation: {mode: 拌勻}}
    completion: [{observe: 肉絲, target: 拌勻（原文：加入食鹽、米酒、太白粉水拌勻）, method: 目測（推論，原文沒寫判斷方式）}]
    note: 補寫依據：醃肉依一般家庭做法約 10–20 分鐘，讓太白粉水和調味附著肉絲。
  - id: a3
    technique: tech/cut
    term: 青筍切二粗絲、木耳切粗絲
    inputs: [i_celtuce, i_woodear]
    outputs: [s_veg_shredded]
    tool: tool/knife
    params: {cut: {shape: cut/si, size_mm: {min: null, max: null}, raw: "青筍切成二粗絲；水發木耳切成粗絲", evidence: S1, note: "木耳『粗絲』以 cut/si（alt: 粗絲）表示；毫米原文沒寫"}}
    completion: [{observe: 青筍與木耳, target: 切好成絲, method: 目測}]
    can_overlap: [a2]
  - id: a4
    technique: tech/heat_oil
    term: 燒油
    inputs: [i_oil]
    outputs: [s_hot_oil]
    tool: tool/wok
    params:
      temperature: {target: oil, min_c: 160, max_c: 160, raw: "鍋中放油燒至160℃", evidence: S1}
      heat: {level: heat/medium_high, raw: null}
      duration:
        min_s: 30
        max_s: 60
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - observe: 油溫
        target: 油面微微流動，料理溫度計讀值達 160°C 後下肉絲。
        method: 目測
        evidence: null
    note: "標準給定 160℃；原文沒寫無溫度計時的判斷法。家庭沒有料理溫度計，待試做校準（不自編感官換算）；補寫依據：來源指定油溫 160°C；中大火加熱食用油約 30–60 秒，並以溫度計確認 160°C。"
  - id: a5
    technique: tech/stir_fry
    term: 放入肉絲炒散、斷生
    inputs: [s_hot_oil, s_marinated]
    outputs: [s_pork_cooked]
    tool: tool/wok
    params: {agitation: {mode: 炒散, continuous: true}, heat: {level: heat/high, raw: null, evidence: null}, duration: {min_s: 60, max_s: 120, raw: null, is_guide: true, evidence: null, status: inferred}}
    completion:
      - observe: 肉絲
        target: 肉絲炒散、顏色轉白，沒有明顯生肉色。
        method: 目測
        evidence: null
    note: 補寫依據：炒肉絲依一般家庭快炒約 1–2 分鐘，炒散至肉絲不再呈生肉色。
  - id: a6
    technique: tech/aromatics
    term: 入泡辣椒末、姜米、蒜米、蔥花炒香
    inputs: [s_pork_cooked, i_paolajiao, i_ginger, i_garlic, i_scallion]
    outputs: [s_fragrant]
    tool: tool/wok
    params: {agitation: {mode: 翻炒, continuous: true}, heat: {level: heat/medium, raw: null, evidence: null}, duration: {min_s: 30, max_s: 60, raw: null, is_guide: true, evidence: null, status: inferred}}
    completion:
      - observe: 香氣
        target: 泡辣椒、薑、蒜和蔥香氣明顯散出，蒜末尚未焦黃。
        method: 目測
        evidence: null
    risk: "泡辣椒末在此步下鍋，辣味進入整鍋，無法最後分出（見 notes.spicy_split）"
    note: 補寫依據：爆香依常識表以中火約 30–120 秒，至泡辣椒、薑、蒜和蔥香氣釋出。
  - id: a7
    technique: tech/stir_fry
    term: 入青筍絲、木耳炒斷生
    inputs: [s_fragrant, s_veg_shredded]
    outputs: [s_veg_cooked]
    tool: tool/wok
    params: {agitation: {mode: 翻炒, continuous: true}, heat: {level: heat/high, raw: null, evidence: null}, duration: {min_s: 60, max_s: 120, raw: null, is_guide: true, evidence: null, status: inferred}}
    completion:
      - observe: 青筍與木耳
        target: 青筍轉亮、木耳熱透，兩者仍保有脆度。
        method: 目測
        evidence: null
    note: 補寫依據：青筍和木耳切絲後大火快炒約 1–2 分鐘，至蔬菜轉色仍略脆。
  - id: a8
    technique: tech/pour_sauce_thicken
    term: 倒入芡汁炒勻，收汁呈包芡狀
    inputs: [s_veg_cooked, s_sauce]
    outputs: [s_coated]
    tool: tool/wok
    params: {thickening: {type: 包芡, starch_ref: j_starch}, heat: {level: heat/medium_high, raw: null, evidence: null}, duration: {min_s: 60, max_s: 120, raw: null, is_guide: true, evidence: null, status: inferred}}

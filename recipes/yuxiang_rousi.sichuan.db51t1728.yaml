recipe:
  id: yuxiang_rousi.sichuan.db51t1728
  version: "1.0"
  kind: dish
  dish_concept: dish/yuxiang_rousi
  name: {zh_hant: 魚香肉絲, zh_hans: 鱼香肉丝, en: Yuxiang shredded pork}
  variant: 四川省地方標準版
  summary: 肉絲炒散至斷生，青筍與水發木耳炒至斷生；下泡辣椒末、薑米、蒜米、蔥花炒香，倒入兌好的糖、醋、醬油芡汁，收至包芡。
  cuisine:
    - {id: cuisine/chuan, basis: "DB51/T 1728-2014 將魚香肉絲列為川菜經典菜餚（附錄 A.4）", claim: primary, evidence: S1}

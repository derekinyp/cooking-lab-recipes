states:
  - {id: s_shredded, label: 豬肉二粗絲}
  - {id: s_marinated, label: 碼味上漿肉絲}
  - {id: s_veg_shredded, label: 青筍二粗絲、木耳粗絲}
  - {id: s_hot_oil, label: 160°C 熱油}
  - {id: s_pork_cooked, label: 炒散斷生肉絲}
  - {id: s_fragrant, label: 泡辣椒蔥薑蒜炒香底}
  - {id: s_veg_cooked, label: 青筍木耳炒斷生}
  - {id: s_coated, label: 包芡魚香肉絲}
  - {id: s_final, label: 魚香肉絲, role: final}

actions:
  - id: a1
    technique: tech/cut
    term: 切成二粗絲
    inputs: [i_pork]
    outputs: [s_shredded]
    tool: tool/knife
    params: {cut: {shape: cut/si_ercu, size_mm: {min: null, max: null}, raw: "二粗丝", evidence: S1, note: "標準未給毫米；cut/si_ercu 為建議新增 id"}}
    completion: [{observe: 肉絲, target: 大小一致的二粗絲, method: 目測（推論：原文只寫形狀名，沒寫判斷方式）}]
  - id: a2
    technique: tech/marinate_coat
    term: 碼味
    inputs: [s_shredded, i_salt_m, i_wine_m, i_starch_m]
    outputs: [s_marinated]
    tool: tool/bowl
    params: {duration: {min_s: null, max_s: null, raw: 標準未註明, status: missing}, agitation: {mode: 拌勻}}
    completion: [{observe: 肉絲, target: 拌勻（原文：加入食盐、料酒、水淀粉拌匀）, method: 目測（推論，原文沒寫判斷方式）}]
  - id: a3
    technique: tech/cut
    term: 青筍切二粗絲、木耳切粗絲
    inputs: [i_celtuce, i_woodear]
    outputs: [s_veg_shredded]
    tool: tool/knife
    params: {cut: {shape: cut/si, size_mm: {min: null, max: null}, raw: "青笋切成二粗丝；水发木耳切成粗丝", evidence: S1, note: "木耳『粗絲』以 cut/si（alt: 粗絲）表示；毫米原文沒寫"}}
    completion: [{observe: 青筍與木耳, target: 切好成絲, method: 目測}]
    can_overlap: [a2]
  - id: a4
    technique: tech/heat_oil
    term: 燒油
    inputs: [i_oil]
    outputs: [s_hot_oil]
    tool: tool/wok
    params:
      temperature: {target: oil, min_c: 160, max_c: 160, raw: "锅中放油烧至160℃", evidence: S1}
      heat: {level: null, raw: 標準未寫火力檔位}
    completion: [{observe: 油溫, target: 160°C（原文）, method: 原文只給 160℃、沒寫無溫度計時如何判斷（家庭沒有溫度計，待試做校準）, evidence: S1}]
    note: "標準給定 160℃；原文沒寫無溫度計時的判斷法。家庭沒有料理溫度計，待試做校準（不自編感官換算）"
  - id: a5
    technique: tech/stir_fry
    term: 放入肉絲炒散、斷生
    inputs: [s_hot_oil, s_marinated]
    outputs: [s_pork_cooked]
    tool: tool/wok
    params: {agitation: {mode: 炒散, continuous: true}}
    completion: [{observe: 肉絲, target: 炒散、斷生（原文）, method: 目測（推論：原文沒寫判斷方式，建議看肉絲變白、分開）, evidence: S1}]
  - id: a6
    technique: tech/aromatics
    term: 入泡辣椒末、姜米、蒜米、葱花炒香
    inputs: [s_pork_cooked, i_paolajiao, i_ginger, i_garlic, i_scallion]
    outputs: [s_fragrant]
    tool: tool/wok
    params: {agitation: {mode: 翻炒, continuous: true}}
    completion: [{observe: 香氣, target: 炒香（原文）, method: 嗅覺（推論：原文沒寫判斷方式）, evidence: S1}]
    risk: "泡辣椒末在此步下鍋，辣味進入整鍋，無法最後分出（見 notes.spicy_split）"
  - id: a7
    technique: tech/stir_fry
    term: 入青筍絲、木耳炒斷生
    inputs: [s_fragrant, s_veg_shredded]
    outputs: [s_veg_cooked]
    tool: tool/wok
    params: {agitation: {mode: 翻炒, continuous: true}}
    completion: [{observe: 青筍、木耳, target: 炒斷生（原文）, method: 目測（推論：原文沒寫判斷方式）, evidence: S1}]
  - id: a8
    technique: tech/pour_sauce_thicken
    term: 倒入芡汁炒勻，收汁呈包芡狀
    inputs: [s_veg_cooked, s_sauce]
    outputs: [s_coated]
    tool: tool/wok
    params: {thickening: {type: 包芡, starch_ref: j_starch}}
    completion:
      - {observe: 芡汁, target: 收汁呈包芡状（原文）, method: 目測, evidence: S1}
      - {observe: 翻炒, target: 炒勻, method: 目測, evidence: S1}
  - id: a9
    technique: tech/plate
    term: 裝盤
    inputs: [s_coated]
    outputs: [s_final]
    tool: tool/bowl
    completion: [{observe: 菜品, target: 裝盤（原文：装盘）, method: 目測, evidence: S1}]

serving:
  completion:
    - {observe: 上桌溫度與時限, target: 原文沒寫, method: null}
  sensory_target: {color: 原文沒寫, taste: 原文沒寫, texture: 原文沒寫}

notes:
  weekday: "原文沒寫總時間，待試做計時。對照來源 T1、T2 各自標 20 分鐘（不同食譜，只作參考，不據此斷定平日可做）"
  burners: "標準步驟以鍋中烹製描述；全程一鍋一爐是依步驟安排的推論。對照來源 T1 另起一鍋爆香（不同做法）"
  spicy_split: "泡辣椒末 50 g 在肉絲斷生後即下鍋炒香（A.4.2.3），辣味與紅色進油、遍布整鍋，無法最後分開加。不辣那份要另外做：另起一鍋，不放泡辣椒末，其餘步驟照 A.4.2.3；不辣版少了泡辣椒的鹹香與紅色，是否以其他調料補足，原文沒寫（家庭改法，推論，不自編數字，待試做）。另：本菜無花椒，『不麻』天然成立。標準沒有不辣版本，此分流是家庭改法（推論）。"
  cross_check: "T2（C 級）以辣豆瓣醬取代泡辣椒，肉絲先炒至變白盛出；另鍋先炒辣豆瓣醬，再下蔥薑蒜，與標準投料順序不同；T1（C 級）肉絲先盛出、另起一鍋爆香（標準只寫『鍋中』烹製，沒有明言鍋數），屬家常變體。兩者的食材表與數字只作對照，未採入主體（主體只用標準的數字）"
  no_scale: "無秤版待試做：標準全用克數，家中無料理秤，需先以量勺校準（推論）"
  missing: "原文沒寫：份數、火力檔位、總時間與各步時間、二粗絲毫米、碼味時間、160℃ 的感官判斷法、上桌溫度與感官目標、青筍是否須先焯水"
  spec_gaps: "辣味來源無法分開的處理只能寫在 notes，規格無 spicy_split 欄位"

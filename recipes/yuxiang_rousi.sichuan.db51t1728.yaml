        target: 醬汁收濃並均勻裹住肉絲和蔬菜，鍋底不留稀薄湯汁。
        method: 目測
        evidence: null
    note: 補寫依據：收汁依常識表以中大火約 1–2 分鐘，讓芡汁濃縮並裹住食材。
  - id: a9
    technique: tech/plate
    term: 盛盤
    inputs: [s_coated]
    outputs: [s_final]
    tool: tool/bowl
    completion: [{observe: 菜品, target: 盛盤（原文：盛盤）, method: 目測, evidence: S1}]


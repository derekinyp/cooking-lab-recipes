# 魚香肉絲（四川省地方標準版）— 起始檔，規格 v1.0
# 主來源 S1＝DB51/T 1728-2014 附錄 A.4；所有數字逐字取自表 A.4 與 A.4.2，來源沒寫的一律 null＋status: missing。

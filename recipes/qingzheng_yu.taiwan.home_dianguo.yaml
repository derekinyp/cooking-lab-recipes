     note: "魚種與重量原文沒寫，常見度亦未核實。C1：『魚在料理之前一定要把腹腔內部靠骨頭的那條紅色血管用小湯匙刮除，鰓蓋內部只要有紅色的組織都要清乾淨』。C1 另述魚要夠新鮮（壓魚腹內臟部位，Q 彈回彈才新鮮）"}
  - {id: i_water_marinade, concept: ing/water, label: 清水（蔥薑水）, role: 液體,
     qty: {value: 200, unit: ml, raw_text: "清水：200ml", evidence: C1, status: sourced}}
  - {id: i_scallion_marinade, concept: ing/scallion, label: 蔥（蔥薑水用）, role: 輔料,
     qty: {value: 2, unit: piece, raw_text: "蔥：2支", evidence: C1, status: sourced}}
  - {id: i_ginger_marinade, concept: ing/ginger, label: 薑（蔥薑水用）, form: 片, role: 輔料,
     qty: {value: 3, unit: slice, raw_text: "薑：3片", evidence: C1, status: sourced}}
  - {id: i_salt_marinade, concept: ing/salt, label: 鹽（蔥薑水用）, role: 調料,
     qty: {value: 1, unit: tsp, raw_text: "鹽：1小匙", evidence: C1, status: sourced}}
  - {id: i_scallion_top, concept: ing/scallion, label: 青蔥（鋪面用）, role: 輔料,
     qty: {value: 2, unit: piece, raw_text: "青蔥：2支", evidence: C1, status: sourced},
     note: "斜切成蔥段泡冰水備用"}
  - {id: i_oil, concept: ing/cooking_oil, label: 食用油（澆熱油用）, role: 油脂,
     qty: {value: 2, unit: tbsp, raw_text: "食用油：2大匙", evidence: C1, status: sourced},
     note: "C1：用一個小的單柄鍋加熱；怕澆熱油危險可省略此步"}
  - {id: i_cup_water, concept: ing/water, label: 電鍋外鍋水, role: 液體,
     qty: {value: 1, unit: cup, raw_text: "外鍋1杯水", evidence: C1, status: sourced},
     note: "設備用水，非食用；倒入電鍋外鍋"}

components:
  - id: c_sauce
    call: {ref: recipe/qingzheng_yu_chushi_sauce.home, version: "1.0", scale: 1.0}
    output_as: s_sauce
    make_ahead: true
    note: 可提前兌好；C1「調製的方法很簡單，都是全部混合，稍微加熱讓糖融化」
    definition:
      recipe:
        id: qingzheng_yu_chushi_sauce.home
        version: "1.0"
        kind: sauce
        name: {zh_hant: 廣式豉油蒸魚汁}
        servings: {value: null, status: missing, note: "C1 食譜卡只寫『蒸魚醬汁：1份』，未標份數"}
        status: machine_checked
      ingredients:
        - {id: j_soy, concept: ing/soy_sauce, label: 生抽醬油, role: 調料,
           qty: {value: 2, unit: tbsp, raw_text: "生抽醬油：2大匙", evidence: C1, status: sourced}}
        - {id: j_water, concept: ing/water, label: 水或高湯, role: 液體,
           qty: {value: 2, unit: tbsp, raw_text: "水或高湯：2大匙", evidence: C1, status: sourced}}
        - {id: j_sesame, concept: ing/sesame_oil, label: 芝麻香油, role: 調料,
           qty: {value: 1, unit: tsp, raw_text: "芝麻香油：1茶匙", evidence: C1, status: sourced}}
        - {id: j_sugar, concept: ing/white_sugar, label: 糖, role: 調料,
           qty: {value: 0.5, unit: tsp, raw_text: "糖：半茶匙", evidence: C1, status: sourced}}
      actions:
        - id: ja1
          technique: tech/combine
          term: 全部混合、稍微加熱讓糖融化
          inputs: [j_soy, j_water, j_sesame, j_sugar]
          outputs: [s_sauce]
          note: "加熱火力與時間原文沒寫；若不加热可搅拌至糖完全溶解（原文：攪拌到完全溶解，稍微加熱一下會比較容易溶解）"
          completion: [{observe: 醬汁, target: 糖完全溶解, method: 目測, evidence: C1}]

states:
  - {id: s_marinade_liquid, label: 蔥薑水}
  - {id: s_fish_marinated, label: 蔥薑水抓醃過的魚（冷藏）}
  - {id: s_scallion_cut, label: 斜切蔥段（泡冰水）}
  - {id: s_fish_scored, label: 沖淨擦乾、畫刀的魚}
  - {id: s_fish_steamed, label: 蒸熟的魚}
  - {id: s_hot_oil, label: 熱油}
  - {id: s_plated, label: 淋汁鋪蔥的魚}
  - {id: s_final, label: 清蒸魚（電鍋版）, role: final}

actions:
  - id: a1
    technique: tech/combine
    term: 調蔥薑水
    inputs: [i_water_marinade, i_scallion_marinade, i_ginger_marinade, i_salt_marinade]
    outputs: [s_marinade_liquid]
    tool: tool/bowl
    params: {duration: {min_s: 120, max_s: 120, raw: "用手揉搓2分鐘成蔥薑水", is_guide: true, evidence: C1, status: sourced}}
    completion: [{observe: 蔥薑水, target: 揉搓後的獨立感官完成條件原文沒寫, method: null, note: "『用手揉搓2分鐘成蔥薑水』是操作時間，不是可目測的液體狀態"}]
    note: "C1：也可以用調理機來打但不要打太碎。duration.min_s/max_s 是 schema 只收秒的單位正規化，權威數字以 raw 原文分鐘為準"
  - id: a2
    technique: tech/marinate
    term: 魚加蔥薑水抓醃，冷藏
    inputs: [i_fish, s_marinade_liquid]
    outputs: [s_fish_marinated]
    params:
      duration: {min_s: 600, max_s: 1800, raw: "放入冷藏醃10～30分鐘", is_guide: true, evidence: C1, status: sourced}
    completion: [{observe: 魚, target: 原文沒寫完成狀態, method: null, note: "原文只給時間；『不要醃太久不然滿滿都是蔥味也怪怪的』"}]
    constraint: "料理前先把腹腔內部靠骨頭的那條紅色血管用小湯匙刮除，鰓蓋內部紅色組織清乾淨（C1）"
    can_overlap: [a4]
    note: "duration.min_s/max_s 是 schema 只收秒的單位正規化，權威數字以 raw 原文分鐘為準"
  - id: a4
    technique: tech/cut
    term: 青蔥斜切成蔥段泡冰水
    inputs: [i_scallion_top]
    outputs: [s_scallion_cut]
    tool: tool/knife
    params: {cut: {shape: cut/duan, raw: "將青蔥斜切成蔥段泡冰水備用", evidence: C1, note: "C1：斜切會切斷纖維，口感好且香味比較出得來"}}
    completion: [{observe: 蔥, target: 斜切成段, method: 目測, evidence: C1}]
    can_overlap: [a2]
  - id: a5
    technique: tech/score
    term: 沖淨擦乾、魚身畫兩三刀
    inputs: [s_fish_marinated]
    outputs: [s_fish_scored]
    tool: tool/knife
    params: {cut: {raw: "用刀在魚身上畫兩三刀便於蒸熟", evidence: C1, note: "劃刀深度、間距原文沒寫"}}
    completion: [{observe: 魚身, target: 畫兩三刀（目的：便於蒸熟）, method: 目測, evidence: C1}]
    note: "先將魚取出用清水沖洗掉上面附著的蔥薑，用廚房紙巾略擦乾（原文）"
  - id: a6
    technique: tech/steam
    term: 電鍋蒸魚：放入魚盤後蓋上鍋蓋，計時 10 分鐘
    inputs: [s_fish_scored, i_cup_water]
    outputs: [s_fish_steamed]
    tool: tool/electric_cooker
    params:
      duration: {min_s: 600, max_s: 600, raw: "計時10分鐘", is_guide: true, evidence: C1, status: sourced}
      loading: {note: "C1 食譜卡寫盤子裡放幾根筷子把魚墊高，前文另寫『盤子裡放兩根筷子』。電鍋鍋底加個蒸架或墊高板，不要直接把盤子放進鍋底蒸（原文）"}
    control: "先放外鍋水按下開關，等電鍋大量冒蒸汽後才放入蒸魚盤，蓋上鍋蓋，開始計時（原文）"
    completion:
      - {observe: 魚眼, target: 魚眼蒸到爆凸就是熟了（僅適用於帶魚眼的整尾或魚頭在的魚；作者並註『據說魚要夠新鮮才會蒸出魚眼爆凸的效果』，自己未驗證不新鮮的魚）, method: 目測, evidence: C1}
      - {observe: 計時, target: 10 分鐘一到立刻把魚拿出來，不要等開關跳起來, method: 目測, evidence: C1}
      - {observe: 不帶魚眼的魚片／魚排, target: 其他感官熟度條件原文沒寫, method: null, note: "不可自行補插筷或離骨等判準"}
    note: "C1：電鍋的熱力不大、蒸汽量較小，要蒸 10 分鐘比較保險；原文同段另述瓦斯爐蒸 7–8 分鐘，本檔為電鍋版不採。duration.min_s/max_s 是 schema 只收秒的單位正規化，權威數字以 raw 原文分鐘為準"
  - id: a7
    technique: tech/heat_oil
    term: 小鍋加熱油（家裡沒有小單柄鍋，用平底鍋代替，推論）
    inputs: [i_oil]
    outputs: [s_hot_oil]
    tool: tool/frying_pan
    params:
      heat: {level: null, raw: 原文沒寫火力, evidence: null}
      temperature: {target: oil, min_c: null, max_c: null, raw: 原文沒寫油溫，家裡無溫度計, evidence: null}
    completion: [{observe: 油, target: 原文沒寫完成狀態, method: null, note: "原文只寫『加熱2大匙油』；油溫、冒煙與否都沒寫"}]
    must_finish_before: [a9]
  - id: a8
    technique: tech/plate
    term: 換盤、倒掉一半湯汁、淋蒸魚醬汁、堆上青蔥
    inputs: [s_fish_steamed, s_sauce, s_scallion_cut]
    outputs: [s_plated]
    completion: [{observe: 成品, target: 原文沒寫完成狀態, method: null, note: "原文只寫『把魚小心放入盤中，倒掉一半的湯汁』再淋汁堆蔥"}]
    note: "C1 前文亦述粵菜做法『倒掉湯汁，把蒸好的魚放在另一個盤子上，淋上調好的蒸魚醬汁』"
  - id: a9
    technique: tech/drizzle_hot_oil
    term: 澆上熱油
    inputs: [s_plated, s_hot_oil]
    outputs: [s_final]
    completion: [{observe: 成品, target: 澆熱油後香氣撲鼻（C1：『用一點點熱油潑上去，一樣能香氣撲鼻』）；熱油前的溫度或完成條件原文沒寫, method: 嗅覺, evidence: C1}]
    timing: {phase: 最後, status: sourced, evidence: C1}
    note: "C1 明確寫先淋醬、堆青蔥、澆熱油"

serving:
  completion:
    - {observe: 上桌溫度與食用時限, target: 原文沒寫, method: null, note: "C1 未給上桌溫度或多久內吃完"}
  sensory_target:
    color: 顏色清爽（C1 述改用生抽後成品菜色顏色清爽）
    taste: 鹹鮮、醬汁夠味且與魚肉搭配（C1 對餐廳蒸魚的描述）
    texture: 肉質鮮嫩 Q 彈（C1 對餐廳蒸魚的描述）

notes:
  whole_fish_caution: "C1 原文：『電鍋直徑小，適合蒸魚片魚排，如果要蒸整尾魚，還是得用瓦斯爐或電磁爐，用專用蒸鍋，或是炒菜鍋加蒸架組合』（瓦斯爐蒸 7～8 分鐘）。『整尾魚只要確認放得進電鍋就用電鍋蒸』是家庭改法（推論），不是 C1 原本的建議；放不下就改用魚片／魚排，或依 C1 改炒鍋加蒸架（不在本檔）"
  main_source_choice: "主來源選 C1：它是三者中唯一同時給齊外鍋水量（1 杯）、計時蒸法（10 分鐘）、淋汁逐項比例（生抽 2 大匙:水 2 大匙:香油 1 茶匙:糖半茶匙）、用油量（2 大匙）與完成狀態（魚眼爆凸）的電鍋蒸魚寫法，且為台灣家常語境。"
  fish_species_note: "主來源 C1 未指定魚種（寫『鮮魚：1尾』），台灣常見度原文沒寫、未核實。對照組 C2 用『紅哥里 1 條』，作者自述『紀錄在新加坡的煮婦生活』；是否為星馬市場名、台灣常見度如何，原文沒寫、未核實，僅作參照。C3 的富貴魚（燕鯧魚）『在傳統市場不容易找到』（C3 原句）。"
  chili_adaptation: "主體無辣椒（C1 廣式豉油汁無辣；其泰式檸檬醬汁另含辣椒 1 根，本檔未採）。C2 將大辣椒 1 根塞入魚肚與魚同蒸——家庭版改法（inferred，無數字）：辣椒不與魚同蒸，最後與蔥段一起鋪上、以熱油淋過，或另盛小碟由振達自行添加，做到一鍋兩吃（太太那份不加）。"
  weekday: "平日（≤20 分鐘）不建議：C1 食譜卡已標準備時間 30 分鐘、料理時間 10 分鐘。冷藏醃 10–30 分鐘是流程中已有的步驟，不要再把它額外加算到準備時間之外；原文未交代這些時間如何重疊。若省略冷藏醃漬、改現場短抓是否壓得進 20 分鐘，原文沒寫、待試做。"
  burners: "家庭排程（推論，非原文）：蒸魚用電鍋（不占爐口）；熱油（a7）家裡改用平底鍋占 1 口爐（C1 原文是小單柄鍋），可與電鍋蒸魚同時進行；醬汁若依原文『稍微加熱』溶糖可同時用第 2 口爐。任何時刻最多 2 口。"
  doneness: "完成判斷只用感官：C1 給『魚眼蒸到爆凸就是熟了』（看；僅適用帶魚眼的魚，且作者註明新鮮度未嚴格驗證）與計時 10 分鐘一到即取出。魚片／魚排或其他感官熟度條件（插筷、離骨等）三家來源都沒寫，維持原文沒寫。來源未給任何溫度，家裡也無溫度計，故 a7 溫度寫 null。"
  jump_switch_note: "振達家習慣電鍋『跳起為止』；主來源 C1 明確說『時間一到立刻把魚拿出來，不要等開關跳起來』（10 分鐘計時）。本檔依主來源，跳起與否的差異留待試做對照。"
  sauce_heating: "C1：醬汁『全部混合，稍微加熱讓糖融化』；不加热時『攪拌到完全溶解』亦可。加熱火力原文沒寫。"
  wda_reference: "勞動部舊版丙級術科 303 A 組『蒜味蒸魚』先前查找紀錄：僅查到第三方鏡像 PDF（嘉南藥理大學機構典藏），當時開啟回 HTTP 403；依『打不開不當來源』規則未列入 sources。本次交叉核對未重新連線驗證該狀態碼。"

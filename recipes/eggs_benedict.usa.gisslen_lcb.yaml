# 班尼迪克蛋 — 正式檔，規格 v1.0。跨來源組合版：組裝與水波蛋依 Gisslen《Professional Cooking》，荷蘭醬依 Le Cordon Bleu。
# 三層：澄清奶油 → 荷蘭醬；水波蛋；→ 組裝。
# Gisslen 原本引用自家 p.200 的荷蘭醬；改用 LCB 是版本選擇（P1 任務指示）。Gisslen 荷蘭醬只拿來對照與保溫安全規則。
# 爐口（家庭版順序）：先做荷蘭醬（1 口），離火保溫；再同時水波蛋（1 口）＋熱火腿（1 口），最多同時用兩口爐。
# 家庭改法（定稿，不是原文）：瑪芬用平底鍋乾烙；卡宴辣椒粉不辣版分開做，最後只撒在要辣的那份。

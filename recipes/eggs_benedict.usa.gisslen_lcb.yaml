notes:
  combination: "跨來源組合版：Gisslen 的 Eggs Benedict 原引用自家 p.200 荷蘭醬（Hollandaise I/II，產量 720 mL）；本檔依版本選擇改用 LCB 四人份。兩者比例對照：LCB 奶油 250 g／蛋黃 4 顆／水 60 mL；Gisslen II 奶油 600 g／蛋黃 6 顆／冷水 30 mL／檸檬汁 45 mL"
  burners: "家庭版順序（最多同時用兩口爐）：①澄清奶油與荷蘭醬（爐口 A）→ 離火保溫 ②水波蛋（爐口 A）與熱火腿（爐口 B）同時 ③瑪芬用平底鍋乾烙（家庭改法，不是原文）。G1 原文只規定『蛋在煮的同時熱火腿』，沒有說荷蘭醬何時做；把荷蘭醬排在最前面是為了最多同時用兩口爐（推論）"
  lcb_time: "L1 準備時間 15 分鐘（Preparation time: 15 minutes）"

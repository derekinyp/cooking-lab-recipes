     qty: {value: 500, unit: g, raw_text: "Cauliflower (about 500g) 1 head", evidence: H1, status: sourced, note: "H1 原量 1 顆約 500 g；小朵約 3–4 cm（H1：about 3 to 4 cm across）"}}
  - {id: i_pork_belly, concept: ing/pork_belly, label: 五花肉（薄片）, form: 片, role: 主料,
     qty: {value: 100, unit: g, raw_text: "Pork belly, thinly sliced 100 g", evidence: H1, status: sourced, note: "H1 原量；是否去皮原文沒寫"}}

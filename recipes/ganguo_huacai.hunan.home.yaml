# 乾鍋花菜（湖南家常版）— 起始草稿，規格 v1.0
# 主來源 H1：份量、火力、時間、完成狀態只用 H1 原文數字；W1、L1 僅作對照，不混進主體比例。
# 家庭條件：廚具僅電鍋、炒鍋、平底鍋、湯鍋；無烤箱、氣炸鍋、蒸籠、溫度計、料理秤。
schema_version: "1.0"
recipe:
  id: ganguo_huacai.hunan.home
  version: "1.0"
  kind: dish
  dish_concept: dish/ganguo_huacai
  name: {zh_hant: 乾鍋花菜, zh_hans: 干锅花菜, en: Dry Pot Cauliflower (Gan Guo Hua Cai)}
  variant: 湘式家常版
  summary: 花菜掰小朵鹽水泡過徹底擦乾，五花肉煸出油脂，先炒辣豆瓣出紅油，再爆香辣椒、花椒、蒜、薑，最大火乾煸花菜至邊緣微焦、口感脆嫩，最後下生抽、老抽、糖與蔥段裹勻。
  cuisine:
    - {id: cuisine/xiang, basis: "H1 標題與內文自稱 Hunan / Xiang cuisine 湘菜", claim: primary, evidence: H1}
    - {id: region/hunan, basis: "H1 為湖南食譜專案頁面", claim: primary, evidence: H1}
  flavor_template: {ref: flavor/mala, basis: "H1：Dry pot cauliflower is a classic example of ma la (麻辣)；配方含花椒、乾辣椒、豆瓣醬", evidence: H1}
  servings: {value: null, status: sourced, evidence: H1, note: "原文 Serves 3-4（結構化資料 recipeYield：3-4 servings），為範圍份數；規格 servings 只支援單一 value，留空，不自取整"}
  status: cross_checked
  sources:
    - id: H1
      title: "HunanFlavor〈Dry Pot Cauliflower (干锅花菜) — Hunan Spicy Stir-Fry〉"
      url: https://hunanflavor.com/recipes/dry-pot-cauliflower.html
      level: C
      type: web
      accessed: 2026-11-27
      note: "主來源。Serves 3–4；Prep 10 min、Cook 15 min、Total time: 25 minutes。花菜約 500 g、五花肉 100 g、乾辣椒 10 個、花椒 1 tbsp、蒜 3 瓣、薑 3 片、豆瓣 1 tbsp、生抽 1 tbsp、老抽 1/2 tsp、糖 1/2 tsp、蔥 2 枝、油 2 tbsp、泡水鹽 1 tsp。頁面本文署名 HunanFlavor Editorial Team；結構化資料的 author 欄另列 Mr. Ma from Henan，署名資訊不一致。非教材或出版書。"
    - id: W1
      title: "Woks of Love〈Homestyle Sichuan Dry Pot Cauliflower (Gan Guo Hua Cai)〉（Lin，2025-11-12，更新 2025-11-21）"
      url: https://woksoflove.com/homestyle-sichuan-dry-pot-cauliflower-gan-guo-hua-cai/
      level: C
      type: web
      accessed: 2026-11-27
      note: "對照（川味家常部落格，作者自稱成長於四川餐廳）。以下只摘頁面的食譜卡（正文敘述段的份量與流程另有出入，例如花菜寫 250–300 g，未採用）：2 人份；Prep 15、Cook 10、Total 25 分鐘。1 small head cauliflower (about 250g / 9 oz)、五花肉 3.5 oz (100g)、Pixian Doubanjiang 1 tbsp、乾辣椒 10-15 個、蒜 2 瓣、生抽 1 tbsp、老抽 1 tsp、鹽 1/4 tsp（or to taste）、蔥 1 枝（只用綠色部分）、泡水鹽 1 tsp；無花椒、無薑、無糖。食譜卡流程：中小火煸五花肉約 4-5 分鐘後撈出、小火炒豆瓣 1-2 分鐘、下蒜與乾辣椒 30 秒、大火炒花菜 2-3 分鐘、五花肉回鍋淋生抽老抽。"
    - id: L1
      title: "李錦記美國官網〈干鍋花菜〉"
      url: https://usa.lkk.com/zh-hk/recipes/dry-pot-cauliflower
      level: A
      type: official
      accessed: 2026-11-27
      note: "對照（醬料品牌官方食譜頁，產品導向）。Serves 2；準備 5 分鐘、烹煮 10 分鐘。椰花菜 1 磅、五花肉（去皮切片）6 安士、小米辣椒 2 安士、乾紅辣椒少許、麻椒 1 湯匙、蒜 1 安士；蠔油 2 湯匙、麻辣火鍋上湯 1 湯匙、生抽 1 湯匙、雞粉 2 茶匙；食材表未列豆瓣醬與糖；另用小米辣椒、乾紅辣椒、麻椒及麻辣火鍋上湯調味。"
  extracted_by: [doubao]

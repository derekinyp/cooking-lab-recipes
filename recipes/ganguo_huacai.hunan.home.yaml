  - {id: i_soy_dark, concept: ing/soy_sauce_dark, label: 老抽（深色醬油，上色用）, role: 調料,
     qty: {value: 0.5, unit: tsp, raw_text: "Dark soy sauce 1/2 tsp", evidence: H1, status: sourced}}
  - {id: i_sugar, concept: ing/white_sugar, label: 白糖, role: 調料,
     qty: {value: 0.5, unit: tsp, raw_text: "Sugar 1/2 tsp", evidence: H1, status: sourced}}
  - {id: i_scallion, concept: ing/scallion, label: 蔥（蔥段）, form: 段, role: 輔料,
     qty: {value: 2, unit: stalk, raw_text: "Scallions 2 stalks", evidence: H1, status: sourced}}
  - {id: i_oil, concept: ing/cooking_oil, label: 食用油, role: 油脂,

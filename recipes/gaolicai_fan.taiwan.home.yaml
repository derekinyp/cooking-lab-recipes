# 高麗菜飯（一鍋到底・湯鍋爐上版）— 規格 v1.0
# 做法依據 V＝Facebook reel〈一鍋到底〉（Ssu Chiao Huang，34.9 秒）：步驟順序、材料種類、「小火滾煮15分鐘」照影片字幕與旁白。影片沒有任何份量。
# 主來源 M＝愛料理 Popo小日子〈一鍋到底「高麗菜飯」簡單又美味。〉（4 人份、30 分鐘）：同樣是爐上一鍋到底、煮滾後蓋鍋小火 15 分鐘；
#   米、水、高麗菜、紅蘿蔔、醬油、鹽、白胡椒、油、悶的時間只用 M 的數字，不混拼。
# 影片有、M 沒有的材料（五花肉、蝦米、紅蔥頭、蔥花）用量標 missing，有出處的建議值寫在 note（S1、S2），不進主體數字。
# 影片與 M 都沒有用烤箱或氣炸鍋，不需改法。影片用「壓鑄湯鍋」，本檔用湯鍋。

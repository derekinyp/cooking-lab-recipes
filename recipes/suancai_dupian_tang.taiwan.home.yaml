  name: {zh_hant: 酸菜肚片湯, zh_hans: 酸菜肚片汤, en: "Pickled mustard greens and pork tripe soup"}
  variant: 台式家常版
  summary: 豬肚加米酒、蔥、薑煮軟後切片，酸菜、薑絲加水煮滾，再放入肚片煮約 10 分鐘，加鹽調味的台式清湯。
  cuisine:
    - {id: cuisine/taiwanese.home, basis: "主來源 M 為楊桃美食網台灣平台家常湯品（#中式家常 #一鍋到底）（編者分類）", claim: primary, evidence: M}
    - {id: region/taiwan, basis: "主來源為台灣食譜平台楊桃美食網；平台本身不單獨證明料理地域歸屬，此為編者分類", claim: primary, evidence: M}
  flavor_template: null
  servings: {value: null, status: missing, note: "M 沒標人份；S1 未標人份。S2 存檔為 429 錯誤頁，無法核對"}
  status: cross_checked
  sources:
    - id: M
      title: "楊桃美食網〈酸菜豬肚湯〉（出處《人氣指數超高小館子料理》）"
      url: https://www.ytower.com.tw/recipe/A02-1455
      level: C
      type: web
      accessed: 2026-11-27
      note: "主來源。材料 A：豬肚 1/2 個、酸菜 2 片、薑絲 50 公克；材料 B：米酒 1 大匙、蔥 1 支、薑片 2 片；調味料：鹽少許。作法：1. 豬肚放入沸水中，加材料 B 煮約 40 分鐘至軟化，撈起切斜片備用。2. 酸菜洗淨，切斜片備用。3. 取鍋加水 2000cc 加入作法 2 的酸菜片、薑絲煮至沸騰。4. 再加入作法 1 的豬肚片，再煮約 10 分鐘，加入鹽調味即可。頁面標籤：#中式家常 #一鍋到底。"
    - id: S1
      title: "《美味鮮湯》（小廚師美食系列七，山東科學技術出版社，ISBN 7-5331-1622-4）〈酸菜肚片湯〉"
      url: https://18803350.s21i.faiusr.com/61/ABUIABA9GAAgs6-xlgYo8ICQ-gM.pdf
      level: B
      type: book
      accessed: 2026-11-27
      note: "對照。掃描 PDF 經免費檔案空間散佈；版權頁載 ISBN 7-5331-1622-4、山東科學技術出版社、圖字：15-95-08、TS·118。材料：猪肚 1 个、酸菜 150 克、笋 1 支、高汤 6 碗。調味料：盐 1 小匙、麻油少许。做法：1. 猪肚兩面搓洗乾淨（詳見薏仁豬肚湯），入熱水略燙一下，切成片狀；酸菜沖去浸汁，切取葉梗部分成小段；筍去殼洗淨，切成薄片備用。2. 高湯入鍋煮滾，放入肚片、酸菜、筍片同煮，等高湯滾時加鹽調味，改用小火繼續燉煮 10~15 分鐘，見肚片酥軟即可熄火。上桌前，滴下少許麻油。"
    - id: S2
      title: "下廚房 Garcia666 轉《家常菜秘訣一學就會》生活新實用編輯部〈酸菜肚片湯〉"
      url: https://hanwuji.xiachufang.com/recipe/107639136/
      level: C
      type: personal
      accessed: 2026-11-27
      note: "對照來源存檔目前只有 429 Too Many Requests 錯誤訊息，未取得食譜文字；本來源內容無法核實，不用於食譜主體或比較結論。"

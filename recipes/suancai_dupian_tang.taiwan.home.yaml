notes:
  weekday: "假日菜：M 煮豬肚約 40 分鐘＋肚片回湯約 10 分鐘，合計約 50 分鐘（推論；不含清洗、切配），已超過平日 20 分鐘門檻（20 分鐘門檻是家庭自訂條件，不是來源數字）；清洗、切配時間 M 沒寫，待試做計時"
  burners: "爐口數與兩階段是否使用同一鍋，原文沒寫；兩段煮製依步驟先後進行（推論），可依家中設備安排"
  spicy_split: "M 主體沒有辣椒、花椒、辣豆瓣，整鍋即不辣那份，一鍋兩吃不需分流；S1 亦無辣椒、花椒。S2 存檔無可核實的食譜文字。想加辣者各自在碗裡加（推論）"
  oven_airfryer: "M、S1 皆未使用烤箱、氣炸鍋、蒸籠；S2 存檔無可核實的食譜文字。本檔用湯鍋爐上煮，無需改法。S1 書中其他食譜用到微波爐，本菜譜未採用；家庭無微波爐不影響"
  pot_size: "湯鍋容量原文沒寫；鍋具容量需求待試做確認（推論）"
  compare: "主體份量與調味照 M；M 未寫火力檔位，完成句為『加入鹽調味即可』，未詳述其他完成狀態。S1（出版書《美味鮮湯》，筍、高湯、麻油）僅作對照；S2 存檔為 429 錯誤頁，無法核對內容，不作比較依據"
  missing: "原文沒寫：人份；豬肚清洗方式／水量／時間；煮豬肚火力檔位、是否加蓋、煮豬肚用水；酸菜是否泡水去鹹及泡水水量時間；肚片／酸菜片／薑絲的毫米尺寸；酸菜薑絲水煮滾時間；最終成品色澤、口感與湯味完成狀態；上桌溫度與食用時限；筍、高湯、麻油、胡椒等配料；湯鍋大小"
  decisions: "主來源選 M：楊桃美食網、內容出自出版書《人氣指數超高小館子料理》，台式家常湯品，兩階段煮法與時間完整。S1 為出版書《美味鮮湯》的對照版本（筍、高湯、麻油，小火 10~15 分鐘）；S2 存檔為 429 錯誤頁，內容無法核實，不作比較依據"

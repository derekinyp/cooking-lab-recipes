# 豆干肉絲（台式家常版）— 起始草案，規格 v1.0
# 主來源 M＝究好豬官方食譜頁《豆乾炒肉絲》（1 人份、30 分鐘）：豆乾、肉絲、蔥、辣椒、
#   醬油、糖、醃料、時間只採 M 的數字，不與 S1/S2 混拼。S1、S2 僅作比較與 note 對照。
# 家庭條件：兩口瓦斯爐（最多 2 口）；廚具僅電鍋、炒鍋、平底鍋、湯鍋；無烤箱、氣炸鍋、
#   蒸籠、溫度計、料理秤。M/S1/S2 皆未用到烤箱、氣炸鍋、蒸籠，無需改法。
schema_version: "1.0"
recipe:
  id: dougan_rousi.taiwan.home
  version: "1.0"
  kind: dish
  dish_concept: dish/dougan_rousi
  name: {zh_hant: 豆干肉絲, zh_hans: 豆干肉丝, en: Stir-fried pork shreds with firm tofu (dougan)}
  variant: 台式家常版
  summary: 豆乾先川燙剖半切絲、炒至微金黃取出；肉絲抓醃再加太白粉抓勻；爆蔥白、辣椒、蒜末後下肉絲炒至 6 分熟，回鍋豆乾與醬油、蠔油、糖、米酒拌炒，最後加青蔥、白胡椒粉起鍋。
  cuisine:
    - {id: cuisine/taiwanese.home, basis: "主來源 M 為台灣品牌站家常炒法（編者分類）", claim: primary, evidence: M}
    - {id: region/taiwan, basis: "主來源 M 為台灣品牌官方食譜站；地域歸屬為編者分類", claim: primary, evidence: M}
  flavor_template: null
  servings: {value: 1, status: sourced, evidence: M, note: "M 標「適用人數：1」；主體用 M 原量不縮放"}
  status: cross_checked
  sources:
    - id: M
      title: "究好豬（choho）官方食譜頁【豆乾炒肉絲】"
      url: https://www.choho.com.tw/recipe-detail/91/
      level: C
      type: web
      accessed: 2026-11-27
      note: "主來源。1 人份、料理時間 30 分鐘。肉絲為品牌包裝產品「究好豬-黃金比例肉絲 200g/1包」。醃料：鹽 1小匙、糖 1小匙、蒜泥 1小瓣、醬油 1小匙、米酒 1中匙、香油 適量、太白粉 1中匙；調味：蒜頭 3瓣(切末)、蔥 3支(蔥白斜切、青蔥斜切)、辣椒 適量、醬油 1中匙、蠔油 1小匙、糖 1小匙、米酒 2大匙、白胡椒粉 適量、油 適量。火力檔位原文沒寫。"
    - id: S1
      title: "金蘭食品股份有限公司 廚藝學院《香干肉丝》（料理作者：金兰小酱）"
      url: https://www.kimlanfoods.com.tw/cn/recipes/18
      level: C
      type: web
      accessed: 2026-11-27
      note: "比較來源。2 人份、料理時間 45 分鐘。豆干 300克、肉丝 150克、蒜头 20克、辣椒 1支、葱 5支；調味：金兰油膏 1大匙、金兰酱油 1大匙、酒 2大匙、糖 少许；腌肉酱料：金兰油膏 1小匙、酒 1小匙、太白粉 少许。頁面為簡體中文，引用保留原字。火力檔位原文沒寫。"
    - id: S2
      title: "灶神（zaogod）部落格《五香豆干炒肉絲》（2018-10-29）"
      url: https://www.zaogod.com/post/%E4%BA%94%E9%A6%99%E8%B1%86%E5%B9%B2%E7%82%92%E8%82%89%E7%B5%B2
      level: C
      type: personal
      accessed: 2026-11-27
      note: "比較來源。份數與總烹調時間原文沒寫（「讀畢需時 1 分鐘」是文章閱讀時間，非烹調時間）。梅花肉 100g 切絲、五香豆干 200g 切絲、大蒜 3～4顆切末、辣椒 半根、青蔥 2根切段、白芝麻 適量；醃料：鹽 1小匙、醬油 1大匙、蛋白 1大匙、玉米粉 1小匙；調味：米酒 2大匙、醬油 2大匙、糖 1大匙、白胡椒粉 適量、水 半碗。作法 4 寫「開大火」。"
  extracted_by: [doubao]

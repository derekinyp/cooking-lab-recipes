# 香菇雞湯（家常湯鍋版）— 起始檔，規格 v1.0
# 主來源 M＝楊桃美食網〈香菇雞湯〉（曹麗娟示範，出處《教瑪麗亞作菜》）：份量、水量、調味、火力、時間全部只用 M 的數字，不混拼。
# 對照：楊桃〈香菇雞湯(6)〉（A03-2046，快樂廚房雜誌第86期）、愛料理劉雪瑜〈美味香菇雞湯〉（電鍋版）。
schema_version: "1.0"
recipe:
  id: xianggu_jitang.taiwan.home
  version: "1.0"
  kind: dish
  dish_concept: dish/xianggu_jitang
  name: {zh_hant: 香菇雞湯, zh_hans: 香菇鸡汤, en: Shiitake chicken soup}
  variant: 家常版（湯鍋版）
  summary: 雞切塊汆燙去血水，與對切鮮香菇、薑片、米酒、鹽等調味料同入湯鍋，中火燉煮 30 分鐘，撈去浮沫即可。
  cuisine:
    - {id: cuisine/taiwanese.home, basis: "主來源 M 為台灣家常一鍋到底湯品（#中式家常 #一鍋到底）（編者分類）", claim: primary, evidence: M}
    - {id: region/taiwan, basis: "主來源為台灣食譜平台楊桃美食網；平台本身不單獨證明料理地域歸屬，此為編者分類", claim: primary, evidence: M}
  flavor_template: null
  servings: {value: null, status: missing, note: "M 沒標人份；材料寫『雞1/2隻』"}
  status: cross_checked
  sources:
    - {id: M, title: "楊桃美食網〈香菇雞湯〉（示範：曹麗娟，出處《教瑪麗亞作菜》）", url: "https://www.ytower.com.tw/recipe/A03-122", level: C, type: web, accessed: 2026-11-24,
       note: "主來源。雞1/2隻、新鮮香菇10朵、薑片5片、水8杯；米酒1/3杯、香油1/3大匙、鹽1/3大匙、柴魚味精1/3大匙；作法：雞切塊汆燙去血水、香菇去蒂對切、8杯水入湯鍋加全部材料、中火燉煮30分鐘、撈去浮沫即可食用。頁首註：『雞肉川燙可以去除血水與腥味』"}
    - {id: S1, title: "楊桃美食網〈香菇雞湯(6)〉（出處《快樂廚房雜誌第86期》）", url: "https://www.ytower.com.tw/recipe/A03-2046", level: C, type: web, accessed: 2026-11-24,
       note: "對照。香菇10朵、雞腿肉1支、薑片20公克、蔥段20公克、水1000㏄；鹽1小匙、米酒2大匙；先汆燙，少許油炒香薑片香菇，水煮滾後下雞腿肉小火煮約15分鐘至熟透，加蔥段調味。小撇步：水滾後才下雞腿肉才不會過老乾柴"}
    - {id: S2, title: "愛料理 劉雪瑜〈美味香菇雞湯〉（2018-06-07）", url: "https://icook.tw/recipes/255094", level: C, type: web, accessed: 2026-11-24,
       note: "對照（電鍋版）。10 人份；雞肉半隻、香菇適量、鹽2匙半、米酒少許、水適量；雞剁塊、香菇泡水、炒鍋加水燙雞肉撈起，加鹽與米酒後拿去電鍋燉。時間欄標 5 分鐘（推論：可能不含電鍋燉煮時間）。小撇步：可加紅棗枸杞"}
  extracted_by: [kimi, codex]
  changelog:
    - {version: "1.0", date: 2026-11-24, change: "起始檔：以 M 為主來源；S1、S2 作對照。M 沒寫的一律 null＋missing，不補不估", by: kimi}
    - {version: "1.0", date: 2026-11-27, change: "Codex 交叉核對後修正：雞改用未指定部位的 ing/chicken；1/3 改用文字欄照原文記、不轉小數；S2 香菇不再說成乾香菇；汆燙與撈浮沫不再指定來源沒寫的工具；燉煮技法改歸煮、保留中火；平日判斷與戳熟的標示改清楚", by: codex}
    - {version: "1.0", date: 2026-11-27, change: "Codex 4 複核通過（上一輪必修項已修好、未引入新錯誤），升為 cross_checked", by: codex}


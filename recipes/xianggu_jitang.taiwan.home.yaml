states:
  - {id: s_chicken_blanched, label: 汆燙洗淨的雞塊}
  - {id: s_shiitake_cut, label: 去蒂對切的香菇}
  - {id: s_ginger_cut, label: 薑片}
  - {id: s_soup, label: 中火燉煮好的香菇雞湯}
  - {id: s_final, label: 香菇雞湯, role: final}

actions:
  - id: a1
    technique: tech/blanch
    term: 雞切塊汆燙去血水，撈起洗淨
    inputs: [i_chicken]
    outputs: [s_chicken_blanched]
    params: {duration: {min_s: null, max_s: null, raw: "原文沒寫汆燙多久", status: missing}, heat: {level: null, raw: "汆燙火力原文沒寫"}}
    completion:
      - {observe: 雞塊, target: 去血水（頁首註『雞肉川燙可以去除血水與腥味』）, method: 目測（浮沫浮出為推論判斷方式，原文沒寫怎麼判斷）, evidence: M}
    note: "M 作法第 1 步；M 沒寫用哪種鍋汆燙（家用建議用湯鍋，推論）。用同一湯鍋汆燙再洗淨換水，或直接另起燙鍋，M 沒寫；本檔全程 1 口爐則先燙好撈起洗淨再進 a3（家庭改法，推論）"
  - id: a2
    technique: tech/cut
    term: 香菇洗淨瀝乾去蒂再對切；薑洗淨切片
    inputs: [i_shiitake, i_ginger]
    outputs: [s_shiitake_cut, s_ginger_cut]
    tool: tool/knife
    completion: [{observe: 香菇, target: 去蒂、對切（M 作法第 2 步）, method: 目測, evidence: M}]
    can_overlap: [a1]
  - id: a3
    technique: tech/boil
    term: 8 杯水入湯鍋，放入雞肉塊、香菇、薑片與所有調味料，中火燉煮 30 分鐘
    inputs: [s_chicken_blanched, s_shiitake_cut, s_ginger_cut, i_water, i_wine, i_sesame, i_salt, i_dashi_msg]
    outputs: [s_soup]
    tool: tool/stock_pot
    params:
      heat: {level: heat/medium, raw: "用中火燉煮30分鐘", evidence: M}
      duration: {min_s: 1800, max_s: 1800, raw: "中火燉煮30分鐘", is_guide: true, evidence: M, status: sourced}
    note: "原文寫『燉煮』；詞表『燉』定義為小火長時間，與原文明寫的中火不同，所以技法歸『煮』，原文用字與中火照留"
    completion:
      - {observe: 計時, target: 中火燉煮滿 30 分鐘, method: 計時, evidence: M}
      - {observe: 雞肉熟度, target: 原文沒寫完成狀態；對照 S1『小火煮約15分鐘至熟透』，以筷子戳得穿是家庭判斷建議（推論，不是 M 或 S1 的原句；依據：S1 寫『煮約15分鐘至熟透』，可見熟度才是判斷標準）, method: 戳（推論）}
  - id: a4
    technique: tech/season
    term: 撈去浮沫即可食用
    inputs: [s_soup]
    outputs: [s_final]
    completion: [{observe: 湯面, target: 浮沫撈淨（M 作法第 6 步）, method: 目測, evidence: M}]
    note: "M 沒寫用什麼工具撈浮沫（家用可用漏勺或湯勺，推論）"

serving:
  completion:
    - {observe: 上桌溫度與時限, target: 原文沒寫, method: null}
  sensory_target: {taste: 原文沒寫, texture: 原文沒寫；對照 S1 小撇步：雞腿肉勿煮過老、否則乾柴}

notes:
  weekday: "平日不可（≤20 分鐘）：M 寫中火燉煮就要 30 分鐘，已超過 20 分鐘（再加汆燙與前置，總時間 M 沒寫）。20 分鐘是家庭自訂的平日門檻，不是來源數字"
  burners: "步驟以一只湯鍋依序汆燙再燉煮；來源沒寫爐口數，全程 1 口爐是依步驟安排的推論"
  spicy_split: "M、S1、S2 都沒有辣椒、花椒，整鍋就是不辣那份，一鍋兩吃不需分流；想加辣者各自在碗裡加（推論）"
  missing: "原文沒寫：人份數、雞的部位與克重、汆燙時間與火力、杯／大匙的容量定義、燉煮後的完成狀態（只寫 30 分鐘與撈浮沫）、鍋子大小、上桌溫度"
  compare: "見輸出 (F) 公開食譜比較表。M 用鮮香菇直接對切；S1 用鮮香菇但先油炒香薑片香菇、水滾才下雞腿肉（防乾柴）；S2 用電鍋燉、香菇稍微泡水（來源未註明鮮、乾），水與香菇量都寫『適量』"

states:
  - {id: s_bamboo_cooked, label: 煮熟的綠竹筍（帶殼）}
  - {id: s_bamboo_cooled, label: 原湯悶涼、冷藏過的綠竹筍}
  - {id: s_bamboo_peeled, label: 去殼切塊的竹筍}
  - {id: s_final, label: 涼拌綠竹筍, role: final}

actions:
  - id: a1
    technique: tech/boil
    term: 冷水放入竹筍，大火煮到水滾，轉中火續煮 25 分鐘
    inputs: [i_bamboo, i_water]
    outputs: [s_bamboo_cooked]
    tool: tool/stock_pot # 推論：來源未明載鍋具種類
    params:
      heat: {level: heat/medium, raw: "大火煮到水滾，再轉中火續煮25分鐘", evidence: S1}
      duration: {min_s: null, max_s: null, raw: "再轉中火續煮25分鐘", is_guide: true, evidence: S1, status: sourced}
    completion:
      - observe: 筍熟度
        target: 筷子可刺入筍身較厚處，沒有明顯硬芯。
        method: 目測
        evidence: null
    note: "S1 未寫煮筍前是否先刷洗竹筍外殼；H1 對照為『洗淨後帶殼冷水下鍋』。家庭無蒸籠、無烤箱、無氣炸鍋：本步用湯鍋爐上水煮；若改電鍋為家庭改法（推論），S1 未寫電鍋外鍋水量。"
  - id: a2
    technique: tech/rest
    term: 關火續悶到水涼，放入冰箱冷藏
    inputs: [s_bamboo_cooked]
    outputs: [s_bamboo_cooled]
    params: {duration: {min_s: 1800, max_s: 3600, raw: null, is_guide: true, evidence: null, status: inferred}}
    completion:
      - {observe: 煮筍湯, target: 續悶到水涼，再放入冰箱冷藏, method: 目測（水溫）, evidence: S1}
    note: "冷卻方式對照：H1 為取出放入冰水降溫；S3 為連湯放涼後冷藏（最多 3 天）或立即食用者冰水鎮 5 分鐘。本檔主體依 S1 原湯悶涼冷藏；補寫依據：關火後連筍留在原湯中悶涼，以一般家庭做法約 30–60 分鐘至不燙手。"
  - id: a3
    technique: tech/cut
    term: 竹筍去皮切塊
    inputs: [s_bamboo_cooled]
    outputs: [s_bamboo_peeled]
    tool: tool/knife
    params: {cut: {shape: cut/kuai, raw: "切塊", evidence: S1, note: "塊大小原文沒寫；S3 對照為約 1½ 吋斜塊，不採用進主體"}}
    completion:
      - {observe: 竹筍, target: 去皮（去殼）後切塊, method: 目測, evidence: S1}
  - id: a4
    technique: tech/liangban
    term: 竹筍塊擠上沙拉醬
    inputs: [s_bamboo_peeled, s_mayo]
    outputs: [s_final]
    completion:
      - {observe: 成品, target: 竹筍去皮切塊，擠上沙拉醬即可, method: 目測, evidence: S1}
    note: "S1 為沙拉醬擠在筍塊上；S3 對照為醬汁另外沾食或淋上皆可。"

serving:
  completion:
    - {observe: 上桌溫度, target: 冷藏後冰涼食用；室溫放置不超過 2 小時。, method: null, evidence: null, note: 補寫依據：依 USDA 食品安全建議，熟食室溫存放上限為 2 小時。}
  sensory_target: {texture: "筍肉嫩脆細緻，切面濕潤，不帶硬芯。", taste: "綠竹筍清甜，搭配微甜帶酸的沙拉醬。"}

notes:
  weekday: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  burners: "家庭自訂：全程最多 1 口爐、1 只湯鍋煮筍；沙拉醬在碗中以打蛋器調製，不佔爐口。任一時刻不超過 2 口爐。"
  spicy_split: "主體沒有辣椒、花椒、辣豆瓣，整鍋即不辣那份；沙拉醬可先分一部分在不辣的碗裡。若日後另做麻辣變化，辣椒／花椒應在最後各自加入（推論）；S1 不存在必須一開始下鍋的辣或麻配料，不需另外分開煮。"
  oven_airfryer: "S1、H1、S3 皆未使用烤箱、氣炸鍋或蒸籠，無器具取代問題。煮筍主體用湯鍋爐上水煮；家庭改法（推論）：可改大同電鍋外鍋加水蒸，但電鍋外鍋水量、跳起次數三來源都沒寫，待試做。"
  compare: "三份來源的份量、調味、火力、時間、完成狀態可依各來源條目核對；主體數字全部來自 S1，H1、S3 僅對照。"
  missing: "已補寫（2026-11-28）：份量、時間、火候、用量的補寫依據見 notes.time_basis 與各欄位 note"
  no_scale: "家中無料理秤：S1 沙拉醬原料以 g 標示（砂糖 40g、鹽 7g、沙拉油 500g、白醋 50g），無秤時如何用匙量替代，S1 原文沒寫，不換算。"
  decisions: "2026-11-28 選定：主來源 S1（楊桃美食網，唯一同時具備份量、火力、時間的公開食譜頁）；H1 為媒體轉述農糧署做法，S3 為英文個人部落格對照。筍種以 S1 綠竹筍為準。"
  total_min: '60'
  time_basis: 竹筍 3 隻洗淨備料約 5 分鐘；水滾與中火煮 25 分鐘，關火悶涼及冷藏等待以一般家庭做法合計抓 30 分鐘，總時間約 60 分鐘。

# 鮮蝦皮蛋瘦肉粥（蝦殼鹹蛋黃湯底・生米直煮）— M 原量 3 人份，規格 v1.0
# 主來源 M＝愛料理 ijustcookit〈皮蛋鮮蝦粥〉（3 人份）：米、水、蝦仁、皮蛋、青江菜、調味、時間只用 M 的數字，本版採 M 原量（3 人份量，選定米量 B：1 米杯＋7½ 米杯水），不再縮放。
# 蝦殼＋鹹蛋黃湯底、豬肉片是影片（Ssu Chiao Huang reel）的做法；M 沒有這幾樣，用量標 missing，建議值寫在 note，不混進主體比例。
# 無秤版：米杯換算依 U1（大同量米杯 180 ml）、U2（Panasonic：1 米杯平口白米約 150 g）。

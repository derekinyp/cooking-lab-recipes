states:
  - {id: s_caipu_rinsed, label: 略洗瀝乾的蘿蔔乾}
  - {id: s_caipu_dry, label: 乾炒到水分炒乾的蘿蔔乾}
  - {id: s_egg_mix, label: 菜脯蔥花蛋液}
  - {id: s_egg_coagulated, label: 中火拌至略凝固的蛋}
  - {id: s_egg_set, label: 小火煎定型、一面微金黃的蛋}
  - {id: s_final, label: 菜脯蛋, role: final}

actions:
  - id: a1
    technique: tech/rinse
    term: 蘿蔔乾略洗淨後瀝乾
    inputs: [i_caipu]
    outputs: [s_caipu_rinsed]
    tool: tool/colander
    completion:
      - observe: 蘿蔔乾
        target: 略洗後瀝到不滴水。
        method: 目測
        evidence: null
    note: "B1 寫『略洗淨後瀝乾』，未列泡水步驟，不是明令禁止泡水。B2 寫『泡水』（時間沒寫），C1 泡水 20 分鐘換水 1-2 次『以免導致料理過鹹』。菜脯鹹度不同時要不要泡水，待試做。濾盆是家庭選用工具（推論；B1 未指定）"
  - id: a2
    technique: tech/dry_fry
    term: 下鍋小火乾炒至水分炒乾後取出
    inputs: [s_caipu_rinsed]
    outputs: [s_caipu_dry]
    tool: tool/frying_pan
    params:
      heat: {level: heat/low, raw: "下鍋小火乾炒", evidence: B1}
      duration:
        min_s: 60
        max_s: 180
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - observe: 蘿蔔乾
        target: 表面乾爽、不再冒水氣，取出備用。
        method: 目測
        evidence: null
    note: "乾炒＝不放油（推論：原文『乾炒』）。tech/dry_fry 詞表定義不完全貼合，保留原句，不從詞表再推加油或皺縮。同一只平底鍋取出後再煎蛋是家庭安排（推論）；B1 寫『另熱鍋』，本身不能證明同鍋。平底鍋是家庭選用（推論）；補寫依據：一般家庭做法以小火乾炒菜脯約 1–3 分鐘，直到表面乾爽、不再冒水氣。"
  - id: a3
    technique: tech/combine
    term: 雞蛋打散，加入蔥花、碎蘿蔔乾、鹽、白胡椒粉打勻
    inputs: [i_egg, i_scallion, s_caipu_dry, i_salt, i_pepper]
    outputs: [s_egg_mix]
    tool: tool/bowl
    completion:
      - observe: 蛋液
        target: 蛋白與蛋黃混合均勻，蔥花和菜脯分布平均。
        method: 目測
        evidence: null
    note: "B1：『雞蛋打散後，加入蔥花及碎蘿蔔乾、鹽、白胡椒粉打勻備用』。調理碗是家庭選用（推論）"
  - id: a4
    technique: tech/pan_fry
    term: 另熱鍋，下 2 大匙油，下蛋液，以中火快速將蛋拌至略凝固
    inputs: [s_egg_mix, i_oil]
    outputs: [s_egg_coagulated]
    tool: tool/frying_pan
    params:
      heat: {level: heat/medium, raw: "以中火快速將蛋拌至略凝固", evidence: B1}
      duration:
        min_s: 30
        max_s: 90
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - observe: 蛋液
        target: 蛋液略凝固、仍可流動成片。
        method: 目測
        evidence: null
    note: "B1 明寫『另熱鍋』；熱鍋時間、熱鍋完成條件及油溫原文沒寫，本版不用溫度計。平底鍋是家庭選用（推論）；補寫依據：一般家庭做法以中火快速拌炒蛋液約 30–90 秒，至蛋液略凝固便可轉小火。"
  - id: a4b
    technique: tech/pan_fry
    term: 關小火煎定型，煎至一面微金黃
    inputs: [s_egg_coagulated]
    outputs: [s_egg_set]
    tool: tool/frying_pan
    params:
      heat: {level: heat/low, raw: "關小火煎定型", evidence: B1}
      duration:
        min_s: 60
        max_s: 180
        raw: null
        is_guide: true
        evidence: null
        status: inferred
    completion:
      - observe: 底面
        target: 蛋餅邊緣定型，底面呈微金黃色。
        method: 目測
        evidence: null
    note: "『關小火』指轉小火（推論）；補寫依據：煎蛋依補寫常識表每面約 120–300 秒；第一面以 60–180 秒作為翻面觀察範圍，看到邊緣定型、底面微金黃即可翻面。"
  - id: a5
    technique: tech/pan_fry
    term: 翻面，轉小火煎約 1 分鐘至金黃
    inputs: [s_egg_set]
    outputs: [s_final]
    tool: tool/frying_pan
    params:
      heat: {level: heat/low, raw: "轉小火煎約1分鐘至金黃", evidence: B1}
      duration: {min_s: 60, max_s: 60, raw: "約1分鐘", is_guide: true, evidence: B1, status: sourced}
    completion:
      - observe: 翻面後的一面
        target: 另一面煎成金黃色，中心不見流動蛋液。
        method: 目測
        evidence: null
    note: "B1 原句是『煎至一面微金黃後翻面，轉小火煎約1分鐘至金黃』，不是籠統的『兩面金黃』。翻面方法 B1 沒寫；C1 是『利用盤子將蛋翻面』，翻不過來時可參考（對照）。duration.min_s/max_s 是 schema 只收秒的單位正規化，權威數字以 raw『約1分鐘』為準，不能當精確上下限"

